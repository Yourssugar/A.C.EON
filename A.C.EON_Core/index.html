<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.C.EON · NETWORK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Space Grotesk без кириллицы: русские буквы в названиях берутся из Manrope -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<script src="../universe.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#020509;
  --acc:#4DAFFF;
  --grn:#3DFFB4;
  --ylw:#FFD060;
  --red:#FF4060;
  --txt:#D8EEF8;
  --dim:rgba(216,238,248,0.32);
  --panel:rgba(2,5,9,0.93);
  --title:'Space Grotesk','Manrope',sans-serif;
  --cur: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M3 2.5L3 20.5L7.6 16.4L10.7 23.2L14 21.8L10.9 15.1L17.2 15.1Z' fill='%234DAFFF' stroke='%23000' stroke-width='1.6' stroke-linejoin='round'/><path d='M5 7L5 15.6' stroke='%23d6f0ff' stroke-width='1.1' stroke-linecap='round' opacity='.75'/></svg>") 3 3, auto;
  --cur-p: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M3 2.5L3 20.5L7.6 16.4L10.7 23.2L14 21.8L10.9 15.1L17.2 15.1Z' fill='%23b8e4ff' stroke='%23000' stroke-width='1.8' stroke-linejoin='round'/><path d='M5 7L5 15.6' stroke='%23fff' stroke-width='1.1' stroke-linecap='round'/></svg>") 3 3, pointer;
}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;
  font-family:'JetBrains Mono',monospace;color:var(--txt);cursor:var(--cur);user-select:none;
  -webkit-tap-highlight-color:transparent}
#c{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;touch-action:none}
#c.hov{cursor:var(--cur-p)}
#c.grab{cursor:grabbing}

.scanlines{position:fixed;inset:0;z-index:998;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px)}
.crt{position:fixed;inset:0;z-index:997;pointer-events:none;animation:crtflick 7s steps(60) infinite}
.crt::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 130% 120% at 50% 50%,transparent 55%,rgba(2,5,9,.28) 88%,rgba(2,5,9,.55) 100%)}
.crt::after{content:'';position:absolute;inset:0;opacity:.35;
  background:
    linear-gradient(90deg,rgba(77,175,255,.05) 0%,transparent 3%,transparent 97%,rgba(255,64,96,.05) 100%),
    linear-gradient(0deg,rgba(77,175,255,.04) 0%,transparent 4%,transparent 96%,rgba(255,64,96,.04) 100%)}
@keyframes crtflick{0%,100%{opacity:1}96%{opacity:1}97%{opacity:.94}98%{opacity:1}99%{opacity:.97}}
html.ufx1 .crt, html.ufx1 .scanlines{display:none}

/* загрузка */
#loader{position:fixed;inset:0;z-index:500;background:var(--bg);
  display:flex;align-items:flex-start;justify-content:center;
  padding:52px 32px 32px;overflow:hidden;transition:opacity .55s}
#loader.fade{opacity:0;pointer-events:none}
.term{width:100%;max-width:660px;font-size:12.5px;line-height:1.95}
.tl{display:flex;justify-content:space-between;white-space:pre;
  opacity:0;transform:translateX(-5px);transition:opacity .13s,transform .13s}
.tl.on{opacity:1;transform:none}
.ca{color:var(--acc)} .cg{color:var(--grn)} .cy{color:var(--ylw)} .cr{color:var(--red)} .cd{color:var(--dim)}
.cur::after{content:'█';animation:blink .65s step-end infinite;color:var(--acc)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pg{margin-top:14px;opacity:0;transition:opacity .3s}
.pg.on{opacity:1}
.pg-lbl{font-size:10px;color:var(--dim);margin-bottom:7px;letter-spacing:.08em}
.pg-bg{height:2px;background:rgba(77,175,255,.1);position:relative;overflow:hidden}
.pg-fill{height:100%;background:var(--acc);width:0%;transition:width .04s linear;box-shadow:0 0 10px var(--acc)}
.pg-pct{font-size:10px;color:var(--acc);text-align:right;margin-top:5px}
.access{font-size:15px;font-weight:700;letter-spacing:.35em;color:var(--grn);
  text-align:center;margin-top:22px;opacity:0;transition:opacity .3s;text-shadow:0 0 24px var(--grn)}
.access.on{opacity:1}

/* шапка */
.hdr{position:fixed;top:0;left:0;right:0;z-index:20;
  padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(to bottom,rgba(2,5,9,.96) 0%,transparent 100%);
  pointer-events:none;opacity:0;transition:opacity .6s}
.hdr.on{opacity:1}
.hdr-logo{font-size:11px;font-weight:700;letter-spacing:.28em;color:var(--acc)}
.hdr-m{font-size:10px;color:var(--dim);letter-spacing:.1em;white-space:nowrap}
.hdr-r{display:flex;align-items:center;gap:12px;pointer-events:auto}
.crumb-back{color:var(--acc);cursor:var(--cur-p);pointer-events:auto;text-shadow:0 0 8px rgba(77,175,255,.5);transition:opacity .15s}
.crumb-back:hover{opacity:.7}
.crumb-here{color:var(--txt)}
#umark{color:#cc2233;letter-spacing:.2em;font-weight:700;text-shadow:0 0 8px rgba(204,34,51,.35)}
.hbtn{display:flex;align-items:center;justify-content:center;height:26px;min-width:26px;padding:0 7px;
  background:rgba(2,5,9,.8);border:1px solid rgba(77,175,255,.25);border-radius:5px;
  cursor:var(--cur-p);color:var(--acc);font-family:inherit;font-size:10px;letter-spacing:.12em;transition:all .2s}
.hbtn:hover{border-color:var(--acc);box-shadow:0 0 10px rgba(77,175,255,.3)}
#bgm-btn{font-size:13px;letter-spacing:0}
#bgm-btn.muted{color:var(--dim);border-color:rgba(216,238,248,.15)}
#langwrap{position:relative}
#langmenu{position:absolute;right:0;top:32px;display:none;flex-direction:column;min-width:150px;
  background:rgba(2,5,9,.96);border:1px solid rgba(77,175,255,.3);padding:5px 0}
#langmenu.on{display:flex}
#langmenu button{background:none;border:0;border-left:2px solid transparent;color:rgba(216,238,248,.6);text-align:left;
  font-family:inherit;font-size:11px;letter-spacing:.12em;padding:7px 14px;cursor:var(--cur-p);display:flex;gap:12px}
#langmenu button b{font-weight:400;color:rgba(77,175,255,.5);width:20px}
#langmenu button:hover,#langmenu button.sel{color:var(--txt);background:rgba(77,175,255,.08);border-left-color:var(--acc)}

/* подписи узлов: обычный текст поверх WebGL, чёткий и переводимый */
#labels{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.nl{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity}
.nl-in{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.nl-name{font-family:var(--title);font-weight:600;color:#D8EEF8;line-height:1.05;letter-spacing:.02em;width:max-content;white-space:normal;word-break:keep-all;overflow-wrap:normal}
.nl.off .nl-name{color:rgba(216,238,248,.38)}
.nl-ico{width:20px;height:20px;stroke:var(--c);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nl-back{font-size:9px;letter-spacing:.14em;color:var(--c);opacity:.85}
.nl-cap{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;
  font-size:9px;letter-spacing:.12em;color:var(--c);opacity:.62;text-transform:uppercase}
.nl-cap i{font-style:normal;color:rgba(216,238,248,.45)}
.nl-new{position:absolute;left:0;transform:translateX(-50%);font-size:8px;letter-spacing:.18em;font-weight:700;
  color:#020509;background:var(--c);padding:1px 5px 0;box-shadow:0 0 10px var(--c)}

/* подсказка над узлом */
.hud{position:fixed;z-index:300;pointer-events:none;opacity:0;transition:opacity .12s;width:260px}
.hud.on{opacity:1}
.hud-box{background:rgba(2,5,9,.95);border:1px solid color-mix(in srgb,var(--hc,#4DAFFF) 35%,transparent);position:relative;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.hud-box::before{content:'';position:absolute;top:2px;right:2px;width:10px;height:10px;border-top:1.5px solid var(--hc,#4DAFFF);border-right:1.5px solid var(--hc,#4DAFFF)}
.hud-box::after{content:'';position:absolute;bottom:2px;left:2px;width:10px;height:10px;border-bottom:1.5px solid var(--hc,#4DAFFF);border-left:1.5px solid var(--hc,#4DAFFF)}
.hud-top{padding:9px 14px 7px;border-bottom:1px solid rgba(77,175,255,.15)}
.hud-tag{font-size:8px;letter-spacing:.18em;color:var(--dim);margin-bottom:2px}
.hud-name{font-family:var(--title);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--hc,#4DAFFF)}
.hud-body{padding:9px 14px 11px}
.hud-row{display:flex;gap:10px;font-size:10px;margin-bottom:3px;align-items:baseline}
.hud-row.hide{display:none}
.hud-k{color:var(--dim);min-width:56px;letter-spacing:.07em}
.hud-v{color:var(--txt)}
.sdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--grn);box-shadow:0 0 5px var(--grn);
  margin-right:5px;animation:sdot 1.6s ease-in-out infinite}
@keyframes sdot{0%,100%{opacity:1}50%{opacity:.3}}
.hud-sep{height:1px;background:rgba(77,175,255,.1);margin:6px 0}
.hud-desc{font-size:12px;color:rgba(216,238,248,.62);line-height:1.55;font-family:'Manrope',sans-serif}
.hud-act{font-size:9px;color:var(--hc,#4DAFFF);letter-spacing:.1em;margin-top:8px}
.hud-drag{font-size:9px;color:var(--dim);letter-spacing:.06em;margin-top:2px}
.hud-scope{display:block;width:100%;height:22px;margin-top:8px;border-top:1px solid rgba(77,175,255,.1);opacity:.85}

/* карта сети слева: то же дерево списком, для тех, кто не любит искать */
#map{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:20;width:200px;
  opacity:0;transition:opacity .6s;pointer-events:none}
#map.on{opacity:1;pointer-events:auto}
.map-t{font-size:8px;letter-spacing:.24em;color:var(--dim);margin-bottom:10px}
.mi{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:var(--cur-p);opacity:.58;transition:opacity .15s}
.mi:hover,.mi.hl{opacity:1}
.mi.off{opacity:.3}
.mi-d{width:6px;height:6px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 6px var(--c)}
.mi-n{font-family:var(--title);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-s{font-size:9px;color:var(--c);margin-left:auto;letter-spacing:.08em;white-space:nowrap}
.mi-new{font-size:7px;letter-spacing:.14em;font-weight:700;color:#020509;background:var(--c);padding:1px 4px 0}
.mi.back .mi-n{font-family:inherit;font-size:10px;letter-spacing:.14em;color:var(--acc)}
#map-toggle{position:fixed;left:14px;bottom:44px;z-index:21;display:none}

/* боковые метки и уголки (раньше рисовались на холсте каждый кадр) */
.side{position:fixed;top:88px;bottom:88px;width:70px;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s}
.side.on{opacity:1}
.side.l{left:26px;border-left:1px solid rgba(77,175,255,.06)}
.side.r{right:26px;border-right:1px solid rgba(77,175,255,.06);text-align:right}
.side span{display:block;height:70px;font-size:8px;color:rgba(77,175,255,.1);padding:0 8px;line-height:0;animation:sideb 9s ease-in-out infinite}
.side.l span{border-top:1px solid transparent;background:linear-gradient(90deg,rgba(77,175,255,.2) 0 4px,transparent 4px) top left/100% 1px no-repeat}
.side.r span{background:linear-gradient(270deg,rgba(77,175,255,.2) 0 4px,transparent 4px) top right/100% 1px no-repeat}
@keyframes sideb{0%,100%{color:rgba(77,175,255,.06)}50%{color:rgba(77,175,255,.18)}}
.side i{position:absolute;width:6px;height:1px;background:rgba(77,175,255,.55);animation:scan 9s linear infinite}
.side.l i{left:-3px}.side.r i{right:-3px}
@keyframes scan{from{top:0}to{top:100%}}
.corner{position:fixed;width:22px;height:22px;z-index:2;pointer-events:none;border:0 solid rgba(77,175,255,.12)}
.corner.a{left:16px;top:16px;border-left-width:1px;border-top-width:1px}
.corner.b{right:16px;top:16px;border-right-width:1px;border-top-width:1px}
.corner.c{left:16px;bottom:16px;border-left-width:1px;border-bottom-width:1px}
.corner.d{right:16px;bottom:16px;border-right-width:1px;border-bottom-width:1px}
html.ufx1 .side{display:none}

/* портал: элемент нужен для попадания курсора, рисует его WebGL */
.dz{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) scale(0);
  z-index:150;width:96px;height:96px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:transform .35s cubic-bezier(.175,.885,.32,1.275);pointer-events:none}
.dz.on{transform:translateX(-50%) scale(1)}
.dz-txt{font-size:9px;letter-spacing:.12em;color:var(--acc);text-align:center;line-height:1.7}
@keyframes dzrej{0%,100%{transform:translateX(-50%) scale(1)}25%{transform:translateX(-54%) scale(1.02)}75%{transform:translateX(-46%) scale(1.02)}}
.dz.rej{animation:dzrej .3s}

.hint{position:fixed;bottom:18px;left:22px;z-index:20;font-size:9px;color:var(--dim);letter-spacing:.08em;opacity:0;transition:opacity .8s;max-width:calc(100vw - 44px)}
.hint.on{opacity:1}

/* шёпот узла */
#whisper{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;
  font-size:13px;letter-spacing:4px;color:#d4efe4;opacity:0;transition:opacity .3s;white-space:nowrap;
  text-shadow:0 0 14px rgba(0,204,102,.35),1px 0 rgba(255,64,96,.55),-1px 0 rgba(77,175,255,.55)}
#whisper.on{opacity:1}

/* без WebGL: карта списком посередине */
body.nogl #c, body.nogl #labels, body.nogl .side{display:none}
body.nogl #map{left:50%;transform:translate(-50%,-50%);width:min(420px,88vw)}
body.nogl .mi{padding:9px 0;opacity:.8}
body.nogl .mi-n{font-size:15px}
#nogl-note{display:none;position:fixed;bottom:18px;right:22px;font-size:9px;letter-spacing:.12em;color:var(--red);z-index:20}
body.nogl #nogl-note{display:block}

@media (max-width:760px){
  #map{left:12px;right:12px;width:auto;top:auto;bottom:84px;transform:none;background:rgba(2,5,9,.94);
    border:1px solid rgba(77,175,255,.2);padding:12px 14px;display:none}
  #map.open{display:block}
  #map-toggle{display:flex}
  .side{display:none}
  .hdr{padding:12px 14px}
  #hst{overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  #hclock{display:none}
  .hud{width:230px}
  body.nogl #map{display:block;left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%)}
}
@media (pointer:coarse){ html,body{cursor:auto} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="labels"></div>
<div class="crt"></div>
<div class="scanlines"></div>
<div class="corner a"></div><div class="corner b"></div><div class="corner c"></div><div class="corner d"></div>
<div class="side l" id="sideL"><i></i></div>
<div class="side r" id="sideR"><i></i></div>

<div id="loader">
  <div class="term" id="term">
    <div class="pg" id="pg">
      <div class="pg-lbl">LOADING NETWORK MAP</div>
      <div class="pg-bg"><div class="pg-fill" id="pgf"></div></div>
      <div class="pg-pct" id="pgp">0%</div>
    </div>
    <div class="access" id="acc">■ &nbsp;ACCESS GRANTED&nbsp; ■</div>
  </div>
</div>

<div class="hdr" id="hdr">
  <div class="hdr-logo">A.C.EON</div>
  <div class="hdr-m" id="hst">NETWORK</div>
  <div class="hdr-r">
    <div class="hdr-m" id="umark"></div>
    <div id="langwrap">
      <button class="hbtn" id="langbtn" type="button">EN</button>
      <div id="langmenu"></div>
    </div>
    <div class="hdr-m" id="hclock"></div>
    <button class="hbtn" id="bgm-btn" type="button">♫</button>
  </div>
</div>

<nav id="map"><div class="map-t" id="map-t"></div><div id="map-list"></div></nav>
<button class="hbtn" id="map-toggle" type="button"></button>

<div class="hud" id="hud">
  <div class="hud-box">
    <div class="hud-top">
      <div class="hud-tag" id="htag"></div>
      <div class="hud-name" id="hname"></div>
    </div>
    <div class="hud-body">
      <div class="hud-row" id="r-type"><div class="hud-k" id="k-type"></div><div class="hud-v" id="htype"></div></div>
      <div class="hud-row" id="r-stat"><div class="hud-k" id="k-stat"></div><div class="hud-v"><span class="sdot" id="hsdot"></span><span id="hstxt"></span></div></div>
      <div class="hud-row" id="r-trace"><div class="hud-k" id="k-trace"></div><div class="hud-v" id="htrace"></div></div>
      <div class="hud-sep"></div>
      <div class="hud-desc" id="hdesc"></div>
      <canvas class="hud-scope" id="hscope" width="220" height="22"></canvas>
      <div class="hud-act" id="hact"></div>
      <div class="hud-drag" id="hdrag"></div>
    </div>
  </div>
</div>

<div class="dz" id="dz"><div class="dz-txt" id="dztxt"></div></div>
<div class="hint" id="hint"></div>
<div id="whisper"></div>
<div id="nogl-note"></div>

<script src="../games/shared/store.js?v=1"></script>
<script src="../games/shared/i18n.js?v=1"></script>
<script src="../shared/trace.js?v=1"></script>
<script src="nodes.js?v=1"></script>
<script src="lang.js?v=1"></script>
<script src="core.js?v=1"></script>
<script src="/A.C.EON/aceon-coin/coin-widget.js" defer></script>
</body>
</html>
