<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI COURSE · NODE AI · A.C.EON</title>
<script src="../universe.js"></script>
<style>
  :root{
    --bg:#020609;
    --panel:rgba(6,15,20,.78);
    --line:rgba(101,188,255,.2);
    --line-hi:rgba(101,188,255,.46);
    --text:#d8e8ef;
    --muted:#8ea3ad;
    --faint:#4a5c66;
    --blue:#45aaff;
    --green:#18e28c;
    --amber:#f3cf62;
    --red:#ff4d67;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}

  /* ── фон ── */
  #bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 18% 30%,rgba(21,117,91,.18),transparent 34rem),
      radial-gradient(circle at 74% 22%,rgba(41,126,191,.16),transparent 30rem),
      radial-gradient(circle at 52% 82%,rgba(180,44,68,.08),transparent 26rem),
      linear-gradient(180deg,#010407 0%,#031015 50%,#020508 100%)}
  #bgfx::after{content:'';position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(101,188,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(101,188,255,.035) 1px,transparent 1px);
    background-size:48px 48px}
  #net{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity 1s}
  #net.on{opacity:1}
  /* без WebGL: несколько неподвижных узлов из CSS */
  #still{position:fixed;inset:0;z-index:1;pointer-events:none;display:none}
  html.nogl #still{display:block}
  #still i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--blue);opacity:.5}

  /* ── шапка ── */
  #top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) clamp(14px,3vw,28px) 10px;pointer-events:none}
  #top > *{pointer-events:auto}
  .tright{display:flex;gap:8px;align-items:center}
  .tbtn{background:rgba(2,8,12,.6);border:1px solid var(--line);color:var(--muted);border-radius:2px;
    padding:7px 11px;font:500 11px/1.2 var(--mono);letter-spacing:.14em;cursor:pointer;display:flex;align-items:center;gap:9px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .15s,border-color .15s;white-space:nowrap}
  .tbtn:hover,.tbtn:focus-visible{color:var(--text);border-color:var(--line-hi);outline:none}
  #chip{color:var(--lc,var(--muted));border-color:color-mix(in srgb,var(--lc,#45aaff) 40%,transparent)}
  #chip .dot{width:7px;height:7px;border-radius:50%;background:var(--lc,var(--faint));box-shadow:0 0 8px var(--lc,transparent)}
  .burger{width:16px;height:10px;position:relative;display:inline-block}
  .burger::before,.burger::after,.burger i{content:'';position:absolute;left:0;right:0;height:1px;background:currentColor}
  .burger::before{top:0}.burger i{top:4.5px}.burger::after{bottom:0}
  @media (max-width:520px){ #menuBtn .lbl{display:none} #chip{max-width:44vw;overflow:hidden;text-overflow:ellipsis} }

  /* ── шкала сцен справа ── */
  #rail{position:fixed;right:clamp(10px,2vw,22px);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:14px}
  #rail button{width:11px;height:11px;transform:rotate(45deg);background:transparent;border:1px solid var(--faint);cursor:pointer;padding:0;transition:.25s}
  #rail button:hover{border-color:var(--text)}
  #rail button.on{background:var(--rc,var(--blue));border-color:var(--rc,var(--blue));box-shadow:0 0 10px var(--rc,var(--blue))}
  @media (max-width:760px){ #rail{display:none} }

  /* ── прокрутка: высокий блок, внутри липкая сцена ── */
  #scroller{position:relative;z-index:2;height:520vh}
  #stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
  .scn{position:absolute;left:clamp(18px,6vw,96px);top:50%;width:min(540px,46vw);transform:translateY(-50%);
    opacity:0;visibility:hidden;will-change:opacity,transform}
  .scn.vis{visibility:visible}
  .eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.2em;color:var(--blue);text-transform:uppercase;margin-bottom:14px}
  .eyebrow .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* вход: по центру */
  .s0{left:50%;width:min(760px,90vw);text-align:center;transform:translate(-50%,-50%)}
  .s0 h1{font:700 clamp(54px,11vw,128px)/.95 var(--mono);letter-spacing:.04em;color:#eef8ff;
    text-shadow:0 0 28px rgba(69,170,255,.35)}
  .s0 h1 span{color:var(--blue)}
  .s0 .sub{font:500 clamp(15px,2vw,19px)/1.4 var(--sans);color:var(--text);margin-top:16px}
  .s0 .lead{color:var(--muted);margin:12px auto 0;max-width:560px;font-size:15px}
  #resume{display:none;margin:22px auto 0;width:max-content;max-width:100%;padding:10px 16px;border:1px solid var(--line-hi);
    background:rgba(2,10,16,.7);font:500 12px/1.3 var(--mono);letter-spacing:.06em;color:var(--text)}
  #resume.on{display:block}
  #resume:hover{border-color:var(--lc,var(--blue));color:#fff}
  .hint{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
    font:500 10px/1 var(--mono);letter-spacing:.24em;color:var(--faint);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .4s}
  .hint i{width:1px;height:34px;background:linear-gradient(var(--blue),transparent);animation:drop 1.8s ease-in-out infinite}
  @keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  h2{font:700 clamp(26px,3.4vw,40px)/1.1 var(--sans);color:#eef8ff;margin-bottom:18px}
  .how{display:grid;gap:12px}
  .how div{border-left:2px solid var(--line-hi);padding:4px 0 4px 16px}
  .how b{display:block;font:600 15px/1.3 var(--sans);color:#eef8ff;margin-bottom:3px}
  .how b em{font-style:normal}
  .how b span{font:500 11px var(--mono);color:var(--blue);margin-right:10px;letter-spacing:.1em}
  .how p{color:var(--muted);font-size:14px}

  /* уровни */
  .lvl{--lc:var(--blue)}
  .lvtag{font:600 11px/1 var(--mono);letter-spacing:.22em;color:var(--lc);display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .lvtag i{display:inline-flex;gap:4px}
  .lvtag i b{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--lc)}
  .lvtag i b.f{background:var(--lc);box-shadow:0 0 8px var(--lc)}
  .lvl h2{color:var(--lc);text-shadow:0 0 24px color-mix(in srgb,var(--lc) 35%,transparent)}
  .who{color:var(--text);font-size:15px;margin-bottom:16px}
  .cap{font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin:0 0 8px}
  .learn{list-style:none;margin-bottom:16px;display:grid;gap:5px}
  .learn li{color:var(--muted);font-size:14px;padding-left:18px;position:relative}
  .learn li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--lc)}
  .lays{display:grid;gap:6px;margin-bottom:18px}
  .lay{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);background:rgba(2,10,16,.62);transition:border-color .2s,background .2s}
  a.lay:hover{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 8%,rgba(2,10,16,.7))}
  .lay .code{font:500 11px var(--mono);letter-spacing:.08em;color:var(--lc);flex:none}
  .lay .nm{flex:1;font-size:14px;color:var(--text);min-width:0}
  .lay .st{font:500 10px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase;flex:none}
  .lay.dn .st{color:var(--green)}
  .lay.soon{opacity:.55;border-style:dashed}
  .cta{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border:1px solid var(--lc);color:#04121a;background:var(--lc);
    font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:filter .2s,box-shadow .2s}
  .cta:hover{filter:brightness(1.1);box-shadow:0 0 22px color-mix(in srgb,var(--lc) 50%,transparent)}
  .cta.ghost{background:transparent;color:var(--lc)}

  /* ── выбор уровня (обычный поток страницы) ── */
  #choose{position:relative;z-index:2;min-height:100vh;padding:110px clamp(16px,5vw,64px) 40px;max-width:1180px;margin:0 auto}
  #choose > h2{text-align:center}
  #choose > .d{text-align:center;color:var(--muted);margin:-6px auto 28px;max-width:560px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{--lc:var(--blue);position:relative;border:1px solid var(--line);background:var(--panel);padding:20px 18px 18px;display:flex;flex-direction:column;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .25s,box-shadow .25s,transform .25s}
  .card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--lc) 55%,transparent)}
  .card.sel{border-color:var(--lc);box-shadow:0 0 0 1px var(--lc),0 0 30px color-mix(in srgb,var(--lc) 22%,transparent)}
  .card h3{font:700 22px/1.2 var(--sans);color:var(--lc);margin-bottom:10px}
  .card .who{font-size:14px;color:var(--muted);flex:1}
  .bar{height:3px;background:rgba(255,255,255,.06);margin:14px 0 6px}
  .bar i{display:block;height:100%;background:var(--lc);box-shadow:0 0 8px var(--lc);transition:width .6s}
  .card .pg{font:500 11px var(--mono);color:var(--faint);letter-spacing:.06em;margin-bottom:14px}
  .card .row{display:flex;gap:8px;flex-wrap:wrap}
  .card .cta{padding:9px 14px;font-size:11px}
  .card .selmark{position:absolute;top:12px;right:12px;font:600 10px var(--mono);letter-spacing:.14em;color:var(--lc);text-transform:uppercase;display:none}
  .card.sel .selmark{display:block}
  @media (max-width:860px){ .cards{grid-template-columns:1fr} }

  #quiz{margin:26px auto 0;max-width:640px;border:1px solid var(--line);background:var(--panel);padding:20px;text-align:center}
  #quiz h4{font:600 17px/1.3 var(--sans);color:#eef8ff;margin-bottom:6px}
  #quiz p{color:var(--muted);font-size:14px;margin-bottom:14px}
  #quiz .qn{font:500 10px var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
  #quiz .ans{display:grid;gap:8px;margin-top:4px}
  #quiz .ans button{border:1px solid var(--line);background:rgba(2,10,16,.6);padding:11px 14px;cursor:pointer;font-size:14px;text-align:left;transition:.2s}
  #quiz .ans button:hover{border-color:var(--line-hi);background:rgba(69,170,255,.08)}
  #quiz .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #quiz .cta{--lc:var(--blue)}
  #ruOnly{text-align:center;color:var(--faint);font-size:13px;margin-top:22px}
  footer{position:relative;z-index:2;display:flex;justify-content:space-between;gap:12px;padding:26px clamp(16px,5vw,64px) max(26px,env(safe-area-inset-bottom));
    font:500 10px/1.4 var(--mono);letter-spacing:.16em;color:var(--faint);text-transform:uppercase;border-top:1px solid rgba(101,188,255,.1)}
  footer button{background:none;border:0;cursor:pointer;font:inherit;letter-spacing:inherit;color:var(--muted)}

  /* ── меню справа ── */
  #veil{position:fixed;inset:0;z-index:40;background:rgba(1,4,7,.6);opacity:0;pointer-events:none;transition:opacity .3s}
  body.menu #veil{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(420px,92vw);background:rgba(3,10,14,.97);border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  body.menu #drawer{transform:none}
  .drh{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
  .drh span{font:600 12px var(--mono);letter-spacing:.2em;color:var(--text)}
  #drClose{background:none;border:1px solid var(--line);width:32px;height:32px;cursor:pointer;font:16px/1 var(--mono);color:var(--muted)}
  #drClose:hover{color:var(--text);border-color:var(--line-hi)}
  .drb{flex:1;overflow-y:auto;padding:14px 18px 24px}
  .drs{font:500 10px var(--mono);letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin:16px 0 8px}
  .drs:first-child{margin-top:2px}
  .dlv{--lc:var(--blue);border:1px solid var(--line);margin-bottom:10px}
  .dlv.sel{border-color:var(--lc)}
  .dlvh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:color-mix(in srgb,var(--lc) 6%,transparent)}
  .dlvh .t{font:600 10px var(--mono);letter-spacing:.18em;color:var(--lc)}
  .dlvh .n{flex:1;font-weight:600;font-size:14px;color:#eef8ff}
  .dlvh button{background:none;border:1px solid color-mix(in srgb,var(--lc) 50%,transparent);color:var(--lc);font:600 10px var(--mono);letter-spacing:.12em;padding:5px 8px;cursor:pointer;text-transform:uppercase}
  .dlv.sel .dlvh button{background:var(--lc);color:#04121a}
  .dlv a,.dlv .soonrow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid rgba(101,188,255,.08);font-size:13px;color:var(--muted)}
  .dlv a:hover{color:#fff;background:rgba(255,255,255,.03)}
  .dlv a .c,.dlv .soonrow .c{font:500 10px var(--mono);color:var(--lc);flex:none}
  .dlv a .nm{flex:1}
  .dlv a .ok{font:500 10px var(--mono);color:var(--green)}
  .dlv .soonrow{opacity:.5}
  .dbtn{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);padding:9px 12px;margin-bottom:6px;cursor:pointer;font-size:13px;color:var(--muted)}
  .dbtn:hover{color:#fff;border-color:var(--line-hi)}
  .dbtn .n{font:500 10px var(--mono);color:var(--blue);margin-right:10px}
  #langs{display:flex;flex-wrap:wrap;gap:6px}
  #langs button{background:none;border:1px solid var(--line);padding:6px 9px;font:500 11px var(--mono);letter-spacing:.1em;color:var(--muted);cursor:pointer}
  #langs button.sel{border-color:var(--blue);color:var(--blue)}

  /* ── телефон: текст снизу, сеть сверху ── */
  @media (max-width:760px), (max-aspect-ratio:4/5){
    .scn{left:16px;right:16px;width:auto;top:auto;bottom:max(18px,env(safe-area-inset-bottom));transform:none}
    .scn.lvl,.scn.s1{background:linear-gradient(transparent,rgba(2,6,9,.82) 18%);padding-top:26px}
    .s0{left:16px;right:16px;width:auto;top:50%;bottom:auto;transform:translateY(-50%)}
    h2{font-size:26px;margin-bottom:12px}
    .who{font-size:14px;margin-bottom:12px}
    .learn{margin-bottom:12px}
    .learn li,.how p{font-size:13px}
    .lays{margin-bottom:14px}
    .lay{padding:8px 10px}
    #choose{padding-top:84px}
  }
  @media (max-height:640px) and (max-width:760px){ .learn{display:none} }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div id="bgfx" aria-hidden="true"></div>
<div id="still" aria-hidden="true"></div>
<canvas id="net" aria-hidden="true"></canvas>

<header id="top">
  <button class="tbtn" id="back" type="button"></button>
  <div class="tright">
    <button class="tbtn" id="chip" type="button"><span class="dot"></span><span class="lbl"></span></button>
    <button class="tbtn" id="menuBtn" type="button" aria-expanded="false" aria-controls="drawer"><span class="burger"><i></i></span><span class="lbl"></span></button>
  </div>
</header>

<nav id="rail" aria-label="scenes"></nav>

<main>
  <div id="scroller">
    <div id="stage">
      <section class="scn s0" data-s="0">
        <p class="eyebrow" id="eyebrow"></p>
        <h1>NODE <span>AI</span></h1>
        <p class="sub" id="sub"></p>
        <p class="lead" id="lead"></p>
        <a id="resume" href="#"></a>
      </section>
      <section class="scn s1" data-s="1">
        <h2 id="howT"></h2>
        <div class="how">
          <div><b><span>01</span><em id="how1t"></em></b><p id="how1d"></p></div>
          <div><b><span>02</span><em id="how2t"></em></b><p id="how2d"></p></div>
          <div><b><span>03</span><em id="how3t"></em></b><p id="how3d"></p></div>
        </div>
      </section>
      <!-- сцены уровней 2..4 собираются из LEVELS в hub.js -->
      <div class="hint" id="hint"><span id="hintT"></span><i></i></div>
    </div>
  </div>

  <section id="choose" aria-labelledby="chooseT">
    <h2 id="chooseT"></h2>
    <p class="d" id="chooseD"></p>
    <div class="cards" id="cards"></div>
    <div id="quiz"></div>
    <p id="ruOnly"></p>
  </section>
</main>

<footer><span id="foot"></span><button id="toTop" type="button"></button></footer>

<div id="veil"></div>
<aside id="drawer" aria-hidden="true">
  <div class="drh"><span id="drTitle"></span><button id="drClose" type="button">x</button></div>
  <div class="drb">
    <div class="drs" id="drLv"></div>
    <div id="drLevels"></div>
    <button class="dbtn" id="drQuiz" type="button"></button>
    <div class="drs" id="drPg"></div>
    <div id="drScenes"></div>
    <div class="drs" id="drLg"></div>
    <div id="langs"></div>
    <div class="drs"></div>
    <button class="dbtn" id="drBack" type="button"></button>
  </div>
</aside>

<script src="../games/shared/store.js?v=1"></script>
<script src="../games/shared/i18n.js?v=1"></script>
<script src="../shared/trace.js?v=1"></script>
<script src="hub-lang.js?v=1"></script>
<script src="hub.js?v=1"></script>
</body>
</html>
