<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Чем он поможет тебе уже сегодня / LAYER_01 / NODE AI / A.C.EON</title>
<script src="../../../universe.js"></script>
<style>
  :root{
    --bg:#020609; --panel:rgba(5,14,19,.84); --panel2:rgba(2,10,16,.7);
    --line:rgba(101,188,255,.2); --line-hi:rgba(101,188,255,.46);
    --text:#d8e8ef; --muted:#8ea3ad; --faint:#4a5c66;
    --blue:#45aaff; --green:#18e28c; --amber:#f3cf62; --red:#ff4d67; --pink:#ff8fd0;
    --lc:var(--green);
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
    --col:min(760px,calc(100vw - 32px));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit;cursor:pointer}
  ::selection{background:rgba(24,226,140,.3)}

  /* фон */
  #bgs{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#010407,#031015 50%,#020508)}
  .bgi{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.1s}
  .bgi.on{opacity:1}
  #bgs::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,9,.9) 0%,rgba(2,6,9,.78) 45%,rgba(2,6,9,.3) 80%,rgba(2,6,9,.2) 100%)}
  @media (max-width:760px){ #bgs::after{background:rgba(2,6,9,.82)} section{padding-bottom:120px} #say{max-width:min(240px,70vw)} }

  /* робот */
  #bot{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
  #botHit{position:fixed;left:0;top:0;z-index:6;cursor:pointer;border-radius:40%}
  #say{position:fixed;left:0;top:0;z-index:7;max-width:min(280px,64vw);padding:9px 13px;background:rgba(3,12,18,.94);border:1px solid var(--line-hi);
    color:var(--text);font-size:13px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .25s;border-radius:2px}
  #say::before{content:'NODE';display:block;font:600 9px var(--mono);letter-spacing:.2em;color:var(--green);margin-bottom:3px}
  #say.on{opacity:1}

  /* шапка */
  #top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) clamp(12px,3vw,28px) 10px;pointer-events:none}
  #top > *{pointer-events:auto}
  .tl,.tr{display:flex;gap:8px;align-items:center}
  .tbtn{background:rgba(2,8,12,.7);border:1px solid var(--line);color:var(--muted);border-radius:2px;
    padding:7px 11px;font:500 11px/1.2 var(--mono);letter-spacing:.12em;display:flex;align-items:center;gap:8px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .15s,border-color .15s;white-space:nowrap}
  .tbtn:hover,.tbtn:focus-visible{color:var(--text);border-color:var(--line-hi);outline:none}
  #stk img{width:18px;height:18px;filter:grayscale(1) opacity(.45);transition:filter .4s}
  #stk.got img{filter:none}
  #stk.pop{animation:pop .5s}
  @keyframes pop{40%{transform:scale(1.25)}}
  .burger{width:16px;height:10px;position:relative;display:inline-block}
  .burger::before,.burger::after,.burger i{content:'';position:absolute;left:0;right:0;height:1px;background:currentColor}
  .burger::before{top:0}.burger i{top:4.5px}.burger::after{bottom:0}
  #core .sh{display:none}
  @media (max-width:560px){ #menuBtn .lbl,#core .lbl{display:none} #core .sh{display:inline} }
  #prog{position:fixed;left:0;top:0;height:2px;z-index:31;background:var(--green);box-shadow:0 0 8px var(--green);width:0}

  /* колонка */
  main{position:relative;z-index:3}
  section{position:relative;min-height:100vh;min-height:100svh;padding:110px 16px 80px clamp(16px,6vw,96px)}
  .col{width:var(--col)}
  .rv{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
  .rv.in{opacity:1;transform:none}
  html.nomo .rv{opacity:1;transform:none;transition:none}

  .hero{display:flex;align-items:center}
  .eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.2em;color:var(--green);text-transform:uppercase;margin-bottom:14px}
  h1{font:700 clamp(36px,6.4vw,72px)/1.04 var(--sans);color:#eefcf5;text-shadow:0 0 30px rgba(24,226,140,.25);margin-bottom:18px}
  .lead{font-size:clamp(16px,1.8vw,19px);color:var(--text);max-width:600px;margin-bottom:26px}
  .map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px;max-width:640px}
  .map a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);font-size:13px;transition:border-color .2s,background .2s}
  .map a:hover{border-color:var(--green);background:rgba(24,226,140,.06)}
  .map a .n{font:500 11px var(--mono);color:var(--green)}
  @media (max-width:560px){ .map{grid-template-columns:1fr 1fr} }
  .cap{font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin:0 0 10px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border:1px solid var(--lc);background:var(--lc);color:#04121a;
    font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:filter .2s,box-shadow .2s,transform .15s}
  .btn:hover{filter:brightness(1.1);box-shadow:0 0 22px color-mix(in srgb,var(--lc) 45%,transparent)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--lc)}
  .btn:disabled{opacity:.4;pointer-events:none}

  .th{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
  .th .num{font:600 13px var(--mono);color:var(--green);letter-spacing:.1em}
  h2{font:700 clamp(26px,3.6vw,40px)/1.15 var(--sans);color:#eefcf5}
  .txt p{color:var(--text);margin-bottom:12px;max-width:680px}
  .txt p.sub{color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 26px}
  .card{border:1px solid var(--line);background:var(--panel2);padding:14px;transition:transform .25s,border-color .25s}
  .card:hover{transform:translateY(-3px);border-color:var(--line-hi)}
  .card b{display:block;font-weight:600;color:#eefcf5;margin-bottom:4px}
  .card span{font-size:13px;color:var(--muted)}
  .card.k1{border-top:2px solid var(--green)} .card.k2{border-top:2px solid var(--blue)} .card.k3{border-top:2px solid var(--amber)}
  @media (max-width:640px){ .cards{grid-template-columns:1fr} }

  /* пособие */
  .tool{border:1px solid var(--line);background:var(--panel);padding:18px;margin:6px 0 24px;position:relative;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .tool::before{content:'';position:absolute;left:-1px;top:-1px;width:26px;height:26px;border-left:2px solid var(--green);border-top:2px solid var(--green)}
  .tool h3{font:600 17px/1.3 var(--sans);color:#eefcf5;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .tool h3 .tag{font:600 9px var(--mono);letter-spacing:.2em;color:var(--green);border:1px solid rgba(24,226,140,.4);padding:3px 6px}
  .tool > p.d{color:var(--muted);font-size:14px;margin-bottom:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{font-size:12px;color:var(--faint);margin-top:10px}
  .msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--text)}
  .msg.ok{color:var(--green)} .msg.bad{color:#ff8d9e}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  @keyframes binok{30%{box-shadow:0 0 0 2px var(--green),0 0 26px rgba(24,226,140,.6)}}
  @keyframes cIn{from{opacity:0;transform:translateY(-14px)}}
  @keyframes paper{from{transform:scaleY(.1);opacity:.3}}
  .qcard{min-height:72px;padding:14px 16px;border:1px solid var(--line-hi);background:#071822;font-size:16px;display:flex;align-items:center;justify-content:center;text-align:center;margin:0 0 12px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .qcard.bad{animation:shake .45s;border-color:var(--red)}
  .qcard.in{animation:cIn .45s}
  .qn2{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chips button{border:1px solid var(--line);background:rgba(2,10,16,.7);padding:6px 10px;font-size:13px;color:var(--muted);text-align:left;transition:.15s}
  .chips button:hover{color:#fff;border-color:var(--line-hi)}
  .chips button.sel{color:#eefcf5;border-color:var(--green);background:rgba(24,226,140,.12)}
  .paperbox{background:#f4efe2;color:#1a2a33;padding:14px 16px;font-size:15px;line-height:1.55;border-radius:2px;box-shadow:0 8px 18px rgba(0,0,0,.4)}
  .lbl2{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin:0 0 6px}

  .tool{scroll-margin-top:70px}
  .tool img{height:auto}
  /* режимы */
  .key{border-left:3px solid var(--green);background:rgba(24,226,140,.07);padding:12px 16px;font-size:16px;color:#eefcf5;margin:6px 0 18px;max-width:680px}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 20px}
  .mode{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel2);padding:10px 12px;transition:transform .25s,border-color .25s}
  .mode:hover{transform:translateY(-3px);border-color:var(--green)}
  .mode img{width:52px;height:52px;flex:none}
  .mode b{display:block;color:#eefcf5;font-weight:600}
  .mode span{font-size:13px;line-height:1.35;color:var(--muted)}
  @media (max-width:640px){ .modes{grid-template-columns:1fr 1fr} .mode{flex-direction:column;text-align:center;gap:6px} }

  /* переводчик */
  .trw{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
  .trm{position:relative;width:100%;max-width:240px;margin:0 auto}
  .trm img{position:absolute;left:0;top:0;width:100%;pointer-events:none}
  .trm img.b{position:relative;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
  .trm .kn{transform-origin:48.51% 48.67%;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
  .trm .hit{position:absolute;left:48.51%;top:48.67%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:none;background:none}
  .trm.shk .b{animation:mshk .45s}
  @keyframes mshk{20%{transform:translateX(-4px) rotate(-1deg)}40%{transform:translateX(4px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  .trLv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
  .trLv button{border:1px solid var(--line);background:rgba(2,10,16,.7);padding:6px 8px;font-size:12px;color:var(--muted)}
  .trLv button.sel{color:#eefcf5;border-color:var(--green);background:rgba(24,226,140,.12)}
  .trLv button.seen::after{content:' +';color:var(--green);font-family:var(--mono)}
  .trSrc{font-size:14px;color:var(--muted);border:1px dashed var(--line-hi);padding:10px 12px;margin-bottom:12px}
  .trOut.new{animation:paper .5s cubic-bezier(.2,.8,.2,1);transform-origin:50% 0}
  @media (max-width:620px){ .trw{grid-template-columns:1fr} .trm{max-width:200px} }

  /* из каши в план */
  .msb{position:relative;min-height:330px;border:1px solid var(--line);background:radial-gradient(circle at 30% 20%,rgba(243,207,98,.06),transparent 60%),rgba(2,10,16,.6);padding:12px;margin-bottom:12px;overflow:hidden}
  .msb.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;min-height:0}
  .step{border:1px solid rgba(24,226,140,.35);background:rgba(24,226,140,.05);padding:8px;display:flex;flex-direction:column;gap:8px}
  .step > b{font:600 11px/1.3 var(--mono);letter-spacing:.06em;color:var(--green);text-transform:uppercase}
  .step > b i{font-style:normal;color:#eefcf5;margin-right:6px}
  .nt{position:absolute;width:150px;padding:8px 10px;font-size:13px;line-height:1.3;color:#2a2410;background:#ffe9a8;box-shadow:0 6px 12px rgba(0,0,0,.45);transform:rotate(var(--r,0deg))}
  .nt:nth-child(3n+1){background:#d6f7e7} .nt:nth-child(3n+2){background:#d9ecff}
  .msb.plan .nt{position:relative;left:auto!important;top:auto!important;width:auto;transform:none}
  .msGoal{font-size:15px;color:#eefcf5;margin-bottom:10px} .msGoal b{font:600 10px var(--mono);letter-spacing:.16em;color:var(--amber);text-transform:uppercase;margin-right:8px}
  @media (max-width:520px){ .nt{width:128px;font-size:12px} .msb{min-height:400px} }

  /* канцелярит */
  .dut{font-size:17px;line-height:2}
  .dz{position:relative;cursor:pointer;color:#5b6266;background:rgba(110,110,110,.16);border-radius:3px;padding:1px 3px;transition:color .3s,background .3s}
  .dz .cl{position:absolute;left:50%;top:50%;width:min(100%,170px);transform:translate(-50%,-50%);opacity:.6;pointer-events:none;animation:cfl 3s ease-in-out infinite}
  @keyframes cfl{50%{transform:translate(-50%,-56%)}}
  @media (max-width:560px){ .dz .cl{opacity:.4;width:min(80%,120px)} }
  .dz.clean{color:#0b6a43;background:rgba(24,226,140,.2);cursor:default}
  .dz.clean .cl{display:none}
  .puff{position:fixed;z-index:20;pointer-events:none;animation:puff .8s ease-out forwards}
  @keyframes puff{to{transform:translate(var(--dx),-70px) scale(1.6) rotate(20deg);opacity:0}}
  .dub{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .dub img{width:56px;transform:rotate(-20deg);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}

  /* найди дыры */
  .hot{font-size:16px;line-height:1.9}
  .hl{cursor:pointer;border-bottom:2px solid transparent;transition:background .2s,border-color .2s}
  .hl:hover{border-bottom:2px dotted #b07a12}
  .hl.found{background:rgba(255,77,103,.16);border-bottom:2px solid #d43a52;cursor:default}
  .hl.hint{animation:hintp 1s 3}
  @keyframes hintp{50%{background:rgba(243,207,98,.45)}}
  .hq{display:grid;gap:8px;margin-top:12px}
  .hq div{padding:10px 12px;border-left:2px solid var(--red);background:rgba(255,77,103,.07);font-size:14px;animation:cIn .4s}
  .hq div b{display:block;font:600 10px var(--mono);letter-spacing:.16em;color:#ff8d9e;text-transform:uppercase;margin-bottom:3px}

  /* автомат идей */
  .gbw{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
  .gbm{position:relative;width:100%;max-width:200px;margin:0 auto}
  .gbm > img{position:absolute;left:0;top:0;width:100%;pointer-events:none}
  .gbm > img.b{position:relative;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
  .gbm .ck{transform-origin:50.18% 72.92%}
  .gbm .ck.spin{animation:spin1 .7s cubic-bezier(.4,0,.2,1)}
  @keyframes spin1{to{transform:rotate(360deg)}}
  .gbm .fl{transform-origin:50.18% 84.48%;transition:transform .25s}
  .gbm .fl.open{transform:scaleY(.15)}
  .gbm .bl{position:absolute;width:13%;pointer-events:none;transition:opacity .3s}
  .gbm .out{position:absolute;left:50.18%;top:88%;width:15%;transform:translate(-50%,-50%);animation:drop .7s cubic-bezier(.3,0,.7,1) forwards;pointer-events:none}
  @keyframes drop{0%{transform:translate(-50%,-90%) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(60%,40%) scale(1);opacity:0}}
  .gbm .hit{position:absolute;left:50.18%;top:72.92%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:none;background:none}
  .gbl{display:grid;gap:6px;margin-top:10px}
  .gbl div{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);background:rgba(2,10,16,.7);font-size:14px;animation:cIn .4s}
  .gbl div img{width:22px;height:22px;flex:none}
  .gbl div span{flex:1}
  .gbl button{border:none;background:none;width:26px;height:26px;padding:0;color:var(--faint)}
  .gbl button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
  .gbl button.on{color:var(--amber)} .gbl button.on svg{fill:currentColor}
  @media (max-width:620px){ .gbw{grid-template-columns:1fr} .gbm{max-width:170px} }

  /* пустой лист */
  .ppw{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}
  .ppi{position:relative;width:100%;max-width:180px;margin:0 auto}
  .ppi img{width:100%;display:block;transition:opacity .4s}
  .ppi img.h{position:absolute;left:0;top:0;opacity:0}
  .ppi.ok img.h{opacity:1} .ppi.ok img.s{opacity:0}
  .ppi:not(.ok) img.s{animation:tremble .5s ease-in-out infinite}
  @keyframes tremble{25%{transform:translate(-1px,0) rotate(-.6deg)}75%{transform:translate(1px,0) rotate(.6deg)}}
  .ped{min-height:130px;outline:none;white-space:pre-wrap}
  .ped:empty::before{content:attr(data-ph);color:#9aa3a6}
  .ped:focus{box-shadow:0 0 0 2px var(--green),0 8px 18px rgba(0,0,0,.4)}
  @media (max-width:620px){ .ppw{grid-template-columns:1fr} .ppi{max-width:140px} }

  /* светофор */
  .tlw{display:grid;grid-template-columns:130px 1fr;gap:22px;align-items:center}
  .tli{position:relative;width:100%;max-width:130px;margin:0 auto}
  .tli img{position:absolute;left:0;top:0;width:100%;pointer-events:none;opacity:0;transition:opacity .3s}
  .tli img.b{position:relative;display:block;opacity:1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
  .tli img.on{opacity:1}
  .tli .hit{position:absolute;left:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:none;background:none}
  .tlb{display:grid;gap:6px}
  .tlb button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:rgba(2,10,16,.7);padding:8px 12px;transition:.15s}
  .tlb button i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
  .tlb button b{display:block;font-size:14px;color:#eefcf5} .tlb button span{font-size:12px;color:var(--muted)}
  .tlb .green{color:#18e28c} .tlb .yellow{color:#f3cf62} .tlb .red{color:#ff4d67}
  .tlb button i{background:currentColor}
  .tlb button:hover{border-color:currentColor}
  .tlb button.bad{animation:shake .45s}
  @media (max-width:560px){ .tlw{grid-template-columns:90px 1fr;gap:12px} }

  /* примерь на себя */
  .ctx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .ctx button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:rgba(2,10,16,.7);padding:8px 4px;font-size:13px;color:var(--muted);transition:.15s}
  .ctx button img{width:48px;height:48px}
  .ctx button.sel{color:#eefcf5;border-color:var(--green);background:rgba(24,226,140,.1)}
  .mec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mec div{border:1px solid var(--line);background:rgba(2,10,16,.7);padding:10px;font-size:13px;color:var(--text);animation:cIn .4s both}
  .mec div b{display:flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.12em;color:var(--green);text-transform:uppercase;margin-bottom:6px}
  .mec div b img{width:28px;height:28px}
  @media (max-width:640px){ .mec{grid-template-columns:1fr 1fr} .ctx button{font-size:11px} .ctx button img{width:38px;height:38px} }

  /* проверка */
  .parts{display:flex;gap:6px;margin-bottom:14px}
  .parts i{flex:1;height:8px;background:rgba(255,255,255,.07);transition:background .4s,box-shadow .4s}
  .parts i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
  .parts i.off{background:rgba(255,77,103,.5)}
  .qn{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
  .qq{font:600 18px/1.35 var(--sans);color:#eefcf5;margin-bottom:12px}
  .qa{display:grid;gap:8px}
  .qa button{text-align:left;border:1px solid var(--line);background:rgba(2,10,16,.7);padding:10px 14px;font-size:14px;transition:.2s}
  .qa button:hover{border-color:var(--line-hi)}
  .qa button.ok{border-color:var(--green);background:rgba(24,226,140,.14)}
  .qa button.no{border-color:var(--red);background:rgba(255,77,103,.12)}
  .qa button:disabled{cursor:default}
  .qx{margin-top:10px;font-size:14px;color:var(--muted)}
  .bigst{display:flex;align-items:center;gap:16px;margin:4px 0 18px}
  .bigst img{width:110px;height:110px;filter:grayscale(1) opacity(.2);transition:.6s}
  .bigst.got img{filter:none;animation:spin .9s}
  .bigst span{font:600 15px var(--sans);color:var(--faint)}
  .bigst.got span{color:var(--green)}

  #toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translate(-50%,40px);opacity:0;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;
    background:rgba(3,14,20,.96);border:1px solid var(--green);box-shadow:0 0 24px rgba(24,226,140,.35);transition:.35s;pointer-events:none;font-size:14px}
  #toast.on{transform:translate(-50%,0);opacity:1}
  #toast img{width:52px;height:52px;animation:spin .8s}
  @keyframes spin{from{transform:rotate(-200deg) scale(.4)}}

  footer{position:relative;z-index:3;display:flex;justify-content:space-between;gap:12px;padding:24px clamp(16px,6vw,96px) max(24px,env(safe-area-inset-bottom));
    font:500 10px/1.4 var(--mono);letter-spacing:.16em;color:var(--faint);text-transform:uppercase;border-top:1px solid rgba(101,188,255,.1)}

  /* меню */
  #veil{position:fixed;inset:0;z-index:40;background:rgba(1,4,7,.6);opacity:0;pointer-events:none;transition:opacity .3s}
  body.menu #veil{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(420px,92vw);background:rgba(3,10,14,.97);border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  body.menu #drawer{transform:none}
  .drh{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
  .drh span{font:600 12px var(--mono);letter-spacing:.2em}
  #drClose{background:none;border:1px solid var(--line);width:32px;height:32px;font:16px/1 var(--mono);color:var(--muted)}
  .drb{flex:1;overflow-y:auto;padding:14px 18px 24px}
  .drs{font:500 10px var(--mono);letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin:16px 0 8px}
  .drs:first-child{margin-top:2px}
  .dbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid var(--line);padding:9px 12px;margin-bottom:6px;font-size:13px;color:var(--muted)}
  .dbtn:hover{color:#fff;border-color:var(--line-hi)}
  .dbtn .n{font:500 10px var(--mono);color:var(--green)}
  .dbtn.cur{border-color:rgba(24,226,140,.45);color:var(--text)}
  #langs{display:flex;flex-wrap:wrap;gap:6px}
  #langs button{background:none;border:1px solid var(--line);padding:6px 9px;font:500 11px var(--mono);letter-spacing:.1em;color:var(--muted)}
  #langs button.sel{border-color:var(--green);color:var(--green)}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  }
</style>
