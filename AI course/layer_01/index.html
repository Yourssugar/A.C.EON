<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LAYER_01 · NODE AI · A.C.EON</title>
<script src="../../universe.js"></script>
<style>
  :root{
    --bg:#020609; --panel:rgba(5,14,19,.84); --panel2:rgba(2,10,16,.7);
    --line:rgba(101,188,255,.2); --line-hi:rgba(101,188,255,.46);
    --text:#d8e8ef; --muted:#8ea3ad; --faint:#4a5c66;
    --blue:#45aaff; --green:#18e28c; --amber:#f3cf62; --red:#ff4d67; --pink:#ff8fd0;
    --lc:var(--green);
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
    --col:min(760px,calc(100vw - 32px));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit;cursor:pointer}
  ::selection{background:rgba(24,226,140,.3)}

  /* ── фон ── */
  #bgs{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#010407,#031015 50%,#020508)}
  .bgi{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.1s}
  .bgi.on{opacity:1}
  #bgs::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,9,.9) 0%,rgba(2,6,9,.78) 45%,rgba(2,6,9,.3) 80%,rgba(2,6,9,.2) 100%)}
  @media (max-width:760px){ #bgs::after{background:rgba(2,6,9,.82)} section{padding-bottom:120px} #say{max-width:min(240px,70vw)} }

  /* ── робот ── */
  #bot{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
  #botHit{position:fixed;left:0;top:0;z-index:6;cursor:pointer;border-radius:40%}
  #say{position:fixed;left:0;top:0;z-index:7;max-width:min(280px,64vw);padding:9px 13px;background:rgba(3,12,18,.94);border:1px solid var(--line-hi);
    color:var(--text);font-size:13px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .25s;border-radius:2px}
  #say::before{content:'NODE';display:block;font:600 9px var(--mono);letter-spacing:.2em;color:var(--green);margin-bottom:3px}
  #say.on{opacity:1}

  /* ── шапка ── */
  #top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) clamp(12px,3vw,28px) 10px;pointer-events:none}
  #top > *{pointer-events:auto}
  .tl,.tr{display:flex;gap:8px;align-items:center}
  .tbtn{background:rgba(2,8,12,.7);border:1px solid var(--line);color:var(--muted);border-radius:2px;
    padding:7px 11px;font:500 11px/1.2 var(--mono);letter-spacing:.12em;display:flex;align-items:center;gap:8px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .15s,border-color .15s;white-space:nowrap}
  .tbtn:hover,.tbtn:focus-visible{color:var(--text);border-color:var(--line-hi);outline:none}
  #stk{color:var(--green)}
  #stk.pop{animation:pop .5s}
  @keyframes pop{40%{transform:scale(1.25)}}
  .burger{width:16px;height:10px;position:relative;display:inline-block}
  .burger::before,.burger::after,.burger i{content:'';position:absolute;left:0;right:0;height:1px;background:currentColor}
  .burger::before{top:0}.burger i{top:4.5px}.burger::after{bottom:0}
  #core .sh{display:none}
  @media (max-width:560px){ #menuBtn .lbl,#core .lbl{display:none} #core .sh{display:inline} }
  #prog{position:fixed;left:0;top:0;height:2px;z-index:31;background:var(--green);box-shadow:0 0 8px var(--green);width:0}

  .ico{display:inline-block;flex:none;background:url(../img/icons.webp) no-repeat;vertical-align:middle}

  /* ── колонка ── */
  main{position:relative;z-index:3}
  section{position:relative;scroll-margin-top:0;min-height:100vh;min-height:100svh;padding:110px 16px 80px clamp(16px,6vw,96px)}
  .col{width:var(--col)}
  .rv{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
  .rv.in{opacity:1;transform:none}
  html.nomo .rv{opacity:1;transform:none;transition:none}

  .hero{display:flex;align-items:center}
  .eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.2em;color:var(--green);text-transform:uppercase;margin-bottom:14px}
  h1{font:700 clamp(40px,7vw,80px)/1 var(--sans);color:#eefcf5;text-shadow:0 0 30px rgba(24,226,140,.25);margin-bottom:18px}
  .lead{font-size:clamp(16px,1.8vw,19px);color:var(--text);max-width:600px;margin-bottom:26px}
  .map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px;max-width:640px}
  .map a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);font-size:13px;transition:border-color .2s,background .2s}
  .map a:hover{border-color:var(--green);background:rgba(24,226,140,.06)}
  .map a .n{font:500 11px var(--mono);color:var(--green)}
  .map a.got{border-color:rgba(24,226,140,.45)}
  .map a.got::after{content:'+';margin-left:auto;font:700 12px var(--mono);color:var(--green)}
  @media (max-width:560px){ .map{grid-template-columns:1fr 1fr} }
  .cap{font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin:0 0 10px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border:1px solid var(--lc);background:var(--lc);color:#04121a;
    font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:filter .2s,box-shadow .2s,transform .15s}
  .btn:hover{filter:brightness(1.1);box-shadow:0 0 22px color-mix(in srgb,var(--lc) 45%,transparent)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--lc)}
  .btn:disabled{opacity:.4;pointer-events:none}

  .th{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
  .th .num{font:600 13px var(--mono);color:var(--green);letter-spacing:.1em}
  h2{font:700 clamp(26px,3.6vw,40px)/1.15 var(--sans);color:#eefcf5}
  .txt p{color:var(--text);margin-bottom:12px;max-width:680px}
  .txt p.sub{color:var(--muted)}
  .more{display:inline-block;font:500 11px var(--mono);letter-spacing:.08em;color:var(--blue);border-bottom:1px dashed rgba(69,170,255,.5);margin:2px 0 20px}
  .more:hover{color:#fff}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 26px}
  .cards.six{grid-template-columns:repeat(3,1fr)}
  .card{border:1px solid var(--line);background:var(--panel2);padding:14px;transition:transform .25s,border-color .25s}
  .card:hover{transform:translateY(-3px);border-color:var(--line-hi)}
  .card b{display:block;font-weight:600;color:#eefcf5;margin-bottom:4px}
  .card span{font-size:13px;color:var(--muted)}
  .card.k1{border-top:2px solid var(--green)} .card.k2{border-top:2px solid var(--blue)} .card.k3{border-top:2px solid var(--amber)}
  @media (max-width:640px){ .cards,.cards.six{grid-template-columns:1fr 1fr} }

  /* ── пособие ── */
  .tool{border:1px solid var(--line);background:var(--panel);padding:18px;margin:6px 0 24px;position:relative;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .tool::before{content:'';position:absolute;left:-1px;top:-1px;width:26px;height:26px;border-left:2px solid var(--green);border-top:2px solid var(--green)}
  .tool h3{font:600 17px/1.3 var(--sans);color:#eefcf5;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .tool h3 .tag{font:600 9px var(--mono);letter-spacing:.2em;color:var(--green);border:1px solid rgba(24,226,140,.4);padding:3px 6px}
  .tool > p.d{color:var(--muted);font-size:14px;margin-bottom:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{font-size:12px;color:var(--faint);margin-top:10px}
  .msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--text)}
  .msg.ok{color:var(--green)} .msg.bad{color:#ff8d9e}

  /* угадай слово */
  .nw-phrase{font:600 clamp(20px,2.6vw,26px)/1.3 var(--sans);margin-bottom:14px;color:#eefcf5}
  .nw-phrase .blank{display:inline-block;min-width:120px;border-bottom:2px dashed var(--green);color:var(--green);text-align:center;padding:0 6px;transition:color .2s}
  .chip{border:1px solid var(--line-hi);background:rgba(2,10,16,.8);padding:8px 13px;font-size:14px;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
  .chip:hover{border-color:var(--green)}
  .chip.you{border-color:var(--blue);background:rgba(69,170,255,.15)}
  .chip.hot{border-color:var(--green);background:rgba(24,226,140,.22);box-shadow:0 0 14px rgba(24,226,140,.4);transform:translateY(-2px)}
  .chip.funny{border-style:dashed;color:var(--pink);opacity:.85}
  .nw-heat{display:flex;align-items:center;gap:12px;margin:14px 0 10px;font-size:12px;color:var(--muted)}
  .nw-heat b{font:600 11px var(--mono);letter-spacing:.14em;color:var(--text);text-transform:uppercase}
  .nw-heat input{flex:1;max-width:260px;accent-color:var(--green)}
  .bars{display:grid;gap:5px;margin-top:12px}
  .bar{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:13px}
  .bar i{display:block;height:8px;background:var(--green);box-shadow:0 0 8px rgba(24,226,140,.5);width:0;transition:width .5s}
  .bar.f i{background:var(--pink);box-shadow:0 0 8px rgba(255,143,208,.5)}
  .bar em{font:500 11px var(--mono);color:var(--muted);font-style:normal;text-align:right}
  @media (max-width:520px){ .bar{grid-template-columns:90px 1fr 44px} }

  /* сортировка */
  .so-stage{position:relative;min-height:240px}
  .so-card{position:relative;margin:4px auto 18px;width:min(360px,100%);min-height:84px;padding:16px 18px;border:1px solid var(--line-hi);background:#071822;
    font-size:16px;text-align:center;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;user-select:none;
    box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
  .so-card.drag{transition:none;cursor:grabbing;z-index:5}
  .so-card.gone{opacity:0}
  .so-card.enter{transform:translateY(-30px) rotate(-3deg);opacity:0}
  .bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .bin{border:1px dashed var(--line-hi);background:rgba(2,10,16,.6);padding:16px 8px;text-align:center;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:.2s}
  .bin .ico{display:block;margin:0 auto 8px}
  .bin.over,.bin:hover{border-style:solid;border-color:var(--green);background:rgba(24,226,140,.08)}
  .bin.ok{animation:binok .6s} .bin.bad{animation:shake .5s}
  @keyframes binok{30%{box-shadow:0 0 0 2px var(--green),0 0 26px rgba(24,226,140,.6)}}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .so-count{font:500 11px var(--mono);color:var(--faint);letter-spacing:.1em;text-align:center;margin-top:10px}

  /* детектор выдумки */
  .li{display:grid;grid-template-columns:1fr 150px;gap:16px;align-items:center}
  .li-says{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
  .li-f{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(2,10,16,.75);padding:10px 14px;margin-bottom:8px;font-size:14px;border-radius:14px 14px 14px 2px;transition:.2s}
  .li-f:hover{border-color:var(--line-hi);transform:translateX(3px)}
  .li-f.fake{border-color:var(--red);background:rgba(255,77,103,.12)}
  .li-f.true{border-color:rgba(24,226,140,.5)}
  .meter{width:150px;height:96px;position:relative}
  .meter svg{width:100%;height:100%}
  .meter .needle{transform-origin:75px 82px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
  .meter .lamp{transition:fill .3s}
  @media (max-width:560px){ .li{grid-template-columns:1fr} .meter{margin:0 auto} }

  /* машина дел */
  .slot{display:grid;grid-template-columns:1fr 70px;gap:12px;align-items:stretch;max-width:560px}
  .reelwin{height:84px;overflow:hidden;border:2px solid var(--line-hi);background:#04121a;position:relative;box-shadow:inset 0 10px 18px rgba(0,0,0,.6),inset 0 -10px 18px rgba(0,0,0,.6)}
  .reel{position:absolute;left:0;right:0;top:0}
  .reel div{height:84px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 14px;font-size:15px;color:#eefcf5}
  .lever{position:relative;border:none;background:none}
  .lever .stick{position:absolute;left:50%;top:6px;width:6px;height:56px;margin-left:-3px;background:linear-gradient(90deg,#9aa,#dee,#9aa);transform-origin:50% 100%;transition:transform .25s}
  .lever .ball{position:absolute;left:50%;top:-6px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9aa8,var(--red));box-shadow:0 0 12px rgba(255,77,103,.6);transform-origin:50% 68px;transition:transform .25s}
  .lever .base{position:absolute;left:50%;bottom:6px;width:34px;height:14px;margin-left:-17px;background:#2a3a44;border-radius:3px}
  .lever .lbl{position:absolute;left:0;right:0;bottom:-16px;font:600 9px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .lever.pull .stick,.lever.pull .ball{transform:rotate(150deg)}
  .sl-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .sl-cards button{border:1px solid var(--line);background:rgba(2,10,16,.7);padding:9px;font-size:13px;transition:.2s}
  .sl-cards button:hover{border-color:var(--amber)}
  .sl-cards button.ok{border-color:var(--green);background:rgba(24,226,140,.14)}
  .sl-cards button.no{border-color:var(--red);animation:shake .4s}
  .ex{margin-top:12px;padding:12px 14px;border-left:2px solid var(--amber);background:rgba(243,207,98,.06);font-size:14px}
  .ex b{display:block;font:600 10px var(--mono);letter-spacing:.16em;color:var(--amber);text-transform:uppercase;margin-bottom:4px}

  /* пазл */
  .pz-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:14px}
  .slotp{min-height:74px;border:1px dashed var(--line-hi);padding:8px;display:flex;flex-direction:column;gap:6px;background:rgba(2,10,16,.5)}
  .slotp + .slotp{border-left:none}
  .slotp > span{font:600 9px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
  .tray{display:flex;flex-wrap:wrap;gap:8px}
  .pc{--pc:var(--green);position:relative;border:none;padding:9px 18px 9px 22px;font-size:13px;color:#04121a;background:var(--pc);text-align:left;
    clip-path:polygon(0 0,calc(100% - 10px) 0,calc(100% - 10px) 30%,100% 30%,100% 70%,calc(100% - 10px) 70%,calc(100% - 10px) 100%,0 100%,0 70%,10px 70%,10px 30%,0 30%);
    transition:transform .2s,filter .2s}
  .pc:hover{transform:translateY(-2px);filter:brightness(1.12)}
  .pc.ctx{--pc:var(--blue)} .pc.fmt{--pc:var(--amber)}
  .pc.badp{--pc:#5d6b73;color:#dfe8ec;clip-path:polygon(0 0,100% 0,96% 22%,100% 40%,94% 58%,100% 78%,95% 100%,0 100%,4% 76%,0 52%,5% 30%,0 12%)}
  .pc.no{animation:shake .45s}
  .slotp .pc{width:100%}
  .assembled{margin-top:6px;padding:12px 14px;border:1px solid rgba(24,226,140,.4);background:rgba(24,226,140,.06);font-size:15px}
  .answer{margin-top:10px;padding:12px 14px;border:1px solid var(--line);background:rgba(2,10,16,.75);font-size:14px;white-space:pre-wrap}
  .answer b{display:block;font:600 10px var(--mono);letter-spacing:.14em;color:var(--blue);text-transform:uppercase;margin-bottom:6px}
  .answer.bare{border-color:rgba(255,77,103,.35)}
  @media (max-width:560px){ .pz-row{grid-template-columns:1fr} .slotp + .slotp{border-left:1px dashed var(--line-hi);border-top:none} }

  /* тон-метр */
  .tone{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}
  .dial{width:220px}
  .dial svg{width:100%;display:block}
  .dial .ndl{transform-origin:110px 112px;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
  .dial input{width:100%;accent-color:var(--green);margin-top:4px}
  .dial .lbls{display:flex;justify-content:space-between;font:500 10px var(--mono);color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
  .tone-req{font:500 15px/1.4 var(--mono);color:#eefcf5;padding:12px 14px;border:1px solid var(--line);background:rgba(2,10,16,.75);margin-bottom:10px}
  .tone-re{font-size:14px;color:var(--green);margin-bottom:6px}
  .tone-v{font-size:14px;color:var(--muted)}
  @media (max-width:620px){ .tone{grid-template-columns:1fr} .dial{margin:0 auto} }

  /* проверка */
  .parts{display:flex;gap:6px;margin-bottom:14px}
  .parts i{flex:1;height:8px;background:rgba(255,255,255,.07);transition:background .4s,box-shadow .4s}
  .parts i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
  .parts i.off{background:rgba(255,77,103,.5)}
  .qn{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
  .qq{font:600 18px/1.35 var(--sans);color:#eefcf5;margin-bottom:12px}
  .qa{display:grid;gap:8px}
  .qa button{text-align:left;border:1px solid var(--line);background:rgba(2,10,16,.7);padding:10px 14px;font-size:14px;transition:.2s}
  .qa button:hover{border-color:var(--line-hi)}
  .qa button.ok{border-color:var(--green);background:rgba(24,226,140,.14)}
  .qa button.no{border-color:var(--red);background:rgba(255,77,103,.12)}
  .qa button:disabled{cursor:default}
  .qx{margin-top:10px;font-size:14px;color:var(--muted)}

  /* итог */
  .fin .stickers{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}
  .stk{text-align:center;font-size:11px;color:var(--muted)}
  .stk .disc{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;border:2px dashed var(--faint);display:flex;align-items:center;justify-content:center;transition:.4s}
  .stk.got .disc{border:2px solid var(--green);background:radial-gradient(circle,rgba(24,226,140,.2),rgba(2,10,16,.9));box-shadow:0 0 16px rgba(24,226,140,.35);transform:rotate(-8deg)}
  .stk:not(.got) .ico{opacity:.15;filter:grayscale(1)}
  .stk.got{color:var(--text)}
  .fin ul{list-style:none;margin:8px 0 22px;display:grid;gap:6px}
  .fin li{padding-left:22px;position:relative}
  .fin li::before{content:'';position:absolute;left:4px;top:.55em;width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--green)}
  .fin .lock{color:var(--faint);font-size:13px;margin-bottom:14px}
  @media (max-width:560px){ .fin .stickers{grid-template-columns:repeat(3,1fr)} }

  /* наклейка получена */
  #toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translate(-50%,40px);opacity:0;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;
    background:rgba(3,14,20,.96);border:1px solid var(--green);box-shadow:0 0 24px rgba(24,226,140,.35);transition:.35s;pointer-events:none;font-size:14px}
  #toast.on{transform:translate(-50%,0);opacity:1}
  #toast .disc{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,rgba(24,226,140,.3),#041016);display:flex;align-items:center;justify-content:center;animation:spin .8s}
  @keyframes spin{from{transform:rotate(-200deg) scale(.4)}}

  footer{position:relative;z-index:3;display:flex;justify-content:space-between;gap:12px;padding:24px clamp(16px,6vw,96px) max(24px,env(safe-area-inset-bottom));
    font:500 10px/1.4 var(--mono);letter-spacing:.16em;color:var(--faint);text-transform:uppercase;border-top:1px solid rgba(101,188,255,.1)}

  /* ── меню ── */
  #veil{position:fixed;inset:0;z-index:40;background:rgba(1,4,7,.6);opacity:0;pointer-events:none;transition:opacity .3s}
  body.menu #veil{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(420px,92vw);background:rgba(3,10,14,.97);border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  body.menu #drawer{transform:none}
  .drh{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
  .drh span{font:600 12px var(--mono);letter-spacing:.2em}
  #drClose{background:none;border:1px solid var(--line);width:32px;height:32px;font:16px/1 var(--mono);color:var(--muted)}
  .drb{flex:1;overflow-y:auto;padding:14px 18px 24px}
  .drs{font:500 10px var(--mono);letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin:16px 0 8px}
  .drs:first-child{margin-top:2px}
  .dbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid var(--line);padding:9px 12px;margin-bottom:6px;font-size:13px;color:var(--muted)}
  .dbtn:hover{color:#fff;border-color:var(--line-hi)}
  .dbtn .n{font:500 10px var(--mono);color:var(--green)}
  .dbtn .ok{margin-left:auto;font:700 12px var(--mono);color:var(--green)}
  .dst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .dst .stk .disc{width:48px;height:48px}
  #langs{display:flex;flex-wrap:wrap;gap:6px}
  #langs button{background:none;border:1px solid var(--line);padding:6px 9px;font:500 11px var(--mono);letter-spacing:.1em;color:var(--muted)}
  #langs button.sel{border-color:var(--green);color:var(--green)}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  }
</style>
