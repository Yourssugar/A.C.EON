<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Что такое ИИ / LAYER_01 / NODE AI / A.C.EON</title>
<script src="../../../universe.js"></script>
<style>
  :root{
    --bg:#020609; --panel:rgba(5,14,19,.84); --panel2:rgba(2,10,16,.7);
    --line:rgba(101,188,255,.2); --line-hi:rgba(101,188,255,.46);
    --text:#d8e8ef; --muted:#8ea3ad; --faint:#4a5c66;
    --blue:#45aaff; --green:#18e28c; --amber:#f3cf62; --red:#ff4d67; --pink:#ff8fd0;
    --lc:var(--green);
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
    --col:min(760px,calc(100vw - 32px));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit;cursor:pointer}
  ::selection{background:rgba(24,226,140,.3)}

  /* фон */
  #bgs{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#010407,#031015 50%,#020508)}
  .bgi{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.1s}
  .bgi.on{opacity:1}
  #bgs::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,9,.9) 0%,rgba(2,6,9,.78) 45%,rgba(2,6,9,.3) 80%,rgba(2,6,9,.2) 100%)}
  @media (max-width:760px){ #bgs::after{background:rgba(2,6,9,.82)} section{padding-bottom:120px} #say{max-width:min(240px,70vw)} }

  /* робот */
  #bot{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
  #botHit{position:fixed;left:0;top:0;z-index:6;cursor:pointer;border-radius:40%}
  #say{position:fixed;left:0;top:0;z-index:7;max-width:min(280px,64vw);padding:9px 13px;background:rgba(3,12,18,.94);border:1px solid var(--line-hi);
    color:var(--text);font-size:13px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .25s;border-radius:2px}
  #say::before{content:'NODE';display:block;font:600 9px var(--mono);letter-spacing:.2em;color:var(--green);margin-bottom:3px}
  #say.on{opacity:1}

  /* шапка */
  #top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) clamp(12px,3vw,28px) 10px;pointer-events:none}
  #top > *{pointer-events:auto}
  .tl,.tr{display:flex;gap:8px;align-items:center}
  .tbtn{background:rgba(2,8,12,.7);border:1px solid var(--line);color:var(--muted);border-radius:2px;
    padding:7px 11px;font:500 11px/1.2 var(--mono);letter-spacing:.12em;display:flex;align-items:center;gap:8px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .15s,border-color .15s;white-space:nowrap}
  .tbtn:hover,.tbtn:focus-visible{color:var(--text);border-color:var(--line-hi);outline:none}
  #stk img{width:18px;height:18px;filter:grayscale(1) opacity(.45);transition:filter .4s}
  #stk.got img{filter:none}
  #stk.pop{animation:pop .5s}
  @keyframes pop{40%{transform:scale(1.25)}}
  .burger{width:16px;height:10px;position:relative;display:inline-block}
  .burger::before,.burger::after,.burger i{content:'';position:absolute;left:0;right:0;height:1px;background:currentColor}
  .burger::before{top:0}.burger i{top:4.5px}.burger::after{bottom:0}
  #core .sh{display:none}
  @media (max-width:560px){ #menuBtn .lbl,#core .lbl{display:none} #core .sh{display:inline} }
  #prog{position:fixed;left:0;top:0;height:2px;z-index:31;background:var(--green);box-shadow:0 0 8px var(--green);width:0}

  /* колонка */
  main{position:relative;z-index:3}
  section{position:relative;min-height:100vh;min-height:100svh;padding:110px 16px 80px clamp(16px,6vw,96px)}
  .col{width:var(--col)}
  .rv{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
  .rv.in{opacity:1;transform:none}
  html.nomo .rv{opacity:1;transform:none;transition:none}

  .hero{display:flex;align-items:center}
  .eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.2em;color:var(--green);text-transform:uppercase;margin-bottom:14px}
  h1{font:700 clamp(36px,6.4vw,72px)/1.04 var(--sans);color:#eefcf5;text-shadow:0 0 30px rgba(24,226,140,.25);margin-bottom:18px}
  .lead{font-size:clamp(16px,1.8vw,19px);color:var(--text);max-width:600px;margin-bottom:26px}
  .map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px;max-width:640px}
  .map a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);font-size:13px;transition:border-color .2s,background .2s}
  .map a:hover{border-color:var(--green);background:rgba(24,226,140,.06)}
  .map a .n{font:500 11px var(--mono);color:var(--green)}
  @media (max-width:560px){ .map{grid-template-columns:1fr 1fr} }
  .cap{font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin:0 0 10px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border:1px solid var(--lc);background:var(--lc);color:#04121a;
    font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:filter .2s,box-shadow .2s,transform .15s}
  .btn:hover{filter:brightness(1.1);box-shadow:0 0 22px color-mix(in srgb,var(--lc) 45%,transparent)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--lc)}
  .btn:disabled{opacity:.4;pointer-events:none}

  .th{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
  .th .num{font:600 13px var(--mono);color:var(--green);letter-spacing:.1em}
  h2{font:700 clamp(26px,3.6vw,40px)/1.15 var(--sans);color:#eefcf5}
  .txt p{color:var(--text);margin-bottom:12px;max-width:680px}
  .txt p.sub{color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 26px}
  .card{border:1px solid var(--line);background:var(--panel2);padding:14px;transition:transform .25s,border-color .25s}
  .card:hover{transform:translateY(-3px);border-color:var(--line-hi)}
  .card b{display:block;font-weight:600;color:#eefcf5;margin-bottom:4px}
  .card span{font-size:13px;color:var(--muted)}
  .card.k1{border-top:2px solid var(--green)} .card.k2{border-top:2px solid var(--blue)} .card.k3{border-top:2px solid var(--amber)}
  @media (max-width:640px){ .cards{grid-template-columns:1fr} }

  /* пособие */
  .tool{border:1px solid var(--line);background:var(--panel);padding:18px;margin:6px 0 24px;position:relative;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .tool::before{content:'';position:absolute;left:-1px;top:-1px;width:26px;height:26px;border-left:2px solid var(--green);border-top:2px solid var(--green)}
  .tool h3{font:600 17px/1.3 var(--sans);color:#eefcf5;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .tool h3 .tag{font:600 9px var(--mono);letter-spacing:.2em;color:var(--green);border:1px solid rgba(24,226,140,.4);padding:3px 6px}
  .tool > p.d{color:var(--muted);font-size:14px;margin-bottom:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{font-size:12px;color:var(--faint);margin-top:10px}
  .msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--text)}
  .msg.ok{color:var(--green)} .msg.bad{color:#ff8d9e}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  /* половинки слова */
  .halves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 6px;max-width:680px}
  .half{border:none;background:none;height:150px;perspective:900px;text-align:left}
  .half .in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
  .half.on .in{transform:rotateY(180deg)}
  .half .f,.half .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line-hi);padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
  .half .f{background:linear-gradient(160deg,rgba(24,226,140,.12),rgba(2,10,16,.85));font:700 clamp(22px,3vw,34px)/1.1 var(--sans);color:#eefcf5}
  .half .f small{display:block;font:500 10px var(--mono);letter-spacing:.2em;color:var(--green);text-transform:uppercase;margin-top:10px}
  .half .b{transform:rotateY(180deg);background:rgba(3,14,20,.95);font-size:14px;color:var(--text);border-color:var(--green)}
  .half .b b{font:600 11px var(--mono);letter-spacing:.16em;color:var(--green);text-transform:uppercase;margin-bottom:6px}
  .hcap{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:22px}
  @media (max-width:520px){ .half{height:160px} .half .b{font-size:13px;padding:12px} }

  /* где тут ИИ */
  .room{position:relative;width:100%;border:1px solid var(--line);overflow:hidden;background:#05121a}
  .room > img{display:block;width:100%;height:auto}
  .hs{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(24,226,140,.18);
    box-shadow:0 0 0 0 rgba(24,226,140,.6);animation:ping 2.2s infinite;transition:transform .2s,background .2s}
  .hs:hover{transform:scale(1.18)}
  .hs i{position:absolute;inset:9px;border-radius:50%;background:#fff;opacity:.85}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(24,226,140,.55)}70%{box-shadow:0 0 0 14px rgba(24,226,140,0)}100%{box-shadow:0 0 0 0 rgba(24,226,140,0)}}
  .hs.v-yes,.hs.v-part,.hs.v-no{animation:none;width:26px;height:26px;margin:-13px 0 0 -13px}
  .hs.v-yes{background:var(--green);border-color:#eafff5} .hs.v-part{background:var(--amber);border-color:#fff7dc} .hs.v-no{background:#5d6d76;border-color:#c9d3d8}
  .hs.v-yes i,.hs.v-part i,.hs.v-no i{inset:8px;background:#04121a}
  .hs.sel{transform:scale(1.3);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
  .rmInfo{min-height:74px;margin-top:12px;padding:12px 14px;border:1px solid var(--line);background:rgba(2,10,16,.75);font-size:14px}
  .rmInfo .nm{font-weight:600;color:#eefcf5;margin-right:8px}
  .vchip{display:inline-block;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border:1px solid;vertical-align:2px}
  .vchip.v-yes{color:var(--green);border-color:rgba(24,226,140,.5)} .vchip.v-part{color:var(--amber);border-color:rgba(243,207,98,.5)} .vchip.v-no{color:#9fb0b8;border-color:rgba(159,176,184,.4)}
  .rmInfo p{color:var(--muted);margin-top:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
  .legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .legend .v-yes::before{background:var(--green)} .legend .v-part::before{background:var(--amber)} .legend .v-no::before{background:#5d6d76}

  /* телефон с подсказками */
  .ac{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}
  .phone{position:relative;width:280px;max-width:100%;margin:0 auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.55))}
  .phone > img{display:block;width:100%}
  .scr{position:absolute;left:9%;right:9%;top:7%;bottom:6%;display:flex;flex-direction:column;overflow:hidden;border-radius:6px}
  .bub{margin:16% 8px 0 auto;max-width:86%;padding:9px 12px;background:#1d6f55;color:#effff8;border-radius:14px 14px 2px 14px;font-size:14px;line-height:1.35;word-wrap:break-word}
  .bub .car{display:inline-block;width:2px;height:1em;background:#effff8;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .bub .nw{animation:wIn .35s}
  @keyframes wIn{from{opacity:0;color:var(--amber)}}
  .sug{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(14,32,40,.95);border-top:1px solid rgba(101,188,255,.25)}
  .sug button{border:none;background:none;padding:9px 3px;font-size:12px;line-height:1.2;color:#dcecf1;min-height:42px;word-break:break-word;transition:background .15s,color .15s}
  .sug button + button{border-left:1px solid rgba(101,188,255,.18)}
  .sug button:first-child{font-weight:700;color:#fff}
  .sug button:last-child{color:var(--pink)}
  .sug button:hover,.sug button.hot{background:rgba(24,226,140,.22)}
  .kb{background:rgba(8,20,26,.96);padding:6px 4px 10px;display:grid;gap:5px}
  .kb div{display:flex;gap:4px;justify-content:center}
  .kb i{flex:1;max-width:18px;height:20px;border-radius:3px;background:rgba(160,190,200,.16)}
  .kb .sp{max-width:none;flex:5}
  .acSide .lbl{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
  .acPath{display:flex;gap:4px;margin:6px 0 2px;flex-wrap:wrap}
  .acPath i{width:16px;height:8px;background:rgba(255,255,255,.08)}
  .acPath i.p0{background:var(--green)} .acPath i.p1{background:var(--blue)} .acPath i.p2{background:var(--pink)}
  .acKey{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
  .acKey span::before{content:'';display:inline-block;width:12px;height:6px;margin-right:6px;vertical-align:1px}
  .acKey .k0::before{background:var(--green)} .acKey .k1::before{background:var(--blue)} .acKey .k2::before{background:var(--pink)}
  @media (max-width:620px){ .ac{grid-template-columns:1fr} .phone{width:min(280px,100%)} }

  /* обучи NODE */
  .tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
  .tc{position:relative;border:1px solid var(--line);background:rgba(2,10,16,.7);padding:6px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .3s}
  .tc img{width:100%;height:auto;display:block}
  .tc .tb{display:grid;gap:4px}
  .tc .tb button{border:1px solid var(--line);background:none;font-size:12px;padding:5px 2px;color:var(--muted);transition:.15s}
  .tc .tb button:hover{color:#fff;border-color:var(--line-hi)}
  .tc .tb button.sel{color:#04121a;background:var(--green);border-color:var(--green)}
  .tc .tb button.sel.n0{background:var(--amber);border-color:var(--amber)}
  .tc .nm{font-size:11px;line-height:1.25;color:var(--muted);text-align:center;min-height:2.5em}
  .tc .gs{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:4px 2px;border:1px solid}
  .tc.ok{border-color:rgba(24,226,140,.55)} .tc.ok .gs{color:var(--green)}
  .tc.no{border-color:rgba(255,77,103,.55)} .tc.no .gs{color:#ff8d9e}
  .tc.flip{animation:tcIn .5s both}
  @keyframes tcIn{from{opacity:0;transform:rotateY(90deg)}}
  .tc .mk{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;font:700 12px/20px var(--mono);text-align:center;color:#04121a}
  .tc.ok .mk{background:var(--green)} .tc.no .mk{background:var(--red)}
  .trBar{height:8px;background:rgba(255,255,255,.07);margin:10px 0 4px;overflow:hidden}
  .trBar i{display:block;height:100%;width:0;background:var(--green);box-shadow:0 0 10px var(--green);transition:width 2.4s linear}
  .wrong{margin-top:10px;display:grid;gap:6px}
  .wrong div{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;font-size:13px;padding:6px;border-left:2px solid var(--amber);background:rgba(243,207,98,.05)}
  .wrong img{width:44px;height:auto}
  .wrong b{color:#eefcf5;font-weight:600}
  @media (max-width:680px){ .tgrid{grid-template-columns:repeat(3,1fr)} }

  /* весы */
  .scl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center}
  .stage{position:relative;width:100%;max-width:440px;margin:0 auto}
  .stage img{position:absolute;display:block;pointer-events:none}
  .stage .bm,.stage .pan{transition:all .7s cubic-bezier(.3,1.4,.5,1)}
  html.nomo .stage .bm,html.nomo .stage .pan{transition:none}
  .stage .st{z-index:1} .stage .bm{z-index:2}
  .pan{position:absolute;z-index:3;border:none;background:none;padding:0}
  .pan img{position:static;width:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  .pan:hover img{filter:brightness(1.15) drop-shadow(0 0 10px rgba(243,207,98,.45))}
  .pan .tk{position:absolute;left:18%;right:18%;bottom:37%;display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:2px}
  .pan .tk i{width:26%;aspect-ratio:1.6;border-radius:2px;background:linear-gradient(#b7f7da,#18e28c);box-shadow:0 1px 2px rgba(0,0,0,.5);animation:tk .45s}
  .pan.you .tk i{background:linear-gradient(#ffe9a8,#f3cf62)}
  @keyframes tk{from{transform:translateY(-30px);opacity:0}}
  .pan .pl{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font:600 11px var(--mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .scCard{min-height:88px;padding:14px 16px;border:1px solid var(--line-hi);background:#071822;font-size:16px;display:flex;align-items:center;margin-bottom:10px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .scCard.bad{animation:shake .45s;border-color:var(--red)}
  .scCard.in{animation:tcIn .45s}
  .scN{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
  .scl .row .btn{flex:1;justify-content:center}
  @media (max-width:640px){ .scl{grid-template-columns:1fr} }

  /* история */
  .tline{list-style:none;position:relative;margin:10px 0 20px;display:grid;gap:14px}
  .tline::before{content:'';position:absolute;left:52px;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--green),var(--blue))}
  .tline li{position:relative;display:grid;grid-template-columns:106px 1fr;gap:16px;align-items:center}
  .tline img{width:106px;height:auto;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5));transition:transform .4s}
  .tline li:hover img{transform:scale(1.06) rotate(-3deg)}
  .tline .tx{border:1px solid var(--line);background:var(--panel2);padding:12px 14px}
  .tline .yr{font:700 22px var(--mono);color:var(--green);letter-spacing:.04em;margin-right:10px}
  .tline b{font-weight:600;color:#eefcf5}
  .tline p{font-size:14px;color:var(--muted);margin-top:4px}
  @media (max-width:520px){ .tline::before{left:36px} .tline li{grid-template-columns:74px 1fr;gap:10px} .tline img{width:74px} .tline .yr{font-size:18px} }

  /* проверка */
  .parts{display:flex;gap:6px;margin-bottom:14px}
  .parts i{flex:1;height:8px;background:rgba(255,255,255,.07);transition:background .4s,box-shadow .4s}
  .parts i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
  .parts i.off{background:rgba(255,77,103,.5)}
  .qn{font:500 10px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
  .qq{font:600 18px/1.35 var(--sans);color:#eefcf5;margin-bottom:12px}
  .qa{display:grid;gap:8px}
  .qa button{text-align:left;border:1px solid var(--line);background:rgba(2,10,16,.7);padding:10px 14px;font-size:14px;transition:.2s}
  .qa button:hover{border-color:var(--line-hi)}
  .qa button.ok{border-color:var(--green);background:rgba(24,226,140,.14)}
  .qa button.no{border-color:var(--red);background:rgba(255,77,103,.12)}
  .qa button:disabled{cursor:default}
  .qx{margin-top:10px;font-size:14px;color:var(--muted)}
  .bigst{display:flex;align-items:center;gap:16px;margin:4px 0 18px}
  .bigst img{width:110px;height:110px;filter:grayscale(1) opacity(.2);transition:.6s}
  .bigst.got img{filter:none;animation:spin .9s}
  .bigst span{font:600 15px var(--sans);color:var(--faint)}

    background:rgba(3,14,20,.96);border:1px solid var(--green);box-shadow:0 0 24px rgba(24,226,140,.35);transition:.35s;pointer-events:none;font-size:14px}
  #toast.on{transform:translate(-50%,0);opacity:1}
  #toast img{width:52px;height:52px;animation:spin .8s}
  @keyframes spin{from{transform:rotate(-200deg) scale(.4)}}

  footer{position:relative;z-index:3;display:flex;justify-content:space-between;gap:12px;padding:24px clamp(16px,6vw,96px) max(24px,env(safe-area-inset-bottom));
    font:500 10px/1.4 var(--mono);letter-spacing:.16em;color:var(--faint);text-transform:uppercase;border-top:1px solid rgba(101,188,255,.1)}

  body.menu #veil{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(420px,92vw);background:rgba(3,10,14,.97);border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  body.menu #drawer{transform:none}
  .drh{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
  .drh span{font:600 12px var(--mono);letter-spacing:.2em}
  #drClose{background:none;border:1px solid var(--line);width:32px;height:32px;font:16px/1 var(--mono);color:var(--muted)}
  .drb{flex:1;overflow-y:auto;padding:14px 18px 24px}
  .drs{font:500 10px var(--mono);letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin:16px 0 8px}
  .drs:first-child{margin-top:2px}
  .dbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid var(--line);padding:9px 12px;margin-bottom:6px;font-size:13px;color:var(--muted)}
  .dbtn:hover{color:#fff;border-color:var(--line-hi)}
  .dbtn .n{font:500 10px var(--mono);color:var(--green)}
  .dbtn.cur{border-color:rgba(24,226,140,.45);color:var(--text)}
  #langs{display:flex;flex-wrap:wrap;gap:6px}
  #langs button{background:none;border:1px solid var(--line);padding:6px 9px;font:500 11px var(--mono);letter-spacing:.1em;color:var(--muted)}
  #langs button.sel{border-color:var(--green);color:var(--green)}

  @media (prefers-reduced-motion: reduce){

    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  }
