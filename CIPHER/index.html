<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.C.EON // CIPHER</title>
<script src="../universe.js"></script>
<style>
  :root{
    --void:#0a0b0e;
    --panel:#12141a;
    --panel-2:#171a22;
    --line:#242835;
    --amber:#e8b04b;      /* фосфор телетайпа, главный акцент */
    --amber-dim:#8a6c2e;
    --steel:#7d8aa0;      /* вторичный текст */
    --steel-dim:#56607a;
    --paper:#d8dae0;      /* основной текст */
    --alert:#c8433a;      /* гриф, расшифровка */
    --ok:#5aa17f;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{background:var(--void)}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #14161d 0%, var(--void) 60%),var(--void);
    color:var(--paper);font-family:var(--mono);line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:14px 16px 80px;min-height:100vh;
  }
  html.gl body{background:transparent}
  /* фон ЭЛТ рисует WebGL; без него остаются тонкие сканлайны */
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
  html.gl #gl{display:block}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);mix-blend-mode:overlay}
  html.gl body::before{display:none}
  .wrap{max-width:860px;margin:0 auto;position:relative;z-index:1}

  /* ---- верхняя строка ---- */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .tb{background:rgba(18,20,26,.8);border:1px solid var(--line);color:var(--steel);font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    padding:6px 11px;cursor:pointer;transition:.15s}
  .tb:hover{color:var(--amber);border-color:var(--amber-dim)}
  #langwrap{position:relative}
  #langmenu{position:absolute;right:0;top:calc(100% + 4px);display:none;flex-direction:column;min-width:150px;padding:4px;z-index:30;background:var(--void);border:1px solid var(--amber-dim)}
  #langmenu.on{display:flex}
  #langmenu button{background:none;border:0;text-align:left;padding:6px 9px;font-family:var(--mono);font-size:12px;color:var(--steel);display:flex;gap:10px;cursor:pointer}
  #langmenu button b{font-weight:400;color:var(--steel-dim);width:20px}
  #langmenu button:hover,#langmenu button.sel{color:var(--amber);background:rgba(232,176,75,.07)}

  /* ---- ГРИФ / ШАПКА ---- */
  header{border:1px solid var(--line);background:var(--panel);position:relative}
  .stamp-row{display:flex;justify-content:space-between;align-items:stretch;border-bottom:1px solid var(--line)}
  .stamp-title{padding:14px 18px;min-width:0}
  .stamp-title h1{margin:0;font-size:clamp(20px,5vw,30px);letter-spacing:.18em;font-weight:700;color:var(--paper)}
  .stamp-title .dot{color:var(--amber)}
  .stamp-title p{margin:3px 0 0;font-size:11px;letter-spacing:.32em;color:var(--steel);text-transform:uppercase}
  .grif{display:flex;align-items:center;padding:0 16px;border-left:1px solid var(--line);color:var(--alert);font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-align:right}
  .grif span{border:1px solid var(--alert);padding:5px 9px;transform:rotate(-3deg);box-shadow:inset 0 0 0 2px rgba(200,67,58,.15)}
  .meta{display:flex;flex-wrap:wrap;gap:2px 22px;padding:9px 18px;font-size:11px;color:var(--steel-dim);letter-spacing:.14em}
  .meta b{color:var(--steel);font-weight:400}
  @media (max-width:520px){ .grif{padding:0 10px;font-size:9.5px} .stamp-title p{letter-spacing:.18em} }

  /* ---- шифромашина (роторы рисует WebGL сквозь прозрачное окно) ---- */
  .machine{display:none;margin-top:20px;border:1px solid var(--line);position:relative}
  html.gl .machine{display:block}
  .machine > .cap{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--steel)}
  .machine > .cap .n{color:var(--amber);font-weight:700}
  .machine > .cap .mode{margin-left:auto;color:var(--steel-dim);font-size:10px}
  .machine.dec > .cap .n{color:var(--alert)}
  #mscreen{position:relative;height:210px}
  @media (max-width:640px){ #mscreen{height:160px} }
  #rlabels{position:absolute;left:0;right:0;bottom:6px;height:16px;pointer-events:none}
  #rlabels span{position:absolute;bottom:0;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;color:var(--steel-dim);white-space:nowrap;transition:color .2s}
  #rlabels span b{color:var(--amber-dim);font-weight:400;margin-right:4px}
  #rlabels span.hot{color:var(--amber)}
  .machine.dec #rlabels span.hot{color:var(--alert)}
  #rempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.2em;color:var(--steel-dim);text-transform:uppercase;pointer-events:none}

  /* ---- ТАБЫ ---- */
  .tabs{display:flex;margin-top:20px;gap:0;border:1px solid var(--line)}
  .tab{flex:1;background:var(--panel);color:var(--steel);border:none;cursor:pointer;font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;padding:15px 8px;transition:.15s}
  .tab + .tab{border-left:1px solid var(--line)}
  .tab:hover{color:var(--paper);background:var(--panel-2)}
  .tab.on{color:var(--void);background:var(--amber)}
  .tab.on.dec{background:var(--alert);color:#fff}

  section.view{display:none;margin-top:20px}
  section.view.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .subtabs{display:flex;border:1px solid var(--line);margin-bottom:18px}
  .subtab{flex:1;background:var(--panel);color:var(--steel);border:none;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:12px 8px;transition:.15s}
  .subtab + .subtab{border-left:1px solid var(--line)}
  .subtab:hover{color:var(--paper);background:var(--panel-2)}
  .subtab.on{background:var(--alert);color:#fff}
  .hint{margin:10px 0 0;font-size:11.5px;line-height:1.55;color:var(--steel-dim);letter-spacing:.02em}

  .block{border:1px solid var(--line);background:var(--panel);margin-bottom:18px}
  .block > .cap{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--steel)}
  .cap .n{color:var(--amber);font-weight:700}
  .cap.dec .n{color:var(--alert)}
  .pad{padding:14px}

  textarea,input.txt{width:100%;background:var(--void);color:var(--paper);border:1px solid var(--line);font-family:var(--mono);font-size:14px;line-height:1.55;padding:12px;outline:none}
  textarea{min-height:110px;resize:vertical}
  textarea:focus,input.txt:focus{border-color:var(--amber-dim)}
  textarea.dec:focus{border-color:var(--alert)}

  /* ---- рецепты ---- */
  .rrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .preset{background:transparent;border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--mono);font-size:12px;padding:7px 11px;cursor:pointer;transition:.13s}
  .preset:hover{background:rgba(232,176,75,.1)}
  .preset.ghost{border-color:var(--line);color:var(--steel)}
  .preset.ghost:hover{color:var(--paper);border-color:var(--steel)}
  .mine{display:inline-flex;align-items:stretch;border:1px solid var(--line)}
  .mine button{background:var(--panel-2);border:0;color:var(--paper);font-family:var(--mono);font-size:12px;padding:6px 10px;cursor:pointer}
  .mine button:hover{color:var(--amber)}
  .mine button.x{border-left:1px solid var(--line);color:var(--steel-dim);padding:6px 8px}
  .mine button.x:hover{color:var(--alert)}
  .saverow{display:flex;gap:7px;margin-top:10px}
  .saverow input{flex:1;min-width:0;padding:7px 10px;font-size:12.5px}
  .saverow button{background:var(--panel-2);border:1px solid var(--line);color:var(--steel);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:0 12px;cursor:pointer}
  .saverow button:hover{color:var(--amber);border-color:var(--amber-dim)}
  .muted{color:var(--steel-dim);font-size:11.5px}

  /* ---- ПАЛИТРА ОПЕРАЦИЙ ---- */
  .grp-label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--steel-dim);margin:14px 0 7px}
  .grp-label:first-child{margin-top:0}
  .palette{display:flex;flex-wrap:wrap;gap:7px}
  .op{background:var(--panel-2);color:var(--paper);border:1px solid var(--line);cursor:pointer;font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;padding:8px 11px;transition:.13s;display:inline-flex;align-items:center;gap:7px}
  .op:hover,.op:focus-visible{border-color:var(--amber-dim);color:var(--amber);background:rgba(232,176,75,.07);outline:none}
  .op::before{content:"+";color:var(--amber);font-weight:700}
  .dec-pal .op:hover,.dec-pal .op:focus-visible{border-color:var(--alert);color:#ff9d94;background:rgba(200,67,58,.08)}
  .dec-pal .op::before{color:var(--alert)}
  .opdesc{margin-top:12px;min-height:38px;padding:8px 11px;border-left:2px solid var(--amber-dim);font-size:11.5px;line-height:1.55;color:var(--steel)}
  .opdesc b{color:var(--paper);font-weight:400}
  .dec-pal + .opdesc{border-left-color:var(--alert)}

  /* ---- КОНВЕЙЕР ---- */
  .pipe{display:flex;flex-direction:column;gap:0;position:relative}
  .pipe-empty{color:var(--steel-dim);font-size:13px;padding:22px 4px;text-align:center;border:1px dashed var(--line)}
  .step{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);padding:10px 12px;position:relative;touch-action:pan-y}
  .step + .step{margin-top:-1px}
  .step .idx{font-size:12px;color:var(--void);background:var(--amber);min-width:30px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.05em;cursor:grab;touch-action:none;user-select:none}
  .dec-pipe .step .idx{background:var(--alert);color:#fff}
  .step .idx::after{content:"";position:absolute}
  .step .nm{flex:1;min-width:0;font-size:13.5px;color:var(--paper)}
  .step .nm small{display:block;color:var(--steel-dim);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
  .step input.param{width:86px;background:var(--void);border:1px solid var(--line);color:var(--amber);font-family:var(--mono);font-size:13px;padding:6px 8px;outline:none;text-align:center}
  .step input.param:focus{border-color:var(--amber)}
  .step .ctrl{display:flex;gap:4px}
  .step .ctrl button{background:transparent;border:1px solid var(--line);color:var(--steel);cursor:pointer;width:28px;height:28px;font-family:var(--mono);font-size:13px;transition:.12s;line-height:1}
  .step .ctrl button:hover{border-color:var(--steel);color:var(--paper)}
  .step .ctrl button.x:hover{border-color:var(--alert);color:var(--alert)}
  .step.drag{z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.55);border-color:var(--amber-dim);transition:none}
  .step.drag .idx{cursor:grabbing}
  .step.shift{transition:transform .15s}
  .step.hl{border-color:var(--amber-dim)}
  @media (max-width:520px){ .step{gap:8px;padding:9px} .step input.param{width:64px} .step .ctrl button{width:26px} }
  .flow{color:var(--steel-dim);font-size:12px;text-align:center;line-height:1;padding:3px 0}
  .step.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim),0 0 18px rgba(232,176,75,.18)}
  .step.active .idx{background:#fff;color:var(--void);box-shadow:0 0 14px var(--amber)}

  /* ---- КНОПКИ ДЕЙСТВИЯ ---- */
  .run{width:100%;margin-top:2px;background:var(--amber);color:var(--void);border:none;cursor:pointer;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:16px;transition:.15s}
  .run:hover{filter:brightness(1.08)}
  .run:active{transform:translateY(1px)}
  .run.dec{background:var(--alert);color:#fff}
  .run:disabled{background:var(--line);color:var(--steel-dim);cursor:not-allowed;filter:none}

  /* ---- ВЫВОД ---- */
  .out-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .copy{background:transparent;border:1px solid var(--line);color:var(--steel);cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;padding:6px 12px;transition:.13s}
  .copy:hover{border-color:var(--amber);color:var(--amber)}
  .copy[hidden]{display:none}
  .copy.air.live{border-color:var(--amber);color:var(--amber);animation:blink 1s steps(1) infinite}
  .tbr{display:flex;gap:6px;align-items:center}
  #sndBtn.off{color:var(--steel-dim)}
  #sndBtn[hidden]{display:none}
  /* учебный и реальный режим */
  .modes{display:flex;margin-top:14px;border:1px solid var(--line)}
  .mode{flex:1;background:var(--panel);border:0;color:var(--steel);font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:12px 8px;cursor:pointer;transition:.15s;display:flex;gap:8px;justify-content:center;align-items:center}
  .mode + .mode{border-left:1px solid var(--line)}
  .mode b{color:var(--steel-dim);font-weight:400}
  .mode:hover{color:var(--paper);background:var(--panel-2)}
  .mode.on{background:var(--panel-2);color:var(--amber);box-shadow:inset 0 -2px 0 var(--amber)}
  .mode.real.on{color:var(--ok);box-shadow:inset 0 -2px 0 var(--ok)}
  body.real .t-only{display:none!important}
  body:not(.real) .r-only{display:none!important}
  .rnote{margin-top:10px;padding:9px 12px;border:1px solid rgba(90,161,127,.45);color:#9fd6b8;font-size:11.5px;line-height:1.55;background:rgba(90,161,127,.07)}
  body.real .tab.on,body.real .tab.on.dec{background:var(--ok);color:var(--void)}
  body.real .run,body.real .run.dec{background:var(--ok);color:var(--void)}
  body.real .run:disabled{background:var(--line);color:var(--steel-dim)}
  body.real .cap .n,body.real .cap.dec .n{color:var(--ok)}
  body.real .grif{color:var(--ok)}
  body.real .grif span{border-color:var(--ok);box-shadow:inset 0 0 0 2px rgba(90,161,127,.15)}
  body.real .stamp-title .dot{color:var(--ok)}
  body.real .transmission{color:#9fd6b8}
  body.real .transmission.plain{color:var(--paper)}
  body.real #passBox{border-left-color:var(--ok)}
  body.real .console{border-left-color:var(--ok)}
  body.real .console div.hot{color:#9fd6b8;text-shadow:0 0 8px rgba(90,161,127,.4)}
  body.real textarea:focus,body.real input.txt:focus{border-color:var(--ok)}
  #rEye,#rGen{white-space:nowrap}
  .meter{height:4px;background:var(--line);margin-top:10px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
  .mtxt{font-size:11px;margin-top:6px;min-height:16px}
  #rwarn{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.84);display:flex;align-items:center;justify-content:center;padding:16px}
  #rwarn[hidden]{display:none}
  .rw-box{max-width:580px;width:100%;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--ok);padding:20px}
  .stamp{display:inline-block;color:var(--ok);border:1px solid var(--ok);padding:6px 10px;letter-spacing:.2em;text-transform:uppercase;font-size:12px;transform:rotate(-2deg)}
  .rw-box ul{margin:16px 0;padding-left:18px;font-size:12.5px;line-height:1.6;color:var(--paper)}
  .rw-box li{margin-bottom:7px}
  .rw-box .toggle{text-transform:none;letter-spacing:.02em;font-size:12.5px;color:var(--paper)}
  .rw-box .toggle input{accent-color:var(--ok)}
  .rw-act{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
  /* перехват */
  .capr{margin-left:auto;color:var(--steel-dim);font-size:10px;letter-spacing:.14em}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .mcard{background:var(--panel-2);border:1px solid var(--line);padding:11px 12px;text-align:left;cursor:pointer;font-family:var(--mono);color:var(--paper);transition:.15s;display:flex;flex-direction:column;gap:4px;min-height:92px}
  .mcard:hover{border-color:var(--alert)}
  .mcard .mn{font-size:20px;font-weight:700;color:var(--alert);letter-spacing:.05em}
  .mcard .mt{font-size:12px;line-height:1.35}
  .mcard .ms{margin-top:auto;font-size:12px;color:var(--amber);letter-spacing:.1em}
  .mcard.done{border-color:rgba(232,176,75,.4)}
  .mcard.locked{opacity:.38;cursor:not-allowed}
  .mcard.locked:hover{border-color:var(--line)}
  .stars{color:var(--amber);letter-spacing:.12em}
  .from{font-size:11px;letter-spacing:.16em;color:var(--steel-dim);text-transform:uppercase}
  .from b{color:var(--alert);font-weight:400}
  .from span{color:var(--paper)}
  .mbrief{margin:10px 0 0;font-size:13px;line-height:1.6;color:var(--paper)}
  #mCipher{max-height:220px;overflow:auto}
  .sig{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .sig span{font-size:10.5px;letter-spacing:.08em;border:1px solid var(--line);padding:3px 7px;color:var(--steel)}
  .sig span b{color:var(--paper);font-weight:400}
  .mhints div{margin-top:10px;font-size:12px;line-height:1.55;color:var(--paper);border-left:2px solid var(--amber-dim);padding-left:10px}
  .mhints div b{color:var(--amber);font-weight:400}
  #mOut{max-height:260px;overflow:auto}
  #mOut.err{color:var(--alert)}
  .mok{margin-top:14px;border:1px solid var(--amber-dim);padding:14px;background:rgba(232,176,75,.05);animation:fade .3s ease}
  .mok[hidden]{display:none}
  .mok-h{font-size:13px;letter-spacing:.2em;color:var(--amber);font-weight:700}
  .mok .run{margin-top:12px}

  /* ================= ТЕМЫ ОФОРМЛЕНИЯ =================
     data-theme на <html>: station (ЭЛТ, по умолчанию), stars, rain, pixel, radio, dossier.
     Фон темы лежит в #themebg (широкий и вертикальный вариант), холст WebGL поверх него прозрачен вне окна машины. */
  #themebg{position:fixed;inset:0;z-index:0;display:none;background:#05070c center/cover no-repeat}
  html.th-img #themebg{display:block}
  html.th-img body::before{display:none}
  html.th-img body{background:#05070c}
  [data-theme=stars] #themebg{background-image:url(themes/stars-w.webp)}
  [data-theme=rain] #themebg{background-image:url(themes/rain-w.webp)}
  [data-theme=pixel] #themebg{background-image:url(themes/pixel-w.webp);image-rendering:pixelated}
  [data-theme=radio] #themebg{background-image:url(themes/radio-w.webp)}
  [data-theme=dossier] #themebg{background-image:url(themes/dossier-w.webp)}
  @media (orientation:portrait),(max-width:760px){
    [data-theme=stars] #themebg{background-image:url(themes/stars-m.webp)}
    [data-theme=rain] #themebg{background-image:url(themes/rain-m.webp)}
    [data-theme=pixel] #themebg{background-image:url(themes/pixel-m.webp)}
    [data-theme=radio] #themebg{background-image:url(themes/radio-m.webp)}
    [data-theme=dossier] #themebg{background-image:url(themes/dossier-m.webp)}
  }
  html.th-img:not(.ufx1) header,html.th-img:not(.ufx1) .block,html.th-img:not(.ufx1) .tabs,html.th-img:not(.ufx1) .modes,html.th-img:not(.ufx1) .subtabs,html.th-img:not(.ufx1) .machine > .cap,html.th-img:not(.ufx1) .tb{backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  html.th-img .rnote{background:rgba(10,30,20,.75)}
  .stamp-title h1,.tab,.mode,.run,.block > .cap,.machine > .cap{font-family:var(--head,var(--mono))}

  /* звёздный архив: ночное небо, золото */
  [data-theme=stars]{--void:#050913;--panel:rgba(7,12,26,.8);--panel-2:rgba(14,21,42,.86);--line:rgba(201,163,90,.26);--amber:#e8c272;--amber-dim:#8f7440;--steel:#a6b0ca;--steel-dim:#6f7896;--paper:#e8e4d8;--alert:#e2675e}
  [data-theme=stars] .block,[data-theme=stars] header,[data-theme=stars] .machine{border-color:rgba(201,163,90,.32);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}
  /* дождливое окно: тёмное стекло, янтарь и зелёный сигнал */
  [data-theme=rain]{--void:#07090b;--panel:rgba(12,14,17,.72);--panel-2:rgba(22,25,29,.8);--line:rgba(255,255,255,.09);--amber:#e8b04b;--amber-dim:#7b6230;--steel:#97a1ab;--steel-dim:#5f6873;--paper:#e2e6ea;--alert:#e2524a}
  [data-theme=rain] .block,[data-theme=rain] header,[data-theme=rain] .machine{border-radius:4px}
  /* пиксельная комната: синий интерфейс, пиксельный шрифт заголовков */
  [data-theme=pixel]{--void:#0a1424;--panel:rgba(11,21,38,.92);--panel-2:#14263f;--line:#2b4a70;--amber:#f2b43a;--amber-dim:#8b6a2a;--steel:#8fb1d6;--steel-dim:#5a7699;--paper:#eaf2ff;--alert:#ff5f57;--head:'Pixelify Sans',var(--mono)}
  [data-theme=pixel] .block,[data-theme=pixel] header,[data-theme=pixel] .machine,[data-theme=pixel] .tabs,[data-theme=pixel] .modes{border-width:2px;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
  [data-theme=pixel] .op,[data-theme=pixel] .preset,[data-theme=pixel] .tb{border-width:2px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
  [data-theme=pixel] .stamp-title h1{letter-spacing:.12em}
  /* радиорубка: тёплое дерево и латунь, винты по углам */
  [data-theme=radio]{--void:#0f0b08;--panel:rgba(26,19,13,.9);--panel-2:rgba(40,29,20,.92);--line:rgba(196,146,74,.32);--amber:#e9a944;--amber-dim:#8a6328;--steel:#bba78c;--steel-dim:#80705b;--paper:#f0e5d2;--alert:#d9573f}
  [data-theme=radio] .block,[data-theme=radio] header,[data-theme=radio] .machine{border-color:rgba(196,146,74,.45);box-shadow:inset 0 1px 0 rgba(255,220,160,.08),0 10px 28px rgba(0,0,0,.5);
    background-image:radial-gradient(circle at 9px 9px,#9c7a45 2px,#3b2a18 3px,transparent 4px),radial-gradient(circle at calc(100% - 9px) 9px,#9c7a45 2px,#3b2a18 3px,transparent 4px)}
  [data-theme=radio] .run{background:linear-gradient(#f3c167,#c98a2c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.4)}
  [data-theme=radio] .tab.on{background:linear-gradient(#f3c167,#c98a2c)}
  /* досье: бумага, бордовый, машинопись */
  [data-theme=dossier]{--void:#f3ead6;--panel:#e9dfc8;--panel-2:#e1d4b8;--line:rgba(70,48,25,.28);--amber:#8e2230;--amber-dim:#b07a80;--steel:#5d4c3a;--steel-dim:#8c7a63;--paper:#2b2118;--alert:#9b1c28;--ok:#2f6b4a;--mono:'PT Mono',ui-monospace,monospace}
  [data-theme=dossier] .block,[data-theme=dossier] header,[data-theme=dossier] .tabs,[data-theme=dossier] .modes,[data-theme=dossier] .subtabs{background:#e9dfc8 url(themes/paper.webp) repeat;background-size:512px;border-color:rgba(70,48,25,.3);box-shadow:0 8px 22px rgba(0,0,0,.5)}
  [data-theme=dossier] .tab:not(.on),[data-theme=dossier] .mode:not(.on),[data-theme=dossier] .subtab:not(.on){background:transparent}
  [data-theme=dossier] .mode.on{background:rgba(142,34,48,.1)}
  [data-theme=dossier] .machine{border-color:rgba(0,0,0,.6);box-shadow:0 8px 22px rgba(0,0,0,.5)}
  [data-theme=dossier] .machine > .cap{background:#e9dfc8 url(themes/paper.webp);color:var(--steel)}
  [data-theme=dossier] header{position:relative}
  [data-theme=dossier] header::after{content:'';position:absolute;left:-10px;top:-18px;width:44px;height:48px;background:url(themes/clip.webp) center/contain no-repeat;transform:rotate(-8deg);pointer-events:none}
  [data-theme=dossier] .tb{background:rgba(233,223,200,.92);color:#4a3a2a;border-color:rgba(70,48,25,.35)}
  [data-theme=dossier] #langmenu{background:#efe5d0}
  [data-theme=dossier] .stamp-title h1{color:#2b2118}
  [data-theme=dossier] .console div.hot{text-shadow:none}
  [data-theme=dossier] .transmission.live{text-shadow:none}
  [data-theme=dossier] footer,[data-theme=dossier] footer b{color:#d8ccb4}


  /* ===== этап 2: своя машина у каждой темы ===== */
  #mview{position:absolute;inset:0}
  #rlabels.stars{top:0;bottom:0;height:auto}
  #rlabels.stars span{bottom:auto}
  #rlabels.stars span b::before{content:'ST-'}
  [data-theme=stars] #rlabels span{color:#c9b07a;text-shadow:0 0 6px rgba(0,0,0,.8)}
  [data-theme=stars] #rlabels span b{color:#e8c272}
  [data-theme=dossier] #rlabels span{color:#5d4c3a}
  [data-theme=dossier] #rlabels span b{color:#8e2230}
  [data-theme=pixel] #rlabels span{font-family:'Pixelify Sans',var(--mono);color:#8fb1d6}
  .gauges,.hud,.anom{display:none}
  [data-theme=radio] #mview{right:clamp(120px,30%,250px)}
  [data-theme=radio] .gauges{display:flex;position:absolute;right:8px;top:6px;bottom:6px;width:calc(clamp(120px,30%,250px) - 14px);flex-direction:column;justify-content:center;gap:4px}
  .gauge{position:relative;width:100%;max-height:calc(50% - 2px);aspect-ratio:420/165;margin:0 auto}
  .gauge img{width:100%;height:100%;display:block}
  .gauge .face{position:absolute;left:6%;right:6%;top:12%;bottom:16%;overflow:hidden}
  .gauge .needle{position:absolute;left:calc(50% - 1px);width:2px;top:27.2%;height:257%;background:linear-gradient(#5a1a10,#2a1608 35%);transform-origin:50% 100%;transform:rotate(-34deg);box-shadow:1px 0 1px rgba(0,0,0,.35)}
  .gauge span{position:absolute;left:0;right:0;bottom:19%;text-align:center;font-size:clamp(7px,1.6vw,10px);letter-spacing:.18em;color:#4a3420;font-weight:700}
  [data-theme=rain] .hud{display:grid;position:absolute;left:12px;top:10px;grid-template-columns:auto auto;gap:2px 10px;font-size:9.5px;letter-spacing:.14em;color:rgba(160,230,200,.55);pointer-events:none}
  [data-theme=rain] .hud b{font-weight:400;color:rgba(200,255,230,.85)}
  [data-theme=rain] .anom{display:block;position:absolute;top:10%;bottom:10%;width:0;border-left:1px solid #ff3b3b;box-shadow:0 0 10px #ff3b3b;opacity:0;pointer-events:none}
  .anom span{position:absolute;left:6px;bottom:0;white-space:nowrap;font-size:10px;letter-spacing:.14em;color:#ff6b6b}
  .anom em{font-style:normal}
  .anom.flip span{left:auto;right:6px}
  /* рукописные заметки по краям (только на широком экране) */
  #notes{position:fixed;inset:0;z-index:1;pointer-events:none;display:none}
  @media (min-width:1280px){ html.th-img #notes{display:block} }
  .note{position:absolute;max-width:min(210px,calc((100vw - 900px) / 2 - 24px));font-family:'Caveat',cursive;font-size:26px;line-height:1.15;white-space:pre-line;opacity:.88}
  [data-theme=stars] .note{color:#e3b866;text-shadow:0 0 12px rgba(227,184,102,.25)}
  [data-theme=rain] .note{color:rgba(225,232,238,.75);font-size:28px}
  [data-theme=radio] .note{color:#3a2a18;background:rgba(236,224,196,.92);padding:10px 14px;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
  [data-theme=dossier] .note{color:#a3212f;background:rgba(236,226,204,.94);padding:10px 14px;font-size:23px;box-shadow:0 6px 16px rgba(0,0,0,.5)}

  /* пиксельный робот-помощник сбоку */
  #rbSide{position:fixed;z-index:2;left:max(12px,calc(50% - 430px - 210px));bottom:16px;width:170px;display:none;pointer-events:none}
  @media (min-width:1280px){ [data-theme=pixel] #rbSide:not([hidden]){display:block} }
  #rbImg{width:170px;height:auto;image-rendering:pixelated;display:block}
  .rb-bub{position:absolute;bottom:calc(100% + 6px);left:40px;width:200px;background:#0d1a2e;border:2px solid #4fb6ff;color:#dff1ff;font-family:'Pixelify Sans',var(--mono);font-size:14px;line-height:1.35;padding:9px 11px;box-shadow:3px 3px 0 rgba(0,0,0,.5);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
  .rb-bub.on{opacity:1;transform:none}

  /* выбор оформления и настройки */
  #thPick{position:fixed;inset:0;z-index:55;background:rgba(4,5,8,.84);display:flex;align-items:center;justify-content:center;padding:16px}
  #thPick[hidden]{display:none}
  .th-box{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#10131a;border:1px solid #2c3242;padding:18px;color:#d8dae0;font-family:ui-monospace,"Cascadia Mono",monospace}
  .th-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#e8b04b;margin-bottom:14px}
  .th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .th-card{background:#171a22;border:1px solid #2c3242;padding:0;cursor:pointer;text-align:left;color:#d8dae0;font-family:inherit;transition:.15s;overflow:hidden}
  .th-card:hover,.th-card:focus-visible{border-color:#e8b04b;outline:none}
  .th-card.on{border-color:#e8b04b;box-shadow:0 0 0 1px #e8b04b}
  .th-card img,.th-card .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .th-card .ph{background:radial-gradient(ellipse at 50% 0,#1c2030,#0a0b0e 70%);position:relative}
  .th-card .ph::after{content:'';position:absolute;left:8%;right:8%;top:48%;height:2px;background:#e8b04b;box-shadow:0 0 10px #e8b04b;opacity:.8}
  .th-card span{display:block;padding:8px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .th-snd{margin-top:14px}
  .th-snd[hidden]{display:none}
  #thPick .hint{color:#7d8aa0}
  .run.realbtn{width:auto;padding:12px 18px;background:var(--ok);font-size:12px}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .incoming{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--alert);margin-bottom:10px}
  .incoming[hidden]{display:none}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #passBox{margin-top:12px;border-left:2px solid var(--alert);padding-left:12px}
  #passBox[hidden]{display:none}
  .passmsg{font-size:12px;color:var(--steel);margin-bottom:8px}
  .passmsg.bad{color:#ff8b80}
  #passBox .saverow input:focus{border-color:var(--alert)}
  .copy.dec:hover{border-color:var(--alert);color:var(--alert)}
  .transmission{background:var(--void);border:1px solid var(--line);padding:14px;font-size:13px;word-break:break-all;white-space:pre-wrap;color:var(--amber);min-height:44px}
  .transmission.plain{color:var(--paper)}
  .transmission.err{color:var(--alert);border-color:var(--alert)}
  .marker{color:var(--steel-dim)}
  .warn{margin-top:10px;font-size:11.5px;color:#e88a6b;border-left:2px solid var(--alert);padding-left:10px;display:none}
  .warn.on{display:block}

  .toggle{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--steel);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--amber)}
  .stages{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:none}
  .stages.on{display:block}
  .stage{font-size:12px;margin-bottom:10px;word-break:break-all;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  .stage .k{color:var(--amber);font-weight:700}
  .stages.dec .stage .k{color:var(--alert)}
  .stage .lbl{color:var(--steel);letter-spacing:.08em}
  .stage .val{grid-column:2;color:var(--paper);white-space:pre-wrap;max-height:4.8em;overflow:hidden;position:relative;cursor:pointer}
  .stage .val.open{max-height:none}
  .stage .len{color:var(--steel-dim);font-size:10.5px;margin-left:6px}

  /* лог */
  .console{display:none;margin-bottom:12px;border-left:2px solid var(--amber-dim);padding-left:12px;font-size:11.5px;line-height:1.95;letter-spacing:.06em}
  .console.on{display:block}
  .console div{color:var(--steel);opacity:.5;transition:.2s}
  .console div.hot{color:var(--amber);opacity:1;text-shadow:0 0 8px rgba(232,176,75,.4)}
  .transmission.live{color:var(--amber);text-shadow:0 0 6px rgba(232,176,75,.25)}
  .transmission.live-dec{color:var(--alert);text-shadow:0 0 6px rgba(200,67,58,.28)}
  .console.dec{border-left-color:var(--alert)}
  .console.dec div.hot{color:var(--alert);text-shadow:0 0 8px rgba(200,67,58,.4)}
  @media (prefers-reduced-motion: reduce){ .transmission.live{text-shadow:none} }

  footer{margin-top:26px;font-size:10.5px;color:var(--steel-dim);letter-spacing:.1em;text-align:center;line-height:1.7}
  footer b{color:var(--steel)}
  ::selection{background:var(--amber);color:var(--void)}
</style>
</head>
<body>
<div id="themebg"></div>
<canvas id="gl"></canvas>
<div id="notes" aria-hidden="true"></div>
<div id="rbSide" hidden><div class="rb-bub" id="rbBub"></div><img id="rbImg" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></div>
<div class="wrap">

  <div class="topbar">
    <button class="tb" id="back" type="button">&lt; A.C.EON</button>
    <div class="tbr"><button class="tb" id="setBtn" type="button">&#9881;</button><button class="tb" id="sndBtn" type="button"></button><div id="langwrap"><button class="tb" id="langbtn" type="button">RU</button><div id="langmenu"></div></div></div>
  </div>

  <header>
    <div class="stamp-row">
      <div class="stamp-title">
        <h1>A<span class="dot">.</span>C<span class="dot">.</span>EON<span class="dot"> // </span>CIPHER</h1>
        <p id="tSub"></p>
      </div>
      <div class="grif"><span id="tGrif"></span></div>
    </div>
    <div class="meta">
      <span><b id="tmCh"></b>: <span id="tmChV"></span></span>
      <span><b id="tmKey"></b>: <span id="tmKeyV"></span></span>
      <span><b id="tmParse"></b>: <span id="tmParseV"></span></span>
    </div>
  </header>

  <div class="modes">
    <button class="mode on" id="modeT" type="button"><b>01</b><span id="tModeT"></span></button>
    <button class="mode real" id="modeR" type="button"><b>02</b><span id="tModeR"></span></button>
  </div>
  <div class="rnote r-only" id="rnote"></div>

  <div class="machine" id="machine">
    <div class="cap"><span class="n">&#9881;</span> <span id="tMachine"></span><span class="mode" id="mMode"></span></div>
    <div id="mscreen">
      <div id="mview"><div id="rlabels"></div><div id="rempty"></div>
        <div class="hud" aria-hidden="true"><span>FREQ</span><b>1.3 kHz</b><span>SNR</span><b id="hudS">+12 dB</b></div>
        <div class="anom" id="mAnom" aria-hidden="true"><span>01 + <em id="tAnom"></em></span></div>
      </div>
      <div class="gauges" aria-hidden="true">
        <div class="gauge" id="gIn"><img src="themes/gauge.webp" alt=""><div class="face"><i class="needle"></i></div><span id="tGIn"></span></div>
        <div class="gauge" id="gOut"><img src="themes/gauge.webp" alt=""><div class="face"><i class="needle"></i></div><span id="tGOut"></span></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tab-enc" type="button"></button>
    <button class="tab dec" id="tab-dec" type="button"></button>
    <button class="tab dec t-only" id="tab-int" type="button"></button>
  </div>

  <!-- ========== ШИФРОВАНИЕ ========== -->
  <section class="view on" id="view-enc">
    <div class="block">
      <div class="cap"><span class="n">01</span> <span id="tC1"></span></div>
      <div class="pad"><textarea id="plain"></textarea></div>
    </div>

    <div class="block r-only">
      <div class="cap"><span class="n">02</span> <span id="tRPass"></span></div>
      <div class="pad">
        <div class="saverow"><input class="txt" id="rPass" type="password" autocomplete="new-password" spellcheck="false"><button type="button" id="rEye"></button><button type="button" id="rGen"></button></div>
        <div class="saverow"><input class="txt" id="rPass2" type="password" autocomplete="new-password" spellcheck="false"></div>
        <div class="meter"><i id="rBar"></i></div><div class="mtxt" id="rMeter"></div>
        <p class="hint" id="tRHint"></p>
      </div>
    </div>

    <div class="block t-only">
      <div class="cap"><span class="n">02</span> <span id="tC2"></span></div>
      <div class="pad">
        <div class="grp-label" id="tPresets"></div>
        <div class="rrow" id="presets"></div>
        <div class="grp-label" id="tMine"></div>
        <div class="rrow" id="mine"></div>
        <div class="saverow"><input class="txt" id="rname" maxlength="32"><button type="button" id="rsave"></button></div>
        <div style="height:16px"></div>
        <div id="palette"></div>
        <div class="opdesc" id="opdesc"></div>
      </div>
    </div>

    <div class="block t-only">
      <div class="cap"><span class="n">03</span> <span id="tC3"></span></div>
      <div class="pad"><div id="pipe" class="pipe"></div></div>
    </div>

    <button class="run" id="encBtn" type="button"></button>

    <div class="block" style="margin-top:18px" id="encOutWrap" hidden>
      <div class="cap"><span class="n">04</span> <span id="tC4"></span></div>
      <div class="pad">
        <div class="out-head"><label class="toggle t-only"><input type="checkbox" id="encSt"> <span class="tStages"></span></label><span class="btns"><button class="copy air" id="encMorse" type="button" hidden></button><button class="copy air" id="encVoice" type="button" hidden></button><button class="copy" id="encLink" type="button" hidden></button><button class="copy" id="encShare" type="button" hidden></button><button class="copy" id="encCopy" type="button"></button></span></div>
        <div style="height:10px"></div>
        <div id="encConsole" class="console"></div>
        <div id="transOut" class="transmission"></div>
        <div id="encStages" class="stages"></div>
      </div>
    </div>
  </section>

  <!-- ========== РАСШИФРОВКА ========== -->
  <section class="view" id="view-dec">
    <div class="subtabs t-only">
      <button class="subtab on" id="sub-auto" type="button"></button>
      <button class="subtab" id="sub-man" type="button"></button>
    </div>

    <div id="decAuto">
      <div class="block">
        <div class="cap dec"><span class="n">&#8634;</span> <span id="tDecPaste"></span></div>
        <div class="pad">
          <div class="incoming" id="incoming" hidden><span class="blink">&#9679;</span> <span id="tIncoming"></span></div>
          <textarea id="cipher" class="dec" placeholder="&#10216;ACEON:...&#10217;..."></textarea>
          <div id="passBox" hidden>
            <div class="passmsg" id="passMsg"></div>
            <div class="saverow"><input class="txt" id="passIn" type="password" autocomplete="off"><button type="button" id="passGo"></button></div>
          </div>
        </div>
      </div>
      <button class="run dec" id="decBtn" type="button"></button>
    </div>

    <div id="decMan" hidden>
      <div class="block">
        <div class="cap dec"><span class="n">&#9998;</span> <span id="tManPhrase"></span></div>
        <div class="pad">
          <textarea id="cipherMan" class="dec"></textarea>
          <p class="hint" id="tManHint"></p>
        </div>
      </div>
      <div class="block">
        <div class="cap dec"><span class="n">&#9636;</span> <span id="tManOps"></span></div>
        <div class="pad"><div id="paletteMan" class="dec-pal"></div><div class="opdesc" id="opdescMan"></div></div>
      </div>
      <div class="block">
        <div class="cap dec"><span class="n">&#9638;</span> <span id="tManSeq"></span></div>
        <div class="pad"><div id="pipeMan" class="pipe dec-pipe"></div></div>
      </div>
      <button class="run dec" id="decBtnMan" type="button"></button>
    </div>

    <div class="block" style="margin-top:18px" id="decOutWrap" hidden>
      <div class="cap dec"><span class="n">&#10003;</span> <span id="tRestored"></span></div>
      <div class="pad">
        <div class="out-head"><label class="toggle t-only"><input type="checkbox" id="decSt"> <span class="tStages"></span></label><button class="copy dec" id="decCopy" type="button"></button></div>
        <div style="height:10px"></div>
        <div id="decConsole" class="console dec"></div>
        <div id="plainOut" class="transmission plain"></div>
        <div class="warn" id="decWarn"></div>
        <div id="decStages" class="stages dec"></div>
      </div>
    </div>
  </section>

  <!-- ========== ПЕРЕХВАТ: миссии ========== -->
  <section class="view t-only" id="view-int">
    <div id="intList">
      <div class="block">
        <div class="cap dec"><span class="n">&#9673;</span> <span id="tIntList"></span><span class="capr" id="intProg"></span></div>
        <div class="pad"><div class="mgrid" id="mgrid"></div><p class="hint" id="tIntStars"></p></div>
      </div>
    </div>
    <div id="intMission" hidden>
      <button class="tb" id="intBack" type="button"></button>
      <div class="block brief" style="margin-top:12px">
        <div class="cap dec"><span class="n" id="mNum">01</span> <span id="mTitle"></span><span class="capr stars" id="mStars"></span></div>
        <div class="pad"><div class="from"><b id="tIntFrom"></b>: <span id="mFrom"></span></div><p class="mbrief" id="mBrief"></p></div>
      </div>
      <div class="block">
        <div class="cap dec"><span class="n">&#8634;</span> <span id="tIntCipher"></span></div>
        <div class="pad">
          <div class="transmission" id="mCipher"></div>
          <div class="sig" id="mSig"></div>
          <div class="rrow" style="margin-top:12px"><button class="preset" id="mHintBtn" type="button"></button><button class="preset ghost" id="mGive" type="button"></button></div>
          <div class="mhints" id="mHints"></div>
        </div>
      </div>
      <div class="block">
        <div class="cap dec"><span class="n">&#9636;</span> <span id="tIntBuild"></span></div>
        <div class="pad"><div id="paletteInt" class="dec-pal"></div><div class="opdesc" id="opdescInt"></div><div style="height:14px"></div><div id="pipeInt" class="pipe dec-pipe"></div></div>
      </div>
      <div class="block">
        <div class="cap dec"><span class="n">&#10003;</span> <span id="tIntOut"></span></div>
        <div class="pad">
          <div class="transmission plain" id="mOut"></div>
          <div class="mok" id="mOk" hidden><div class="mok-h"><span id="tIntOk"></span> <span class="stars" id="mOkStars"></span></div><p class="hint" id="mOkNote"></p><button class="run dec" id="mNext" type="button"></button></div>
        </div>
      </div>
    </div>
  </section>

  <footer><span class="t-only"><b id="tF1"></b> <span id="tF2"></span><br><span id="tF3"></span><br><span id="tF4"></span><br><span id="tF6"></span><br></span><span class="r-only"><span id="tFR"></span><br></span><span id="tF5"></span></footer>

<div id="thPick" hidden role="dialog" aria-modal="true">
  <div class="th-box">
    <div class="th-h"><span id="thTitle"></span><button class="tb" id="thClose" type="button">&#10005;</button></div>
    <div class="th-grid" id="thGrid"></div>
    <div class="th-snd" id="thSndRow"><label class="toggle"><input type="checkbox" id="thSnd"> <span id="thSndT"></span></label></div>
    <p class="hint" id="thNote"></p>
  </div>
</div>

<div id="rwarn" hidden role="dialog" aria-modal="true">
  <div class="rw-box">
    <span class="stamp" id="tRwT"></span>
    <ul id="rwList"></ul>
    <label class="toggle"><input type="checkbox" id="rwOk"> <span id="tRwAgree"></span></label>
    <div class="rw-act"><button class="tb" id="rwNo" type="button"></button><button class="run realbtn" id="rwYes" type="button" disabled></button></div>
  </div>
</div>
</div>
