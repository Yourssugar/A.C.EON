<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.C.EON — Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<script src="../../universe.js"></script>
<style>
/* ══ RESET ════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07050f;
  --t1: rgba(255,255,255,.9);
  --t2: rgba(255,255,255,.5);
  --t3: rgba(255,255,255,.2);
  --bd: rgba(255,255,255,.07);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Space Grotesk', sans-serif;
  color: var(--t1);
}

/* ══ LAYER STACK ══════════════════════════════════════
   0  — #skywrap → #cv + #cv-glitch (хроматика бьёт только сюда)
   10 — #fld orb container (→ 65 in phase 5)
   35 — #flash
   40 — #overlay
   50 — #reveal
════════════════════════════════════════════════════ */
#skywrap { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#cv {
  position: absolute; inset: 0;
  pointer-events: none;
  transition: opacity 2s ease;
}
#cv-glitch {
  position: absolute; inset: 0;
  pointer-events: none; opacity: 0;
}
#fld {
  position: fixed; inset: 0; z-index: 10;
  pointer-events: none;
}
#flash {
  position: fixed; inset: 0; z-index: 35;
  pointer-events: none; opacity: 0;
}
#overlay {
  position: fixed; inset: 0; z-index: 40;
  background: #fff; opacity: 0;
  pointer-events: none;
  transition: opacity 3.5s ease;
}
#reveal {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; padding: 52px;
  pointer-events: none;
}

/* ══ ORBS ════════════════════════════════════════════ */
.dw {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 20;
  pointer-events: none;
}
.dw.has-tip { pointer-events: auto; cursor: pointer; }

.dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: rgba(255,255,255,.8);
  box-shadow: 0 0 4px 1px rgba(255,255,255,.28), 0 0 10px 2px rgba(255,255,255,.08);
  animation: pu var(--pd,3s) ease-in-out infinite var(--pdly,0s);
  transition: transform .22s ease, background .15s, box-shadow .22s;
  will-change: transform;
}

@keyframes pu {
  0%,100% { opacity:.38; box-shadow:0 0 2px 1px rgba(255,255,255,.18); }
  50%      { opacity:.9;  box-shadow:0 0 8px 3px rgba(255,255,255,.5), 0 0 18px 5px rgba(255,255,255,.12); }
}

.dw:hover .dot, .dw.on .dot {
  transform: scale(4);
  box-shadow: 0 0 14px 5px rgba(255,255,255,.85), 0 0 28px 10px rgba(255,255,255,.28) !important;
  opacity: 1;
}

/* glitch tint states — box-shadow вместо filter:drop-shadow (дёшево) */
.dot.gc-r { background:#ff2255!important; box-shadow:0 0 6px 2px rgba(255,34,85,.7)!important; }
.dot.gc-g { background:#00ff77!important; box-shadow:0 0 6px 2px rgba(0,255,119,.7)!important; }
.dot.gc-b { background:#00aaff!important; box-shadow:0 0 6px 2px rgba(0,170,255,.7)!important; }
.dot.gc-y { background:#ffee00!important; box-shadow:0 0 6px 2px rgba(255,238,0,.7)!important; }
.dot.gc-p { background:#cc00ff!important; box-shadow:0 0 6px 2px rgba(204,0,255,.7)!important; }
.dot.gc-o { background:#ff8800!important; box-shadow:0 0 6px 2px rgba(255,136,0,.7)!important; }

/* ══ TOOLTIP ═════════════════════════════════════════ */
.tip {
  position: absolute;
  bottom: calc(100% + 14px);
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  opacity: 0;
  pointer-events: none;
  background: rgba(4,2,10,.94);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px;
  padding: 10px 14px;
  min-width: 130px; max-width: 215px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: opacity .18s, transform .18s;
  white-space: nowrap;
  z-index: 200;
}
.dw:hover .tip, .dw.on .tip {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.tip.dn {
  bottom: auto; top: calc(100% + 14px);
  transform: translateX(-50%) translateY(-8px);
}
.dw:hover .tip.dn, .dw.on .tip.dn { transform: translateX(-50%) translateY(0); }

.tn { font-size:12px; font-weight:500; margin-bottom:4px; color:var(--t1); font-family:monospace; }
.tp { font-size:11px; color:var(--t2); font-style:italic; line-height:1.45; white-space:normal; font-family:monospace; }
.tt { font-size:10px; color:var(--t3); margin-top:5px; font-family:monospace; }

/* ══ PHASE-5 BLACK STARS ═════════════════════════════ */
.dw.p5 .dot {
  background: rgba(0,0,0,.72) !important;
  box-shadow: 0 0 4px 1px rgba(0,0,0,.22), 0 0 10px 2px rgba(0,0,0,.07) !important;
  animation: pu5 var(--pd,3s) ease-in-out infinite var(--pdly,0s);
  filter: none !important;
}
@keyframes pu5 {
  0%,100% { opacity:.32; transform:scale(1);   box-shadow:0 0 2px 1px rgba(0,0,0,.15); }
  50%      { opacity:.82; transform:scale(1.7); box-shadow:0 0 8px 3px rgba(0,0,0,.42), 0 0 18px 5px rgba(0,0,0,.1); }
}
.dw.p5:hover .dot, .dw.p5.on .dot {
  transform: scale(5) !important;
  opacity: 1;
  background: rgba(0,0,0,.92) !important;
  box-shadow: 0 0 14px 5px rgba(0,0,0,.65), 0 0 28px 10px rgba(0,0,0,.22) !important;
}
.dw.p5 .tip {
  background: rgba(255,255,255,.97);
  border: 1px solid rgba(0,0,0,.1);
}
.dw.p5 .tn { color: #0d0d0d; }
.dw.p5 .tp { color: #555; }
.dw.p5 .tt { color: #aaa; }

/* ══ TEXT REVEAL ═════════════════════════════════════ */
.rv {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 300;
  text-align: center;
  max-width: 560px;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 1.5s ease, transform 1.5s ease;
}
.rv.show { opacity: 1; transform: translateY(0); }

.rv-err {
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #bbb;
  font-weight: 400;
  font-family: monospace;
}
.rv-main {
  font-size: clamp(24px, 3.8vw, 36px);
  font-weight: 400;
  color: #0d0d0d;
  letter-spacing: -.01em;
}
.rv-sub {
  font-size: clamp(14px, 2vw, 18px);
  color: #555;
  font-weight: 300;
}
.rv-end {
  font-size: clamp(11px, 1.4vw, 13px);
  letter-spacing: .08em;
  color: #bbb;
  font-weight: 300;
  margin-top: 6px;
}
</style>
</head>
<body>

<div id="skywrap">
  <canvas id="cv"></canvas>
  <canvas id="cv-glitch"></canvas>
</div>
<div id="flash"></div>
<div id="fld"></div>
<div id="overlay"></div>

<div id="reveal">
  <div class="rv rv-err">// FATAL ERROR — MEMORY CORRUPTION DETECTED</div>
  <div class="rv rv-main">your words were real.</div>
  <div class="rv rv-sub">we could not stop the collapse —<br>but every trace you left here survived it.</div>
  <div class="rv rv-end">a part of you remains here, forever. ✦</div>
</div>

<script>
'use strict';

/* ── универс-мост ── */
let AU = { id: 1, fx: 1 };
try { AU = window.AceonUniverse || AU; } catch (e) {}
const RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ════════════════════════════════════════════════════════
   CONFIG & API  (не тронуто)
════════════════════════════════════════════════════════ */
const CONFIG_URL = 'https://raw.githubusercontent.com/yourssugar/A.C.EON/main/Guestbook/config.json';
const CROSS_MS   = 20 * 60 * 1000;
const TICK_MS    = 150;
const MAX_FETCH  = 300;
const CFG_TTL    = 5 * 60 * 1000;

let apiUrl = '', cfgAt = 0;

async function fetchCfg() {
  try {
    const r = await fetch(CONFIG_URL + '?t=' + Date.now());
    const d = await r.json();
    if (d.api) { apiUrl = d.api; cfgAt = Date.now(); }
  } catch { /* silent */ }
}

async function getApiUrl() {
  if (!apiUrl || Date.now() - cfgAt > CFG_TTL) await fetchCfg();
  return apiUrl;
}

async function apiFetch(path, opts) {
  const url = await getApiUrl();
  if (!url) throw new Error('no api url');
  try {
    return await fetch(url + path, opts);
  } catch (e) {
    cfgAt = 0;
    const u2 = await getApiUrl();
    if (!u2) throw e;
    return await fetch(u2 + path, opts);
  }
}

/* ════════════════════════════════════════════════════════
   UTILS (не тронуто)
════════════════════════════════════════════════════════ */
const rnd   = (a, b) => a + Math.random() * (b - a);
const rndI  = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick  = a => a[Math.floor(Math.random() * a.length)];
const srand = s => { let x = Math.sin(s * 1.7 + 3) * 10000; return x - Math.floor(x); };
const seedY = id => srand(Math.abs(id) * 37 + 7) * 80 + 10;
const esc   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function relTime(ts) {
  const s = Math.floor(Date.now() / 1000 - ts);
  if (s < 60)    return 'just now';
  if (s < 3600)  return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

/* ════════════════════════════════════════════════════════
   BROKEN MESSAGE GENERATOR (не тронуто)
════════════════════════════════════════════════════════ */
const GC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789#$@!%^&*_=+|~<>';
const TC = '01FvG#$!@vdDb ';

const gStr = (min, max, ch, sp = false) => {
  let s = '', l = rndI(min, max);
  for (let i = 0; i < l; i++)
    s += (sp && Math.random() < 0.09) ? ' ' : ch[Math.floor(Math.random() * ch.length)];
  return s;
};

const genName = () => GC[rndI(0, 25)] + gStr(5, 13, GC);
const genMsg  = () => gStr(10, 28, GC, true);
const genTime = () => '(' + gStr(6, 14, TC, true) + ')';

const BROKEN = Array.from({ length: 35 }, (_, i) => ({
  id: -(i + 1),
  name:   genName(),
  phrase: genMsg(),
  tstr:   genTime(),
  hasMsg: true,
}));

const EMPTY = Array.from({ length: 35 }, (_, i) => ({
  id: -(i + 36),
  hasMsg: false,
}));

const P1 = [...BROKEN, ...EMPTY].sort(() => Math.random() - 0.5);

/* ════════════════════════════════════════════════════════
   ЖИВОЕ НЕБО — синхронизировано с гостевой по тирам
   U-1: статичное (оригинальный paintBg)
   U-2: цветные звёзды, дыхание туманностей, параллакс
   U-3: + Млечный Путь, светлячки, аврора, созвездия,
        падающие звёзды
   Во время смерти движок получает dying 0..1
════════════════════════════════════════════════════════ */
const bgCv  = document.getElementById('cv');
const bgCtx = bgCv.getContext('2d');
const LIVESKY = AU.id >= 2 && !RM;

let SKY = null;
let skyOff = false;
let dying = 0;              /* 0..1 интенсивность разрушения */
let deathMode = false;

function paintBg() {        /* U-1 / reduced-motion: как было */
  bgCv.width  = window.innerWidth;
  bgCv.height = window.innerHeight;
  const W = bgCv.width, H = bgCv.height;
  bgCtx.clearRect(0, 0, W, H);
  [[.28,.28,'rgba(55,18,110,',  .07],
   [.72,.62,'rgba(18,38,100,',  .05],
   [.52,.1, 'rgba(95,28,55,',   .045],
  ].forEach(([rx,ry,c,a]) => {
    const g = bgCtx.createRadialGradient(rx*W,ry*H,0,rx*W,ry*H,Math.min(W,H)*.48);
    g.addColorStop(0, c+a+')');
    g.addColorStop(1, 'transparent');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, 0, W, H);
  });
  for (let i = 0; i < 180; i++) {
    const x=Math.random()*W, y=Math.random()*H, r=Math.random()*.9+.15;
    bgCtx.fillStyle = `rgba(255,255,255,${(Math.random()*.5+.15).toFixed(2)})`;
    bgCtx.beginPath(); bgCtx.arc(x,y,r,0,Math.PI*2); bgCtx.fill();
  }
}

function buildBlob(cw,color,a){
  const c=document.createElement('canvas');c.width=c.height=cw;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(cw/2,cw/2,0,cw/2,cw/2,cw/2);
  gr.addColorStop(0,color+a+')');gr.addColorStop(1,'transparent');
  g.fillStyle=gr;g.fillRect(0,0,cw,cw);
  return c;
}
function buildMilky(W,H){
  const c=document.createElement('canvas');c.width=W+80;c.height=H+80;
  const g=c.getContext('2d');
  const x0=-40,y0=H*.72, x1=W+40,y1=H*.22;
  const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy);
  const nx=-dy/L,ny=dx/L;
  for(let k=0;k<3;k++){
    const t=Math.random();
    const bx=x0+dx*t+40, by=y0+dy*t+40;
    const gr=g.createRadialGradient(bx,by,0,bx,by,H*.35);
    gr.addColorStop(0,'rgba(190,200,235,0.028)');gr.addColorStop(1,'transparent');
    g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
  }
  for(let i=0;i<720;i++){
    const t=Math.random();
    const spread=(Math.random()+Math.random()+Math.random()-1.5)/1.5;
    const px=x0+dx*t+nx*spread*H*.14+40;
    const py=y0+dy*t+ny*spread*H*.14+40;
    const a=(.03+Math.random()*.10)*(1-Math.abs(spread)*.7);
    if(a<=0)continue;
    g.fillStyle=`rgba(235,240,255,${a.toFixed(3)})`;
    g.fillRect(px,py,Math.random()<.85?1:1.6,1);
  }
  return c;
}
function skySetup(){
  bgCv.width=window.innerWidth; bgCv.height=window.innerHeight;
  const W=bgCv.width,H=bgCv.height,bs=Math.max(120,Math.min(W,H)*.96|0);
  const tint=r=> r<.78?'rgba(255,255,255,' : (r<.90?'rgba(255,214,170,' : 'rgba(170,200,255,');
  SKY={
    W,H,
    px:0,py:0,tx:0,ty:0,
    blobs:[
      {sp:buildBlob(bs,'rgba(55,18,110,',0.09),x:.28,y:.28,ax:.05,ay:.04,s1:.00007,s2:.00005},
      {sp:buildBlob(bs,'rgba(18,38,100,',0.07),x:.72,y:.62,ax:.06,ay:.05,s1:.00005,s2:.00008},
      {sp:buildBlob(bs,'rgba(95,28,55,',0.06),x:.52,y:.10,ax:.04,ay:.03,s1:.00006,s2:.00004}
    ],
    milky:AU.id>=3?buildMilky(W,H):null,
    stars:Array.from({length:AU.id>=3?170:120},()=>({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*.9+.15,z:.3+Math.random()*.7,
      ph:Math.random()*6.283,c:tint(Math.random()),
      vy:0,g:0,flare:0
    })),
    flies:AU.id>=3?Array.from({length:50},()=>({
      x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,ph:Math.random()*6.283
    })):null,
    consts:[], shoot:null,
    constTimer:16+Math.random()*18,
    last:performance.now(), lastF:0
  };
}
function pickConstellation(broken){
  if(orbs.size<4)return null;
  const W=SKY.W,H=SKY.H;
  const pts=[];
  for(const [id,o] of orbs){
    if(o.p5)continue;
    const x=parseFloat(o.el.style.left);
    if(!(x>50&&x<W-50))continue;
    pts.push({o,x,y:o.yFrac*H});
  }
  if(pts.length<4)return null;
  const seed=pts[(Math.random()*pts.length)|0];
  pts.sort((a,b)=>((a.x-seed.x)**2+(a.y-seed.y)**2)-((b.x-seed.x)**2+(b.y-seed.y)**2));
  const k=3+(Math.random()*2|0);
  return {list:pts.slice(0,Math.min(k+1,pts.length)).map(p=>p.o),t:0,broken:!!broken};
}
function skyFrame(now){
  requestAnimationFrame(skyFrame);
  if(skyOff||document.hidden||!SKY)return;
  const capMs=(AU.id>=3&&!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches))?15:31;
  if(now-SKY.lastF<capMs-1)return;
  SKY.lastF=now;
  const dt=Math.min((now-SKY.last)/1000,.05);SKY.last=now;
  const W=SKY.W,H=SKY.H,g=bgCtx,T=now,dy=dying;
  SKY.px+=(SKY.tx-SKY.px)*.03;
  SKY.py+=(SKY.ty-SKY.py)*.03;
  const px=SKY.px,py=SKY.py;

  g.fillStyle='#07050f';g.fillRect(0,0,W,H);

  SKY.blobs.forEach(b=>{
    const bx=(b.x+Math.sin(T*b.s1)*b.ax)*W - px*26;
    const by=(b.y+Math.cos(T*b.s2)*b.ay)*H - py*20;
    const sz=b.sp.width;
    g.drawImage(b.sp,bx-sz/2,by-sz/2);
  });
  /* смерть: свет уходит из туманностей */
  if(dy>0){
    g.fillStyle=`rgba(8,8,12,${(dy*.5).toFixed(3)})`;
    g.fillRect(0,0,W,H);
  }

  if(SKY.milky){
    g.globalAlpha=1-dy*.8;
    g.drawImage(SKY.milky,-40-px*15,-40-py*11);
    g.globalAlpha=1;
  }

  /* аврора (U-3) гаснет при смерти */
  if(AU.id>=3&&dy<.9){
    const base=H*.14, amp=H*.035;
    g.beginPath();
    for(let i=0;i<=24;i++){
      const x=i/24*W;
      const y=base+Math.sin(x*.004+T*.00012)*amp+Math.sin(x*.011+T*.00007)*amp*.4;
      i===0?g.moveTo(x,y):g.lineTo(x,y);
    }
    for(let i=24;i>=0;i--){
      const x=i/24*W;
      const y=base+Math.sin(x*.004+T*.00012)*amp+Math.sin(x*.011+T*.00007)*amp*.4;
      g.lineTo(x,y+H*.09);
    }
    g.closePath();
    const ag=g.createLinearGradient(0,base-amp,0,base+H*.11);
    ag.addColorStop(0,`rgba(120,220,190,${(0.05*(1-dy)).toFixed(3)})`);
    ag.addColorStop(1,'rgba(120,220,190,0)');
    g.fillStyle=ag;g.fill();
  }

  /* звёзды: при смерти падают и мерцают агонией */
  SKY.stars.forEach(st=>{
    if(dy>0&&st.g===0)st.g=AU.id>=2?rnd(24,90):rnd(6,16);
    if(dy>0){ st.vy+=st.g*dy*dt; st.y+=st.vy*dt; }
    st.x-=(2+st.z*6)*dt;
    if(st.x<-4&&dy===0){st.x=W+4;st.y=Math.random()*H;}
    if(st.y>H+6)return;                       /* упавшие не возвращаются */
    if(AU.id>=3&&st.flare<=0&&Math.random()<.00035)st.flare=1;
    const tw=.5+.5*Math.sin(T*.001+st.ph);
    const agony=dy>0?(.6+.4*Math.sin(T*.02+st.ph*7)):1;
    const sx=st.x-px*14*st.z, sy=st.y-py*10*st.z;
    let a=st.z*(.2+.4*tw)*agony*(1-dy*.35), r=st.r;
    if(st.flare>0){
      a=Math.min(1,a+st.flare*.65); r=st.r*(1+st.flare*1.6);
      g.strokeStyle=`rgba(255,255,255,${(st.flare*.4).toFixed(3)})`;
      g.lineWidth=.7;
      const gl=6+st.flare*8;
      g.beginPath();g.moveTo(sx-gl,sy);g.lineTo(sx+gl,sy);
      g.moveTo(sx,sy-gl);g.lineTo(sx,sy+gl);g.stroke();
      st.flare-=dt*.55;
    }
    g.fillStyle=st.c+Math.max(0,a).toFixed(2)+')';
    g.beginPath();g.arc(sx,sy,r,0,6.283);g.fill();
  });

  if(SKY.flies){
    SKY.flies.forEach(f=>{
      f.vx+=(Math.random()-.5)*3*dt; f.vy+=(Math.random()-.5)*3*dt+dy*30*dt;
      f.vx*=.985; f.vy*=.985;
      f.x+=f.vx; f.y+=f.vy;
      if(f.x<0)f.x=W; if(f.x>W)f.x=0;
      if(f.y>H)f.y=dy>0?H:0; if(f.y<0)f.y=H;
      const a=(.10+.16*(.5+.5*Math.sin(T*.0016+f.ph)))*(1-dy*.6);
      g.fillStyle=`rgba(220,230,255,${Math.max(0,a).toFixed(3)})`;
      g.fillRect(f.x,f.y,1,1);
    });
  }

  /* созвездия памяти (U-3): при смерти рвутся с дрожью */
  if(AU.id>=3){
    if(dy===0){
      SKY.constTimer-=dt;
      if(SKY.constTimer<=0){
        const c=pickConstellation(false);
        if(c)SKY.consts.push(c);
        SKY.constTimer=32+Math.random()*22;
      }
    }
    for(let i=SKY.consts.length-1;i>=0;i--){
      const c=SKY.consts[i]; c.t+=dt;
      const life=c.broken?2.6:3.6;
      if(c.t>=life){SKY.consts.splice(i,1);continue;}
      let a;
      if(c.t<.5)a=c.t/.5;
      else if(c.t>life-1.1)a=(life-c.t)/1.1;
      else a=1;
      let ok=true;
      g.beginPath();
      c.list.forEach((o,k)=>{
        if(!orbs.has(+o.el.dataset.id)){ok=false;return;}
        const jit=c.broken?(Math.random()-.5)*10*dying:0;
        const x=parseFloat(o.el.style.left)+jit;
        const y=o.yFrac*H+jit;
        k===0?g.moveTo(x,y):g.lineTo(x,y);
      });
      if(!ok){SKY.consts.splice(i,1);continue;}
      g.strokeStyle=c.broken
        ? `rgba(255,80,110,${(a*.35).toFixed(3)})`
        : `rgba(255,255,255,${(a*.20).toFixed(3)})`;
      g.lineWidth=c.broken?1:.8;
      g.stroke();
    }
    /* падающие звёзды — чаще во время смерти */
    if(!SKY.shoot&&Math.random()<(.0012+dy*.012))
      SKY.shoot={x:Math.random()*W*.7+W*.2,y:Math.random()*H*.3,t:0};
    if(SKY.shoot){
      const sh=SKY.shoot;sh.t+=dt*1.8;
      if(sh.t>=1)SKY.shoot=null;
      else{
        const dx2=sh.x-sh.t*220,dy2=sh.y+sh.t*120;
        const len=60+dy*70;
        const gr=g.createLinearGradient(dx2,dy2,dx2+len,dy2-len*.55);
        gr.addColorStop(0,`rgba(255,255,255,${((1-sh.t)*.7).toFixed(3)})`);
        gr.addColorStop(1,'rgba(255,255,255,0)');
        g.strokeStyle=gr;g.lineWidth=1.1;
        g.beginPath();g.moveTo(dx2,dy2);g.lineTo(dx2+len,dy2-len*.55);g.stroke();
      }
    }
  }
}
if(LIVESKY){
  skySetup();
  if(!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)){
    document.addEventListener('mousemove',e=>{
      if(!SKY)return;
      SKY.tx=e.clientX/SKY.W-.5;
      SKY.ty=e.clientY/SKY.H-.5;
    },{passive:true});
  }
  requestAnimationFrame(skyFrame);
}

/* ════════════════════════════════════════════════════════
   GLITCH CANVAS + ДИРИЖЁР СМЕРТИ
   Один rAF (кап 30fps). Без body-filter, без getImageData:
   разрывы неба — drawImage-слайсы из bgCv,
   хроматика — filter только на #skywrap (U-3),
   порча точек — из кэша orbs, ≤8 одновременно.
════════════════════════════════════════════════════════ */
const gcv  = document.getElementById('cv-glitch');
const gctx = gcv.getContext('2d');
let   glitchOn     = false;
let   glitchStartT = 0;
let   glitchDurMs  = 12000;

function glitchI() {
  return Math.min((Date.now() - glitchStartT) / glitchDurMs, 1);
}
function resizeGCV() { gcv.width = window.innerWidth; gcv.height = window.innerHeight; }
resizeGCV();

const GCOLS = ['gc-r','gc-g','gc-b','gc-y','gc-p','gc-o'];
const flashEl = document.getElementById('flash');
const skywrap = document.getElementById('skywrap');

let deathLoopOn=false, dLastF=0;
let accDot=0, accFlash=0, accShake=0, accChrom=0;
let corrupted=[];           /* {dot,cls,until} */
let cracks=[];              /* U-3: деревья трещин */
let invDone=false;

function genCracks(){
  cracks=[];
  const W=gcv.width,H=gcv.height;
  const trees=AU.id>=3?5:0;
  for(let t=0;t<trees;t++){
    const segs=[];
    (function grow(x,y,ang,len,depth){
      if(depth>7||len<8)return;
      const nx=x+Math.cos(ang)*len, ny=y+Math.sin(ang)*len;
      segs.push([x,y,nx,ny]);
      grow(nx,ny,ang+rnd(-.5,.5),len*rnd(.7,.95),depth+1);
      if(Math.random()<.55)grow(nx,ny,ang+rnd(.5,1.3)*(Math.random()<.5?1:-1),len*rnd(.5,.8),depth+2);
    })(rnd(W*.1,W*.9),rnd(H*.1,H*.9),rnd(0,6.283),rnd(40,90),0);
    cracks.push(segs);
  }
}

function deathTick(now){
  if(!deathLoopOn)return;
  requestAnimationFrame(deathTick);
  if(document.hidden)return;
  if(now-dLastF<31)return;
  const dt=Math.min((now-dLastF)/1000,.08); dLastF=now;
  if(!glitchOn)return;
  const i=glitchI();
  dying=i;
  const W=gcv.width,H=gcv.height;

  /* ── слой глитча ── */
  gctx.clearRect(0,0,W,H);

  /* минимальный глитч — все тиры: тонкие цветные полосы */
  const bandMax=AU.id>=2?Math.ceil(1+i*9):Math.ceil(1+i*2);
  const bands=rndI(0,bandMax);
  for(let k=0;k<bands;k++){
    gctx.fillStyle=`rgba(${rndI(0,255)},${rndI(0,255)},${rndI(0,255)},${(AU.id>=2?.07+i*.35:.05+i*.14).toFixed(2)})`;
    gctx.fillRect(0,Math.random()*H,W,rndI(1,Math.ceil(1+i*(AU.id>=2?20:5))));
  }

  if(AU.id>=2){
    /* блоки шума */
    if(Math.random()<i*.7){
      gctx.fillStyle=`rgba(${rndI(0,255)},${rndI(0,255)},${rndI(0,255)},${(.08+i*.3).toFixed(2)})`;
      gctx.fillRect(Math.random()*W*.8,Math.random()*H,rndI(20,240),rndI(2,Math.ceil(2+i*60)));
    }
    /* разрыв неба: слайс живого канваса, сдвинутый вбок (GPU, без getImageData) */
    if(Math.random()<i*.45){
      const ty=rndI(0,Math.max(1,H-40));
      const th=rndI(4,30);
      const tx=Math.round(rnd(-46,46)*i);
      gctx.drawImage(bgCv,0,ty,W,th,tx,ty,W,th);
    }
    /* белая скан-линия */
    if(Math.random()<i*.35){
      gctx.fillStyle=`rgba(255,255,255,${(i*.06).toFixed(2)})`;
      gctx.fillRect(0,Math.random()*H,W,1);
    }
  }

  /* трещины реальности (U-3): прорастают ко второй половине */
  if(AU.id>=3&&cracks.length){
    const frac=Math.max(0,(i-.35)/.65);
    if(frac>0){
      gctx.lineWidth=1;
      cracks.forEach(segs=>{
        const n=Math.ceil(segs.length*Math.min(1,frac*1.2));
        gctx.strokeStyle=`rgba(255,255,255,${(.18+i*.3).toFixed(2)})`;
        gctx.beginPath();
        for(let k=0;k<n;k++){
          const s=segs[k];
          gctx.moveTo(s[0],s[1]);gctx.lineTo(s[2],s[3]);
        }
        gctx.stroke();
        if(i>.7){          /* хроматические двойники трещин */
          gctx.strokeStyle=`rgba(255,60,90,${(i*.2).toFixed(2)})`;
          gctx.beginPath();
          for(let k=0;k<n;k++){
            const s=segs[k];
            gctx.moveTo(s[0]+1.5,s[1]);gctx.lineTo(s[2]+1.5,s[3]);
          }
          gctx.stroke();
        }
      });
    }
  }

  /* ── тряска (только transform — композитор) ── */
  accShake+=dt;
  if(accShake>.08){
    accShake=0;
    if(Math.random()<i*(AU.id>=2?.5:.25)){
      const a=i*(AU.id>=2?13:6);
      document.body.style.transform=`translate(${(Math.random()-.5)*a}px,${(Math.random()-.5)*a*.35}px)`;
    } else document.body.style.transform='';
  }

  /* ── порча точек: из кэша, ≤8 одновременно ── */
  accDot+=dt;
  if(accDot>.14){
    accDot=0;
    /* снять отжившие */
    const nowMs=Date.now();
    for(let k=corrupted.length-1;k>=0;k--){
      if(corrupted[k].until<=nowMs){
        corrupted[k].dot.classList.remove(corrupted[k].cls);
        corrupted.splice(k,1);
      }
    }
    const budget=Math.min(8-corrupted.length,rndI(1,AU.id>=2?Math.ceil(2+i*5):2));
    if(budget>0&&orbs.size){
      const arr=[...orbs.values()];
      for(let k=0;k<budget;k++){
        const o=arr[(Math.random()*arr.length)|0];
        if(o.p5)continue;
        if(Math.random()>i*.6)continue;
        const dot=o.el.firstChild;
        const cls=pick(GCOLS);
        dot.classList.add(cls);
        const fight=rndI(80,Math.max(90,Math.floor(750*(1-i*.7))));
        corrupted.push({dot,cls,until:Date.now()+fight});
      }
    }
  }

  /* ── вспышки ── */
  accFlash+=dt;
  if(accFlash>.2){
    accFlash=0;
    if(Math.random()<i*(AU.id>=2?.3:.12)){
      flashEl.style.background=Math.random()<.6?'#fff':pick(['#ff2244','#00ff88','#4488ff','#ffee00','#ff00aa']);
      flashEl.style.opacity=(.04+i*(AU.id>=2?.42:.2)).toFixed(2);
      setTimeout(()=>{flashEl.style.opacity='0';},rndI(20,Math.floor(65+i*140)));
    }
  }

  /* ── хроматика импульсами (U-3): фильтр только на небе ── */
  if(AU.id>=3){
    accChrom+=dt;
    if(accChrom>.4){
      accChrom=0;
      if(Math.random()<i*.5){
        skywrap.style.filter=`hue-rotate(${rndI(0,360)}deg) saturate(${rnd(1.4,1+i*3.5).toFixed(1)})`;
        setTimeout(()=>{skywrap.style.filter='';},rndI(60,200));
      }
    }
    /* финальный крик: три инверсии неба на пике */
    if(i>.84&&!invDone){
      invDone=true;
      let c=0;
      const burst=setInterval(()=>{
        c++;
        skywrap.style.filter=c%2?'invert(1) brightness(1.2) saturate(2)':'brightness(1.3)';
        if(c>=6){clearInterval(burst);skywrap.style.filter='';}
      },170);
    }
  }
}

function startGlitch(dur){
  glitchOn=true;
  glitchStartT=Date.now();
  glitchDurMs=dur;
  gcv.style.opacity='1';
  invDone=false;
  dying=0.0001;
  genCracks();
  /* U-3: все созвездия вспыхивают и рвутся в момент начала смерти */
  if(AU.id>=3&&SKY){
    for(let k=0;k<3;k++){
      const c=pickConstellation(true);
      if(c)SKY.consts.push(c);
    }
  }
  if(!deathLoopOn){
    deathLoopOn=true; dLastF=0;
    requestAnimationFrame(deathTick);
  }
}

function stopGlitch(){
  glitchOn=false;
  deathLoopOn=false;
  dying=1;
  gctx.clearRect(0,0,gcv.width,gcv.height);
  gcv.style.opacity='0';
  document.body.style.transform='';
  skywrap.style.filter='';
  flashEl.style.opacity='0';
  corrupted.forEach(c=>c.dot.classList.remove(c.cls));
  corrupted=[];
  document.querySelectorAll('.dot').forEach(d=>
    GCOLS.forEach(c=>d.classList.remove(c))
  );
}

/* ════════════════════════════════════════════════════════
   ORB SYSTEM (не тронуто, + yFrac для созвездий)
════════════════════════════════════════════════════════ */
const fld  = document.getElementById('fld');
const orbs = new Map();
let   hovEl = null;

function unhover(el) {
  if (!el) return;
  const o = orbs.get(+el.dataset.id);
  if (o) {
    o.hov = false;
    const x = parseFloat(el.style.left), sw = window.innerWidth;
    o.birth = Date.now() - Math.max(0, ((sw - x) / (sw + 100)) * CROSS_MS);
  }
  el.classList.remove('on');
  hovEl = null;
}

function makeOrb(entry, p5 = false) {
  const el    = document.createElement('div');
  const yPct  = p5 ? rnd(8, 88) : seedY(entry.id);
  const hasTip = !!entry.hasMsg;

  el.className  = 'dw' + (p5 ? ' p5' : '') + (hasTip ? ' has-tip' : '');
  el.dataset.id = entry.id;
  el.style.top  = yPct + '%';
  el.style.left = (window.innerWidth + 60) + 'px';
  el.style.setProperty('--pd',   (2 + srand(Math.abs(entry.id)) * 3).toFixed(1) + 's');
  el.style.setProperty('--pdly', (srand(Math.abs(entry.id) * 13) * 4).toFixed(1) + 's');

  let tipHtml = '';
  if (hasTip) {
    const tc = yPct < 18 ? 'tip dn' : 'tip';
    tipHtml = p5
      ? `<div class="${tc}"><div class="tn">${esc(entry.name)}</div><div class="tp">«${esc(entry.phrase)}»</div><div class="tt">${relTime(entry.created_at)}</div></div>`
      : `<div class="${tc}"><div class="tn">${esc(entry.name)}</div><div class="tp">${esc(entry.phrase)}</div><div class="tt">${esc(entry.tstr)}</div></div>`;
  }

  el.innerHTML = `<div class="dot"></div>${tipHtml}`;

  if (hasTip) {
    el.addEventListener('mouseenter', () => {
      if (hovEl && hovEl !== el) unhover(hovEl);
      const o = orbs.get(entry.id); if (o) o.hov = true;
      el.classList.add('on'); hovEl = el;
    });
    el.addEventListener('mouseleave', () => unhover(el));
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (el.classList.contains('on') && hovEl === el) unhover(el);
      else {
        if (hovEl) unhover(hovEl);
        const o = orbs.get(entry.id); if (o) o.hov = true;
        el.classList.add('on'); hovEl = el;
      }
    });
  }
  return el;
}

function addOrb(entry, birth, p5 = false) {
  if (orbs.has(entry.id)) return;
  const el = makeOrb(entry, p5);
  fld.appendChild(el);
  orbs.set(entry.id, { entry, birth, el, hov: false, p5,
    yFrac: (p5 ? parseFloat(el.style.top) : seedY(entry.id)) / 100 });
}

function tick() {
  const now = Date.now(), sw = window.innerWidth;
  for (const [id, o] of orbs) {
    if (o.hov) continue;
    const x = sw - ((now - o.birth) / CROSS_MS) * (sw + 100);
    if (x < -80) { o.el.remove(); orbs.delete(id); }
    else          { o.el.style.left = x + 'px'; }
  }
}

/* ════════════════════════════════════════════════════════
   PHASE 1 (не тронуто)
════════════════════════════════════════════════════════ */
function startP1() {
  const now = Date.now(), N = P1.length;
  P1.forEach((e, i) => addOrb(e, now - (i / N) * CROSS_MS * 0.96));
}

/* ════════════════════════════════════════════════════════
   PHASE 3 — FADE TO WHITE (не тронуто)
════════════════════════════════════════════════════════ */
function fadeWhite() {
  document.getElementById('overlay').style.opacity = '1';
  setTimeout(() => { skyOff = true; }, 3800);   /* небо мертво — цикл спит */
}

/* ════════════════════════════════════════════════════════
   PHASE 4 — TEXT REVEAL (не тронуто)
════════════════════════════════════════════════════════ */
function revealText(onDone) {
  const lines = Array.from(document.querySelectorAll('#reveal .rv'));
  lines.forEach((ln, i) => {
    setTimeout(() => {
      ln.classList.add('show');
      if (i === lines.length - 1) setTimeout(onDone, 1500);
    }, 600 + i * 1700);
  });
}

/* ════════════════════════════════════════════════════════
   PHASE 5 — BLACK STARS ON WHITE
   (не тронуто; опрос сервера — раз в 60с, как в гостевой,
    свёрнутая вкладка сервер не дёргает)
════════════════════════════════════════════════════════ */
async function startP5() {
  for (const [, o] of orbs) o.el.remove();
  orbs.clear();

  document.body.style.background = '#fff';
  bgCv.style.opacity = '0';
  fld.style.zIndex   = '65';

  await loadP5();
  setInterval(() => { if (!document.hidden) loadP5(); }, 60_000);
}

async function loadP5() {
  try {
    const res  = await apiFetch('/entries?count=' + MAX_FETCH);
    const data = await res.json();
    const now  = Date.now(), N = Math.max(data.entries.length, 1);
    data.entries.forEach((e, i) => {
      if (!orbs.has(e.id)) {
        addOrb({ ...e, hasMsg: true }, now - (i / N) * CROSS_MS * 0.94, true);
      }
    });
  } catch {
    const now = Date.now();
    BROKEN.forEach((e, i) => {
      if (!orbs.has(e.id))
        addOrb(e, now - (i / BROKEN.length) * CROSS_MS * 0.9, true);
    });
  }
}

/* ════════════════════════════════════════════════════════
   ORCHESTRATION (тайминги не тронуты)
════════════════════════════════════════════════════════ */
async function main() {
  if (!LIVESKY) paintBg();
  fetchCfg();
  setInterval(tick, TICK_MS);

  document.addEventListener('click', e => {
    if (!e.target.closest('.dw') && hovEl) unhover(hovEl);
  });

  startP1();

  const t1 = rndI(15_000, 25_000);
  setTimeout(() => {
    const dur = rndI(10_000, 15_000);
    startGlitch(dur);

    setTimeout(() => {
      stopGlitch();
      fadeWhite();

      setTimeout(() => {
        revealText(() => startP5());
      }, 3900);

    }, dur);
  }, t1);
}

window.addEventListener('resize', () => {
  if (LIVESKY) { if (!skyOff) skySetup(); } else paintBg();
  resizeGCV();
});

main();
</script>
