<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07050f;--t1:rgba(255,255,255,.9);--t2:rgba(255,255,255,.5);--t3:rgba(255,255,255,.2);--bd:rgba(255,255,255,.07)}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Space Grotesk',sans-serif;color:var(--t1)}
#cv{position:fixed;inset:0;z-index:0;pointer-events:none}
#w{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}
#top{padding:18px 22px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);flex-shrink:0}

#cnt{font-size:11px;font-weight:300;color:var(--t3)}

/* ── КНОПКА АРХИВА ПАМЯТИ ── */
#mb{
  margin-left:auto;display:flex;align-items:center;gap:6px;

#rb{background:none;border:1px solid var(--bd);color:var(--t2);font-size:14px;cursor:pointer;border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center;transition:.2s}

.dw{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:10}

@keyframes pu{0%,100%{opacity:.38;box-shadow:0 0 2px 1px rgba(255,255,255,.18)}50%{opacity:.9;box-shadow:0 0 8px 3px rgba(255,255,255,.5),0 0 18px 5px rgba(255,255,255,.12)}}
.dw:hover .dot,.dw.on .dot{transform:scale(4);box-shadow:0 0 14px 5px rgba(255,255,255,.85),0 0 28px 10px rgba(255,255,255,.28);opacity:1}

/* ── «фонарик»: следы разгораются возле курсора (U-2/U-3) ── */
html.ufx2 .dot, html.ufx3 .dot{
  filter:brightness(calc(1 + var(--lg,0)*1.7));
}

.tip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(8px);opacity:0;pointer-events:none;background:rgba(4,2,10,.94);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;min-width:130px;max-width:215px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .18s,transform .18s;white-space:nowrap;z-index:200}
.dw:hover .tip,.dw.on .tip{opacity:1;transform:translateX(-50%) translateY(0)}
.tip.dn{bottom:auto;top:calc(100% + 14px);transform:translateX(-50%) translateY(-8px)}
.dw:hover .tip.dn,.dw.on .tip.dn{transform:translateX(-50%) translateY(0)}
.tn{font-size:12px;font-weight:500;margin-bottom:4px;color:var(--t1)}
.tp{font-size:11px;color:var(--t2);font-style:italic;line-height:1.45;white-space:normal}
.tt{font-size:10px;color:var(--t3);margin-top:5px;font-weight:300}
#frm{padding:14px 22px 18px;border-top:1px solid var(--bd);flex-shrink:0}
#fi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:6px;color:var(--t1);font-family:inherit;font-size:13px;padding:8px 10px;outline:none;transition:.18s}

#ni{flex:0 0 125px}
#pw{flex:1;position:relative;min-width:150px}

#cc.lim{color:rgba(255,100,100,.7)}
#sb{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--t1);font-size:16px;width:36px;height:36px;border-radius:6px;cursor:pointer;flex-shrink:0;transition:.18s}
#sb:hover:not(:disabled){background:rgba(255,255,255,.11)}

#ms{min-height:16px;font-size:11px;margin-top:7px;font-weight:300}

#dc{font-size:10px;color:rgba(255,255,255,.13);margin-top:5px;letter-spacing:.03em}
@media(max-width:520px){#ni{flex:0 0 100px}#pw{min-width:120px}}
</style>

<script>
// ═══════════════════════════════════════════════════════
// URL конфига берётся из GitHub — сервер обновляет его
// при каждом запуске / смене туннеля автоматически
// ═══════════════════════════════════════════════════════
const CONFIG_URL = 'https://raw.githubusercontent.com/yourssugar/A.C.EON/main/Guestbook/config.json';

// ── универс-мост: тир графики (../universe.js) ──
let AU={id:1,fx:1}, LIVEBG=false;
try{
  AU=window.AceonUniverse||AU;
  LIVEBG=AU.id>=2 && !(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}catch(e){}

// ══════════
// CONSTANTS
// ══════════
const CROSS_MS = 20 * 60 * 1000;
const TICK_MS  = 150;
const REFRESH  = 60 * 1000;
const MAX_FETCH = 300;
const PL = 35;

// ════════════════════
// API URL — динамический
// ════════════════════
let currentApi = '';
let configFetchedAt = 0;
const CONFIG_TTL = 5 * 60 * 1000;

async function fetchConfig() {
  try {
    const res = await fetch(CONFIG_URL + '?t=' + Date.now());
    const d   = await res.json();
    if (d.api) {
      currentApi = d.api;
      configFetchedAt = Date.now();
      console.log('[gb] API URL:', currentApi);
    }
  } catch(e) {
    console.warn('[gb] config fetch failed:', e.message);
  }
}

async function getApi() {
  if (!currentApi || Date.now() - configFetchedAt > CONFIG_TTL) {
    await fetchConfig();
  }
  return currentApi;
}

async function apiFetch(path, opts) {
  const url = await getApi();
  if (!url) throw new Error('нет URL сервера');
  try {
    return await fetch(url + path, opts);
  } catch(e) {
    configFetchedAt = 0;
    const freshUrl = await getApi();
    if (!freshUrl) throw e;
    return await fetch(freshUrl + path, opts);
  }
}

// ═══════════
// PROFANITY
// ═══════════
const BAN = [
  'хуй','залуп','пизд','пидор','педик','ёбан','ебан','ебат','нахуй',
  'бляд','блять','мудак','уёб','уеб','мразь','шлюх',
  'х*й','п*зд','е*ать','б*ять','х у й',' сука ',' суку ',' суки ',
  'fuck','shit','bitch','cunt',' ass ','dick','cock',
  'pussy','nigger','nigga','fag','bastard','whore','slut','asshole'
];
const hasBan = t => BAN.some(w => (' '+t.toLowerCase().replace(/ё/g,'е')+' ').includes(w));

// ═══════════════
// SEEDED RANDOM
// ═══════════════
const srand  = s => { let x = Math.sin(s*1.7+3)*10000; return x-Math.floor(x); };
const seedY  = id => srand(id*37+7)*80+10;

// ═══════
// CANVAS: статичный фон (U-1) — как было
// ═══════
function initCV() {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  cv.width  = window.innerWidth;
  cv.height = window.innerHeight;
  const W = cv.width, H = cv.height;

  [[.28,.28,'rgba(55,18,110,',0.07],[.72,.62,'rgba(18,38,100,',0.05],[.52,.1,'rgba(95,28,55,',0.045]]
    .forEach(([rx,ry,c,a]) => {
      const g = ctx.createRadialGradient(rx*W,ry*H,0,rx*W,ry*H,Math.min(W,H)*0.48);
      g.addColorStop(0,c+a+')'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    });

  for (let i=0;i<180;i++) {
    const x=Math.random()*W, y=Math.random()*H, r=Math.random()*.9+.15;
    ctx.fillStyle=`rgba(255,255,255,${(Math.random()*.5+.15).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
}

// ═══════════════════════════════════════════════
// ЖИВОЙ ФОН «ТИХОЕ НЕБО» (U-2/U-3)
// U-2: цветные звёзды, параллакс, фонарик, волна рождения
// U-3: + Млечный Путь, созвездия памяти, светлячки,
//      аврора, падающие звёзды, вспышки, пыль памяти
// ═══════════════════════════════════════════════
let lbg=null, fldRect=null;
function getFld(){ if(!fldRect)fldRect=document.getElementById('fld').getBoundingClientRect(); return fldRect; }
function buildBlob(cw,color,a){
  const c=document.createElement('canvas');c.width=c.height=cw;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(cw/2,cw/2,0,cw/2,cw/2,cw/2);
  gr.addColorStop(0,color+a+')');gr.addColorStop(1,'transparent');
  g.fillStyle=gr;g.fillRect(0,0,cw,cw);
  return c;
}
function buildMilky(W,H){
  const c=document.createElement('canvas');c.width=W+80;c.height=H+80;
  const g=c.getContext('2d');
  const x0=-40,y0=H*.72, x1=W+40,y1=H*.22;
  const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy);
  const nx=-dy/L,ny=dx/L;
  /* мягкая лента свечения */
  for(let k=0;k<3;k++){
    const t=Math.random();
    const bx=x0+dx*t+40, by=y0+dy*t+40;
    const gr=g.createRadialGradient(bx,by,0,bx,by,H*.35);
    gr.addColorStop(0,'rgba(190,200,235,0.028)');gr.addColorStop(1,'transparent');
    g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
  }
  /* пыль */
  for(let i=0;i<720;i++){
    const t=Math.random();
    const spread=(Math.random()+Math.random()+Math.random()-1.5)/1.5;  /* ~гаусс */
    const px=x0+dx*t+nx*spread*H*.14+40;
    const py=y0+dy*t+ny*spread*H*.14+40;
    const a=(.03+Math.random()*.10)*(1-Math.abs(spread)*.7);
    if(a<=0)continue;
    g.fillStyle=`rgba(235,240,255,${a.toFixed(3)})`;
    g.fillRect(px,py,Math.random()<.85?1:1.6,1);
  }
  return c;
}
function lbgSetup(){
  const cv=document.getElementById('cv');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  fldRect=null;
  const W=cv.width,H=cv.height,bs=Math.max(120,Math.min(W,H)*.96|0);
  const tint=r=> r<.78?'rgba(255,255,255,' : (r<.90?'rgba(255,214,170,' : 'rgba(170,200,255,');
  lbg={
    W,H,ctx:cv.getContext('2d'),
    px:0,py:0,tx:0,ty:0,                      /* параллакс с инерцией */
    blobs:[
      {sp:buildBlob(bs,'rgba(55,18,110,',0.09),x:.28,y:.28,ax:.05,ay:.04,s1:.00007,s2:.00005},
      {sp:buildBlob(bs,'rgba(18,38,100,',0.07),x:.72,y:.62,ax:.06,ay:.05,s1:.00005,s2:.00008},
      {sp:buildBlob(bs,'rgba(95,28,55,',0.06),x:.52,y:.10,ax:.04,ay:.03,s1:.00006,s2:.00004}
    ],
    milky:AU.id>=3?buildMilky(W,H):null,
    stars:Array.from({length:AU.id>=3?170:120},()=>({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*.9+.15,z:.3+Math.random()*.7,
      ph:Math.random()*6.283,c:tint(Math.random()),flare:0
    })),
    flies:AU.id>=3?Array.from({length:50},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:0,vy:0,ph:Math.random()*6.283
    })):null,
    dust:[], consts:[], waves:[], shoot:null,
    constTimer:14+Math.random()*18,
    last:performance.now(), lastF:0
  };
}
function birthWave(){
  if(!lbg)return;
  lbg.waves.push({t:0});
}
function pickConstellation(){
  /* созвездие памяти: соединяем соседние следы */
  if(typeof activeOrbs==='undefined'||activeOrbs.size<4)return null;
  const W=lbg.W, fr=getFld();
  const pts=[];
  for(const [id,orb] of activeOrbs){
    const x=parseFloat(orb.el.style.left);
    if(!(x>50&&x<W-50))continue;
    if(orb.yFrac===undefined)orb.yFrac=seedY(id)/100;
    pts.push({orb,x,y:fr.top+orb.yFrac*fr.height});
  }
  if(pts.length<4)return null;
  const seed=pts[(Math.random()*pts.length)|0];
  pts.sort((a,b)=>((a.x-seed.x)**2+(a.y-seed.y)**2)-((b.x-seed.x)**2+(b.y-seed.y)**2));
  const k=3+(Math.random()*2|0);
  return {orbs:pts.slice(0,Math.min(k+1,pts.length)).map(p=>p.orb),t:0};
}
function startLiveBG(){
  lbgSetup();
  /* параллакс от курсора */
  if(!window.matchMedia('(pointer:coarse)').matches){
    document.addEventListener('mousemove',e=>{
      if(!lbg)return;
      lbg.tx=e.clientX/lbg.W-.5;
      lbg.ty=e.clientY/lbg.H-.5;
    },{passive:true});
  }
  const capMs=(AU.id>=3&&!window.matchMedia('(pointer:coarse)').matches)?15:31;
  function loop(now){
    requestAnimationFrame(loop);
    if(document.hidden||!lbg)return;
    if(now-lbg.lastF<capMs-1)return;
    lbg.lastF=now;
    const dt=Math.min((now-lbg.last)/1000,.05);lbg.last=now;
    const W=lbg.W,H=lbg.H,g=lbg.ctx,T=now;
    lbg.px+=(lbg.tx-lbg.px)*.03;
    lbg.py+=(lbg.ty-lbg.py)*.03;
    const px=lbg.px,py=lbg.py;

    g.fillStyle='#07050f';g.fillRect(0,0,W,H);

    /* туманности дышат (дальний параллакс) */
    lbg.blobs.forEach(b=>{
      const bx=(b.x+Math.sin(T*b.s1)*b.ax)*W - px*26;
      const by=(b.y+Math.cos(T*b.s2)*b.ay)*H - py*20;
      const sz=b.sp.width;
      g.drawImage(b.sp,bx-sz/2,by-sz/2);
    });

    /* Млечный Путь (U-3, средний параллакс) */
    if(lbg.milky) g.drawImage(lbg.milky,-40-px*15,-40-py*11);

    /* аврора (U-3): почти неразличимая лента у верха */
    if(AU.id>=3){
      const base=H*.14, amp=H*.035;
      g.beginPath();
      for(let i=0;i<=24;i++){
        const x=i/24*W;
        const y=base+Math.sin(x*.004+T*.00012)*amp+Math.sin(x*.011+T*.00007)*amp*.4;
        i===0?g.moveTo(x,y):g.lineTo(x,y);
      }
      for(let i=24;i>=0;i--){
        const x=i/24*W;
        const y=base+Math.sin(x*.004+T*.00012)*amp+Math.sin(x*.011+T*.00007)*amp*.4;
        g.lineTo(x,y+H*.09);
      }
      g.closePath();
      const ag=g.createLinearGradient(0,base-amp,0,base+H*.11);
      ag.addColorStop(0,'rgba(120,220,190,0.05)');
      ag.addColorStop(1,'rgba(120,220,190,0)');
      g.fillStyle=ag;g.fill();
    }

    /* звёзды: дрейф в такт следам, цвета, вспышки */
    lbg.stars.forEach(st=>{
      st.x-=(2+st.z*6)*dt;
      if(st.x<-4){st.x=W+4;st.y=Math.random()*H;}
      if(AU.id>=3&&st.flare<=0&&Math.random()<.00035)st.flare=1;
      const tw=.5+.5*Math.sin(T*.001+st.ph);
      const sx=st.x-px*14*st.z, sy=st.y-py*10*st.z;
      let a=st.z*(.2+.4*tw), r=st.r;
      if(st.flare>0){
        a=Math.min(1,a+st.flare*.65); r=st.r*(1+st.flare*1.6);
        g.strokeStyle=`rgba(255,255,255,${(st.flare*.4).toFixed(3)})`;
        g.lineWidth=.7;
        const gl=6+st.flare*8;
        g.beginPath();g.moveTo(sx-gl,sy);g.lineTo(sx+gl,sy);
        g.moveTo(sx,sy-gl);g.lineTo(sx,sy+gl);g.stroke();
        st.flare-=dt*.55;
      }
      g.fillStyle=st.c+a.toFixed(2)+')';
      g.beginPath();g.arc(sx,sy,r,0,6.283);g.fill();
    });

    /* светлячки-пыль (U-3): броуновское блуждание */
    if(lbg.flies){
      lbg.flies.forEach(f=>{
        f.vx+= (Math.random()-.5)*3*dt; f.vy+=(Math.random()-.5)*3*dt;
        f.vx*= .985; f.vy*=.985;
        f.x+=f.vx; f.y+=f.vy;
        if(f.x<0)f.x=W; if(f.x>W)f.x=0;
        if(f.y<0)f.y=H; if(f.y>H)f.y=0;
        const a=.10+.16*(.5+.5*Math.sin(T*.0016+f.ph));
        g.fillStyle=`rgba(220,230,255,${a.toFixed(3)})`;
        g.fillRect(f.x,f.y,1,1);
      });
    }

    /* созвездия памяти (U-3) */
    if(AU.id>=3){
      lbg.constTimer-=dt;
      if(lbg.constTimer<=0){
        const c=pickConstellation();
        if(c)lbg.consts.push(c);
        lbg.constTimer=32+Math.random()*22;
      }
      const fr=getFld();
      for(let i=lbg.consts.length-1;i>=0;i--){
        const c=lbg.consts[i]; c.t+=dt;
        const life=3.6;
        if(c.t>=life){lbg.consts.splice(i,1);continue;}
        let a;
        if(c.t<.8)a=c.t/.8;
        else if(c.t>life-1.2)a=(life-c.t)/1.2;
        else a=1;
        let ok=true;
        g.beginPath();
        c.orbs.forEach((orb,k)=>{
          if(!activeOrbs.has(+orb.el.dataset.id)){ok=false;return;}
          const x=parseFloat(orb.el.style.left);
          const y=fr.top+orb.yFrac*fr.height;
          k===0?g.moveTo(x,y):g.lineTo(x,y);
        });
        if(!ok){lbg.consts.splice(i,1);continue;}
        g.strokeStyle=`rgba(255,255,255,${(a*.20).toFixed(3)})`;
        g.lineWidth=.8;
        g.stroke();
      }
      /* пыль памяти: искорки из следа под курсором */
      if(typeof hoveredEl!=='undefined'&&hoveredEl&&Math.random()<.14&&lbg.dust.length<12){
        const r=hoveredEl.getBoundingClientRect();
        lbg.dust.push({x:r.left+r.width/2+(Math.random()-.5)*8,
                       y:r.top+r.height/2,
                       vy:-(6+Math.random()*9),vx:(Math.random()-.5)*5,life:1});
      }
      for(let i=lbg.dust.length-1;i>=0;i--){
        const d=lbg.dust[i];
        d.x+=d.vx*dt; d.y+=d.vy*dt; d.life-=dt*.5;
        if(d.life<=0){lbg.dust.splice(i,1);continue;}
        g.fillStyle=`rgba(255,255,255,${(d.life*.55).toFixed(3)})`;
        g.fillRect(d.x,d.y,1.2,1.2);
      }
      /* падающая звезда */
      if(!lbg.shoot&&Math.random()<.0012)
        lbg.shoot={x:Math.random()*W*.7+W*.2,y:Math.random()*H*.3,t:0};
      if(lbg.shoot){
        const sh=lbg.shoot;sh.t+=dt*1.8;
        if(sh.t>=1)lbg.shoot=null;
        else{
          const dx=sh.x-sh.t*220,dy=sh.y+sh.t*120;
          const gr=g.createLinearGradient(dx,dy,dx+60,dy-33);
          gr.addColorStop(0,`rgba(255,255,255,${((1-sh.t)*.7).toFixed(3)})`);
          gr.addColorStop(1,'rgba(255,255,255,0)');
          g.strokeStyle=gr;g.lineWidth=1.1;
          g.beginPath();g.moveTo(dx,dy);g.lineTo(dx+60,dy-33);g.stroke();
        }
      }
    }

    /* волна рождения следа (U-2+) */
    for(let i=lbg.waves.length-1;i>=0;i--){
      const wv=lbg.waves[i]; wv.t+=dt*.55;
      if(wv.t>=1){lbg.waves.splice(i,1);continue;}
      const R=wv.t*Math.hypot(W,H)*.8;
      const a=(1-wv.t)*.12;
      g.beginPath();g.arc(W/2,H+20,R,Math.PI,2*Math.PI);
      g.strokeStyle=`rgba(190,220,255,${a.toFixed(3)})`;
      g.lineWidth=1.4;g.stroke();
      g.beginPath();g.arc(W/2,H+20,R*.86,Math.PI,2*Math.PI);
      g.strokeStyle=`rgba(190,220,255,${(a*.5).toFixed(3)})`;
      g.lineWidth=1;g.stroke();
    }
  }
  requestAnimationFrame(loop);
}

// ════════
// UTILS
// ════════
function relTime(ts) {
  const s = Math.floor(Date.now()/1000 - ts);
  if (s<60)    return 'только что';
  if (s<3600)  return Math.floor(s/60)+' мин. назад';
  if (s<86400) return Math.floor(s/3600)+' ч. назад';
  return Math.floor(s/86400)+' д. назад';
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ════════════
// ORBS STATE
// ════════════
const activeOrbs = new Map();
let hoveredEl = null;

function unhover(el) {
  if (!el) return;
  const id = +el.dataset.id, orb = activeOrbs.get(id);
  if (orb) {
    orb.hovered = false;
    const x = parseFloat(el.style.left), sw = window.innerWidth;
    orb.birthTime = Date.now() - Math.max(0, ((sw-x)/(sw+100))*CROSS_MS);
  }
  el.classList.remove('on');
  hoveredEl = null;
}

function makeDot(entry) {
  const el = document.createElement('div');
  el.className = 'dw';
  el.dataset.id = entry.id;
  const y = seedY(entry.id);
  el.style.top  = y+'%';
  el.style.left = (window.innerWidth+60)+'px';
  el.style.setProperty('--pd',   (2+srand(entry.id)*3).toFixed(1)+'s');
  el.style.setProperty('--pdly', (srand(entry.id*13)*4).toFixed(1)+'s');
  const tc = y<18?'tip dn':'tip';
  el.innerHTML = `<div class="dot"></div>
<div class="${tc}">
  <div class="tn">${esc(entry.name)}</div>
  <div class="tp">«${esc(entry.phrase)}»</div>
  <div class="tt">${relTime(entry.created_at)}</div>
</div>`;

  el.addEventListener('mouseenter', () => {
    if (hoveredEl && hoveredEl!==el) unhover(hoveredEl);
    const o = activeOrbs.get(entry.id); if(o) o.hovered=true;
    el.classList.add('on'); hoveredEl=el;
  });
  el.addEventListener('mouseleave', () => unhover(el));
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (el.classList.contains('on') && hoveredEl===el) { unhover(el); }
    else {
      if (hoveredEl) unhover(hoveredEl);
      const o = activeOrbs.get(entry.id); if(o) o.hovered=true;
      el.classList.add('on'); hoveredEl=el;
    }
  });
  return el;
}

function addEntry(entry, birthTime) {
  if (activeOrbs.has(entry.id)) return;
  const el = makeDot(entry);
  document.getElementById('fld').appendChild(el);
  activeOrbs.set(entry.id, {entry, birthTime, el, hovered:false});
}

// ════════
// LOAD
// ════════
function setCount(n) {
  document.getElementById('cnt').textContent = n ? n.toLocaleString('ru')+' следов' : '';
}

async function loadEntries(initial=false) {
  try {
    const res  = await apiFetch(`/entries?count=${MAX_FETCH}`);
    const data = await res.json();
    setCount(data.total);
    const N=data.entries.length, now=Date.now();
    data.entries.forEach((e,i) => {
      addEntry(e, initial
        ? now - (i/N)*CROSS_MS*0.96
        : now + Math.random()*12000
      );
    });
  } catch(err) {
    console.warn('[gb] loadEntries failed:', err.message);
    if (initial) showMsg('сервер следов недоступен — попробуй ↻ чуть позже','err',7000);
  }
}

// ════════════
// DRIFT TICK
// ════════════
function tick() {
  const now=Date.now(), sw=window.innerWidth;
  for (const [id,orb] of activeOrbs) {
    if (orb.hovered) continue;
    const x = sw - ((now-orb.birthTime)/CROSS_MS)*(sw+100);
    if (x < -80) { orb.el.remove(); activeOrbs.delete(id); }
    else          { orb.el.style.left = x+'px'; }
  }
}

setInterval(() => {
  document.querySelectorAll('.dw.on .tt').forEach(el => {
    const o = activeOrbs.get(+el.closest('.dw').dataset.id);
    if (o) el.textContent = relTime(o.entry.created_at);
  });
}, 30000);

// ════════
// FORM
// ════════
const ni=document.getElementById('ni'),pi=document.getElementById('pi'),
      cc=document.getElementById('cc'),ms=document.getElementById('ms'),
      sb=document.getElementById('sb');

pi.addEventListener('input', ()=>{
  const l=pi.value.length; cc.textContent=l+'/'+PL; cc.classList.toggle('lim',l>=PL);
});
ni.addEventListener('keydown', e=>{ if(e.key==='Enter') pi.focus(); });
pi.addEventListener('keydown', e=>{ if(e.key==='Enter') doSubmit(); });

let msgT;
function showMsg(t,c,d=0){
  ms.textContent=t; ms.className=c||'';
  clearTimeout(msgT); if(d) msgT=setTimeout(()=>{ms.textContent='';ms.className='';},d);
}

async function doSubmit() {
  const name=ni.value.trim(), phrase=pi.value.trim();
  if (!name)   { showMsg('введи имя','err'); ni.focus(); return; }
  if (!phrase) { showMsg('введи фразу','err'); pi.focus(); return; }
  if (hasBan(name)||hasBan(phrase)) { showMsg('нецензурная лексика','err',3000); return; }
  sb.disabled=true; sb.textContent='…';
  try {
    const res = await apiFetch('/entry',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,phrase})
    });
    const d = await res.json();
    if (d.ok) {
      ni.value=''; pi.value=''; cc.textContent='0/'+PL; cc.classList.remove('lim');
      showMsg('след оставлен ✦','ok',3000);
      try{ if(LIVEBG)birthWave(); }catch(e){}
      if (d.total) setCount(d.total);
    } else { showMsg(d.error||'ошибка','err',4000); }
  } catch { showMsg('нет связи с сервером','err',4000); }
  finally  { sb.disabled=false; sb.textContent='→'; }
}

sb.addEventListener('click', doSubmit);

// ── «фонарик»: следы разгораются возле курсора (U-2/U-3) ──
if(AU.id>=2 && window.matchMedia && !window.matchMedia('(pointer:coarse)').matches){
  let lampT=0;
  document.addEventListener('mousemove',e=>{
    const now=Date.now();
    if(now-lampT<40)return;
    lampT=now;
    const fr=getFld?getFld():null;
    if(!fr)return;
    for(const [id,orb] of activeOrbs){
      if(orb.yFrac===undefined)orb.yFrac=seedY(id)/100;
      const x=parseFloat(orb.el.style.left);
      const y=fr.top+orb.yFrac*fr.height;
      const d=Math.hypot(e.clientX-x,e.clientY-y);
      const k=d<130?(1-d/130):0;
      orb.el.style.setProperty('--lg',k.toFixed(2));
    }
  },{passive:true});
}

// ═══════
// INIT
// ═══════
document.addEventListener('click', e => { if(!e.target.closest('.dw')&&!e.target.closest('#bgm-btn')&&hoveredEl) unhover(hoveredEl); });
document.getElementById('rb').addEventListener('click', ()=>loadEntries(false));
window.addEventListener('resize', ()=>{ fldRect=null; if(LIVEBG){ lbgSetup(); } else { initCV(); } });

async function init() {
  if (LIVEBG) { try{ startLiveBG(); }catch(e){ initCV(); } } else initCV();
  await fetchConfig();
  setInterval(tick, TICK_MS);
  setInterval(()=>loadEntries(false), REFRESH);
  loadEntries(true);
}

init();

// ════════════════════
// BACKGROUND MUSIC
// ════════════════════
const BGM = new Audio('../audio/Schlaf, Mein Herz.mp3');
BGM.volume = 0;
const BGM_VOL = 0.4;
let bgmStarted = false;
let bgmMuted   = false;

function startBGM() {
  if (bgmStarted) return;
  bgmStarted = true;
  BGM.play().then(() => {
    document.getElementById('bgm-btn').classList.add('on');
    let v = 0;
    const fi = setInterval(() => {
      v = Math.min(v + 0.016, BGM_VOL);
      BGM.volume = bgmMuted ? 0 : v;
      if (v >= BGM_VOL) clearInterval(fi);
    }, 160);
  }).catch(() => {});
}

function toggleBGM() {
  bgmMuted = !bgmMuted;
  const btn = document.getElementById('bgm-btn');
  if (bgmMuted) {
    let v = BGM.volume;
    const fo = setInterval(() => {
      v = Math.max(v - 0.04, 0);
      BGM.volume = v;
      if (v <= 0) clearInterval(fo);
    }, 60);
    btn.textContent = '♪';
    btn.title = 'включить звук';
    btn.classList.add('muted');
  } else {
    let v = 0;
    const fi = setInterval(() => {
      v = Math.min(v + 0.016, BGM_VOL);
      BGM.volume = v;
      if (v >= BGM_VOL) clearInterval(fi);
    }, 160);
    btn.textContent = '♫';
    btn.title = 'выключить звук';
    btn.classList.remove('muted');
  }
}

// Первое взаимодействие → запуск
['click', 'touchstart', 'keydown'].forEach(ev => {
  document.addEventListener(ev, startBGM, { once: true, passive: true });
});

document.getElementById('bgm-btn').addEventListener('click', e => {
  e.stopPropagation(); // не триггерит unhover
  toggleBGM();
});
</script>
