<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.C.EON · ГОСТЕВАЯ КНИГА</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Space Grotesk без кириллицы: русские буквы берутся из Manrope -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<script src="../universe.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07050f;--t1:rgba(255,255,255,.9);--t2:rgba(255,255,255,.5);--t3:rgba(255,255,255,.2);--bd:rgba(255,255,255,.07);
  --gold:#ffd27a;
  --cur: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M3 2.5L3 20.5L7.6 16.4L10.7 23.2L14 21.8L10.9 15.1L17.2 15.1Z' fill='%234DAFFF' stroke='%23000' stroke-width='1.6' stroke-linejoin='round'/><path d='M5 7L5 15.6' stroke='%23d6f0ff' stroke-width='1.1' stroke-linecap='round' opacity='.75'/></svg>") 3 3, auto;
  --cur-p: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M3 2.5L3 20.5L7.6 16.4L10.7 23.2L14 21.8L10.9 15.1L17.2 15.1Z' fill='%23b8e4ff' stroke='%23000' stroke-width='1.8' stroke-linejoin='round'/><path d='M5 7L5 15.6' stroke='%23fff' stroke-width='1.1' stroke-linecap='round'/></svg>") 3 3, pointer;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Space Grotesk','Manrope',sans-serif;color:var(--t1);cursor:var(--cur)}
button,a{cursor:var(--cur-p);font-family:inherit}
#cv{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}
#w{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#top{padding:14px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);flex-shrink:0}
#back{background:none;border:0;color:var(--t3);font-size:11px;letter-spacing:.12em;padding:4px 2px;white-space:nowrap;transition:.2s}
#back:hover{color:var(--t1)}
#ttl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;color:rgba(255,255,255,.35);white-space:nowrap}
#cnt{font-size:11px;font-weight:300;color:var(--t3);white-space:nowrap}
#top .sp{flex:1}
.ib{background:none;border:1px solid var(--bd);color:var(--t2);font-size:13px;border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.ib:hover{color:var(--t1);border-color:rgba(255,255,255,.2)}
#bgm-btn.muted{color:var(--t3)}
#find{display:none;color:var(--gold);border-color:rgba(255,210,122,.22)}
#find.on{display:flex}
#find:hover{border-color:rgba(255,210,122,.5);box-shadow:0 0 12px rgba(255,210,122,.15)}
#langwrap{position:relative}
#langbtn{width:auto;border-radius:14px;padding:0 9px;font-size:10px;letter-spacing:.1em}
#langmenu{position:absolute;right:0;top:36px;display:none;flex-direction:column;min-width:150px;padding:5px;z-index:40;
  background:rgba(6,4,14,.96);border:1px solid rgba(255,255,255,.1);border-radius:8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#langmenu.on{display:flex}
#langmenu button{background:none;border:0;text-align:left;padding:6px 9px;font-size:12px;color:var(--t2);display:flex;gap:10px;border-radius:5px}
#langmenu button b{font-weight:400;color:var(--t3);width:20px}
#langmenu button:hover,#langmenu button.sel{color:var(--t1);background:rgba(255,255,255,.05)}

/* вход в архив памяти: затмение без подписи */
#mb{position:relative;width:34px;height:34px;flex-shrink:0;display:block;border-radius:50%}
#mb svg{position:absolute;inset:-7px;width:48px;height:48px;overflow:visible}
#mb .cor{transform-origin:24px 24px;animation:corona 16s linear infinite}
#mb .halo{animation:halo 5.5s ease-in-out infinite}
#mb .rim{transition:stroke-opacity .3s}
#mb:hover .cor{animation-duration:5s}
#mb:hover .rim{stroke-opacity:1}
#mb:hover .halo{animation-duration:1.8s}
#mb.gl svg{filter:invert(1)}
@keyframes corona{to{transform:rotate(360deg)}}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:1}}
html.ufx1 #mb .cor{animation:none}

#fld{flex:1;position:relative;overflow:hidden;touch-action:manipulation}
#fld.hov{cursor:var(--cur-p)}
#tip{position:absolute;left:0;top:0;opacity:0;pointer-events:none;background:rgba(4,2,10,.94);border:1px solid rgba(255,255,255,.1);border-radius:8px;
  padding:10px 14px;min-width:130px;max-width:230px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:opacity .18s,transform .18s;z-index:20;transform:translate(-50%,calc(-100% - 18px)) translateY(8px)}
#tip.on{opacity:1;transform:translate(-50%,calc(-100% - 18px))}
#tip.dn{transform:translate(-50%,18px) translateY(-8px)}
#tip.dn.on{transform:translate(-50%,18px)}
#tip.own{border-color:rgba(255,210,122,.35)}
.tn{font-size:12px;font-weight:500;margin-bottom:4px;color:var(--t1);word-break:break-word}
.tp{font-size:11px;color:var(--t2);font-style:italic;line-height:1.45;word-break:break-word}
.tt{font-size:10px;color:var(--t3);margin-top:5px;font-weight:300;display:flex;gap:8px}
.tt b{font-weight:400;color:var(--gold)}

#frm{padding:14px 22px 18px;border-top:1px solid var(--bd);flex-shrink:0}
#fi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:6px;color:var(--t1);font-family:inherit;font-size:13px;padding:8px 10px;outline:none;transition:.18s}
input::placeholder{color:rgba(255,255,255,.2)}
input:focus{border-color:rgba(255,255,255,.18)}
#ni{flex:0 0 125px;min-width:0}
#pw{flex:1;position:relative;min-width:150px}
#pi{width:100%;padding-right:42px}
#cc{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--t3);pointer-events:none}
#cc.lim{color:rgba(255,100,100,.7)}
#sb{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--t1);font-size:15px;width:36px;height:36px;border-radius:6px;flex-shrink:0;transition:.18s}
#sb:hover:not(:disabled){background:rgba(255,255,255,.11);box-shadow:0 0 14px rgba(255,255,255,.08)}
#sb:disabled{opacity:.35;cursor:var(--cur)}
#ms{min-height:16px;font-size:11px;margin-top:7px;font-weight:300}
#ms.err{color:#ff7272}
#ms.ok{color:#7dffaa}
#ms.gold{color:var(--gold)}
#dc{font-size:10px;color:rgba(255,255,255,.15);margin-top:5px;letter-spacing:.03em}
@media(max-width:560px){
  #top{gap:7px;padding:12px 12px 10px}
  #cnt{display:none}
  #ni{flex:0 0 100px}#pw{min-width:120px}
  #frm{padding:12px 14px 14px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="w">
  <div id="top">
    <button id="back" type="button">&lt; CORE</button>
    <span id="ttl">✦ GUESTBOOK</span>
    <span id="cnt"></span>
    <span class="sp"></span>
    <a href="./Guestbook/" id="mb" aria-label="memory">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <radialGradient id="mbh" cx="50%" cy="50%" r="50%">
            <stop offset="45%" stop-color="#cfe0ff" stop-opacity=".0"/>
            <stop offset="58%" stop-color="#cfe0ff" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#cfe0ff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="halo" cx="24" cy="24" r="22" fill="url(#mbh)"/>
        <g class="cor" stroke="#e8f0ff" stroke-linecap="round">
          <path d="M24 4.5v4M24 39.5v4M4.5 24h4M39.5 24h4" stroke-width="1" stroke-opacity=".55"/>
          <path d="M10.2 10.2l2.4 2.4M35.4 35.4l2.4 2.4M37.8 10.2l-2.4 2.4M12.6 35.4l-2.4 2.4" stroke-width=".8" stroke-opacity=".3"/>
          <path d="M24 1.5v1.6M46.5 24h-1.6" stroke-width=".8" stroke-opacity=".7"/>
        </g>
        <circle class="rim" cx="24" cy="24" r="11.2" fill="none" stroke="#f2f6ff" stroke-width="1.1" stroke-opacity=".75"/>
        <circle cx="24" cy="24" r="10.4" fill="#000"/>
        <circle cx="27.6" cy="20.6" r="1.1" fill="#fff" fill-opacity=".9"/>
      </svg>
    </a>
    <button class="ib" id="find" type="button">◎</button>
    <button class="ib" id="rb" type="button">↻</button>
    <button class="ib muted" id="bgm-btn" type="button">♪</button>
    <div id="langwrap">
      <button class="ib" id="langbtn" type="button">EN</button>
      <div id="langmenu"></div>
    </div>
  </div>
  <div id="fld"><div id="tip"></div></div>
  <div id="frm">
    <div id="fi">
      <input id="ni" maxlength="20" autocomplete="off" spellcheck="false">
      <div id="pw">
        <input id="pi" maxlength="35" autocomplete="off">
        <span id="cc">0/35</span>
      </div>
      <button id="sb" type="button">✦</button>
    </div>
    <div id="ms"></div>
    <div id="dc"></div>
  </div>
</div>
<script src="../games/shared/store.js?v=1"></script>
<script src="../games/shared/i18n.js?v=1"></script>
<script src="../shared/trace.js?v=1"></script>
<script src="lang.js?v=1"></script>
<script src="sky.js?v=1"></script>
<script src="gb.js?v=1"></script>
</body>
</html>
