<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Архив звука</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #080810;
      --surface:      #11111c;
      --surface2:     #1a1a2c;
      --border:       rgba(255,255,255,0.08);
      --accent:       #6d28d9;
      --accent-hover: #5b21b6;
      --accent-light: #a78bfa;
      --accent-bg:    rgba(109,40,217,0.12);
      --text:         #e8e8f8;
      --muted:        #7878a0;
      --dim:          #44445a;
      --liked:        #e879a0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Заголовок ── */
    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-light);
      letter-spacing: -0.3px;
      margin-bottom: 20px;
    }

    /* ── Плеер ── */
    .player {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 10px;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 14px;
    }

    .cover {
      width: 46px;
      height: 46px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }

    .track-meta    { flex: 1; min-width: 0; }
    .track-title   { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-sub     { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .like-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--dim);
      transition: color 0.15s, transform 0.15s;
    }
    .like-btn:hover      { transform: scale(1.2); color: var(--liked); }
    .like-btn.liked      { color: var(--liked); }
    .like-btn i          { font-size: 20px; }

    /* Прогресс */
    .progress-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      margin-bottom: 6px;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--dim);
      margin-bottom: 14px;
    }

    /* Управление */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 7px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s, background 0.12s;
    }
    .ctrl-btn:hover   { color: var(--text); background: var(--surface2); }
    .ctrl-btn.active  { color: var(--accent-light); }
    .ctrl-btn i       { font-size: 20px; }

    .play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, transform 0.1s;
    }
    .play-btn:hover  { background: var(--accent-hover); transform: scale(1.05); }
    .play-btn:active { transform: scale(0.96); }
    .play-btn i      { font-size: 18px; }

    .ctrl-group { display: flex; align-items: center; gap: 4px; }

    /* Бейджи режимов */
    .mode-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .mode-badge {
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 20px;
      background: var(--accent-bg);
      color: var(--accent-light);
      border: 1px solid rgba(109,40,217,0.25);
    }

    /* ── Вкладки ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tab.active { color: var(--accent-light); border-bottom-color: var(--accent); font-weight: 500; }
    .badge {
      background: var(--accent);
      color: white;
      border-radius: 20px;
      font-size: 10px;
      padding: 1px 7px;
      font-weight: 500;
    }

    /* ── Список треков ── */
    .track-list { padding-top: 4px; }

    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .track-row:hover   { background: var(--surface); }
    .track-row.active  { background: var(--accent-bg); }

    .row-num {
      width: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--dim);
      flex-shrink: 0;
    }
    .track-row.active .row-num { color: var(--accent-light); }

    .row-cover {
      width: 38px;
      height: 38px;
      border-radius: 7px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
    }

    .row-title {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .track-row.active .row-title { color: var(--accent-light); font-weight: 500; }

    .row-dur  { font-size: 11px; color: var(--dim); flex-shrink: 0; }

    .row-heart {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      color: var(--dim);
      transition: color 0.15s, transform 0.15s;
    }
    .row-heart:hover     { color: var(--liked); transform: scale(1.2); }
    .row-heart.liked     { color: var(--liked); }
    .row-heart i         { font-size: 15px; }

    /* Пустой список */
    .empty {
      text-align: center;
      padding: 64px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .empty i { font-size: 40px; display: block; margin: 0 auto 14px; color: var(--dim); }

    /* Скроллбар */
    ::-webkit-scrollbar        { width: 4px; }
    ::-webkit-scrollbar-track  { background: transparent; }
    ::-webkit-scrollbar-thumb  { background: var(--surface2); border-radius: 4px; }
  </style>
</head>
<body>
<div class="container">

  <p class="page-title">◈ Архив звука</p>

  <!-- ── Плеер ──────────────────────────────────── -->
  <div class="player">
    <div class="track-info">
      <div class="cover" id="playerCover" style="background:#1e1b4b;color:#a78bfa;">
        <i class="ti ti-music" style="font-size:20px;"></i>
      </div>
      <div class="track-meta">
        <div class="track-title" id="playerTitle">Выбери трек</div>
        <div class="track-sub"   id="playerSub">нажми на трек ниже</div>
      </div>
      <button class="like-btn" id="playerLike" onclick="likeFromPlayer()" aria-label="в понравившееся">
        <i class="ti ti-heart"></i>
      </button>
    </div>

    <div class="progress-wrap" onclick="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="timeCur">0:00</span>
      <span id="timeTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnShuffle" onclick="toggleShuffle()" aria-label="случайное воспроизведение" title="Случайно">
        <i class="ti ti-arrows-shuffle"></i>
      </button>
      <div class="ctrl-group">
        <button class="ctrl-btn" onclick="skip(-1)" aria-label="предыдущий">
          <i class="ti ti-player-skip-back"></i>
        </button>
        <button class="play-btn" id="btnPlay" onclick="togglePlay()" aria-label="играть / пауза">
          <i class="ti ti-player-play" id="playIcon"></i>
        </button>
        <button class="ctrl-btn" onclick="skip(1)" aria-label="следующий">
          <i class="ti ti-player-skip-forward"></i>
        </button>
      </div>
      <button class="ctrl-btn" id="btnRepeat" onclick="toggleRepeat()" aria-label="повтор трека" title="Повтор трека">
        <i class="ti ti-repeat-once"></i>
      </button>
    </div>

    <div class="mode-row" id="modeRow" style="display:none;">
      <span class="mode-badge" id="badgeShuf" style="display:none;">случайно</span>
      <span class="mode-badge" id="badgeRep"  style="display:none;">повтор</span>
    </div>
  </div>

  <!-- ── Вкладки ──────────────────────────────────── -->
  <div class="tabs">
    <button class="tab active" id="tabAll"  onclick="setTab('all')">Все треки</button>
    <button class="tab"        id="tabFavs" onclick="setTab('favs')">Понравилось</button>
  </div>

  <!-- ── Список треков ──────────────────────────────── -->
  <div class="track-list" id="trackList"></div>

</div><!-- /container -->

<script>
/* ================================================================
   ТРЕКИ — ВСЁ ЧТО НУЖНО РЕДАКТИРОВАТЬ НАХОДИТСЯ ЗДЕСЬ
   ================================================================

   Каждый трек — одна строчка:
     { id: число,  title: "Название",  src: "путь/к/файлу.mp3",  duration: "3:42" }

   • id       — порядковый номер, каждый уникальный
   • title    — название трека (отображается в плеере и списке)
   • src      — путь к аудиофайлу относительно этого HTML
                Если файлы лежат в папке audio/ рядом с HTML:  "audio/track.mp3"
                Если где-то в интернете — полная ссылка: "https://example.com/track.mp3"
   • duration — длительность строкой (необязательно, можно убрать)

   Добавить трек = скопировать строчку и изменить данные.
   Порядок в списке = порядок в массиве.
   ================================================================ */

const TRACKS = [

  { id: 1,  title: "Это Любовь!.mp3",                            src: "audio/Это Любовь!.mp3",                             },
  { id: 2,  title: "Ночной город.mp3",                           src: "audio/Ночной город.mp3",                            },
  { id: 3,  title: "Ночной город (rock remasted).mp3",           src: "audio/Ночной город (rock remasted).mp3,             },
  { id: 4,  title: "The Xerox of My Childhood.mp3",              src: "audio/The Xerox of My Childhood.mp3",               },
  { id: 5,  title: "Ксерокс моего детства.mp3",                  src: "audio/Ксерокс моего детства.mp3",                   },
  { id: 6,  title: "«Сегодня всё можно».mp3",                    src: "audio/«Сегодня всё можно».mp3",                     },
  { id: 7,  title: "“Princess”.mp3",                             src: "audio/cifrovoy-dozhd.mp3",                          },
  { id: 8,  title: "Сигнал",           src: "audio/signal.mp3",           duration: "2:47" },
  { id: 9,  title: "Сломанная орбита", src: "audio/slomannaya-orbita.mp3",duration: "4:55" },
  { id: 10, title: "Версия 2.0",       src: "audio/versiya-2.mp3",        duration: "3:18" },
  { id: 11, title: "Последний_сеанс",  src: "audio/posledniy-seans.mp3",  duration: "4:02" },
  { id: 12, title: "Помехи",           src: "audio/pomehi.mp3",           duration: "2:33" },

  /* ← сюда добавляй новые треки, не забудь запятую в конце предыдущей строки */

];

/* ================================================================
   НИЖЕ — КОД ПЛЕЕРА. МЕНЯТЬ НЕ НУЖНО.
   ================================================================ */

/* Цвета обложек — цикл по треку, добавлять не нужно */
const PALETTE = [
  { bg:'#1e1b4b', fg:'#a78bfa' },
  { bg:'#1a2a1a', fg:'#6ee7b7' },
  { bg:'#2a1000', fg:'#fdba74' },
  { bg:'#2a0a1a', fg:'#f9a8d4' },
  { bg:'#0a1a2a', fg:'#7dd3fc' },
  { bg:'#1a1500', fg:'#fde68a' },
  { bg:'#1a0a0a', fg:'#fca5a5' },
  { bg:'#0a1a1a', fg:'#5eead4' },
];
const color   = id => PALETTE[(id - 1) % PALETTE.length];
const initials = title => title.split(/[\s_.]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const fmtTime  = s => { if (!isFinite(s)) return '0:00'; return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; };

/* Состояние */
let current = null;
let playing  = false;
let shuffle  = false;
let repeat   = false;
let tab      = 'all';
let favs     = new Set();

/* Audio */
const audio = new Audio();

/* localStorage */
function loadFavs() {
  try { const s = localStorage.getItem('sound_archive_favs'); if (s) favs = new Set(JSON.parse(s)); } catch(_) {}
}
function saveFavs() {
  try { localStorage.setItem('sound_archive_favs', JSON.stringify([...favs])); } catch(_) {}
}

/* Текущий список */
function getList() {
  return tab === 'favs' ? TRACKS.filter(t => favs.has(t.id)) : TRACKS;
}

/* Следующий / предыдущий трек */
function pickNext(forward) {
  const list = getList();
  if (!list.length) return null;
  if (shuffle) {
    const pool = list.length > 1 ? list.filter(t => t.id !== current?.id) : list;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  const i = current ? list.findIndex(t => t.id === current.id) : -1;
  return forward ? list[(i + 1) % list.length] : list[(i - 1 + list.length) % list.length];
}

/* Воспроизведение трека */
function playTrack(track, autoPlay = true) {
  current = track;
  audio.src = track.src;
  if (autoPlay) { audio.play(); playing = true; }
  updatePlayer();
  renderList();
}

/* Play / Pause */
function togglePlay() {
  if (!current) { const f = getList()[0]; if (f) playTrack(f); return; }
  if (playing) { audio.pause(); playing = false; }
  else         { audio.play();  playing = true;  }
  updatePlayer();
}

/* Пропуск */
function skip(dir) {
  const next = pickNext(dir > 0);
  if (next) playTrack(next, playing);
}

/* Shuffle */
function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById('btnShuffle').classList.toggle('active', shuffle);
  updateModes();
}

/* Repeat */
function toggleRepeat() {
  repeat = !repeat;
  document.getElementById('btnRepeat').classList.toggle('active', repeat);
  updateModes();
}

/* Seek по клику на прогресс-бар */
function seek(e) {
  if (!current || !audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
}

/* Лайки */
function toggleLike(id, e) {
  if (e) e.stopPropagation();
  favs.has(id) ? favs.delete(id) : favs.add(id);
  saveFavs();
  updatePlayerLike();
  renderList();
  renderTabs();
}
function likeFromPlayer() {
  if (current) toggleLike(current.id);
}

/* Вкладка */
function setTab(t) {
  tab = t;
  renderTabs();
  renderList();
}

/* ── Обновление плеера ── */
function updatePlayer() {
  if (!current) return;
  const col = color(current.id);
  const cov = document.getElementById('playerCover');
  cov.style.background = col.bg;
  cov.style.color      = col.fg;
  cov.innerHTML        = `<span>${initials(current)}</span>`;

  document.getElementById('playerTitle').textContent = current.title;
  document.getElementById('playerSub').textContent   = current.duration || '—';
  document.getElementById('playIcon').className      = `ti ti-player-${playing ? 'pause' : 'play'}`;
  updatePlayerLike();
}
function updatePlayerLike() {
  if (!current) return;
  const liked = favs.has(current.id);
  const btn   = document.getElementById('playerLike');
  btn.querySelector('i').className = liked ? 'ti ti-heart-filled' : 'ti ti-heart';
  btn.classList.toggle('liked', liked);
}
function updateModes() {
  const active = shuffle || repeat;
  document.getElementById('modeRow').style.display    = active ? 'flex' : 'none';
  document.getElementById('badgeShuf').style.display  = shuffle ? 'inline' : 'none';
  document.getElementById('badgeRep').style.display   = repeat  ? 'inline' : 'none';
}

/* ── Рендер вкладок ── */
function renderTabs() {
  document.getElementById('tabAll').className  = 'tab' + (tab === 'all'  ? ' active' : '');
  document.getElementById('tabFavs').className = 'tab' + (tab === 'favs' ? ' active' : '');
  document.getElementById('tabFavs').innerHTML =
    'Понравилось' + (favs.size ? `<span class="badge">${favs.size}</span>` : '');
}

/* ── Рендер списка треков ── */
function renderList() {
  const list = getList();
  const el   = document.getElementById('trackList');

  if (!list.length) {
    el.innerHTML = `<div class="empty">
      <i class="ti ti-heart"></i>
      Нажми ♡ у трека чтобы добавить в понравившееся
    </div>`;
    return;
  }

  el.innerHTML = list.map((t, idx) => {
    const col     = color(t.id);
    const isActive = current?.id === t.id;
    const liked   = favs.has(t.id);

    return `<div class="track-row ${isActive ? 'active' : ''}" onclick="playTrack(TRACKS.find(r=>r.id===${t.id}))">
      <div class="row-num">${isActive
        ? `<i class="ti ti-player-${playing ? 'play' : 'pause'}" style="font-size:12px;"></i>`
        : idx + 1
      }</div>
      <div class="row-cover" style="background:${col.bg};color:${col.fg};">${initials(t)}</div>
      <div class="row-title">${t.title}</div>
      ${t.duration ? `<div class="row-dur">${t.duration}</div>` : ''}
      <button class="row-heart ${liked ? 'liked' : ''}" onclick="toggleLike(${t.id}, event)" aria-label="в понравившееся">
        <i class="ti ti-heart${liked ? '-filled' : ''}"></i>
      </button>
    </div>`;
  }).join('');
}

/* ── Audio события ── */
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('timeCur').textContent      = fmtTime(audio.currentTime);
  document.getElementById('timeTotal').textContent    = fmtTime(audio.duration);
});

audio.addEventListener('loadedmetadata', () => {
  document.getElementById('timeTotal').textContent = fmtTime(audio.duration);
  if (current && !current.duration)
    document.getElementById('playerSub').textContent = fmtTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (repeat) { audio.currentTime = 0; audio.play(); return; }
  const next = pickNext(true);
  if (next) playTrack(next, true);
  else { playing = false; document.getElementById('playIcon').className = 'ti ti-player-play'; }
});

audio.addEventListener('play',  () => { playing = true;  document.getElementById('playIcon').className = 'ti ti-player-pause'; });
audio.addEventListener('pause', () => { playing = false; document.getElementById('playIcon').className = 'ti ti-player-play';  });

/* ── Старт ── */
loadFavs();
renderList();
renderTabs();
</script>
</body>
</html>
