<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.C.EON · Архив звука</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script src="../universe.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #06030f;
      --surface:      #0e0a1a;
      --surface2:     #17112a;
      --border:       rgba(255,255,255,0.07);
      --accent:       #7c3aed;
      --accent-h:     #6d28d9;
      --accent-light: #c4b5fd;
      --accent-bg:    rgba(124,58,237,0.1);
      --text:         #ede8ff;
      --muted:        #8b80b0;
      --dim:          #4a4065;
      --liked:        #e879a0;
    }

    html { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      padding: 32px 16px 72px;
      position: relative;
      overscroll-behavior: contain;
    }

    /* ── BACKGROUND ── */
    #bokeh { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: none; }
    html.ufx3 #bokeh { display: block; }

    .bg-orb {
      position: fixed; border-radius: 50%;
      filter: blur(72px); opacity: .13;
      pointer-events: none; z-index: 0;
    }
    .bg-orb1 {
      width: 55vw; height: 55vw; top: -18%; left: -16%;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
      animation: orb-a 22s ease-in-out infinite alternate;
    }
    .bg-orb2 {
      width: 42vw; height: 42vw; bottom: -14%; right: -14%;
      background: radial-gradient(circle, #4c1d95 0%, transparent 70%);
      animation: orb-b 29s ease-in-out infinite alternate;
    }
    .bg-orb3 {
      width: 28vw; height: 28vw; top: 40%; right: 5%;
      background: radial-gradient(circle, #6d28d9 0%, transparent 70%);
      opacity: .07;
      animation: orb-a 35s ease-in-out infinite alternate-reverse;
    }
    @keyframes orb-a { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(8%,10%) scale(1.1)} }
    @keyframes orb-b { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-8%,-8%) scale(1.08)} }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .035;
      background-image:
        linear-gradient(to right, #7c3aed 1px, transparent 1px),
        linear-gradient(to bottom, #7c3aed 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .bg-scan {
      position: fixed; left: 0; right: 0; height: 130px; z-index: 0; pointer-events: none;
      background: linear-gradient(to bottom, transparent, rgba(124,58,237,.04), transparent);
      animation: scan-mv 14s linear infinite;
    }
    @keyframes scan-mv { 0%{top:-130px} 100%{top:100%} }

    /* U-1: тихий режим, без вечных анимаций фона */
    html.ufx1 .bg-orb  { animation: none; }
    html.ufx1 .bg-scan { display: none; }

    .container {
      max-width: 880px; margin: 0 auto;
      position: relative; z-index: 1;
    }
    /* робот слева от плеера и списка, при прокрутке едет вниз вместе со страницей; на узком экране над плеером */
    .stage { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr; column-gap: 16px; row-gap: 12px; }
    .robot-col { grid-column: 1; grid-row: 1 / span 2; position: relative; }
    .robot-wrap { position: sticky; top: 14px; height: 300px; }
    #robot { position: absolute; inset: 0; width: 100%; height: 100%; }
    .stage > .player { grid-column: 2; grid-row: 1; }
    .lower { grid-column: 2; grid-row: 2; min-width: 0; }
    @media (max-width: 520px) { .stream-status span:last-child { display: none; } .page-title { font-size: 15px; } }
    @media (max-width: 820px) {
      .stage { grid-template-columns: 1fr; grid-template-rows: none; row-gap: 0; }
      .robot-col { grid-row: auto; height: 170px; margin-bottom: -6px; }
      .robot-wrap { position: absolute; inset: 0; height: auto; top: 0; }
      .stage > .player, .lower { grid-column: 1; grid-row: auto; }
      .lower { margin-top: 12px; }
      .container { max-width: 640px; }
      /* сцена с роботом ушла за экран: робот спускается в угол */
      .robot-wrap.float { position: fixed; inset: auto 10px 12px auto; width: 92px; height: 118px; z-index: 40; cursor: pointer;
        background: radial-gradient(closest-side, rgba(124,58,237,.22), transparent); border-radius: 50%; animation: rb-drop .4s ease-out; }
      @keyframes rb-drop { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    }
    .stage .player { margin-bottom: 0; }

    /* сцена (WebGL) за всем; с ней боке не нужно */
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; image-rendering: auto; }
    #scene.on { opacity: .55; }
    html.has-scene #bokeh { display: none; }
    html.has-scene .bg-grid { opacity: .02; }

    /* значок у играющего трека: прыгающие полоски, на наведении пауза */
    .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
    .eq i { width: 3px; background: var(--accent-light); border-radius: 1px; animation: eq-b .9s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-duration: .7s; animation-delay: -.3s; }
    .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -.6s; }
    @keyframes eq-b { 0%,100% { height: 3px; } 50% { height: 12px; } }
    html.ufx1 .eq i { animation: none; height: 8px; }
    .eq-p { display: none; font-size: 13px; }
    .track-row.active:hover .eq { display: none; }
    .track-row.active:hover .eq-p { display: inline; }

    /* реплика робота */
    #rbBubble { position: absolute; left: 50%; top: 4px; transform: translate(-50%, 6px); max-width: 210px; width: max-content; z-index: 3;
      background: rgba(237,232,255,.96); color: #17112a; font-size: 12px; line-height: 1.35; padding: 7px 11px; border-radius: 12px;
      opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
    #rbBubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(237,232,255,.96); }
    #rbBubble.on { opacity: 1; transform: translate(-50%, 0); }
    .robot-wrap.float #rbBubble { left: auto; right: 0; top: -8px; transform: translate(0, calc(-100% + 6px)); }
    .robot-wrap.float #rbBubble.on { transform: translate(0, -100%); }
    .robot-wrap.float #rbBubble::after { left: auto; right: 34px; }
    @media (max-width: 820px) { #rbBubble { top: 0; } }

    /* кнопка кассеты в шапке */
    .hd-ico { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px; display: flex; font-size: 19px; opacity: .75; transition: opacity .15s, color .15s; }
    .hd-ico:hover { opacity: 1; color: var(--accent-light); }

    /* альбомы */
    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 14px; padding: 12px 2px; }
    .album-card { cursor: pointer; animation: row-in .3s ease both; min-width: 0; }
    .album-cover { position: relative; aspect-ratio: 1; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 600; letter-spacing: -.5px; border: 1px solid rgba(255,255,255,.06); overflow: hidden; transition: transform .2s; }
    .album-cover::before { content: ''; position: absolute; inset: 22%; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); }
    .album-card:hover .album-cover { transform: translateY(-3px); }
    .album-play { position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
    .album-card:hover .album-play { opacity: 1; transform: none; }
    @media (hover: none) { .album-play { opacity: 1; transform: none; } }
    .album-title { margin-top: 8px; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album-sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .album-sub b { color: var(--accent-light); font-weight: 500; }
    .album-head { display: flex; align-items: center; gap: 12px; padding: 10px 6px 8px; flex-wrap: wrap; }
    .album-back { background: none; border: 0; color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em; cursor: pointer; padding: 4px 0; }
    .album-back:hover { color: var(--accent-light); }
    .album-head-t { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; color: var(--accent-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album-playall { background: var(--accent-bg); border: 1px solid rgba(124,58,237,.3); color: var(--accent-light); border-radius: 16px; padding: 5px 12px; font-size: 11px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }
    .album-playall:hover { background: rgba(124,58,237,.25); }

    /* твоя кассета */
    #cass { position: fixed; inset: 0; z-index: 55; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(5,3,12,.72); backdrop-filter: blur(6px); }
    #cass.on { display: flex; animation: row-in .25s ease; }
    .cass-box { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: rgba(14,10,26,.98); border: 1px solid rgba(124,58,237,.25); border-radius: 18px; padding: 16px; }
    .cass-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: var(--accent-light); }
    #cassX { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; display: flex; }
    #cassX:hover { color: var(--text); }
    #cassCv { width: 100%; height: auto; display: block; border-radius: 14px; }
    .cass-actions { display: flex; justify-content: flex-end; margin: 10px 0 14px; }
    #cassSave { background: var(--accent); color: #fff; border: 0; border-radius: 16px; padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; }
    #cassSave:hover { filter: brightness(1.12); }
    .cass-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--dim); margin-bottom: 8px; text-transform: uppercase; }
    .cass-tapes { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
    .tape { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: left; cursor: default; font-family: inherit; color: var(--dim); opacity: .55; }
    .tape.ok { opacity: 1; cursor: pointer; border-color: color-mix(in srgb, var(--tc) 40%, transparent); color: var(--text); }
    .tape.ok:hover { background: color-mix(in srgb, var(--tc) 12%, transparent); }
    .tape-reels { display: flex; gap: 14px; justify-content: center; padding: 6px 0; margin-bottom: 6px; border-radius: 6px; background: rgba(0,0,0,.35); }
    .tape-reels i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--dim); }
    .tape.ok .tape-reels i { border-color: var(--tc); }
    .tape.ok:hover .tape-reels i { animation: reel 1s linear infinite; border-style: dashed; }
    @keyframes reel { to { transform: rotate(360deg); } }
    .tape-name { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .06em; }
    .tape-sub { display: block; font-size: 10px; color: var(--dim); margin-top: 2px; }
    .cass-secret { margin-top: 14px; font-size: 12px; color: var(--muted); }
    .secret-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.06); overflow: hidden; margin-bottom: 6px; }
    .secret-bar i { display: block; height: 100%; background: linear-gradient(90deg, #a78bfa, #ffd27a); }
    .gold-tg { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #ffd27a; }
    .gold-tg input { accent-color: #ffd27a; }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }
    .page-title {
      font-size: 17px; font-weight: 600;
      color: var(--accent-light); letter-spacing: -.3px;
    }
    .hd-left, .hd-right { display: flex; align-items: center; gap: 12px; }
    #back { background: none; border: 0; color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; cursor: pointer; padding: 4px 0; white-space: nowrap; }
    #back:hover { color: var(--accent-light); }
    #langwrap { position: relative; }
    #langbtn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 14px; padding: 4px 9px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em; cursor: pointer; }
    #langbtn:hover { color: var(--text); border-color: rgba(124,58,237,.35); }
    #langmenu { position: absolute; right: 0; top: 30px; display: none; flex-direction: column; min-width: 150px; padding: 5px; z-index: 30;
      background: rgba(14,10,26,.97); border: 1px solid rgba(124,58,237,.25); border-radius: 10px; backdrop-filter: blur(14px); }
    #langmenu.on { display: flex; }
    #langmenu button { background: none; border: 0; text-align: left; padding: 6px 9px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; border-radius: 6px; cursor: pointer; font-family: inherit; }
    #langmenu button b { font-weight: 500; color: var(--dim); width: 20px; font-family: 'JetBrains Mono', monospace; }
    #langmenu button:hover, #langmenu button.sel { color: var(--text); background: var(--accent-bg); }
    .stream-status {
      display: flex; align-items: center; gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: .12em;
      color: var(--accent-light);
      opacity: 0; transition: opacity .45s;
    }
    .stream-status.on { opacity: 1; }
    .stream-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-light);
      box-shadow: 0 0 7px var(--accent-light);
      animation: sdot 1.5s ease-in-out infinite;
    }
    @keyframes sdot { 0%,100%{opacity:1} 50%{opacity:.28} }

    /* ── PLAYER ── */
    .player {
      background: rgba(14,10,26,.75);
      border: 1px solid rgba(124,58,237,.2);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 40px -12px rgba(124,58,237,.3);
      transition: box-shadow .6s ease, border-color .6s ease;
    }
    /* U-2+: плеер светится цветом текущего трека */
    html.ufx2 .player.playing,
    html.ufx3 .player.playing {
      box-shadow: 0 0 46px -10px var(--glow, rgba(124,58,237,.5));
      border-color: var(--glow-bd, rgba(124,58,237,.3));
    }
    .track-info {
      display: flex; align-items: center; gap: 15px; margin-bottom: 18px;
    }

    /* Cover with ring */
    .cover-wrap {
      position: relative; width: 62px; height: 62px; flex-shrink: 0;
    }
    .cover-ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, #7c3aed 90deg, #c4b5fd 180deg, #7c3aed 270deg, transparent 360deg);
      opacity: 0; transition: opacity .45s;
      animation: ring-spin 3s linear infinite;
    }
    .cover-wrap.playing .cover-ring { opacity: 1; }
    @keyframes ring-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .cover {
      position: absolute; inset: 3px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: #1e1b4b; color: #a78bfa;
      z-index: 1;
    }

    .track-meta { flex: 1; min-width: 0; }
    .track-title {
      font-size: 14px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--muted); margin-top: 4px; letter-spacing: .04em;
    }

    .like-btn {
      background: none; border: none; cursor: pointer; padding: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; color: var(--dim); transition: color .15s, transform .15s;
    }
    .like-btn:hover { transform: scale(1.2); color: var(--liked); }
    .like-btn.liked { color: var(--liked); }
    .like-btn i { font-size: 20px; }

    /* Progress */
    .progress-wrap {
      height: 5px; background: rgba(124,58,237,.14);
      border-radius: 3px; cursor: pointer; margin-bottom: 6px;
      transition: height .15s;
    }
    .progress-wrap:hover { height: 7px; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, var(--accent), var(--accent-light));
      border-radius: 3px; width: 0%; pointer-events: none;
      box-shadow: 0 0 10px rgba(124,58,237,.7);
      transition: width .1s linear;
    }
    .time-row {
      display: flex; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--dim); margin-bottom: 4px;
      letter-spacing: .04em;
    }

    /* Visualizer */
    #visualizer {
      height: 38px; display: flex; align-items: flex-end;
      gap: 2px; margin: 8px 0 14px;
      overflow: hidden;
    }
    .viz-bar {
      flex: 1; border-radius: 2px 2px 0 0;
      background: linear-gradient(to top, var(--accent), var(--accent-light));
      height: 3px; min-width: 0;
      will-change: height, opacity;
    }
    /* U-3: свечение баров */
    html.ufx3 .viz-bar { box-shadow: 0 0 6px rgba(124,58,237,.45); }

    .controls {
      display: flex; align-items: center; justify-content: space-between;
    }
    .ctrl-btn {
      background: none; border: none; cursor: pointer; color: var(--muted);
      padding: 8px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      transition: color .12s, background .12s;
    }
    .ctrl-btn:hover  { color: var(--text); background: var(--surface2); }
    .ctrl-btn.active { color: var(--accent-light); }
    .ctrl-btn i { font-size: 20px; }

    .play-btn {
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      color: white; display: flex; align-items: center; justify-content: center;
      transition: background .12s, transform .1s, box-shadow .2s;
      box-shadow: 0 0 20px -4px rgba(124,58,237,.6);
    }
    .play-btn:hover  { background: var(--accent-h); transform: scale(1.06); box-shadow: 0 0 28px -2px rgba(124,58,237,.8); }
    .play-btn:active { transform: scale(0.95); }
    .play-btn i { font-size: 19px; }
    .ctrl-group { display: flex; align-items: center; gap: 4px; }

    .mode-row {
      display: flex; gap: 6px; justify-content: center;
      margin-top: 14px; padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .mode-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; padding: 2px 10px; border-radius: 20px;
      background: var(--accent-bg); color: var(--accent-light);
      border: 1px solid rgba(124,58,237,.25); letter-spacing: .08em;
    }

    /* ── TABS ── */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 10px 18px; cursor: pointer;
      font-size: 10px; letter-spacing: .1em;
      color: var(--muted); font-family: inherit;
      transition: color .15s, border-color .15s;
      display: flex; align-items: center; gap: 7px;
    }
    .tab.active { color: var(--accent-light); border-bottom-color: var(--accent); font-weight: 500; }
    .badge {
      background: var(--accent); color: white; border-radius: 20px;
      font-size: 9px; padding: 1px 7px; font-weight: 500; letter-spacing: 0;
    }

    /* ── TRACK LIST ── */
    .track-list { padding-top: 4px; }

    @keyframes row-in {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .track-row {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 8px 8px 10px; border-radius: 11px;
      cursor: pointer;
      transition: background .1s, transform .15s;
      animation: row-in .3s ease both;
      content-visibility: auto;
      contain-intrinsic-size: auto 54px;
    }
    .track-row:hover  { background: rgba(124,58,237,.08); transform: translateX(2px); }
    .track-row.active {
      background: rgba(124,58,237,.12);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .row-num {
      width: 22px; text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--dim); flex-shrink: 0;
    }
    .track-row.active .row-num { color: var(--accent-light); }

    .row-cover {
      width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; transition: box-shadow .2s;
    }
    .track-row.active .row-cover {
      box-shadow: 0 0 14px -3px var(--accent);
    }

    .row-title {
      flex: 1; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .track-row.active .row-title { color: var(--accent-light); font-weight: 500; }
    .row-dur {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--dim); flex-shrink: 0;
    }
    .row-heart {
      background: none; border: none; cursor: pointer; padding: 5px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 7px; color: var(--dim); transition: color .15s, transform .15s;
    }
    .row-heart:hover { color: var(--liked); transform: scale(1.2); }
    .row-heart.liked { color: var(--liked); }
    .row-heart i { font-size: 15px; }

    .row-btn {
      background: none; border: none; cursor: pointer; padding: 5px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 7px; color: var(--dim); transition: color .15s, opacity .15s;
    }
    .row-btn i { font-size: 15px; }
    .row-hide { opacity: 0; }
    .track-row:hover .row-hide, .track-row.active .row-hide { opacity: 1; }
    .row-hide:hover { color: var(--text); }
    .row-restore { color: var(--accent-light); }
    .row-restore:hover { color: var(--text); }
    @media (pointer: coarse) { .row-hide { opacity: .55; } }
    .track-row.is-hidden .row-title { color: var(--muted); }
    .track-row.gone { opacity: 0; transform: translateX(-40px); transition: opacity .25s, transform .25s; }
    .badge.dim { background: var(--surface2); color: var(--muted); }

    /* YouTube: кнопка у трека, значок в списке, значок канала */
    .yt-ico { display: inline-block; width: 18px; height: 13px; border-radius: 4px; background: #ff0033; position: relative; flex-shrink: 0; }
    .yt-ico::after { content: ''; position: absolute; left: 7px; top: 3.5px; border-left: 6px solid #fff; border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
    .yt-btn { display: flex; align-items: center; gap: 7px; flex-shrink: 0; cursor: pointer; padding: 6px 11px 6px 9px; border-radius: 20px;
      background: rgba(255,0,51,.12); border: 1px solid rgba(255,0,51,.45); color: #ffd6de; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em;
      animation: ytblink 1.6s ease-in-out infinite; transition: background .15s, transform .15s; }
    .yt-btn[hidden] { display: none; }
    .yt-btn:hover { background: rgba(255,0,51,.26); transform: scale(1.05); animation-play-state: paused; }
    @keyframes ytblink { 0%,100% { box-shadow: 0 0 0 0 rgba(255,0,51,.0); border-color: rgba(255,0,51,.35); } 50% { box-shadow: 0 0 18px 2px rgba(255,0,51,.45); border-color: rgba(255,60,90,.9); } }
    html.ufx1 .yt-btn { animation: none; box-shadow: 0 0 10px rgba(255,0,51,.35); }
    @media (max-width: 520px) { .yt-btn .yt-lbl { display: none; } .yt-btn { padding: 7px; } }
    .row-yt { display: inline-block; width: 12px; height: 9px; border-radius: 3px; background: #ff0033; vertical-align: 1px; margin-left: 6px; position: relative; opacity: .85; }
    .row-yt::after { content: ''; position: absolute; left: 4.5px; top: 2px; border-left: 4px solid #fff; border-top: 2.5px solid transparent; border-bottom: 2.5px solid transparent; }
    #ytChannel { display: flex; opacity: .55; transition: opacity .15s; }
    #ytChannel:hover { opacity: 1; }

    /* YouTube: окно видео, робот рядом, луч проектора */
    #yt { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
    #yt.on { display: flex; }
    #yt-back { position: absolute; inset: 0; background: rgba(6,3,15,.82); backdrop-filter: blur(6px); opacity: 0; transition: opacity .45s; }
    #yt.show #yt-back { opacity: 1; }
    #yt-row { position: relative; z-index: 2; display: flex; align-items: flex-end; gap: 14px; max-width: 100%; }
    #yt-robot-wrap { position: relative; width: 200px; height: 300px; flex-shrink: 0; z-index: 2; margin-bottom: -8px; }
    #yt-robot { width: 100%; height: 100%; display: block; }
    #yt-panel { position: relative; z-index: 2; width: min(960px, calc(100vw - 280px)); aspect-ratio: 16/9; max-height: calc(100vh - 80px);
      background: #000; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 0 60px -10px rgba(124,58,237,.55); transform-origin: 0% 30%; transform: scale(.02,.02); opacity: 0;
      transition: transform .7s cubic-bezier(.2,.9,.25,1.05), opacity .3s; }
    #yt.show #yt-panel { transform: none; opacity: 1; }
    #yt-panel iframe, #yt-panel .yt-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #yt-scan { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(196,181,253,.0), rgba(196,181,253,.35) 50%, rgba(196,181,253,0)); opacity: 0; }
    #yt.show #yt-scan { animation: ytscan .9s ease-out .25s 1; }
    @keyframes ytscan { 0% { opacity: 1; transform: translateY(-100%); } 100% { opacity: 0; transform: translateY(100%); } }
    #yt-beam { position: fixed; z-index: 1; pointer-events: none; opacity: 0; transition: opacity .5s;
      background: linear-gradient(to right, rgba(196,181,253,.38), rgba(124,58,237,.06)); filter: blur(1px); }
    #yt.show #yt-beam { opacity: 1; }
    #yt.closing #yt-beam { opacity: 0; }
    #yt-tools { position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; gap: 6px; opacity: 0; transition: opacity .3s .5s; }
    #yt.show #yt-tools { opacity: 1; }
    #yt-tools button, #yt-tools a { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(6,3,15,.7);

<script>
var AU = window.AceonUniverse || { id: 1, fx: 1 };
/* ── БОКЕ (U-3): всплывающие огоньки, оживают под музыку ────── */
(function initBokeh() {
  if (AU.id < 3) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('bokeh');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, parts = [];
  var HUES = ['167,139,250', '196,181,253', '124,58,237', '232,121,160'];
  function setup() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    parts = [];
    for (var i = 0; i < 55; i++) parts.push(spawn(true));
  }
  function spawn(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 20,
      r: 1 + Math.random() * 2.6,
      sp: 4 + Math.random() * 9,
      ph: Math.random() * 6.283,
      hue: HUES[(Math.random() * HUES.length) | 0],
      drift: (Math.random() - .5) * 4
    };
  }
  window.addEventListener('resize', setup);
  setup();
  var last = performance.now(), lastF = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    if (now - lastF < 30) return;
    lastF = now;
    var dt = Math.min((now - last) / 1000, .05); last = now;
    var MP = window.MusicPlayer || {}, playing = !!MP.playing, lv = MP.levels || {};
    var boost = playing ? 1.5 + (lv.bass || 0) * 1.2 : 1;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.y -= p.sp * boost * dt;
      p.x += p.drift * dt + Math.sin(now * .0006 + p.ph) * .12;
      if (p.y < -20) parts[i] = spawn(false);
      var tw = .5 + .5 * Math.sin(now * .0012 + p.ph);
      var a = (0.05 + tw * 0.09) * (playing ? 1.5 : 1);
      ctx.fillStyle = 'rgba(' + p.hue + ',' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (playing ? 1.15 : 1), 0, 6.283); ctx.fill();
    }
  }
  requestAnimationFrame(loop);
})();
</script>
