<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Архив звука</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #080810;
      --surface:      #11111c;
      --surface2:     #1a1a2c;
      --border:       rgba(255,255,255,0.08);
      --accent:       #6d28d9;
      --accent-h:     #5b21b6;
      --accent-light: #a78bfa;
      --accent-bg:    rgba(109,40,217,0.12);
      --text:         #e8e8f8;
      --muted:        #7878a0;
      --dim:          #44445a;
      --liked:        #e879a0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    .container { max-width: 640px; margin: 0 auto; }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-light);
      letter-spacing: -0.3px;
      margin-bottom: 20px;
    }

    /* Player */
    .player {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 10px;
    }
    .track-info {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 14px;
    }
    .cover {
      width: 46px;
      height: 46px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      background: #1e1b4b;
      color: #a78bfa;
    }
    .track-meta { flex: 1; min-width: 0; }
    .track-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .like-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--dim);
      transition: color 0.15s, transform 0.15s;
    }
    .like-btn:hover { transform: scale(1.2); color: var(--liked); }
    .like-btn.liked { color: var(--liked); }
    .like-btn i { font-size: 20px; }

    .progress-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--dim);
      margin-bottom: 14px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 7px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s, background 0.12s;
    }
    .ctrl-btn:hover  { color: var(--text); background: var(--surface2); }
    .ctrl-btn.active { color: var(--accent-light); }
    .ctrl-btn i { font-size: 20px; }

    .play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, transform 0.1s;
    }
    .play-btn:hover  { background: var(--accent-h); transform: scale(1.05); }
    .play-btn:active { transform: scale(0.96); }
    .play-btn i { font-size: 18px; }
    .ctrl-group { display: flex; align-items: center; gap: 4px; }

    .mode-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .mode-badge {
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 20px;
      background: var(--accent-bg);
      color: var(--accent-light);
      border: 1px solid rgba(109,40,217,0.25);
    }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tab.active { color: var(--accent-light); border-bottom-color: var(--accent); font-weight: 500; }
    .badge {
      background: var(--accent);
      color: white;
      border-radius: 20px;
      font-size: 10px;
      padding: 1px 7px;
      font-weight: 500;
    }

    /* Track list */
    .track-list { padding-top: 4px; }
    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .track-row:hover  { background: var(--surface); }
    .track-row.active { background: var(--accent-bg); }

    .row-num {
      width: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--dim);
      flex-shrink: 0;
    }
    .track-row.active .row-num { color: var(--accent-light); }

    .row-cover {
      width: 38px;
      height: 38px;
      border-radius: 7px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
    }
    .row-title {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .track-row.active .row-title { color: var(--accent-light); font-weight: 500; }
    .row-dur { font-size: 11px; color: var(--dim); flex-shrink: 0; }
    .row-heart {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      color: var(--dim);
      transition: color 0.15s, transform 0.15s;
    }
    .row-heart:hover { color: var(--liked); transform: scale(1.2); }
    .row-heart.liked { color: var(--liked); }
    .row-heart i { font-size: 15px; }

    .empty {
      text-align: center;
      padding: 64px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .empty i { font-size: 40px; display: block; margin: 0 auto 14px; color: var(--dim); }

    ::-webkit-scrollbar       { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }
  </style>
</head>
<body>
<div class="container">

  <p class="page-title">&#9672; Архив звука</p>

  <div class="player">
    <div class="track-info">
      <div class="cover" id="playerCover">
        <i class="ti ti-music" style="font-size:20px;"></i>
      </div>
      <div class="track-meta">
        <div class="track-title" id="playerTitle">Выбери трек</div>
        <div class="track-sub"   id="playerSub">нажми на трек ниже</div>
      </div>
      <button class="like-btn" id="playerLike" onclick="likeFromPlayer()" aria-label="в понравившееся">
        <i class="ti ti-heart" id="playerLikeIcon"></i>
      </button>
    </div>

    <div class="progress-wrap" onclick="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="timeCur">0:00</span>
      <span id="timeTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnShuffle" onclick="toggleShuffle()" aria-label="случайное воспроизведение">
        <i class="ti ti-arrows-shuffle"></i>
      </button>
      <div class="ctrl-group">
        <button class="ctrl-btn" onclick="skip(-1)" aria-label="предыдущий">
          <i class="ti ti-player-skip-back"></i>
        </button>
        <button class="play-btn" onclick="togglePlay()" aria-label="играть / пауза">
          <i class="ti ti-player-play" id="playIcon"></i>
        </button>
        <button class="ctrl-btn" onclick="skip(1)" aria-label="следующий">
          <i class="ti ti-player-skip-forward"></i>
        </button>
      </div>
      <button class="ctrl-btn" id="btnRepeat" onclick="toggleRepeat()" aria-label="повтор трека">
        <i class="ti ti-repeat-once"></i>
      </button>
    </div>

    <div class="mode-row" id="modeRow" style="display:none;">
      <span class="mode-badge" id="badgeShuf" style="display:none;">случайно</span>
      <span class="mode-badge" id="badgeRep"  style="display:none;">повтор</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabAll"  onclick="setTab('all')">Все треки</button>
    <button class="tab"        id="tabFavs" onclick="setTab('favs')">Понравилось</button>
  </div>

  <div class="track-list" id="trackList"></div>

</div>

<script>

/* =================================================================
   ТРЕКИ — ЕДИНСТВЕННОЕ МЕСТО ДЛЯ РЕДАКТИРОВАНИЯ

   Каждая строка — один трек:
     { id: 1, title: "Название", src: "audio/файл.mp3", duration: "3:42" },

   id       — уникальный номер (просто по порядку)
   title    — название (отображается в плеере и списке)
   src      — путь к mp3 от этого HTML файла, например "audio/track01.mp3"
              или полная ссылка "https://cdn.example.com/track.mp3"
   duration — длительность строкой, можно не писать — подтянется из файла
================================================================= */

var TRACKS = [

  { id: 1,  title: "Это Любовь!",                             src: "audio/Это Любовь!.mp3"                  },
  { id: 2,  title: "Ночной город",                            src: "audio/Ночной город.mp3"                 },
  { id: 3,  title: "Ночной город (rock edit).mp3",            src: "audio/Ночной город (rock edit).mp3"     },
  { id: 4,  title: "The Xerox of My Childhood",               src: "audio/The Xerox of My Childhood.mp3"    },
  { id: 5,  title: "Ксерокс моего детства",                   src: "audio/Ксерокс моего детства.mp3"        },
  { id: 6,  title: "Сегодня всё можно",                       src: "audio/Сегодня всё можно.mp3"            },
  { id: 7,  title: "Princess",                                src: "audio/Princess.mp3"                     },
  { id: 8,  title: "Sweet Poison",                            src: "audio/Sweet Poison.mp3"                 },
  { id: 9,  title: "До утра (modern pop)",                    src: "audio/До утра (modern pop).mp3"         },
  { id: 10, title: "Dance Me Closer",                         src: "audio/Dance Me Closer.mp3"              },
  { id: 11, title: "Не забыл",                                src: "audio/Не забыл.mp3"                     }

  // <- добавляй треки сюда, не забудь запятую после предыдущей строки

];

/* ================================================================= */

var PALETTE = [
  { bg: "#1e1b4b", fg: "#a78bfa" },
  { bg: "#1a2a1a", fg: "#6ee7b7" },
  { bg: "#2a1000", fg: "#fdba74" },
  { bg: "#2a0a1a", fg: "#f9a8d4" },
  { bg: "#0a1a2a", fg: "#7dd3fc" },
  { bg: "#1a1500", fg: "#fde68a" },
  { bg: "#1a0a0a", fg: "#fca5a5" },
  { bg: "#0a1a1a", fg: "#5eead4" }
];

function trackColor(id) {
  return PALETTE[(id - 1) % PALETTE.length];
}

function trackInitials(title) {
  var parts = title.split(/[\s_.\-]+/).filter(function(p) { return p.length > 0; });
  var result = "";
  for (var i = 0; i < Math.min(2, parts.length); i++) {
    result += parts[i][0].toUpperCase();
  }
  return result || "?";
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return "0:00";
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

/* State */
var current = null;
var playing  = false;
var shuffle  = false;
var repeat   = false;
var activeTab = "all";
var favs = {};

var audio = new Audio();

/* localStorage — сохранение понравившихся */
function loadFavs() {
  try {
    var raw = localStorage.getItem("sound_archive_favs");
    if (raw) {
      var ids = JSON.parse(raw);
      for (var i = 0; i < ids.length; i++) {
        favs[ids[i]] = true;
      }
    }
  } catch (e) {}
}

function saveFavs() {
  try {
    var ids = Object.keys(favs).filter(function(k) { return favs[k]; });
    localStorage.setItem("sound_archive_favs", JSON.stringify(ids.map(Number)));
  } catch (e) {}
}

/* Список с учётом вкладки */
function getList() {
  if (activeTab === "favs") {
    return TRACKS.filter(function(t) { return favs[t.id]; });
  }
  return TRACKS;
}

/* Следующий / предыдущий */
function pickNext(forward) {
  var list = getList();
  if (!list.length) return null;

  if (shuffle) {
    var pool = list.length > 1
      ? list.filter(function(t) { return !current || t.id !== current.id; })
      : list;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  var i = -1;
  if (current) {
    for (var j = 0; j < list.length; j++) {
      if (list[j].id === current.id) { i = j; break; }
    }
  }

  if (forward) return list[(i + 1) % list.length];
  return list[(i - 1 + list.length) % list.length];
}

/* Воспроизведение */
function playTrack(track, autoPlay) {
  if (autoPlay === undefined) autoPlay = true;
  current = track;
  audio.src = track.src;
  if (autoPlay) {
    audio.play();
    playing = true;
  }
  updatePlayer();
  renderList();
}

/* Глобальная функция для onclick в списке */
function playById(id) {
  for (var i = 0; i < TRACKS.length; i++) {
    if (TRACKS[i].id === id) {
      if (current && current.id === id) {
        togglePlay();
      } else {
        playTrack(TRACKS[i], true);
      }
      return;
    }
  }
}

function togglePlay() {
  if (!current) {
    var list = getList();
    if (list.length) playTrack(list[0]);
    return;
  }
  if (playing) {
    audio.pause();
    playing = false;
  } else {
    audio.play();
    playing = true;
  }
  updatePlayer();
  renderList();
}

function skip(dir) {
  var next = pickNext(dir > 0);
  if (next) playTrack(next, playing);
}

function toggleShuffle() {
  shuffle = !shuffle;
  var btn = document.getElementById("btnShuffle");
  if (shuffle) btn.classList.add("active");
  else btn.classList.remove("active");
  updateModes();
}

function toggleRepeat() {
  repeat = !repeat;
  var btn = document.getElementById("btnRepeat");
  if (repeat) btn.classList.add("active");
  else btn.classList.remove("active");
  updateModes();
}

function seek(e) {
  if (!current || !audio.duration) return;
  var rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

/* Лайки */
function toggleLike(id) {
  if (favs[id]) {
    delete favs[id];
  } else {
    favs[id] = true;
  }
  saveFavs();
  updatePlayerLike();
  renderList();
  renderTabs();
}

/* Глобальная функция для onclick в списке */
function likeById(id, e) {
  if (e) e.stopPropagation();
  toggleLike(id);
}

function likeFromPlayer() {
  if (current) toggleLike(current.id);
}

function setTab(t) {
  activeTab = t;
  renderTabs();
  renderList();
}

/* UI обновление */
function updatePlayer() {
  if (!current) return;

  var col = trackColor(current.id);
  var cov = document.getElementById("playerCover");
  cov.style.background = col.bg;
  cov.style.color      = col.fg;
  cov.innerHTML        = trackInitials(current.title);

  document.getElementById("playerTitle").textContent = current.title;
  document.getElementById("playerSub").textContent   = current.duration || "...";
  document.getElementById("playIcon").className      = playing ? "ti ti-player-pause" : "ti ti-player-play";
  updatePlayerLike();
}

function updatePlayerLike() {
  if (!current) return;
  var liked = !!favs[current.id];
  var btn   = document.getElementById("playerLike");
  document.getElementById("playerLikeIcon").className = liked ? "ti ti-heart-filled" : "ti ti-heart";
  if (liked) btn.classList.add("liked");
  else btn.classList.remove("liked");
}

function updateModes() {
  var active = shuffle || repeat;
  document.getElementById("modeRow").style.display   = active ? "flex" : "none";
  document.getElementById("badgeShuf").style.display = shuffle ? "inline" : "none";
  document.getElementById("badgeRep").style.display  = repeat  ? "inline" : "none";
}

/* Рендер вкладок */
function renderTabs() {
  var tabAll  = document.getElementById("tabAll");
  var tabFavs = document.getElementById("tabFavs");

  if (activeTab === "all") tabAll.classList.add("active");
  else tabAll.classList.remove("active");

  if (activeTab === "favs") tabFavs.classList.add("active");
  else tabFavs.classList.remove("active");

  var count = Object.keys(favs).filter(function(k) { return favs[k]; }).length;
  tabFavs.innerHTML = count > 0
    ? "Понравилось <span class=\"badge\">" + count + "</span>"
    : "Понравилось";
}

/* Рендер списка треков */
function renderList() {
  var list = getList();
  var el   = document.getElementById("trackList");

  if (!list.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-heart"></i>Нажми на сердечко у трека чтобы добавить в понравившееся</div>';
    return;
  }

  var html = "";
  for (var i = 0; i < list.length; i++) {
    var t      = list[i];
    var col    = trackColor(t.id);
    var isAct  = current && current.id === t.id;
    var liked  = !!favs[t.id];

    var numHtml = isAct
      ? '<i class="ti ti-' + (playing ? "player-play" : "player-pause") + '" style="font-size:12px;"></i>'
      : String(i + 1);

    var durHtml = t.duration ? '<div class="row-dur">' + t.duration + '</div>' : "";

    html += '<div class="track-row' + (isAct ? " active" : "") + '" onclick="playById(' + t.id + ')">'
      + '<div class="row-num">' + numHtml + '</div>'
      + '<div class="row-cover" style="background:' + col.bg + ';color:' + col.fg + ';">' + trackInitials(t.title) + '</div>'
      + '<div class="row-title">' + t.title + '</div>'
      + durHtml
      + '<button class="row-heart' + (liked ? " liked" : "") + '" onclick="likeById(' + t.id + ', event)" aria-label="в понравившееся">'
      + '<i class="ti ti-' + (liked ? "heart-filled" : "heart") + '"></i>'
      + '</button>'
      + '</div>';
  }

  el.innerHTML = html;
}

/* Audio события */
audio.addEventListener("timeupdate", function() {
  if (!audio.duration) return;
  var pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("timeCur").textContent      = fmtTime(audio.currentTime);
  document.getElementById("timeTotal").textContent    = fmtTime(audio.duration);
});

audio.addEventListener("loadedmetadata", function() {
  document.getElementById("timeTotal").textContent = fmtTime(audio.duration);
  if (current && !current.duration) {
    document.getElementById("playerSub").textContent = fmtTime(audio.duration);
  }
});

audio.addEventListener("ended", function() {
  if (repeat) {
    audio.currentTime = 0;
    audio.play();
    return;
  }
  var next = pickNext(true);
  if (next) {
    playTrack(next, true);
  } else {
    playing = false;
    document.getElementById("playIcon").className = "ti ti-player-play";
  }
});

audio.addEventListener("play", function() {
  playing = true;
  document.getElementById("playIcon").className = "ti ti-player-pause";
  renderList();
});

audio.addEventListener("pause", function() {
  playing = false;
  document.getElementById("playIcon").className = "ti ti-player-play";
  renderList();
});

/* Старт */
loadFavs();
renderList();
renderTabs();

</script>
</body>
</html>
