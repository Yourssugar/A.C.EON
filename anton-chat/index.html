<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АНТОН</title>
<style>
  :root{--bg:#060a07;--bg-panel:#0d140e;--bg-input:#0a100b;--green:#3dff8a;
    --green-dim:#1f6b3f;--green-soft:#2a5e3f;--text-muted:#5a9b76;
    --border:#163320;--glow:rgba(61,255,138,.35);--warn:#ff5d5d;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--green);
    font-family:'Consolas','JetBrains Mono','Courier New',monospace;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px);z-index:9999;}
  .page{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;justify-content:space-between;align-items:center;
    padding:14px 20px;border-bottom:1px solid var(--border);
    background:var(--bg);flex-shrink:0;z-index:10;}
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand h1{font-size:22px;font-weight:700;letter-spacing:4px;
    text-shadow:0 0 8px var(--glow),0 0 18px var(--glow);}
  .brand .sub{font-size:12px;color:var(--text-muted);letter-spacing:1px;}
  .hstatus{display:flex;align-items:center;gap:6px;font-size:11px;
    color:var(--text-muted);letter-spacing:1px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);
    box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
  .hstatus.offline .dot{background:var(--text-muted);box-shadow:none;animation:none;}
  .hstatus.busy .dot{background:var(--warn);box-shadow:0 0 6px var(--warn);
    animation:pulse .8s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .body-split{display:flex;flex:1;overflow:hidden;}
  .anim-panel{width:420px;flex-shrink:0;position:relative;
    border-right:1px solid var(--border);overflow:hidden;background:var(--bg);}
  #nc{display:block;width:100%;height:calc(100% - 44px);}
  .nn-footer{position:absolute;bottom:0;left:0;right:0;height:44px;
    display:flex;align-items:center;justify-content:center;
    gap:10px;border-top:1px solid var(--border);}
  .nn-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);
    transition:background .6s,box-shadow .6s;}
  .nn-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);
    animation:pulse .8s infinite;}
  .nn-lbl{font-size:10px;letter-spacing:2px;color:var(--text-muted);
    transition:color .6s,text-shadow .6s;}
  .nn-lbl.on{color:var(--green);text-shadow:0 0 6px var(--glow);}
  .chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .controls{display:flex;align-items:center;gap:16px;padding:8px 16px;
    border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted);flex-shrink:0;}
  .controls button{background:transparent;border:1px solid var(--green-soft);
    color:var(--text-muted);font-family:inherit;font-size:12px;padding:5px 10px;
    cursor:pointer;letter-spacing:1px;transition:all .15s;}
  .controls button:hover{color:var(--green);border-color:var(--green);box-shadow:0 0 8px var(--glow);}
  .chat{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:88%;line-height:1.55;font-size:14px;white-space:pre-wrap;
    word-wrap:break-word;animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg .label{display:block;font-size:11px;letter-spacing:2px;margin-bottom:4px;color:var(--text-muted);}
  .msg.user{align-self:flex-end;background:var(--bg-panel);border:1px solid var(--border);
    border-right:2px solid var(--green-soft);padding:8px 12px;color:#cdeedd;}
  .msg.user .label{text-align:right;}
  .msg.anton{align-self:flex-start;color:var(--green);text-shadow:0 0 6px var(--glow);padding:0 4px;}
  .msg.system{align-self:center;color:var(--text-muted);font-size:12px;letter-spacing:1px;text-align:center;}
  .msg.system.warn{color:var(--warn);}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--green);
    box-shadow:0 0 6px var(--green);animation:blink 1s steps(1) infinite;
    vertical-align:text-bottom;margin-left:2px;}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .input-row{border-top:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:flex-end;gap:10px;flex-shrink:0;}
  .arrow{font-size:16px;color:var(--green);text-shadow:0 0 6px var(--glow);padding-bottom:8px;}
  textarea#input{flex:1;background:var(--bg-input);border:1px solid var(--border);
    color:var(--green);font-family:inherit;font-size:14px;padding:8px 10px;
    resize:none;max-height:120px;outline:none;transition:border-color .15s,box-shadow .15s;}
  textarea#input:focus{border-color:var(--green-soft);box-shadow:0 0 8px var(--glow);}
  textarea#input::placeholder{color:var(--green-soft);}
  textarea#input:disabled{opacity:.4;}
  button#send{background:transparent;border:1px solid var(--green);color:var(--green);
    font-family:inherit;font-size:13px;letter-spacing:2px;padding:9px 16px;
    cursor:pointer;transition:all .15s;text-shadow:0 0 6px var(--glow);}
  button#send:hover:not(:disabled){background:var(--green-dim);box-shadow:0 0 12px var(--glow);}
  button#send:disabled{opacity:.35;cursor:default;}
  .chat::-webkit-scrollbar{width:5px;}
  .chat::-webkit-scrollbar-thumb{background:var(--green-soft);border-radius:3px;}
  @media(max-width:820px){.anim-panel{display:none;}}

/* ── BOOT ── */
#boot{position:fixed;inset:0;z-index:900;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;
  transition:opacity .42s;}
#boot.gone{opacity:0;pointer-events:none;}
#boot-in{width:100%;max-width:460px;}
#boot-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
#boot-ttl{font-size:13px;letter-spacing:2px;color:var(--green);
  text-shadow:0 0 14px var(--glow);}
#boot-pct{font-size:10px;color:var(--text-muted);}
#boot-track{height:3px;background:var(--border);overflow:hidden;margin-bottom:18px;}
#boot-bar{height:100%;width:0;background:var(--green);
  box-shadow:0 0 8px var(--glow);transition:width .12s linear;}
#boot-log{font-size:11.5px;line-height:1.9;min-height:270px;}
#boot-log .bl{opacity:0;transform:translateX(-3px);
  transition:opacity .1s,transform .1s;color:var(--text-muted);white-space:pre;}
#boot-log .bl.on{opacity:1;transform:none;}
#boot-log .bl.cmd{color:var(--green);}
#boot-log .bl.ok{color:var(--green-soft);}
#boot-log .bl.dim{color:var(--green-dim);}
#boot-log .bl.warn{color:var(--warn);}
#boot-log .bl.grn{color:var(--green);text-shadow:0 0 10px var(--glow);}
#boot-skip{margin-top:16px;font-size:9px;letter-spacing:3px;color:var(--green-dim);
  animation:blink 1.4s step-end infinite;}
@media(prefers-reduced-motion:reduce){#boot-log .bl{transition:none;}}
</style>
</head>
<body>
<div id="boot">
  <div id="boot-in">
    <div id="boot-hd">
      <span id="boot-ttl">antonhup</span>
      <span id="boot-pct">0%</span>
    </div>
    <div id="boot-track"><div id="boot-bar"></div></div>
    <div id="boot-log"></div>
    <div id="boot-skip">[ клик — пропустить ]</div>
  </div>
</div>

<div class="page">
  <header>
    <div class="brand"><h1 id="title">АНТОН</h1><span class="sub">статус: автономный модуль</span></div>
    <div class="hstatus offline" id="status"><span class="dot"></span><span id="statusText">НЕ ПОДКЛЮЧЕНО</span></div>
  </header>
  <div class="body-split">
    <div class="anim-panel">
      <canvas id="nc"></canvas>
      <div class="nn-footer">
        <span class="nn-dot" id="nnDot"></span>
        <span class="nn-lbl" id="nnLbl">РЕЖИМ ОЖИДАНИЯ</span>
      </div>
    </div>
    <div class="chat-panel">
      <div class="controls"><button id="clearBtn">очистить диалог</button></div>
      <div class="chat" id="chat"><div class="msg system">— инициализация —</div></div>
      <div class="input-row">
        <span class="arrow">&gt;</span>
        <textarea id="input" rows="1" placeholder="Напиши что-нибудь Антону... " disabled></textarea>
        <button id="send" disabled>ОТПРАВИТЬ</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   DEPENDENCY GRAPH  v1
   Idle   → граф дышит, изредка пробегает импульс
   Active → волна пересборки идёт снизу вверх по зависимостям
   Наружу торчит тот же window.neuralSetActive(on)
═══════════════════════════════════════════════════ */
(function(){
  const cv  = document.getElementById('nc');
  const ctx = cv.getContext('2d');
  const nnD = document.getElementById('nnDot');
  const nnL = document.getElementById('nnLbl');

  /* модули и кто от кого зависит. lvl — этаж снизу вверх:
     сначала собирается то, на чём всё держится */
  const MODULES = [
    { id:'io',      lvl:0, col:0, deps:[] },
    { id:'lexer',   lvl:0, col:1, deps:[] },
    { id:'mem',     lvl:1, col:0, deps:['io'] },
    { id:'parser',  lvl:1, col:1, deps:['lexer'] },
    { id:'gc',      lvl:2, col:0, deps:['mem'] },
    { id:'ast',     lvl:2, col:1, deps:['parser'] },
    { id:'runtime', lvl:3, col:0, deps:['gc','mem'] },
    { id:'eval',    lvl:3, col:1, deps:['ast'] },
    { id:'codegen', lvl:4, col:0, deps:['runtime','eval'] },
    { id:'core',    lvl:4, col:1, deps:['eval'] }
  ];
  const LVLS = 5;

  const G = { green:'#3dff8a', dim:'#1f6b3f', soft:'#2a5e3f', border:'#163320', muted:'#5a9b76' };

  let W, H, nodes = [], pulses = [];
  let activity = 0, target = 0;
  let T = 0;
  let wave = -1, waveT = 0, built = 0;

  function rgba(hex, a){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function build(){
    const padX = 58, padY = 54;
    const stepY = (H - padY*2) / (LVLS - 1);
    const colX = [padX + (W - padX*2)*0.16, padX + (W - padX*2)*0.84];
    nodes = MODULES.map(m => ({
      ...m,
      x: colX[m.col],
      y: H - padY - m.lvl*stepY,     // нулевой этаж внизу
      w: 84, h: 28,
      p: 0,            // прогресс сборки 0..1
      state: 'idle',
      seed: Math.random()*Math.PI*2
    }));
  }

  function resize(){
    const p = cv.parentElement;
    W = cv.width  = p.clientWidth;
    H = cv.height = p.clientHeight - 44;
    build();
  }

  const byId = id => nodes.find(n => n.id === id);

  function addPulse(from, to){
    pulses.push({ from, to, t: 0, sp: 0.024 + Math.random()*0.012 });
  }

  function update(){
    T++;
    activity += (target - activity) * (target > activity ? 0.05 : 0.02);

    /* волна пересборки: этаж за этажом снизу вверх */
    if(activity > 0.5){
      if(wave < 0){ wave = 0; waveT = 0; built = 0; nodes.forEach(n => { n.p = 0; n.state = 'idle'; }); }
      waveT++;
      if(waveT > 26){
        waveT = 0;
        const layer = nodes.filter(n => n.lvl === wave);
        layer.forEach(n => {
          n.state = 'building';
          n.deps.forEach(d => { const f = byId(d); if(f) addPulse(f, n); });
        });
        wave = wave + 1 > LVLS - 1 ? 0 : wave + 1;   // дошли до верха — заново
        if(wave === 0){ built = 0; nodes.forEach(n => { if(n.lvl > 0) { n.p = 0; n.state='idle'; } }); }
      }
    } else if(wave >= 0 && activity < 0.2){
      wave = -1;
      nodes.forEach(n => n.state = 'idle');
    }

    nodes.forEach(n => {
      if(n.state === 'building'){
        n.p += 0.05;
        if(n.p >= 1){ n.p = 1; n.state = 'done'; built = Math.min(nodes.length, built + 1); }
      } else if(n.state === 'idle' && activity < 0.3){
        n.p += (0 - n.p) * 0.06;
      }
    });

    /* в покое изредка что-то шевелится само по себе */
    if(activity < 0.3 && T % 52 === 0){
      const n = nodes[Math.floor(Math.random()*nodes.length)];
      if(n.deps.length){
        const f = byId(n.deps[Math.floor(Math.random()*n.deps.length)]);
        if(f) addPulse(f, n);
      }
    }

    pulses.forEach(p => p.t += p.sp * (0.6 + activity*1.6));
    pulses = pulses.filter(p => p.t < 1);

    const lbl = activity > 0.5;
    if(lbl){ nnD.classList.add('on'); nnL.classList.add('on'); nnL.textContent = 'ПЕРЕСБОРКА ' + built + '/' + nodes.length; }
    else   { nnD.classList.remove('on'); nnL.classList.remove('on'); nnL.textContent = 'РЕЖИМ ОЖИДАНИЯ'; }
  }

  function grid(){
    ctx.strokeStyle = rgba(G.border, 0.55);
    ctx.lineWidth = 1;
    for(let x = 0; x < W; x += 34){ ctx.beginPath(); ctx.moveTo(x+.5, 0); ctx.lineTo(x+.5, H); ctx.stroke(); }
    for(let y = 0; y < H; y += 34){ ctx.beginPath(); ctx.moveTo(0, y+.5); ctx.lineTo(W, y+.5); ctx.stroke(); }
  }

  function edge(f, t, lit){
    const x1 = f.x, y1 = f.y - f.h/2, x2 = t.x, y2 = t.y + t.h/2;
    const my = (y1 + y2) / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(x1, my, x2, my, x2, y2);
    ctx.strokeStyle = lit ? rgba(G.green, 0.5) : rgba(G.soft, 0.32);
    ctx.lineWidth = lit ? 1.6 : 1;
    ctx.setLineDash(lit ? [] : [3, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    /* стрелка */
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 3.5, y2 + 5);
    ctx.lineTo(x2 + 3.5, y2 + 5);
    ctx.closePath();
    ctx.fillStyle = lit ? rgba(G.green, 0.65) : rgba(G.soft, 0.4);
    ctx.fill();
  }

  function bezPt(f, t, u){
    const x1 = f.x, y1 = f.y - f.h/2, x2 = t.x, y2 = t.y + t.h/2;
    const my = (y1 + y2) / 2, v = 1 - u;
    return {
      x: v*v*v*x1 + 3*v*v*u*x1 + 3*v*u*u*x2 + u*u*u*x2,
      y: v*v*v*y1 + 3*v*v*u*my + 3*v*u*u*my + u*u*u*y2
    };
  }

  function node(n){
    const br = Math.sin(T*0.02 + n.seed)*0.5 + 0.5;      // дыхание
    const lit = n.state === 'done' ? 1 : n.state === 'building' ? n.p : 0;
    const x = n.x - n.w/2, y = n.y - n.h/2;

    /* корпус */
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, n.w, n.h, 3) : ctx.rect(x, y, n.w, n.h);
    ctx.fillStyle = rgba('#0d140e', 0.92);
    ctx.fill();

    /* заливка прогрессом — модуль собирается слева направо */
    if(lit > 0){
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, n.w*lit, n.h);
      ctx.clip();
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, n.w, n.h, 3) : ctx.rect(x, y, n.w, n.h);
      ctx.fillStyle = rgba(G.green, 0.12 + 0.06*br);
      ctx.fill();
      ctx.restore();
    }

    /* рамка */
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x+.5, y+.5, n.w-1, n.h-1, 3) : ctx.rect(x+.5, y+.5, n.w-1, n.h-1);
    ctx.strokeStyle = lit > 0.9 ? rgba(G.green, 0.85)
                    : lit > 0   ? rgba(G.green, 0.4 + lit*0.4)
                                : rgba(G.dim, 0.55 + br*0.15);
    ctx.lineWidth = lit > 0.9 ? 1.4 : 1;
    ctx.stroke();

    if(lit > 0.9){
      ctx.shadowColor = rgba(G.green, 0.5); ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    /* имя */
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = lit > 0.9 ? '#bdffd8' : lit > 0 ? rgba(G.green, 0.75) : rgba(G.muted, 0.7);
    ctx.fillText(n.id, n.x, n.y);

    /* галочка у собранного */
    if(n.state === 'done'){
      ctx.font = '9px monospace';
      ctx.fillStyle = rgba(G.green, 0.9);
      ctx.fillText('✓', x + n.w - 9, y + 7);
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#060a07';
    ctx.fillRect(0, 0, W, H);
    grid();

    /* рёбра */
    nodes.forEach(n => n.deps.forEach(d => {
      const f = byId(d);
      if(f) edge(f, n, n.state !== 'idle' && f.state === 'done');
    }));

    /* импульсы по рёбрам */
    pulses.forEach(p => {
      const pt = bezPt(p.from, p.to, p.t);
      const a = Math.sin(p.t*Math.PI);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2.4, 0, Math.PI*2);
      ctx.fillStyle = rgba(G.green, 0.9*a);
      ctx.shadowColor = rgba(G.green, 0.8*a); ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    nodes.forEach(node);

    /* подпись сверху */
    ctx.font = '9px "JetBrains Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = rgba(G.muted, 0.5);
    ctx.fillText('DEPENDENCY GRAPH', 12, 16);
    ctx.textAlign = 'right';
    ctx.fillStyle = activity > 0.5 ? rgba(G.green, 0.75) : rgba(G.muted, 0.4);
    ctx.fillText(activity > 0.5 ? 'rebuild' : 'idle', W - 12, 16);
  }

  /* ── наружу: тот же интерфейс, что был ── */
  window.neuralSetActive = function(on){
    target = on ? 1 : 0;
  };

  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  resize();
  loop();
  window.addEventListener('resize', resize);
})();

/* ═══════════════════════════════════════════════════
   CHAT
═══════════════════════════════════════════════════ */
const chat=document.getElementById('chat'),input=document.getElementById('input'),
  sendBtn=document.getElementById('send'),clearBtn=document.getElementById('clearBtn'),
  statusEl=document.getElementById('status'),statusText=document.getElementById('statusText');

let API_BASE='',busy=false,pollTimer=null;
const SP=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
const GH='https://api.github.com/repos/Yourssugar/A.C.EON/contents/anton-chat/config.json';

function getSid(){let i=localStorage.getItem('anton_sid');
  if(!i){i=crypto.randomUUID?crypto.randomUUID():'s'+Math.random().toString(36).slice(2);
    localStorage.setItem('anton_sid',i);}return i;}
const SID=getSid();

function addMsg(role,text){const d=document.createElement('div');d.className='msg '+role;
  if(role==='user')d.innerHTML='<span class="label">ТЫ</span>'+esc(text);
  else if(role==='anton')d.innerHTML='<span class="label">АНТОН</span><span class="text"></span>';
  else d.textContent=text;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function setUi(st){
  statusEl.classList.remove('offline','busy');
  if(st==='ready'){statusText.textContent='ONLINE';input.disabled=false;sendBtn.disabled=busy;
    input.placeholder='Напиши что-нибудь Антону...(ВНИМАНИЕ АНТОН МОЖЕТ ИСПОЛЬЗОВАТЬ МАТ В СВОЕЙ РЕЧИ)';if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
  else if(st==='busy'){statusEl.classList.add('busy');statusText.textContent='ЗАНЯТ';
    input.disabled=true;sendBtn.disabled=true;input.placeholder='Антон сейчас с кем-то другим...';
    if(!pollTimer)pollTimer=setInterval(chkAvail,8000);}
  else{statusEl.classList.add('offline');statusText.textContent='НЕ ПОДКЛЮЧЕНО';
    input.disabled=true;sendBtn.disabled=true;input.placeholder='Подключение...';
    if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}}

async function chkAvail(){try{const r=await fetch(API_BASE+'/api/state?session_id='+encodeURIComponent(SID));
  if(!r.ok)throw 0;const d=await r.json();
  if(!d.busy){addMsg('system','— Антон свободен —');setUi('ready');input.focus();}}catch(_){}}

async function loadConfig(){try{
  const r=await fetch(GH+'?t='+Date.now(),{headers:{'Accept':'application/vnd.github.v3+json'}});
  if(!r.ok)throw 0;const d=await r.json();
  const cfg=JSON.parse(atob(d.content.replace(/\n/g,'')));
  if(!cfg.api_url)throw 0;API_BASE=cfg.api_url;await connect();}
  catch(_){addMsg('system warn','— Антон офлайн —');setUi('disconnected');}}

async function connect(){try{
  const r=await fetch(API_BASE+'/api/state?session_id='+encodeURIComponent(SID));
  if(!r.ok)throw 0;const d=await r.json();
  if(d.busy){addMsg('system warn','— Антон занят —');setUi('busy');}
  else{addMsg('system','— соединение установлено —');setUi('ready');input.focus();}}
  catch(_){addMsg('system warn','— сервер недоступен —');setUi('disconnected');}}

input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
sendBtn.addEventListener('click',doSend);

async function doSend(){
  const text=input.value.trim();if(!text||busy||!API_BASE)return;
  addMsg('user',text);input.value='';input.style.height='auto';
  busy=true;sendBtn.disabled=true;
  window.neuralSetActive&&window.neuralSetActive(true);
  const div=addMsg('anton','');const span=div.querySelector('.text');
  let si=0;span.textContent=SP[0]+' печатает...';
  const st=setInterval(()=>{si=(si+1)%SP.length;span.textContent=SP[si]+' печатает...';},90);
  let first=true;const cur=document.createElement('span');cur.className='cursor';
  try{
    const r=await fetch(API_BASE+'/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,session_id:SID})});
    if(r.status===409){clearInterval(st);div.remove();addMsg('system warn','— Антон занят —');
      setUi('busy');busy=false;window.neuralSetActive&&window.neuralSetActive(false);return;}
    const reader=r.body.getReader();const dec=new TextDecoder('utf-8');
    while(true){const{value,done}=await reader.read();if(done)break;
      const chunk=dec.decode(value,{stream:true});
      if(chunk){if(first){clearInterval(st);span.textContent='';div.appendChild(cur);first=false;}
        span.textContent+=chunk;chat.scrollTop=chat.scrollHeight;}}
    if(first){clearInterval(st);span.textContent='...';}
  }catch(_){clearInterval(st);span.textContent='[Ошибка соединения]';setUi('disconnected');}
  finally{cur.remove();busy=false;sendBtn.disabled=false;
    window.neuralSetActive&&window.neuralSetActive(false);
    if(!statusEl.classList.contains('busy')&&!statusEl.classList.contains('offline'))input.focus();}}

clearBtn.addEventListener('click',async()=>{if(!API_BASE)return;
  const r=await fetch(API_BASE+'/api/reset',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:SID})});
  if(r.status===409){addMsg('system warn','— Антон занят —');return;}
  chat.innerHTML='<div class="msg system">— диалог очищен —</div>';});

/* glitch */
(function(){const t=document.getElementById('title');
  const s=document.createElement('style');
  s.textContent=`@keyframes gl{0%{text-shadow:0 0 8px var(--glow),0 0 18px var(--glow);transform:translate(0)}
    20%{text-shadow:-2px 0 #ff5d5d,2px 0 #4dd9ff;transform:translate(-1px,0)}
    40%{text-shadow:2px 0 #ff5d5d,-2px 0 #4dd9ff;transform:translate(1px,0)}
    100%{text-shadow:0 0 8px var(--glow),0 0 18px var(--glow);transform:translate(0)}}.gl{animation:gl .28s linear}`;
  document.head.appendChild(s);
  function f(){t.classList.add('gl');setTimeout(()=>t.classList.remove('gl'),280);
    setTimeout(f,7000+Math.random()*11000);}setTimeout(f,5000);})();

loadConfig();
</script>

<script>
/* ═══════════════════════════════════════════════════
   BOOT: Антона никто не ждал.
   Он собирал проект, а тут ты.
═══════════════════════════════════════════════════ */
(function(){
  const ov = document.getElementById('boot');
  if(!ov) return;
  const logEl = document.getElementById('boot-log');
  const barEl = document.getElementById('boot-bar');
  const pctEl = document.getElementById('boot-pct');

  let done = false;
  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  /* он именно работает, а не «приветствует пользователя» */
  const LINES = [
    { t:'$ make -j4',                        c:'cmd',  d:150  },
    { t:'  cc io.c ........... ok',          c:'ok',   d:520  },
    { t:'  cc lexer.c ........ ok',          c:'ok',   d:760  },
    { t:'  cc parser.c ....... ok',          c:'ok',   d:1010 },
    { t:'  cc eval.c ......... ok',          c:'ok',   d:1270 },
    { t:'  cc runtime.c ...... ok',          c:'ok',   d:1520 },
    { t:'  link core .......... ok',         c:'ok',   d:1760 },
    { t:'build finished in 2.14s',           c:'dim',  d:1980 },
    { t:'',                                            d:2140 },
    { t:'! входящее соединение',             c:'warn', d:2280 },
    { t:'  сессия: наблюдатель',             c:'dim',  d:2460 },
    { t:'',                                            d:2620 },
    { t:'$ ignore --incoming',               c:'cmd',  d:2760 },
    { t:'  не вышло: он всё ещё висит',      c:'dim',  d:3120 },
    { t:'',                                            d:3320 },
    { t:'$ ну ладно',                        c:'cmd',  d:3460 },
    { t:'  открываю канал. недолго.',        c:'grn',  d:3820 }
  ];

  function line(l){
    const d = document.createElement('div');
    d.className = 'bl ' + (l.c || '');
    d.textContent = l.t;
    logEl.appendChild(d);
    requestAnimationFrame(() => d.classList.add('on'));
    logEl.scrollTop = logEl.scrollHeight;
  }

  function run(){
    LINES.forEach(l => at(l.d, () => line(l)));

    /* полоска сборки: доходит до 100 и замирает — он уже закончил, когда ты пришёл */
    let p = 0;
    const iv = setInterval(() => {
      p = Math.min(100, p + 2.2);
      barEl.style.width = p + '%';
      pctEl.textContent = Math.round(p) + '%';
      if(p >= 100){ clearInterval(iv); pctEl.textContent = 'ok'; }
    }, 40);
    timers.push({ clear: () => clearInterval(iv) });

    at(4400, finish);
  }

  function finish(){
    if(done) return;
    done = true;
    timers.forEach(t => (t && t.clear) ? t.clear() : clearTimeout(t));
    ov.classList.add('gone');
    setTimeout(() => { ov.style.display = 'none'; }, 420);
  }

  ov.addEventListener('click', finish);
  run();
})();
</script>
