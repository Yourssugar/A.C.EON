<!DOCTYPE html>
<html lang="ru" data-theme="obs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A.C.EON // ASTRO</title>
<script src="../universe.js"></script>
<link rel="stylesheet" href="astro.css?v=5">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="themebg" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <button class="tb" id="back" type="button">&lt; A.C.EON</button>
    <div class="brand"><b>A S T R O</b><span id="tSub"></span></div>
    <div class="tbr">
      <button class="tb" id="setBtn" type="button" aria-label="settings">&#9881;</button>
      <div id="langwrap"><button class="tb" id="langbtn" type="button">RU</button><div id="langmenu"></div></div>
    </div>
  </header>

  <div class="sky" id="sky"></div>

  <nav class="modes" id="modes">
    <button type="button" data-m="fc"><i class="ic" aria-hidden="true">&#9737;&#xFE0E;</i><span id="tTabFc"></span></button>
    <button type="button" data-m="map"><i class="ic" aria-hidden="true">&#9675;</i><span id="tTabMap"></span></button>
    <button type="button" data-m="syn"><i class="ic" aria-hidden="true">&#9901;&#xFE0E;</i><span id="tTabSyn"></span></button>
  </nav>

  <div class="cols">
    <aside class="side">
      <section class="pane" data-pane="fc">
        <h3 id="tFcWho"></h3>
        <div class="chips" id="fcPeople"></div>
        <h3 id="tFcSign"></h3>
        <div class="signs" id="fcSigns"></div>
        <div class="seg" id="period">
          <button type="button" data-p="today"></button><button type="button" data-p="tomorrow"></button><button type="button" data-p="week"></button>
        </div>
      </section>
      <section class="pane" data-pane="map">
        <h3 id="tPeople"></h3>
        <div class="chips" id="mapPeople"></div>
        <p class="hint" id="tPHint"></p>
      </section>
      <section class="pane" data-pane="syn">
        <h3 class="ha" id="tSynA"></h3>
        <div class="chips" id="synA"></div>
        <h3 class="hb" id="tSynB"></h3>
        <div class="chips" id="synB"></div>
      </section>
    </aside>

    <main class="main">
      <section class="view" data-view="fc">
        <div class="ballwrap" id="ballwrap">
          <canvas id="ball" aria-hidden="true"></canvas>
          <div id="ballCss" aria-hidden="true"></div>
          <button type="button" id="ballBtn"></button>
        </div>
        <article class="card" id="fcCard" hidden>
          <h2 id="fcTitle"></h2>
          <p class="intro" id="fcIntro"></p>
          <div id="fcBlocks"></div>
          <div class="extras" id="fcExtras"></div>
          <p class="note" id="fcNote"></p>
        </article>
      </section>
      <section class="view" data-view="map">
        <p class="empty" id="mapEmpty"></p>
        <div class="sum" id="mapSum"></div>
        <svg class="wheel" id="wheelMap" viewBox="0 0 800 800" hidden></svg>
        <div class="list" id="mapList"></div>
      </section>
      <section class="view" data-view="syn">
        <p class="empty" id="synEmpty"></p>
        <div class="sum" id="synSum"></div>
        <svg class="wheel" id="wheelSyn" viewBox="0 0 800 800" hidden></svg>
        <div class="list" id="synList"></div>
      </section>
    </main>
  </div>
</div>

<div id="char" hidden><div id="charSay"></div><img id="charImg" alt=""></div>

<div id="scrim"></div>
<aside id="panel" aria-hidden="true">
  <button type="button" class="x" id="pClose" aria-label="close">&#10005;</button>
  <div class="pglyph" id="pGlyph"></div>
  <h2 id="pTitle"></h2>
  <p class="psub" id="pSub"></p>
  <div class="pbody" id="pBody"></div>
  <div class="phouse" id="pHouse"></div>
  <h4 id="pAspT"></h4>
  <div id="pAsp"></div>
</aside>

<div class="modal" id="editor" hidden>
  <form class="mbox" id="edForm" novalidate>
    <div class="mh"><span id="edTitle"></span><button type="button" class="x" id="edClose" aria-label="close">&#10005;</button></div>
    <label class="f"><span id="tEdName"></span><input id="edName" maxlength="24" autocomplete="off"></label>
    <div class="f"><span id="tEdDate"></span>
      <div class="row3">
        <input id="edD" inputmode="numeric" maxlength="2" autocomplete="off">
        <input id="edM" inputmode="numeric" maxlength="2" autocomplete="off">
        <input id="edY" inputmode="numeric" maxlength="4" autocomplete="off">
      </div>
    </div>
    <div class="f"><span id="tEdTime"></span>
      <div class="rowt"><input id="edT" type="time"><label class="chk"><input type="checkbox" id="edNoT"><span id="tEdNoT"></span></label></div>
    </div>
    <div class="f city"><span id="tEdCity"></span>
      <input id="edCity" autocomplete="off" spellcheck="false">
      <ul id="edSug" hidden></ul>
    </div>
    <details id="edMan"><summary id="tEdCoords"></summary>
      <div class="row2"><label class="f"><span id="tEdLat"></span><input id="edLat" inputmode="decimal"></label><label class="f"><span id="tEdLon"></span><input id="edLon" inputmode="decimal"></label></div>
    </details>
    <p class="err" id="edErr"></p>
    <p class="hint" id="tEdHint"></p>
    <div class="mact"><button type="button" class="ghost" id="edDel"></button><button type="submit" class="go" id="edSave"></button></div>
  </form>
</div>

<div class="modal" id="settings" hidden>
  <div class="mbox wide">
    <div class="mh"><span id="setTitle"></span><button type="button" class="x" id="setClose" aria-label="close">&#10005;</button></div>
    <div class="thgrid" id="thGrid"></div>
    <p class="hint" id="thNote"></p>
    <div class="setdata" id="setData"><span id="tSetData"></span><button type="button" class="ghost" id="setClear"></button></div>
  </div>
</div>

<script src="../games/shared/store.js?v=1"></script>
<script src="../games/shared/i18n.js?v=1"></script>
<script src="../shared/trace.js?v=1"></script>
<script src="astronomy.browser.min.js"></script>
<script src="lang.js?v=2"></script>
<script src="interp.js?v=2"></script>
<script src="cities.js?v=1"></script>
<script src="astro-core.js?v=1"></script>
<script src="astro-gl.js?v=2"></script>
<script src="astro-ui.js?v=2"></script>
</body>
</html>
