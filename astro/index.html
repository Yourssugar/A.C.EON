<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRO · A.C.EON</title>
<link rel="stylesheet" href="astro.css">
</head>
<body>
<canvas id="stars"></canvas>
<div id="glow"></div>

<div class="app">
  <aside class="sidebar">
    <div id="brand"><h1>☉ A S T R O</h1><span>A.C.EON</span></div>

    <div class="widgets">
      <div class="widget" id="w-moon">☽ Луна…</div>
      <div class="widget" id="w-mercury">☿ Меркурий…</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="today">Сегодня</button>
      <button class="tab" data-tab="whoami">Кто я</button>
      <button class="tab" data-tab="syn">Мы двое</button>
    </div>

    <!-- СЕГОДНЯ: прогноз по знаку -->
    <div class="form" id="form-today">
      <p class="lead">Введи дату рождения — покажу прогноз на сегодня.</p>
      <div class="grid3">
        <label>День<input id="t-day" type="number" min="1" max="31" placeholder="15"></label>
        <label>Месяц<input id="t-month" type="number" min="1" max="12" placeholder="9"></label>
        <label>Год<input id="t-year" type="number" placeholder="1993"></label>
      </div>
      <button class="go" id="t-build">Узнать прогноз</button>
    </div>

    <!-- КТО Я: портрет (натал) -->
    <div class="form hidden" id="form-whoami">
      <p class="lead">Портрет характера по карте рождения. Дата — минимум; время и город добавят дома и асцендент.</p>
      <div class="grid3">
        <label>День<input id="f-day" type="number" min="1" max="31"></label>
        <label>Месяц<input id="f-month" type="number" min="1" max="12"></label>
        <label>Год<input id="f-year" type="number"></label>
        <label>Час<input id="f-hour" type="number" min="0" max="23" placeholder="—"></label>
        <label>Мин<input id="f-min" type="number" min="0" max="59" placeholder="—"></label>
        <label class="city">Город (необязательно)<input class="city-in" data-target="f" list="cities" placeholder="начни вводить…"></label>
        <label>Широта<input id="f-lat" type="text" placeholder="авто"></label>
        <label>Долгота<input id="f-lon" type="text" placeholder="авто"></label>
      </div>
      <button class="go" id="f-build">Показать карту</button>
    </div>

    <!-- МЫ ДВОЕ: синастрия -->
    <div class="form hidden" id="form-syn">
      <p class="lead">Насколько две карты ладят. Нужны обе даты; время и город — точнее.</p>
      <p class="card-title">Первый</p>
      <div class="grid3">
        <label>Д<input id="s1-day" type="number"></label>
        <label>М<input id="s1-month" type="number"></label>
        <label>Год<input id="s1-year" type="number"></label>
        <label>Ч<input id="s1-hour" type="number"></label>
        <label>Мин<input id="s1-min" type="number"></label>
        <label class="city">Город<input class="city-in" data-target="s1" list="cities" placeholder="…"></label>
        <label>Шир<input id="s1-lat" type="text"></label>
        <label>Долг<input id="s1-lon" type="text"></label>
      </div>
      <p class="card-title" style="margin-top:12px">Второй</p>
      <div class="grid3">
        <label>Д<input id="s2-day" type="number"></label>
        <label>М<input id="s2-month" type="number"></label>
        <label>Год<input id="s2-year" type="number"></label>
        <label>Ч<input id="s2-hour" type="number"></label>
        <label>Мин<input id="s2-min" type="number"></label>
        <label class="city">Город<input class="city-in" data-target="s2" list="cities" placeholder="…"></label>
        <label>Шир<input id="s2-lat" type="text"></label>
        <label>Долг<input id="s2-lon" type="text"></label>
      </div>
      <button class="go" id="s-build">Сравнить</button>
    </div>

    <p class="summary" id="summary"></p>
  </aside>

  <main class="stage">
    <svg id="chart" viewBox="0 0 800 800" class="hidden"></svg>
    <div id="forecast-card" class="fcard hidden">
      <h2 id="fc-title"></h2>
      <p id="fc-intro" class="fc-intro"></p>
      <div id="fc-blocks"></div>
      <div class="fc-extras" id="fc-extras"></div>
    </div>
    <p class="hint" id="hint">введи дату слева</p>
  </main>
</div>

<datalist id="cities"></datalist>

<aside id="panel">
  <span class="close" onclick="closePanel()">✕</span>
  <div class="pglyph" id="p-glyph"></div>
  <h2 id="p-title"></h2>
  <p class="psub" id="p-sub"></p>
  <div class="pbody" id="p-body"></div>
  <div id="p-house"></div>
  <p class="card-title" id="p-asp-title" style="display:none">Аспекты</p>
  <div id="p-aspects"></div>
</aside>

<script src="astronomy.browser.min.js"></script>
<script src="interpretations.js"></script>
<script src="forecast.js"></script>
<script src="astro.js"></script>
</body>
</html>
