<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRO · A.C.EON</title>
<link rel="stylesheet" href="astro.css">
</head>
<body>
<!-- СЛОЙ 0: амбиентный фон (заглушка под твой вихрь/воркер) -->
<canvas id="stars"></canvas>
<div id="glow"></div>

<div class="app">
  <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
  <aside class="sidebar">
    <div id="brand"><h1>☉ A S T R O</h1><span>A.C.EON · орбитальная карта</span></div>

    <div class="widgets">
      <div class="widget" id="w-moon">☽ Луна…</div>
      <div class="widget" id="w-mercury">☿ Меркурий…</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="light">По дате</button>
      <button class="tab" data-tab="full">Натал</button>
      <button class="tab" data-tab="syn">Синастрия</button>
    </div>

    <!-- ЛАЙТ -->
    <div class="form" id="form-light">
      <div class="grid3">
        <label>День<input id="l-day" type="number" min="1" max="31" placeholder="15"></label>
        <label>Месяц<input id="l-month" type="number" min="1" max="12" placeholder="9"></label>
        <label>Год<input id="l-year" type="number" placeholder="1993"></label>
      </div>
      <button class="go" id="l-build">Показать</button>
      <p class="note">Только знаки планет. Луна помечена ≈ — без времени её знак примерный.</p>
    </div>

    <!-- НАТАЛ -->
    <div class="form hidden" id="form-full">
      <div class="grid3">
        <label>День<input id="f-day" type="number" min="1" max="31"></label>
        <label>Месяц<input id="f-month" type="number" min="1" max="12"></label>
        <label>Год<input id="f-year" type="number"></label>
        <label>Час<input id="f-hour" type="number" min="0" max="23"></label>
        <label>Мин<input id="f-min" type="number" min="0" max="59"></label>
        <label class="city">Город<select class="city-preset" data-target="#f">
          <option value="">вручную</option>
          <option value="53.9006,27.5590">Минск</option>
          <option value="55.7558,37.6173">Москва</option>
          <option value="50.4501,30.5234">Киев</option>
          <option value="51.5074,-0.1278">Лондон</option>
          <option value="40.7128,-74.0060">Нью-Йорк</option>
        </select></label>
        <label>Широта<input id="f-lat" type="text" placeholder="53.90"></label>
        <label>Долгота<input id="f-lon" type="text" placeholder="27.56"></label>
      </div>
      <button class="go" id="f-build">Построить карту</button>
      <p class="note">Таймзона и переход на летнее время — по координатам автоматически.</p>
    </div>

    <!-- СИНАСТРИЯ -->
    <div class="form hidden" id="form-syn">
      <p class="card-title">Карта 1</p>
      <div class="grid3">
        <label>Д<input id="s1-day" type="number"></label>
        <label>М<input id="s1-month" type="number"></label>
        <label>Год<input id="s1-year" type="number"></label>
        <label>Ч<input id="s1-hour" type="number"></label>
        <label>Мин<input id="s1-min" type="number"></label>
        <label class="city">Город<select class="city-preset" data-target="#s1">
          <option value="">вручную</option><option value="53.9006,27.5590">Минск</option>
          <option value="55.7558,37.6173">Москва</option><option value="50.4501,30.5234">Киев</option>
        </select></label>
        <label>Шир<input id="s1-lat" type="text"></label>
        <label>Долг<input id="s1-lon" type="text"></label>
      </div>
      <p class="card-title" style="margin-top:12px">Карта 2</p>
      <div class="grid3">
        <label>Д<input id="s2-day" type="number"></label>
        <label>М<input id="s2-month" type="number"></label>
        <label>Год<input id="s2-year" type="number"></label>
        <label>Ч<input id="s2-hour" type="number"></label>
        <label>Мин<input id="s2-min" type="number"></label>
        <label class="city">Город<select class="city-preset" data-target="#s2">
          <option value="">вручную</option><option value="53.9006,27.5590">Минск</option>
          <option value="55.7558,37.6173">Москва</option><option value="50.4501,30.5234">Киев</option>
        </select></label>
        <label>Шир<input id="s2-lat" type="text"></label>
        <label>Долг<input id="s2-lon" type="text"></label>
      </div>
      <button class="go" id="s-build">Сравнить</button>
    </div>

    <p class="summary" id="summary"></p>
  </aside>

  <!-- СЦЕНА: орбитальное колесо -->
  <main class="stage">
    <svg id="chart" viewBox="0 0 800 800"></svg>
    <p class="hint" id="hint">заполни данные слева и построй карту</p>
  </main>
</div>

<!-- ПАНЕЛЬ ПРОЧТЕНИЯ -->
<aside id="panel">
  <span class="close" onclick="closePanel()">✕</span>
  <div class="pglyph" id="p-glyph"></div>
  <h2 id="p-title"></h2>
  <p class="psub" id="p-sub"></p>
  <div class="pbody" id="p-body"></div>
  <div id="p-house"></div>
  <p class="card-title" id="p-asp-title" style="display:none">Аспекты</p>
  <div id="p-aspects"></div>
</aside>

<!-- движки: astronomy сразу, natal — лениво из astro.js -->
<script src="astronomy.browser.min.js"></script>
<script src="interpretations.js"></script>
<script src="astro.js"></script>
</body>
</html>
