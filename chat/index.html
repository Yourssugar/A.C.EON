<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.C.EON · AI OFFICE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0e17;
  --ink:#1a1c2c;
  --pan:#161a2b;
  --pan2:#21283f;
  --line:#333c57;
  --txt:#f4f4f4;
  --dim:#94b0c2;
  --mute:#566c86;
  --acc:#41a6f6;
  --cyan:#73eff7;
  --grn:#38b764;
  --lime:#a7f070;
  --red:#b13e53;
  --org:#ef7d57;
  --ylw:#ffcd75;
  --px:'Pixelify Sans','JetBrains Mono',monospace;
  --mono:'JetBrains Mono',monospace;
  --cur: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M3 2.5L3 20.5L7.6 16.4L10.7 23.2L14 21.8L10.9 15.1L17.2 15.1Z' fill='%234DAFFF' stroke='%23000' stroke-width='1.6' stroke-linejoin='round'/><path d='M5 7L5 15.6' stroke='%23d6f0ff' stroke-width='1.1' stroke-linecap='round' opacity='.75'/></svg>") 3 3, auto;
  --cur-p: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M3 2.5L3 20.5L7.6 16.4L10.7 23.2L14 21.8L10.9 15.1L17.2 15.1Z' fill='%23b8e4ff' stroke='%23000' stroke-width='1.8' stroke-linejoin='round'/><path d='M5 7L5 15.6' stroke='%23fff' stroke-width='1.1' stroke-linecap='round'/></svg>") 3 3, pointer;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:var(--px);cursor:var(--cur);-webkit-tap-highlight-color:transparent}
button,a{font:inherit;color:inherit;cursor:var(--cur-p)}
button{background:none;border:0}
button:disabled{cursor:var(--cur)}

/* рамка в стиле пиксельных игр */
.px{background:var(--pan);border:2px solid var(--ink);
  box-shadow:inset 2px 2px 0 var(--pan2),inset -2px -2px 0 #0b0d16,0 0 0 2px var(--line)}
.pbtn{font-family:var(--px);font-size:14px;letter-spacing:.06em;padding:7px 12px;background:var(--pan2);
  border:2px solid var(--ink);box-shadow:inset 0 -3px 0 #121626,inset 0 2px 0 #2d3656;color:var(--txt);white-space:nowrap}
.pbtn:hover:not(:disabled){background:#2b3554}
.pbtn:active:not(:disabled){box-shadow:inset 0 3px 0 #121626;transform:translateY(1px)}
.pbtn.go{background:#24603f;box-shadow:inset 0 -3px 0 #153a26,inset 0 2px 0 #38b764}
.pbtn.go:hover:not(:disabled){background:#2c7a4f}
.pbtn:disabled{opacity:.42}

/* шапка */
#top{position:fixed;left:0;right:0;top:0;height:46px;z-index:20;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:#10131f;border-bottom:2px solid var(--ink);box-shadow:0 2px 0 var(--line)}
#back{font-size:14px;color:var(--dim);padding:6px 8px;white-space:nowrap}
#back:hover{color:var(--txt)}
#ttl{font-size:17px;letter-spacing:.08em;white-space:nowrap}
#ttl b{color:var(--cyan);font-weight:600}
#top .sp{flex:1}
#clock{font-family:var(--mono);font-size:12px;color:var(--ylw)}
#obs{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.08em}
.hbtn{min-width:34px;height:30px;padding:0 8px;font-size:13px;background:var(--pan2);border:2px solid var(--ink);
  box-shadow:inset 0 -2px 0 #121626;color:var(--dim)}
.hbtn:hover{color:var(--txt)}
#bgm-btn.muted{color:var(--mute)}
#langwrap{position:relative}
#langmenu{position:absolute;right:0;top:36px;display:none;flex-direction:column;min-width:150px;padding:4px;z-index:40}
#langmenu.on{display:flex}
#langmenu button{text-align:left;padding:6px 10px;font-size:14px;color:var(--dim);display:flex;gap:10px}
#langmenu button b{font-weight:400;color:var(--acc);width:22px}
#langmenu button:hover,#langmenu button.sel{color:var(--txt);background:var(--pan2)}
#agents-btn{display:flex;align-items:center;gap:8px}
#agents-btn .cnt{font-family:var(--mono);font-size:11px;color:var(--lime)}
.dot{width:8px;height:8px;display:inline-block;background:var(--mute);box-shadow:0 0 0 2px var(--ink)}
.dot.free{background:var(--lime)} .dot.busy{background:var(--org)} .dot.off{background:var(--red)}

/* сцена */
#stage{position:fixed;left:0;right:0;top:48px;bottom:28px;overflow:auto;display:flex;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#view{position:relative;margin:auto;flex:none}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;width:100%;height:100%}
#cv.hov{cursor:var(--cur-p)}
#ov{position:absolute;inset:0;pointer-events:none;overflow:visible}
#foot{position:fixed;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--mute);letter-spacing:.05em}

/* реплики */
.bub{position:absolute;transform:translate(-50%,-100%);max-width:200px;width:max-content;padding:5px 8px 6px;
  background:var(--txt);color:var(--ink);font-size:var(--bf,13px);line-height:1.2;text-align:center;
  border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(13,14,23,.45);
  animation:bubIn .16s steps(3) both;white-space:normal}
.bub::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-4px;border:4px solid transparent;
  border-top:4px solid var(--ink)}
.bub.out{animation:bubOut .2s steps(3) both}
.bub.robo{font-family:var(--mono);font-size:calc(var(--bf,13px) - 2px);letter-spacing:.02em}
@keyframes bubIn{from{opacity:0;margin-top:4px}to{opacity:1;margin-top:0}}
@keyframes bubOut{to{opacity:0;margin-top:-4px}}

/* табличка с именем */
#tag{position:absolute;transform:translate(-50%,6px);display:none;align-items:center;gap:6px;padding:3px 7px;
  font-size:12px;background:var(--ink);color:var(--txt);border:2px solid var(--line);pointer-events:auto;white-space:nowrap}
#tag.on{display:flex}
#tag i{font-style:normal;color:var(--cyan);border-left:2px solid var(--line);padding-left:6px;cursor:var(--cur-p)}

/* выезжающее меню агентов */
#drawer{position:fixed;top:48px;right:0;bottom:0;width:320px;max-width:92vw;z-index:30;display:flex;flex-direction:column;
  transform:translateX(105%);transition:transform .28s steps(7)}
#drawer.on{transform:none}
#drawer h2{font-size:16px;font-weight:600;letter-spacing:.1em;padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink)}
#drawer h2 small{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.05em}
#alist{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ai{display:flex;align-items:center;gap:10px;padding:6px 8px;text-align:left;width:100%;background:var(--pan2);
  border:2px solid var(--ink);box-shadow:inset 0 -2px 0 #121626}
.ai:hover{background:#2b3554}
.ai canvas{width:32px;height:48px;image-rendering:pixelated;flex:none}
.ai .nm{font-size:15px;letter-spacing:.06em}
.ai .cl{font-size:11px;color:var(--dim);letter-spacing:.04em}
.ai .stt{margin-left:auto;font-size:11px;letter-spacing:.05em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ai.slot{opacity:.5}
.ai.slot .nm{color:var(--mute)}
#term-open{margin:8px;justify-content:center}

/* карточка персонажа */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,9,15,.72)}
.modal.on{display:flex}
#cardbox{width:700px;max-width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:250px 1fr;animation:cardIn .2s steps(4)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#cp{background:#0f1220;border-right:2px solid var(--ink);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
#pt{position:relative;width:220px;aspect-ratio:360/359}
#pt img{position:absolute;display:block}
#pt-body{inset:0;width:100%;height:100%}
#pt-face{left:33.33%;top:24.2%;width:32.3%}
#pt-q{position:absolute;left:33.33%;top:24.2%;width:32.3%;height:21.7%;display:none;align-items:center;justify-content:center;
  font-size:30px;color:var(--mute)}
#pt-z{position:absolute;right:16%;top:6%;font-size:18px;color:var(--dim);display:none;animation:zz 2s steps(4) infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-10px)}}
#cstat{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.08em}
#csub{font-size:12px;color:var(--dim);text-align:center}
#cq{font-size:13px;color:var(--ylw);text-align:center;padding:0 6px;line-height:1.3}
#cr{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
#chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
#cname{font-size:30px;font-weight:600;letter-spacing:.06em;line-height:1}
#ccls{display:inline-block;margin-top:6px;font-size:12px;letter-spacing:.08em;padding:3px 7px;background:var(--ink);color:var(--cyan)}
#cx{font-family:var(--mono);font-size:13px;padding:4px 8px;color:var(--dim);border:2px solid var(--line)}
#cx:hover{color:var(--txt)}
#cmeta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
#cmeta dt{color:var(--mute);letter-spacing:.06em}
#cmeta dd{font-family:var(--mono);font-size:12px;color:var(--txt);align-self:center}
#cabout{font-size:14px;line-height:1.4;color:#d7e3ec}
#cbars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:12px;letter-spacing:.05em}
#cbars .bl{color:var(--dim)}
#cbars .bv{font-family:var(--mono);font-size:11px;color:var(--mute);min-width:16px;text-align:right}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:10px}
.seg i{background:#0f1220;box-shadow:inset 0 0 0 1px #262d47}
.seg i.on{background:var(--c,#41a6f6);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
#cskills{font-size:13px;line-height:1.5}
#cskills b{font-weight:400;color:var(--mute);letter-spacing:.06em;margin-right:6px}
#cbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
#cnote{font-size:12px;color:var(--org)}

/* терминал фрагментов */
#termbox{width:560px;max-width:100%;height:440px;max-height:100%;display:flex;flex-direction:column;font-family:var(--mono)}
#termbox h3{font-family:var(--px);font-weight:600;font-size:15px;letter-spacing:.1em;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink)}
#tlog{flex:1;overflow-y:auto;padding:10px 12px;font-size:12px;line-height:1.6;background:#0b0d16}
#tlog .m{margin-bottom:10px;white-space:pre-wrap}
#tlog .m .s{font-size:10px;color:var(--mute);letter-spacing:.08em}
#tlog .bot{color:var(--cyan)} #tlog .user{color:var(--ylw)}
#tlog .valid{color:var(--lime)} #tlog .invalid{color:#ff8a8a} #tlog .claimed{color:var(--dim)}
#thint{font-size:11px;color:var(--mute);padding:8px 12px;line-height:1.45;border-top:2px solid var(--ink)}
#trow{display:flex;gap:8px;padding:10px 12px;border-top:2px solid var(--ink)}
#tin{flex:1;min-width:0;background:#0b0d16;border:2px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:13px;padding:7px 10px;outline:none;text-transform:uppercase;letter-spacing:.1em}
#tin:focus{border-color:var(--acc)}

/* загрузка */
#boot{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .4s}
#boot.gone{opacity:0;pointer-events:none}
#boot pre{font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--dim);min-width:300px}
#boot pre b{color:var(--cyan);font-weight:400}

@media (max-width:640px){
  #ttl{font-size:14px} #obs,#clock{display:none}
  #cardbox{grid-template-columns:1fr}
  #cp{border-right:0;border-bottom:2px solid var(--ink)}
  #pt{width:170px}
  #cname{font-size:24px}
  #agents-btn .lbl{display:none}
}
</style>
</head>
<body>
<div id="boot"><pre id="bootl"></pre></div>

<header id="top">
  <button id="back" type="button">&lt; CORE</button>
  <div id="ttl">A.C.EON <b id="ttl-b">AI OFFICE</b></div>
  <div class="sp"></div>
  <span id="clock"></span>
  <span id="obs"></span>
  <button class="hbtn muted" id="bgm-btn" type="button">♪</button>
  <div id="langwrap">
    <button class="hbtn" id="langbtn" type="button">EN</button>
    <div id="langmenu" class="px"></div>
  </div>
  <button class="hbtn" id="agents-btn" type="button"><span class="dot free"></span><span class="lbl">AGENTS</span><span class="cnt">0/13</span></button>
</header>

<main id="stage"><div id="view"><canvas id="cv" width="368" height="208"></canvas><div id="ov"><div id="tag"></div></div></div></main>
<div id="foot"></div>

<aside id="drawer" class="px">
  <h2><span id="dr-t">AGENTS</span><small id="dr-c"></small></h2>
  <div id="alist"></div>
  <button class="pbtn" id="term-open" type="button"></button>
</aside>

<div class="modal" id="card">
  <div id="cardbox" class="px">
    <div id="cp">
      <div id="pt"><img id="pt-body" alt=""><img id="pt-face" alt=""><div id="pt-q">?</div><div id="pt-z">z</div></div>
      <div id="cstat"><span class="dot" id="cdot"></span><span id="cst"></span></div>
      <div id="csub"></div>
      <div id="cq"></div>
    </div>
    <div id="cr">
      <div id="chead"><div><div id="cname"></div><span id="ccls"></span></div><button id="cx" type="button">X</button></div>
      <dl id="cmeta"></dl>
      <div id="cabout"></div>
      <div id="cbars"></div>
      <div id="cskills"></div>
      <div id="cbtns"><button class="pbtn go" id="ctalk" type="button"></button><button class="pbtn" id="ccall" type="button"></button><span id="cnote"></span></div>
    </div>
  </div>
</div>

<div class="modal" id="term">
  <div id="termbox" class="px">
    <h3><span id="term-t">FRAGMENT TERMINAL</span><button id="tx" class="hbtn" type="button">X</button></h3>
    <div id="tlog"></div>
    <div id="thint"></div>
    <div id="trow"><input id="tin" type="text" maxlength="40" autocomplete="off" spellcheck="false"><button class="pbtn" id="tsend" type="button"></button></div>
  </div>
</div>

<script src="../universe.js"></script>
<script src="../games/shared/store.js?v=1"></script>
<script src="../games/shared/i18n.js?v=1"></script>
<script src="../shared/trace.js?v=1"></script>
<script src="agents.js?v=1"></script>
<script src="lang.js?v=1"></script>
<script src="office.js?v=1"></script>
</body>
</html>
