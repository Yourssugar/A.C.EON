<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>FORGE · конструктор страниц</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel2:#0f1216; --grid:#151a20;
    --line:#232a32; --line2:#2f3a44; --text:#d7dde3; --muted:#7c8792; --dim:#4b545d;
    --run:#4fd6c8; --gen:#e0a54a; --bad:#ff5d73;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --barH:52px; --tabH:58px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overflow:hidden;
    display:grid;height:100dvh;grid-template-columns:100%;
    grid-template-rows:var(--barH) minmax(0,1fr) auto var(--tabH);
    grid-template-areas:"bar" "stage" "panel" "tabs";}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--text)}

  /* верхняя полоса */
  .bar{grid-area:bar;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--panel2);min-width:0}
  .back{display:grid;place-items:center;width:38px;height:38px;color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:20px;border-radius:8px;flex:none}
  .back:hover{color:var(--run)}
  .title{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 8px;font-weight:600;font-size:15px}
  .title:focus{outline:none;border-color:var(--line2);background:var(--panel)}
  .ib{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;color:var(--muted);font-size:19px;flex:none}
  .ib:hover{color:var(--text);background:var(--panel)}
  .ib:disabled{opacity:.3;cursor:default}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
  .seg button{padding:6px 10px;border-radius:8px;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--line2);color:var(--text)}
  .pri{background:var(--run);color:#06201d;font-weight:700;border-radius:10px;padding:8px 12px;font-size:13px;flex:none}
  .pri:hover{filter:brightness(1.1)}

  /* сцена с превью */
  .stage{grid-area:stage;position:relative;min-height:0;display:flex;flex-direction:column;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
  .devs{display:none;justify-content:center;gap:4px;padding:8px}
  .devs button{font-family:var(--mono);font-size:12px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .devs button.on{color:var(--run);border-color:var(--run)}
  .fw{flex:1;min-height:0;display:flex;justify-content:center}
  #pv{width:100%;height:100%;border:0;background:#fff;display:block}
  .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(10,12,15,.88);border:1px solid var(--line2);
    color:var(--text);font-size:13px;padding:8px 14px;border-radius:20px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
  .hint.off{opacity:0}

  /* нижние вкладки (на телефоне) */
  .tabs{grid-area:tabs;display:flex;border-top:1px solid var(--line);background:var(--panel2);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
  .tabs button i{font-style:normal;font-size:19px;font-family:var(--mono);line-height:1}
  .tabs button.on{color:var(--run)}
  .tabs button.add i{color:var(--run)}

  /* панель: на телефоне выезжает снизу, на компьютере стоит слева */
  .panel{grid-area:panel;display:none;flex-direction:column;background:var(--panel);border-top:1px solid var(--line2);height:56dvh;min-height:0}
  .panel.open{display:flex}
  .panel.full{height:calc(100dvh - var(--barH) - var(--tabH) - 40px)}
  .ph{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);flex:none;position:relative}
  .grip{position:absolute;left:50%;top:4px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line2)}
  .ph b{flex:1;font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding-top:4px}
  .pb{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}

  @media (min-width:960px){
    body{grid-template-columns:400px minmax(0,1fr);grid-template-rows:var(--barH) auto minmax(0,1fr);
      grid-template-areas:"bar bar" "tabs stage" "panel stage"}
    .tabs{border-top:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
    .tabs button{flex-direction:row;gap:6px;padding:12px 4px;font-size:13px}
    .tabs button i{font-size:15px}
    .panel{display:flex;height:auto;border-top:0;border-right:1px solid var(--line)}
    .panel.full{height:auto}
    .grip,#pFull,#pClose{display:none}
    .devs{display:flex}
    .fw{padding:0 16px 16px}
    .fw.phone #pv{max-width:390px;border-radius:14px;box-shadow:0 0 0 1px var(--line2),0 20px 60px -20px #000}
    .fw.tab #pv{max-width:820px;border-radius:10px;box-shadow:0 0 0 1px var(--line2)}
    .fw.pc #pv{border-radius:6px}
  }

  /* элементы панели */
  .sh{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
  .sh:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);min-height:52px}
  .tile:hover,.tile:active{border-color:var(--run)}
  .tile .g{font-family:var(--mono);color:var(--run);font-size:18px;width:22px;text-align:center;flex:none}
  .tile span{font-size:14px;line-height:1.25}
  .note{color:var(--muted);font-size:13.5px;line-height:1.55}
  .note b{color:var(--text);font-weight:600}
  .note a{color:var(--run)}

  .lay{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--panel2)}
  .lay.on{border-color:var(--run)}
  .lay .nm{flex:1;display:flex;align-items:center;gap:10px;min-width:0;text-align:left;padding:6px 0}
  .lay .nm i{font-style:normal;font-family:var(--mono);color:var(--run);width:20px;text-align:center}
  .lay .nm span{white-space:nowrap;flex:none}
  .lay .nm small{flex:1;min-width:0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);flex:none}
  .sb:hover{background:var(--line);color:var(--text)}
  .sb.del:hover{color:var(--bad)}

  .acts{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  a.btn{text-decoration:none;color:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;font-size:13.5px;background:var(--panel2)}
  .btn:hover{border-color:var(--run);color:var(--run)}
  .btn.del:hover{border-color:var(--bad);color:var(--bad)}
  .btn.wide{width:100%;justify-content:flex-start;padding:13px 14px;margin-bottom:8px;font-size:14.5px}
  .btn.wide small{margin-left:auto;color:var(--dim);font-size:12px}
  .btn.go{background:var(--run);color:#06201d;border-color:var(--run);font-weight:700}
  .btn.go:hover{color:#06201d;filter:brightness(1.1)}

  .f{margin-bottom:14px}
  .f>label,.f .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
  .f .lab output{font-family:var(--mono);color:var(--text)}
  .f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f select,.f textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:16px}
  .f textarea{min-height:92px;resize:vertical;line-height:1.45}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--run)}
  .f input[type=range]{width:100%;accent-color:var(--run);height:28px}
  .crow{display:flex;align-items:center;gap:10px}
  .crow input[type=color]{width:46px;height:38px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);padding:3px;flex:none}
  .chip{padding:7px 11px;border-radius:20px;border:1px solid var(--line2);font-size:12.5px;color:var(--muted)}
  .chip.on{border-color:var(--run);color:var(--run)}
  .tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--text);padding:4px 0}
  .tgl input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex:none;cursor:pointer;transition:background .15s}
  .tgl input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
  .tgl input:checked{background:var(--run)}
  .tgl input:checked::after{left:21px}
  details.grp{border-top:1px solid var(--line);margin-top:6px}
  details.grp summary{list-style:none;cursor:pointer;padding:14px 0;font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
  details.grp summary::after{content:"+";font-family:var(--mono)}
  details.grp[open] summary::after{content:"-"}
  details.grp summary::-webkit-details-marker{display:none}

  .imgf .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .imgf .th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--panel2)}
  .imgf .th img{width:100%;height:100%;object-fit:cover;display:block}
  .imgf .th button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:1}
  .imgf .row{display:flex;gap:6px}
  .imgf .row input{flex:1;min-width:0}
  .imgf .sub{font-size:12px;color:var(--dim);margin-top:6px}

  .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-bottom:6px}
  .pre{border:1px solid var(--line2);border-radius:12px;overflow:hidden;text-align:left}
  .pre.on{border-color:var(--run);box-shadow:0 0 0 1px var(--run)}
  .pre .sw{height:44px;display:flex;align-items:flex-end;gap:4px;padding:6px}
  .pre .sw i{width:14px;height:14px;border-radius:50%;display:block}
  .pre span{display:block;padding:6px 8px;font-size:12.5px;background:var(--panel2)}

  pre.code{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#b9c3cc;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
  pre.code .cmt{color:#5f6b76}
  pre.code .cblock.hot{background:rgba(79,214,200,.09);box-shadow:-3px 0 0 var(--run);display:block}

  /* стартовый экран */
  .start{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none;padding:22px 16px 40px;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
  .start.on{display:block}
  .start .in{max-width:1080px;margin:0 auto}
  .start .top{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
  .start .top a{color:var(--muted);text-decoration:none}
  .start .top a:hover{color:var(--run)}
  .start h1{font-size:clamp(26px,5vw,38px);margin:18px 0 6px;letter-spacing:.01em}
  .start h1 b{color:var(--run)}
  .start .lead{color:var(--muted);max-width:62ch;line-height:1.6;margin-bottom:22px}
  .tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .tpl{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;text-align:left;display:flex;flex-direction:column}
  .tpl:hover{border-color:var(--run)}
  .tpl .shot{height:210px;overflow:hidden;position:relative;background:#111;pointer-events:none}
  .tpl .shot iframe{width:160%;height:336px;border:0;transform:scale(.625);transform-origin:0 0;position:absolute;left:0;top:0}
  .tpl .shot.blank{display:grid;place-items:center;color:var(--dim);font-family:var(--mono);font-size:44px}
  .tpl .tx{padding:12px 14px 14px}
  .tpl .tx b{display:block;font-size:16px;margin-bottom:4px}
  .tpl .tx span{color:var(--muted);font-size:13.5px;line-height:1.45}
  .start .cont{margin-bottom:18px}

  /* окна */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
  .modal.on{display:flex}
  .modal .box{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
  @media (min-width:600px){ .modal{align-items:center} .modal .box{border-radius:16px} }
  .modal h3{font-size:17px;margin-bottom:10px}
  .modal .linkbox{width:100%;font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px;color:var(--text);word-break:break-all;max-height:120px;overflow:auto;margin:10px 0}
  .modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .modal .row .btn{flex:1}
  .warn{color:var(--gen);font-size:13px;line-height:1.5;margin-top:8px}

  .toast{position:fixed;left:50%;top:62px;transform:translate(-50%,-20px);opacity:0;z-index:70;background:#1b2128;border:1px solid var(--line2);
    padding:9px 16px;border-radius:20px;font-size:13.5px;transition:all .25s;pointer-events:none;max-width:92vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:560px){ .bar .title{visibility:hidden} }
  @media (max-width:420px){ .seg button{padding:6px 8px} .pri{padding:8px 10px} #undo{width:32px} }
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="../" title="Назад в FORGE">&lsaquo;</a>
  <input id="title" class="title" maxlength="80" aria-label="Название страницы">
  <button class="ib" id="undo" title="Отменить последнее действие" disabled>&#8630;</button>
  <div class="seg" role="tablist">
    <button data-mode="edit" class="on">Правка</button><button data-mode="view">Просмотр</button>
  </div>
  <button class="pri" id="shareBtn">Поделиться</button>
</header>

<section class="stage">
  <div class="devs">
    <button data-dev="phone" class="on">телефон</button><button data-dev="tab">планшет</button><button data-dev="pc">компьютер</button>
  </div>
  <div class="fw phone" id="fw"><iframe id="pv" title="Ваша страница" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe></div>
  <div class="hint" id="hint">Нажмите на любой блок страницы, чтобы его изменить</div>
</section>

<aside class="panel" id="panel">
  <div class="ph"><span class="grip"></span><b id="pTitle"></b>
    <button class="ib" id="pFull" title="Развернуть">&#8597;</button>
    <button class="ib" id="pClose" title="Свернуть">&times;</button></div>
  <div class="pb" id="pBody"></div>
</aside>

<nav class="tabs" id="tabs">
  <button data-tab="add" class="add"><i>+</i>Блок</button>
  <button data-tab="layers"><i>&#9776;</i>Блоки</button>
  <button data-tab="theme"><i>&#9680;</i>Тема</button>
  <button data-tab="code"><i>&lt;/&gt;</i>Код</button>
  <button data-tab="more"><i>&middot;&middot;&middot;</i>Ещё</button>
</nav>

<div class="start" id="start"><div class="in">
  <div class="top"><a href="../">&larr; FORGE</a><span>/</span><span>страницы</span></div>
  <h1>Соберите свою <b>страницу</b></h1>
  <p class="lead">Выберите заготовку и поменяйте в ней текст, фото и цвета. Готовую страницу можно отправить ссылкой или скачать одним файлом и выложить в интернет. Регистрация не нужна, всё хранится в вашем браузере.</p>
  <div class="cont" id="contWrap"></div>
  <div class="tpls" id="tpls"></div>
</div></div>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>

<script src="engine.js?v=1"></script>
<script>
(function(){
"use strict";
var $=function(s){ return document.querySelector(s); };
var STORE_KEY="forge_project_v2";
var wide=matchMedia("(min-width:960px)");

/* ─────────── состояние ─────────── */
var st=null, mode="edit", tab=null, lastY=0, goSel=false;

function snapshot(){ return JSON.stringify({ title:st.title, page:st.page, blocks:st.blocks, seq:st.seq }); }
function save(){
  try{ localStorage.setItem(STORE_KEY, snapshot()); }
  catch(e){ toast("Память браузера заполнена. Уберите часть загруженных фото или вставьте их ссылками."); }
}
function load(){
  try{ var d=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(d&&Array.isArray(d.blocks)) return d; }catch(e){}
  return null;
}
function setState(d){
  st={ title:d.title||"Моя страница", page:d.page||{}, blocks:d.blocks||[], seq:d.seq||0, sel:"" };
  st.blocks.forEach(function(b){ var n=+String(b.uid).slice(1); if(n>st.seq) st.seq=n; });
  fillDefaults(st);
  $("#title").value=st.title;
}

/* отмена: снимки до изменения, правки одного поля склеиваются */
var undoStack=[], undoKey="", undoT=0;
function remember(key){
  var now=Date.now();
  if(key && key===undoKey && now-undoT<900){ undoT=now; return; }
  undoStack.push(snapshot()); if(undoStack.length>50) undoStack.shift();
  undoKey=key||""; undoT=now; $("#undo").disabled=false;
}
$("#undo").onclick=function(){
  var s=undoStack.pop(); if(!s) return;
  var sel=st.sel; setState(JSON.parse(s)); if(blockBy(sel)) st.sel=sel;
  undoKey=""; $("#undo").disabled=!undoStack.length;
  refreshPanel(); render();
};

function blockBy(uid){ for(var i=0;i<st.blocks.length;i++) if(st.blocks[i].uid===uid) return st.blocks[i]; return null; }
function indexOf(uid){ for(var i=0;i<st.blocks.length;i++) if(st.blocks[i].uid===uid) return i; return -1; }

/* ─────────── превью ─────────── */
var pv=$("#pv"), rT=0;
function render(now){
  clearTimeout(rT);
  rT=setTimeout(function(){
    var doc=mode==="edit" ? buildPage(st,"edit",{ y:lastY, go:goSel }) : buildPage(st,"file");
    goSel=false;
    pv.srcdoc=doc;
    save();
  }, now?0:220);
}
addEventListener("message",function(e){
  if(e.source!==pv.contentWindow || !e.data || !e.data.forge) return;
  if(e.data.forge==="y") lastY=e.data.y|0;
  if(e.data.forge==="sel"){ hideHint(); st.sel=e.data.uid; openTab("block"); }
});
function markSel(scroll){ try{ pv.contentWindow.postMessage({ forge:"mark", uid:st.sel, scroll:!!scroll },"*"); }catch(e){} }

document.querySelectorAll(".seg button").forEach(function(b){
  b.onclick=function(){
    mode=b.getAttribute("data-mode");
    document.querySelectorAll(".seg button").forEach(function(x){ x.classList.toggle("on",x===b); });
    if(mode==="view"){ lastY=0; if(!wide.matches) closePanel(); }
    render(true);
  };
});
document.querySelectorAll(".devs button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll(".devs button").forEach(function(x){ x.classList.toggle("on",x===b); });
    $("#fw").className="fw "+b.getAttribute("data-dev");
  };
});
var hintOff=false;
function hideHint(){ if(hintOff) return; hintOff=true; $("#hint").classList.add("off"); }
setTimeout(hideHint, 9000);

/* ─────────── панель ─────────── */
var panel=$("#panel"), pBody=$("#pBody");
var TAB_TITLES={ add:"Добавить блок", layers:"Блоки страницы", theme:"Тема и фон", code:"Код страницы", more:"Ещё", block:"" };
function openTab(t){
  tab=t; if(!wide.matches) hideHint();
  document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-tab")===t || (t==="block" && b.getAttribute("data-tab")==="layers")); });
  panel.classList.add("open");
  refreshPanel();
  pBody.scrollTop=0;
  if(t==="block") setTimeout(function(){ markSel(true); }, 60);
  else markSel(false);
}
function closePanel(){
  if(wide.matches) return;
  tab=null; panel.classList.remove("open","full");
  document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.remove("on"); });
}
$("#pClose").onclick=closePanel;
$("#pFull").onclick=function(){ panel.classList.toggle("full"); };
document.querySelectorAll("#tabs button").forEach(function(b){
  b.onclick=function(){ var t=b.getAttribute("data-tab"); if(tab===t && !wide.matches) closePanel(); else openTab(t); };
});
wide.addEventListener("change",function(){ if(wide.matches && !tab) openTab("add"); });

function refreshPanel(){
  if(!tab) return;
  if(tab==="block" && !blockBy(st.sel)) tab="layers";
  $("#pTitle").textContent= tab==="block" ? RECIPES[blockBy(st.sel).rid].name : TAB_TITLES[tab];
  pBody.innerHTML="";
  ({ add:renderAdd, layers:renderLayers, theme:renderTheme, code:renderCode, more:renderMore, block:renderBlock })[tab]();
}

function addBlock(rid){
  remember();
  var uid="b"+(++st.seq), at=indexOf(st.sel);
  var blk={ uid:uid, rid:rid, cfg:defaults(blockOpts(rid)) };
  if(at<0) st.blocks.push(blk); else st.blocks.splice(at+1,0,blk);
  st.sel=uid; goSel=true; openTab("block"); render(true);
  toast("Блок «"+RECIPES[rid].name+"» добавлен");
}

/* список блоков */
function snippet(b){
  var c=b.cfg, t=c.title||c.text||c.name||c.brand||c.label||c.question||c.items||"";
  return String(t).split("\n")[0].replace(/<[^>]+>/g,"").slice(0,40);
}
function renderLayers(){
  if(!st.blocks.length){ pBody.innerHTML='<p class="note">На странице пока нет блоков. Нажмите <b>+ Блок</b> внизу, чтобы добавить первый.</p>'; return; }
  st.blocks.forEach(function(b,i){
    var r=RECIPES[b.rid], row=document.createElement("div"); row.className="lay"+(b.uid===st.sel?" on":"");
    row.innerHTML='<button class="nm"><i>'+r.glyph+'</i><span>'+esc(r.name)+'</span><small>'+esc(snippet(b))+'</small></button>'+
      '<button class="sb" data-a="up" title="Выше"'+(i?"":" disabled")+'>&uarr;</button>'+
      '<button class="sb" data-a="down" title="Ниже"'+(i<st.blocks.length-1?"":" disabled")+'>&darr;</button>'+
      '<button class="sb del" data-a="del" title="Удалить">&times;</button>';
    row.querySelector(".nm").onclick=function(){ st.sel=b.uid; openTab("block"); };
    row.querySelectorAll(".sb").forEach(function(x){ x.onclick=function(){ act(x.getAttribute("data-a"), b.uid); }; });
    pBody.appendChild(row);
  });
  pBody.insertAdjacentHTML("beforeend",'<p class="note" style="margin-top:12px">Стрелками можно менять порядок. Нажмите на название, чтобы открыть настройки.</p>');
}
function act(a, uid){
  var i=indexOf(uid); if(i<0) return;
  if(a==="up"||a==="down"){ var j=i+(a==="up"?-1:1); if(j<0||j>=st.blocks.length) return; remember();
    var t=st.blocks[i]; st.blocks[i]=st.blocks[j]; st.blocks[j]=t; st.sel=uid; goSel=true; }
  if(a==="dup"){ remember(); var b=st.blocks[i], nid="b"+(++st.seq);
    st.blocks.splice(i+1,0,{ uid:nid, rid:b.rid, cfg:JSON.parse(JSON.stringify(b.cfg)) }); st.sel=nid; goSel=true; toast("Копия добавлена ниже"); }
  if(a==="del"){ remember(); var name=RECIPES[st.blocks[i].rid].name; st.blocks.splice(i,1); if(st.sel===uid) st.sel=""; toast("Блок «"+name+"» удалён. Вернуть: стрелка отмены вверху"); }
  refreshPanel(); render(true);
}

/* поля настроек */
function fields(opts, cfg, scope){
  var box=document.createElement("div");
  opts.forEach(function(o){
    if(o.type==="presets"||o.type==="section") return;
    var v=cfg[o.id], f=document.createElement("div"); f.className="f"; f.setAttribute("data-id",o.id); f.setAttribute("data-scope",scope);
    var L='<label>'+esc(o.label)+'</label>';
    if(o.img){ f.appendChild(imgField(o,v,cfg,scope)); box.appendChild(f); return; }
    if(o.type==="text") f.innerHTML=L+'<input type="text" value="'+attr(v)+'">';
    else if(o.type==="textarea") f.innerHTML=L+'<textarea rows="4">'+esc(v)+'</textarea>';
    else if(o.type==="number") f.innerHTML=L+'<input type="number" inputmode="numeric" value="'+attr(v)+'">';
    else if(o.type==="date") f.innerHTML=L+'<input type="date" value="'+attr(v)+'">';
    else if(o.type==="time") f.innerHTML=L+'<input type="time" value="'+attr(v)+'">';
    else if(o.type==="range") f.innerHTML='<div class="lab"><span>'+esc(o.label)+'</span><output>'+v+(o.unit||"")+'</output></div><input type="range" min="'+o.min+'" max="'+o.max+'" step="'+(o.step||1)+'" value="'+v+'">';
    else if(o.type==="select") f.innerHTML=L+'<select>'+o.choices.map(function(c){ return '<option value="'+attr(c[0])+'"'+(c[0]===v?" selected":"")+'>'+esc(c[1])+'</option>'; }).join("")+'</select>';
    else if(o.type==="toggle") f.innerHTML='<label class="tgl"><span>'+esc(o.label)+'</span><input type="checkbox"'+(v?" checked":"")+'></label>';
    else if(o.type==="color") f.innerHTML=L+'<div class="crow"><input type="color" value="'+attr(v)+'"><span class="note">'+esc(v)+'</span></div>';
    else if(o.type==="tcolor"){
      var th=String(v).indexOf("var(")===0, show=th ? (st.page[o.token]||"#888888") : v;
      f.innerHTML=L+'<div class="crow"><input type="color" value="'+attr(show)+'"><button class="chip'+(th?" on":"")+'" data-theme>как в теме</button></div>';
    }
    box.appendChild(f);
  });
  return box;
}
function attr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function targetCfg(scope){ return scope==="page" ? st.page : (blockBy(st.sel)||{}).cfg; }
function optOf(scope,id){
  var list=scope==="page" ? PAGE.options : blockOpts(blockBy(st.sel).rid);
  for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i];
}
function setVal(scope,id,val,group){
  var cfg=targetCfg(scope); if(!cfg || cfg[id]===val) return;
  remember(group?scope+":"+id:""); cfg[id]=val; render();
}
pBody.addEventListener("input",function(e){
  var f=e.target.closest(".f"); if(!f || !f.hasAttribute("data-scope") || e.target.type==="file") return;
  var scope=f.getAttribute("data-scope"), id=f.getAttribute("data-id"), o=optOf(scope,id); if(!o || o.img) return;
  var el=e.target, v;
  if(o.type==="toggle") v=el.checked;
  else if(o.type==="range"||o.type==="number"){ v=Number(el.value); if(isNaN(v)) return; }
  else v=el.value;
  if(o.type==="range") f.querySelector("output").textContent=v+(o.unit||"");
  if(o.type==="color") f.querySelector(".note").textContent=v;
  if(o.type==="tcolor"){ var c=f.querySelector(".chip"); if(c) c.classList.remove("on"); }
  setVal(scope,id,v,true);
  if(scope==="page" && /^(bg|bg2|fg|accent|surface|font)$/.test(id)) document.querySelectorAll(".pre").forEach(function(p){ p.classList.remove("on"); });
});
pBody.addEventListener("click",function(e){
  var chip=e.target.closest("[data-theme]"); if(!chip) return;
  var f=chip.closest(".f"), scope=f.getAttribute("data-scope"), id=f.getAttribute("data-id"), o=optOf(scope,id);
  setVal(scope,id,o.def,false); chip.classList.add("on");
  f.querySelector("input[type=color]").value=st.page[o.token]||"#888888";
});

/* картинки: ссылка из интернета или фото с устройства (сжимается и хранится прямо в странице) */
function imgField(o,v,cfg,scope){
  var w=document.createElement("div"); w.className="imgf";
  var list=o.img===2 ? String(v||"").split("\n").map(function(s){return s.trim();}).filter(Boolean) : (v?[v]:[]);
  var thumbs=list.map(function(u,i){ return '<div class="th"><img src="'+attr(u)+'" alt=""><button data-rm="'+i+'" title="Убрать">&times;</button></div>'; }).join("");
  var local=list.filter(function(u){ return u.indexOf("data:")===0; }).length;
  w.innerHTML='<label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">'+esc(o.label.replace(/ ?\(.*\)$/,""))+'</label>'+
    (thumbs?'<div class="thumbs">'+thumbs+'</div>':'')+
    '<div class="row"><input type="text" placeholder="https://... ссылка на картинку" value="'+(o.img===1&&v&&v.indexOf("data:")!==0?attr(v):"")+'">'+
    (o.img===2?'<button class="btn" data-addurl>Добавить</button>':'')+'</div>'+
    '<div class="row" style="margin-top:8px"><button class="btn" data-up style="flex:1">'+(o.img===2?'Загрузить фото с устройства':'Загрузить с устройства')+'</button></div>'+
    (local?'<div class="sub">Фото с устройства сохраняются внутри страницы. В скачанном файле они будут, а в ссылку «Поделиться» не помещаются.</div>':'');
  var inp=w.querySelector("input");
  function setList(nl){ setVal(scope,o.id, o.img===2 ? nl.join("\n") : (nl[0]||""), false); refreshPanel(); }
  if(o.img===1) inp.addEventListener("change",function(){ setList(inp.value.trim()?[inp.value.trim()]:[]); });
  var add=w.querySelector("[data-addurl]");
  if(add) add.onclick=function(){ var u=inp.value.trim(); if(!u) return; setList(list.concat([u])); };
  w.querySelectorAll("[data-rm]").forEach(function(b){ b.onclick=function(){ var nl=list.slice(); nl.splice(+b.getAttribute("data-rm"),1); setList(nl); }; });
  w.querySelector("[data-up]").onclick=function(){
    var fi=$("#fileImg"); fi.multiple=o.img===2; fi.value="";
    fi.onchange=function(){
      var files=[].slice.call(fi.files||[]); if(!files.length) return;
      toast("Сжимаю фото...");
      Promise.all(files.map(function(f){ return shrink(f, o.id==="avatar"?360:1100); })).then(function(urls){
        urls=urls.filter(Boolean); if(!urls.length){ toast("Не получилось открыть это фото"); return; }
        setList(o.img===2 ? list.concat(urls) : [urls[0]]); toast("Фото добавлено");
      });
    };
    fi.click();
  };
  return w;
}
function shrink(file, max){
  return new Promise(function(res){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var k=Math.min(1, max/Math.max(im.width,im.height)), c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.82));
    };
    im.onerror=function(){ URL.revokeObjectURL(url); res(null); };
    im.src=url;
  });
}

function fileDoc(){ return buildPage(st,"file"); }
function copyCode(){ copyText(fileDoc(), "Код скопирован"); }
function fileName(){ return (st.title||"page").trim().toLowerCase().replace(/[^\wа-яё]+/gi,"-").replace(/^-+|-+$/g,"").slice(0,40)||"page"; }
function downloadHtml(){ dl(fileDoc(), fileName()+".html", "text/html"); toast("Файл скачан"); }
function dl(text,name,type){
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
}
function copyText(t,msg){
  var ok=function(){ toast(msg); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,fallback); else fallback();
  function fallback(){ var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ toast("Не получилось скопировать"); } ta.remove(); }
}

/* ─────────── поделиться ссылкой ─────────── */
function shareState(){
  var c=JSON.parse(snapshot()), cut=0;
  c.blocks.forEach(function(b){
    blockOpts(b.rid).forEach(function(o){
      if(!o.img) return; var v=String(b.cfg[o.id]||"");
      if(o.img===2){ var l=v.split("\n"), k=l.filter(function(u){ return u.trim().indexOf("data:")!==0; }); cut+=l.length-k.length; b.cfg[o.id]=k.join("\n"); }
      else if(v.indexOf("data:")===0){ b.cfg[o.id]=""; cut++; }
    });
  });
  return { st:c, cut:cut };
}
$("#shareBtn").onclick=function(){
  var s=shareState();
  encodeShare(s.st).then(function(code){
    var url=new URL("../p/", location.href).href+"#"+code;
    var long=url.length>6000;
    modal('<h3>Ссылка на вашу страницу</h3>'+
      '<p class="note">Вся страница записана прямо в ссылке, поэтому ничего не хранится на сервере. Отправьте ссылку кому угодно: страница откроется сразу, у получателя будет кнопка «сделать свою копию».</p>'+
      '<div class="linkbox" id="lnk"></div>'+
      (s.cut?'<p class="warn">Фото, загруженные с устройства ('+s.cut+' шт.), в ссылку не помещаются, вместо них будут заглушки. Чтобы фото были видны, вставьте их ссылками из интернета или скачайте HTML-файл.</p>':'')+
      (long?'<p class="warn">Ссылка получилась длинной ('+url.length+' символов). Некоторые мессенджеры такие обрезают. Если не откроется, скачайте HTML-файл.</p>':'')+
      '<div class="row"><button class="btn go" id="sCopy">Скопировать ссылку</button><a class="btn" id="sOpen" target="_blank" rel="noopener">Открыть</a></div>'+
      (navigator.share?'<div class="row"><button class="btn" id="sNative">Отправить через...</button></div>':'')+
      '<div class="row"><button class="btn" id="sDl">Скачать HTML-файл</button><button class="btn" data-close>Закрыть</button></div>');
    $("#lnk").textContent=url; $("#sOpen").href=url;
    $("#sCopy").onclick=function(){ copyText(url,"Ссылка скопирована"); };
    $("#sDl").onclick=downloadHtml;
    if($("#sNative")) $("#sNative").onclick=function(){ navigator.share({ title:st.title, url:url }).catch(function(){}); };
  }).catch(function(){ toast("Не получилось собрать ссылку"); });
};

/* ─────────── окна и подсказки ─────────── */
function modal(html){ $("#mbox").innerHTML=html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click",function(e){ if(e.target.id==="modal" || e.target.hasAttribute("data-close")) closeModal(); });
function ask(text, okLabel){
  return new Promise(function(res){
    modal('<h3>'+esc(text)+'</h3><div class="row"><button class="btn" data-no>Отмена</button><button class="btn go" data-yes>'+esc(okLabel)+'</button></div>');
    $("#mbox [data-no]").onclick=function(){ closeModal(); res(false); };
    $("#mbox [data-yes]").onclick=function(){ closeModal(); res(true); };
  });
}
var tT=0;
function toast(t){ var el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(tT); tT=setTimeout(function(){ el.classList.remove("on"); },2600); }
addEventListener("keydown",function(e){
  if(e.key==="Escape"){ if($("#modal").classList.contains("on")) closeModal(); else if($("#start").classList.contains("on") && st) hideStart(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); $("#undo").click(); }
});
$("#title").addEventListener("input",function(){ remember("title"); st.title=this.value; save(); });
$("#title").addEventListener("change",function(){ render(true); });

/* ─────────── стартовый экран с заготовками ─────────── */
var shotsDone=false;
function showStart(){
  var wrap=$("#contWrap");
  wrap.innerHTML= st && st.blocks.length ? '<button class="btn" id="cont">&larr; Вернуться к странице «'+esc(st.title)+'»</button>' : "";
  if($("#cont")) $("#cont").onclick=hideStart;
  $("#start").classList.add("on");
  if(shotsDone) return; shotsDone=true;
  var box=$("#tpls");
  TEMPLATES.forEach(function(t){
    var b=document.createElement("button"); b.className="tpl";
    b.innerHTML=(t.blocks.length?'<div class="shot"><iframe tabindex="-1" sandbox="allow-scripts" loading="lazy" aria-hidden="true"></iframe></div>':'<div class="shot blank">+</div>')+
      '<div class="tx"><b>'+esc(t.name)+'</b><span>'+esc(t.desc)+'</span></div>';
    var fr=b.querySelector("iframe"); if(fr) fr.srcdoc=buildPage(fromTemplate(t.id),"file",{ still:true });
    b.onclick=function(){ pick(t.id); };
    box.appendChild(b);
  });
}
function hideStart(){ $("#start").classList.remove("on"); }
function pick(tid){
  var go=function(){ if(st) remember(); setState(fromTemplate(tid)); st.sel=""; lastY=0; hideStart(); render(true);
    if(wide.matches) openTab(tid==="blank"?"add":"layers"); else if(tid==="blank") openTab("add"); else closePanel();
    if(tid!=="blank"){ hintOff=false; $("#hint").classList.remove("off"); setTimeout(hideHint,9000); } };
  if(st && st.blocks.length && $("#cont")) ask("Начать новую страницу? Текущая заменится, но её можно вернуть стрелкой отмены.","Начать").then(function(y){ if(y) go(); });
  else go();
}

/* ─────────── запуск ─────────── */
function boot(){
  var m=location.hash.match(/^#p=([\w-]+)$/);
  var saved=load();
  if(m){
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    decodeShare(m[1]).then(function(d){
      if(saved && saved.blocks.length){ setState(saved); undoStack.push(snapshot()); $("#undo").disabled=false; }
      setState({ title:d.title, page:d.page, blocks:d.blocks, seq:d.seq });
      render(true); if(wide.matches) openTab("layers");
      toast(saved&&saved.blocks.length ? "Открыта копия страницы. Ваша прежняя страница: стрелка отмены" : "Это ваша копия страницы, меняйте как хотите");
    }).catch(function(){ start(saved); toast("Ссылка повреждена, страницу открыть не получилось"); });
    return;
  }
  start(saved);
}
function start(saved){
  if(saved){ setState(saved); render(true); if(wide.matches) openTab("add"); }
  else showStart();
}
boot();
})();
</script>
