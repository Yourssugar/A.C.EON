<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<title>FORGE · A.C.EON</title>


<link rel="stylesheet" href="https://fonts.bunny.net/css?family=manrope:400,600,700,800|unbounded:500,700&display=swap">
<script src="../universe.js"></script>
<style>
  :root{
    --bg:#0b0907; --text:#efe7dc; --muted:#a99c8d; --dim:#6f655a; --line:rgba(239,231,220,.14);
    --run:#4fd6c8; --ember:#ff8a3c; --hot:#ffb347;
    --ui:Manrope,system-ui,sans-serif; --head:Unbounded,Manrope,system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-text-size-adjust:100%}
  button,a{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}

  /* сцена: задний холст, проект на плите, передний холст */
  #scene{position:fixed;inset:0;overflow:hidden}
  #scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #proj{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;opacity:0;pointer-events:none;background:#111;border-radius:6px}
  #proj iframe{border:0;display:block;pointer-events:none;background:#fff}
  #proj canvas{position:static;display:block;margin:auto}
  #shade{position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(8,6,5,.86) 0%,rgba(8,6,5,.55) 30%,rgba(8,6,5,0) 52%),
               linear-gradient(0deg,rgba(8,6,5,.7) 0%,rgba(8,6,5,0) 22%)}

  /* верхняя строка */
  .top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 0;z-index:5}
  .top .sp{flex:1}
  #back{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
  #back:hover{color:var(--run)}
  #langs{display:flex;gap:4px;flex-wrap:wrap}
  #langs button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:rgba(8,6,5,.35)}
  #langs button:hover{color:var(--text)}
  #langs button.sel{color:var(--run);border-color:var(--run)}

  /* заголовок */
  .hero{position:fixed;left:clamp(18px,6vw,96px);top:50%;transform:translateY(-55%);max-width:min(470px,42vw);z-index:4}
  .kick{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--run);margin-bottom:14px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(46px,7.4vw,104px);line-height:.92;letter-spacing:.01em;
     background:linear-gradient(180deg,#fff3df 0%,#ffbf73 55%,#ff7a2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 0 22px rgba(255,120,40,.28))}
  h1 small{display:block;font-family:var(--mono);font-weight:400;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:12px;filter:none}
  .tag{margin:20px 0 26px;font-size:16.5px;line-height:1.55;color:#d8cdbf;max-width:420px}
  #start{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:800;font-size:16px;color:#1b0d03;
    background:linear-gradient(180deg,#ffc46b,#ff8a3c);box-shadow:0 8px 30px rgba(255,120,40,.35),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .2s,box-shadow .2s}
  #start:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,120,40,.5),inset 0 1px 0 rgba(255,255,255,.45)}
  #start svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #still{margin-top:16px;font-size:12.5px;color:var(--dim)}

  /* подпись проекта на витрине */
  #cap{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,10px);display:flex;align-items:center;gap:16px;
    padding:10px 10px 10px 20px;border-radius:999px;background:rgba(14,11,9,.72);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;z-index:4;max-width:calc(100vw - 24px)}
  #cap.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #cap .t{display:flex;flex-direction:column;min-width:0}
  #cap small{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--run)}
  #cap b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cap b i{font-style:normal;font-weight:600;color:var(--muted);font-size:13px;margin-left:8px}
  #same{white-space:nowrap;text-decoration:none;font-weight:800;font-size:14px;color:#062520;background:var(--run);border-radius:999px;padding:10px 18px}
  #same:hover{filter:brightness(1.1)}

  #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);transition:opacity .6s;z-index:3}

  /* меню инструментов */
  #menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(6,5,4,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .35s}
  #menu.on{opacity:1;pointer-events:auto}
  .mp{width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:linear-gradient(180deg,#191410,#110e0b);border:1px solid var(--line);border-radius:26px;
    padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateY(16px) scale(.98);transition:transform .35s}
  #menu.on .mp{transform:none}
  .mh{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .mh h2{font-family:var(--head);font-size:22px;font-weight:700;flex:1}
  #mClose{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:18px}
  #mClose:hover{color:var(--text)}
  #cont{display:flex;align-items:center;gap:12px;text-decoration:none;border:1px solid rgba(79,214,200,.35);background:rgba(79,214,200,.07);border-radius:16px;padding:12px 16px;margin-bottom:14px}
  #cont[hidden]{display:none}
  #cont small{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--run)}
  #cont b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cont span{color:var(--muted);font-size:13px}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tools>:last-child:nth-child(odd){grid-column:1/-1}
  .tool{position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;border:1px solid var(--line);border-radius:18px;padding:16px 16px 16px 104px;min-height:112px;
    background:rgba(255,255,255,.025);transition:border-color .2s,background .2s,transform .2s;overflow:hidden}
  .tool img{position:absolute;left:10px;top:50%;width:84px;transform:translateY(-50%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
  .tool b{font-size:17px;font-weight:800}
  .tool p{font-size:13.5px;line-height:1.45;color:var(--muted)}
  .tool em{position:absolute;right:14px;top:14px;font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--hot)}
  a.tool:hover{border-color:rgba(255,160,80,.55);background:rgba(255,140,60,.07);transform:translateY(-2px)}
  .tool.off{opacity:.55;cursor:default}
  .tool.off em{color:var(--dim)}
  .learn{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
  .learn small{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .learn p{flex:1 1 220px;font-size:12.5px;color:var(--dim)}
  .learn a{font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .learn a:hover{color:var(--run);border-color:var(--run)}

  /* телефон: текст сверху, кнопка снизу, меню шторкой */
  @media (max-aspect-ratio:1/1){
    #shade{background:linear-gradient(180deg,rgba(8,6,5,.95) 0%,rgba(8,6,5,.75) 26%,rgba(8,6,5,0) 42%),linear-gradient(0deg,rgba(8,6,5,.92) 0%,rgba(8,6,5,0) 30%)}
    .kick{display:none}
    .hero{top:calc(max(16px,env(safe-area-inset-top)) + 46px);transform:none;max-width:none;right:18px}
    h1{font-size:clamp(40px,13vw,64px)}
    .tag{font-size:14.5px;margin:12px 0 0}
    #start{position:fixed;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));justify-content:center}
    #cap{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 66px);padding:8px 8px 8px 16px;gap:10px}
    #cap b{font-size:14.5px}
    #same{padding:9px 14px;font-size:13px}
    #menu{place-items:end center;padding:0}
    .mp{border-radius:24px 24px 0 0;max-height:88vh;padding:22px 16px max(20px,env(safe-area-inset-bottom));transform:translateY(40px)}
    .tools{grid-template-columns:1fr}
    .tool{min-height:96px;padding-left:96px}
    .tool img{width:76px}
  }
</style>
</head>
<body>
<div id="scene">
  <canvas id="cv"></canvas>
  <div id="proj"></div>
  <canvas id="fg"></canvas>
</div>
<div id="shade"></div>
<div id="loading"></div>

<div class="top">
  <button id="back" type="button">&lt; A.C.EON</button>
  <span class="sp"></span>
  <div id="langs"></div>
</div>

<section class="hero">
  <div class="kick" id="tKick">A.C.EON // FORGE</div>
  <h1>FORGE<small id="tSub">кузня</small></h1>
  <p class="tag" id="tTag"></p>
  <button id="start" type="button"><span id="tStart">Приступить к работе</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <p id="still" hidden></p>
</section>

<div id="cap"><div class="t"><small id="tNow">На витрине</small><b id="capName"></b></div><a id="same" href="#">Сделать такую же</a></div>

<div id="menu" aria-hidden="true">
  <div class="mp" role="dialog" aria-labelledby="tMenu">
    <div class="mh"><h2 id="tMenu">Что будем делать?</h2><button id="mClose" type="button" aria-label="close">&#10005;</button></div>
    <a id="cont" hidden href="#"><small id="tCont">Продолжить</small><b id="contName"></b><span id="contKind"></span></a>
    <div class="tools">
      <a class="tool" href="HTML-CSS-JS/"><img src="film/s/piece-ingot-white.webp" alt=""><em id="tO1">открыть</em><b id="tPages">Страницы</b><p id="tPagesD"></p></a>
      <a class="tool" href="grafika/"><img src="film/s/piece-ingot-hot.webp" alt=""><em id="tO2">открыть</em><b id="tGfx">Графика</b><p id="tGfxD"></p></a>
      <a class="tool" href="fony/"><img src="film/s/piece-ingot-hot.webp" alt="" style="filter:hue-rotate(-25deg) saturate(1.2) drop-shadow(0 4px 10px rgba(0,0,0,.5))"><em id="tO3">открыть</em><b id="tFony">Фоны</b><p id="tFonyD"></p></a>
      <a class="tool" href="koleso/"><img src="film/s/piece-ingot-white.webp" alt="" style="filter:hue-rotate(160deg) saturate(.9) drop-shadow(0 4px 10px rgba(0,0,0,.5))"><em id="tO4">открыть</em><b id="tKoleso">Колесо и жребий</b><p id="tKolesoD"></p></a>
      <a class="tool" href="zvuk/"><img src="film/s/piece-ingot-hot.webp" alt="" style="filter:hue-rotate(140deg) saturate(1.1) drop-shadow(0 4px 10px rgba(0,0,0,.5))"><em id="tO5">открыть</em><b id="tZvuk">Звук</b><p id="tZvukD"></p></a>
      <a class="tool" href="bit/"><img src="film/s/piece-ingot-white.webp" alt="" style="filter:hue-rotate(250deg) saturate(1.4) drop-shadow(0 4px 10px rgba(0,0,0,.5))"><em id="tO6">открыть</em><b id="tBit">Биты</b><p id="tBitD"></p></a>
      <a class="tool" href="otkrytka/"><img src="film/s/piece-ingot-hot.webp" alt="" style="filter:hue-rotate(310deg) saturate(1.3) drop-shadow(0 4px 10px rgba(0,0,0,.5))"><em id="tO7">открыть</em><b id="tOtk">Открытки</b><p id="tOtkD"></p></a>
      <a class="tool" href="igry/"><img src="film/s/piece-ingot-hot.webp" alt="" style="filter:hue-rotate(60deg) saturate(1.2) drop-shadow(0 4px 10px rgba(0,0,0,.5))"><em id="tO8">открыть</em><b id="tGames">Игры</b><p id="tGamesD"></p></a>
      <a class="tool" href="montazh/"><img src="film/s/piece-ingot-white.webp" alt="" style="filter:hue-rotate(20deg) saturate(1.3) drop-shadow(0 4px 10px rgba(0,0,0,.5))"><em id="tO9">открыть</em><b id="tMont">Монтаж</b><p id="tMontD"></p></a>
    </div>
    <div class="learn"><small id="tLearn">Учу код</small><p id="tLearnD"></p><a href="Python/">Python</a><a href="SQL/">SQL</a></div>
  </div>
</div>

<script src="../games/shared/store.js?v=1"></script>
<script src="../games/shared/i18n.js?v=1"></script>
<script src="../shared/trace.js?v=1"></script>
<script src="lang.js?v=9"></script>
<script src="forge.js?v=11"></script>
</body>
</html>
