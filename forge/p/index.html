<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Страница из FORGE</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0c0e12}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#dfe5ea}
  #view{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
  .msg{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  .msg b{display:block;font-size:20px;margin-bottom:8px}
  .msg p{color:#8994a0;line-height:1.6;max-width:44ch;margin:0 auto 18px}
  .msg a{color:#4fd6c8}
  .badge{position:fixed;right:12px;bottom:12px;z-index:5;display:none;align-items:center;gap:8px;background:rgba(12,14,18,.9);
    border:1px solid #313b46;border-radius:20px;padding:6px 6px 6px 12px;font-size:12.5px;backdrop-filter:blur(6px)}
  .badge span{color:#8994a0;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
  .badge a{color:#05201c;background:#4fd6c8;text-decoration:none;font-weight:700;border-radius:14px;padding:5px 10px}
  .badge button{background:none;border:0;color:#8994a0;font-size:16px;cursor:pointer;padding:0 6px}
</style>
</head>
<body>
<!-- страница из ссылки показывается в изолированной рамке: её скрипты не видят этот сайт и его данные -->
<iframe id="view" title="Страница" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
<div class="msg" id="msg"><div><b>Открываю страницу...</b></div></div>
<div class="badge" id="badge"><span>FORGE</span><a id="copy" href="../HTML-CSS-JS/">Сделать свою копию</a><button id="hide" title="Скрыть">&times;</button></div>
<script src="../i18n-forge.js?v=5"></script>
<script src="../HTML-CSS-JS/engine.js?v=3"></script>
<script>
(function(){
  var code=location.hash.slice(1), msg=document.getElementById("msg");
  function say(t,p){ msg.innerHTML='<div><b>'+t+'</b><p>'+p+'</p><a href="../HTML-CSS-JS/">Собрать свою страницу в FORGE</a></div>'; }
  if(!/^[JZjz][\w-]+$/.test(code)){ say("Здесь открываются страницы из FORGE","Соберите страницу в конструкторе и нажмите «Поделиться»: получится ссылка, которая ведёт сюда."); return; }
  decodeShare(code).then(function(st){
    var v=document.getElementById("view"); v.srcdoc=buildPage(st,"file"); v.style.display="block"; msg.style.display="none";
    if(st.title){ document.title=st.title; document.querySelector("title").setAttribute("data-nt",""); }
    document.getElementById("copy").href="../HTML-CSS-JS/#p="+code;
    var b=document.getElementById("badge"); b.style.display="flex"; document.getElementById("hide").onclick=function(){ b.style.display="none"; };
  }).catch(function(e){
    if(e&&e.message==="old") say("Ссылка от прошлой версии конструктора","Эту страницу собрали в старой версии FORGE, она больше не открывается. Попросите прислать HTML-файл.");
    else say("Страница не открылась","Похоже, ссылка обрезана или скопирована не полностью. Попросите отправить её ещё раз или прислать HTML-файл.");
  });
})();
</script>
</body>
</html>
