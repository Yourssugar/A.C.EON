<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>A.C.EON CHECKERS</title>

<!-- Загрузчик: качает файлы из списка ниже с прогрессом и дописывает к ним ?v=.
     data-v МЕНЯТЬ ПРИ КАЖДОЙ ВЫКЛАДКЕ (и при изменениях в games/shared). -->
<script src="../shared/boot.js" data-v="2" defer></script>
<script type="application/json" id="boot-manifest">
{"files":[
  {"src":"../shared/arcade.css","kb":7},
  {"src":"css/checkers.css","kb":20},
  {"src":"../shared/store.js","kb":3},
  {"src":"../shared/i18n.js","kb":3},
  {"src":"../shared/sound.js","kb":9},
  {"src":"../shared/arcade.js","kb":5},
  {"src":"../shared/achievements.js","kb":30},
  {"src":"js/lang.js","kb":24},
  {"src":"js/rules.js","kb":7},
  {"src":"js/ai.js","kb":4},
  {"src":"js/checkers.js","kb":20}
]}
</script>

<!-- Обложка загрузки: шашки по мере загрузки встают на доску (--p от загрузчика) -->
<template id="boot-skin">
  <style>
    .ck-b{position:relative;width:120px;height:120px;border:4px solid #8a5a2b;box-shadow:0 0 18px rgba(255,210,58,.35);
      background:conic-gradient(#3a2414 25%,#e8c99a 0 50%,#3a2414 0 75%,#e8c99a 0) 0 0/30px 30px;}
    .ck-b i{position:absolute;width:22px;height:22px;border-radius:50%;opacity:calc(var(--p) * 1.4 - .2);
      background:radial-gradient(circle at 35% 30%,#fff 0 15%,#e8e0cc 40%,#9a8a6a);box-shadow:0 2px 4px rgba(0,0,0,.6);}
    .ck-b i.k{background:radial-gradient(circle at 35% 30%,#888 0 12%,#2a2a2a 45%,#000);opacity:calc(var(--p) * 2 - 1);}
    .ck-t{font-size:clamp(14px,4vw,22px);letter-spacing:.3em;color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.8);padding-left:.3em;}
    .ck-br{font-size:9px;letter-spacing:.5em;color:#ff2d78;text-shadow:0 0 10px #ff2d78;padding-left:.5em;margin-bottom:-14px;}
  </style>
  <div class="ck-br">A.C.EON</div>
  <div class="ck-t">CHECKERS</div>
  <div class="ck-b"><i style="left:34px;top:4px" class="k"></i><i style="left:94px;top:4px" class="k"></i><i style="left:4px;top:94px"></i><i style="left:64px;top:94px"></i></div>
</template>
</head>
<body class="screen-menu">

<!-- ════════ МЕНЮ ════════ -->
<main class="m-menu" id="menu">
  <div class="m-head">
    <h1 class="m-title"><span class="m-brand">A.C.EON</span><span data-i18n="c.title"></span></h1>
    <div class="m-sub" data-i18n="menu.sub"></div>
  </div>

  <div class="m-cols">
    <section class="m-card">
      <h2 class="m-h" data-i18n="menu.mode"></h2>
      <div class="mode-list" id="mode-list"></div>
      <div class="opt-row"><span class="opt-lbl" data-i18n="opt.rules"></span>
        <div class="seg" id="seg-rules">
          <button class="seg-btn" data-v="russian" data-i18n="rules.russian"></button>
          <button class="seg-btn" data-v="english" data-i18n="rules.english"></button>
          <button class="seg-btn" data-v="giveaway" data-i18n="rules.giveaway"></button>
        </div></div>
      <div class="opt-note" id="rules-note"></div>
      <div class="adv-box" id="bot-box">
        <h2 class="m-h m-h2" data-i18n="menu.opp"></h2>
        <div class="ops" id="levels"></div>
        <div class="opt-note" id="lv-note"></div>
        <div class="opt-row"><span class="opt-lbl" data-i18n="opt.side"></span>
          <div class="seg" id="seg-side">
            <button class="seg-btn" data-v="white" data-i18n="side.white"></button>
            <button class="seg-btn" data-v="black" data-i18n="side.black"></button>
            <button class="seg-btn" data-v="random" data-i18n="side.random"></button>
          </div></div>
      </div>
      <div class="adv-box hidden" id="duo-box">
        <div class="opt-row"><span class="opt-lbl" data-i18n="opt.flip"></span>
          <div class="seg" id="seg-flip">
            <button class="seg-btn" data-v="on" data-i18n="opt.on"></button>
            <button class="seg-btn" data-v="off" data-i18n="opt.off"></button>
          </div></div>
        <div class="opt-note" data-i18n="note.flip"></div>
      </div>
    </section>

    <section class="m-card">
      <h2 class="m-h" data-i18n="menu.opts"></h2>
      <div class="opt-row"><span class="opt-lbl" data-i18n="opt.theme"></span>
        <div class="seg" id="seg-theme">
          <button class="seg-btn" data-v="wood" data-i18n="theme.wood"></button>
          <button class="seg-btn" data-v="neon" data-i18n="theme.neon"></button>
          <button class="seg-btn" data-v="flat" data-i18n="theme.flat"></button>
        </div></div>
      <div class="opt-row"><span class="opt-lbl" data-i18n="opt.hints"></span>
        <div class="seg" id="seg-hints">
          <button class="seg-btn" data-v="on" data-i18n="opt.on"></button>
          <button class="seg-btn" data-v="off" data-i18n="opt.off"></button>
        </div></div>
      <div class="opt-note" data-i18n="note.hints"></div>
      <h2 class="m-h m-h2" data-i18n="menu.ctrl"></h2>
      <div class="opt-note" data-i18n="note.ctrl"></div>
      <h2 class="m-h m-h2" id="stats-h"></h2>
      <div class="stats" id="stats"></div>
    </section>
  </div>

  <div class="m-actions">
    <button class="btn m-cont hidden" id="btn-cont">&#9654; <span data-i18n="menu.cont"></span><small id="cont-info"></small></button>
    <button class="btn m-play" id="btn-play">&#9654; <span data-i18n="menu.play"></span></button>
  </div>
</main>

<!-- ════════ ИГРА ════════ -->
<main class="t-game" id="game">
  <div class="hud">
    <div class="hud-mode" id="hud-mode"></div>
    <div class="hud-btns">
      <button class="btn" id="btn-undo">&#8630; <span data-i18n="hud.undo"></span></button>
      <button class="btn" id="btn-hint">? <span data-i18n="hud.hint"></span></button>
      <button class="btn" id="btn-new" data-i18n="hud.new"></button>
      <button class="btn" id="btn-menu">&#9664; <span data-i18n="hud.menu"></span></button>
    </div>
  </div>
  <div class="arena" id="arena">
    <div class="board" id="board"></div>
    <aside class="side">
      <div class="opp hidden" id="opp"><div class="opp-pic" id="opp-pic"></div><div><b id="opp-name"></b><span id="opp-side"></span></div></div>
      <div class="status-row"><i class="turn-dot" id="turn-dot"></i><span class="status" id="status"></span></div>
      <div class="counts"><span><i class="turn-dot w"></i><b id="cnt-w">12</b></span><span><i class="turn-dot b"></i><b id="cnt-b">12</b></span></div>
      <div class="log" id="log"></div>
    </aside>
  </div>
</main>

<div class="arc-modal hidden over-modal" id="over-modal">
  <div class="arc-box over-box">
    <div class="over-title" id="over-title"></div>
    <div class="opt-note why" id="over-why"></div>
    <div class="over-rows" id="over-rows"></div>
    <div class="over-btns">
      <button class="btn" id="over-retry">&#9654; <span data-i18n="over.retry"></span></button>
      <button class="btn" id="over-undo" data-i18n="over.undo"></button>
      <button class="btn" id="over-menu" data-i18n="over.menu"></button>
    </div>
  </div>
</div>

</body>
</html>
