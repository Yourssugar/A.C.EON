<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A.C.EON CHESS</title>
<link rel="stylesheet" href="../shared/arcade.css">
<link rel="stylesheet" href="chess.css">
</head>
<body class="screen-menu">

<!-- градиенты для фигур (pieces.js) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="pc-grad-w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--pw-a)"/><stop offset="1" style="stop-color:var(--pw-b)"/></linearGradient>
  <linearGradient id="pc-grad-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--pb-a)"/><stop offset="1" style="stop-color:var(--pb-b)"/></linearGradient>
</defs></svg>

<!-- ════════ МЕНЮ ════════ -->
<main class="menu" id="menu">
  <div class="menu-bg" aria-hidden="true"></div>

  <div class="menu-head">
    <h1 class="menu-title"><span class="menu-brand">A.C.EON</span><span data-i18n="ch.title">CHESS</span></h1>
    <div class="menu-sub" data-i18n="menu.sub"></div>
  </div>

  <div class="menu-cols">
    <!-- соперник -->
    <section class="menu-card">
      <h2 class="menu-h" data-i18n="menu.opponent"></h2>
      <div class="lvl-list" id="lvl-list"></div>
    </section>

    <!-- настройки и превью -->
    <section class="menu-card">
      <h2 class="menu-h" data-i18n="menu.setup"></h2>

      <div class="preview" id="preview" aria-hidden="true">
        <div class="preview-stage"><div class="preview-board" id="preview-board"></div></div>
        <div class="preview-tags"><span id="tag-view">2D</span><span id="tag-theme"></span></div>
      </div>

      <div class="opt-row">
        <span class="opt-lbl" data-i18n="menu.view"></span>
        <div class="seg" id="seg-view">
          <button class="seg-btn" data-v="2d">2D</button>
          <button class="seg-btn soon" data-v="3d" aria-disabled="true">3D <small data-i18n="menu.soon"></small></button>
        </div>
      </div>
      <div class="opt-row">
        <span class="opt-lbl" data-i18n="menu.board"></span>
        <div class="seg" id="seg-theme">
          <button class="seg-btn" data-v="wood"><i class="sw sw-wood"></i><span data-i18n="theme.wood"></span></button>
          <button class="seg-btn" data-v="neon"><i class="sw sw-neon"></i><span data-i18n="theme.neon"></span></button>
        </div>
      </div>
      <div class="opt-row">
        <span class="opt-lbl" data-i18n="menu.side"></span>
        <div class="seg" id="seg-side">
          <button class="seg-btn" data-v="w"><i class="side-ico" id="ico-w"></i><span data-i18n="side.w"></span></button>
          <button class="seg-btn" data-v="r"><i class="side-ico side-r">?</i><span data-i18n="side.r"></span></button>
          <button class="seg-btn" data-v="b"><i class="side-ico" id="ico-b"></i><span data-i18n="side.b"></span></button>
        </div>
      </div>
    </section>
  </div>

  <div class="menu-actions">
    <button class="btn menu-play" id="btn-play">&#9654; <span data-i18n="menu.play"></span></button>
    <button class="btn menu-cont hidden" id="btn-continue" data-i18n="menu.continue"></button>
  </div>
</main>

<!-- ════════ ПАРТИЯ ════════ -->
<main class="ch-layout" id="game">

  <aside class="ch-left">
    <section class="panel game-panel">
      <div class="panel-title" data-i18n="game.panel"></div>
      <div class="panel-body">
        <div class="game-lvl"><span id="game-lvl-name"></span><span class="bars" id="game-lvl-bars"></span></div>
        <div class="side-info" id="ch-side"></div>
        <div class="btn-row">
          <button class="btn" id="ch-new" data-i18n="game.new"></button>
          <button class="btn" id="ch-resign" data-i18n="game.resign"></button>
        </div>
        <button class="btn" id="ch-menu">&#9664; <span data-i18n="game.menu"></span></button>
      </div>
    </section>

    <section class="panel" id="ch-movelog">
      <div class="panel-title" data-i18n="log.title"></div>
      <div class="mlog-head"><span></span><span data-i18n="log.white"></span><span data-i18n="log.black"></span></div>
      <div class="mlog-body" id="ch-movelog-body"></div>
    </section>
  </aside>

  <section class="ch-center">
    <div id="ch-msg"></div>
    <div class="board-wrap"><div id="ch-board"></div></div>
  </section>

  <aside class="ch-right">
    <div id="aceon-bot" aria-hidden="true">
      <div class="bot-stage">
        <span class="bot-particle p1"></span><span class="bot-particle p2"></span>
        <span class="bot-particle p3"></span><span class="bot-particle p4"></span>
        <div class="bot-core">
          <div class="bot-ring"></div>
          <div class="bot-antenna"><span class="bot-antenna-dot"></span></div>
          <div class="bot-face">
            <div class="bot-eyes"><span class="bot-eye"></span><span class="bot-eye"></span></div>
            <div class="bot-mouth"><span></span><span></span><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
      <div class="bot-name">A.C.EON</div>
      <div class="bot-sub" id="aceon-bot-sub"></div>
      <div class="bot-status" id="aceon-bot-status"></div>
    </div>

    <section class="panel captured">
      <div class="panel-title" data-i18n="cap.title"></div>
      <div class="cap-lbl" data-i18n="cap.you"></div>
      <div class="cap-row" id="cap-human"></div>
      <div class="cap-lbl" data-i18n="cap.ai"></div>
      <div class="cap-row" id="cap-ai"></div>
    </section>
  </aside>
</main>

<!-- превращение пешки -->
<div class="arc-modal hidden" id="promo-modal">
  <div class="arc-box" style="max-width:420px;">
    <div class="panel-title" style="border:0;margin-bottom:14px;" data-i18n="promo.title"></div>
    <div id="ch-promo-row"></div>
  </div>
</div>

<!-- итоги партии -->
<div class="arc-modal hidden" id="report-modal">
  <div class="arc-box ch-report-box">
    <div id="ch-report-title" class="ch-report-title draw"></div>
    <div id="ch-report-sub" class="ch-report-sub"></div>
    <div id="ch-report-stats" class="ch-report-stats"></div>
    <div class="ch-report-btns">
      <button class="btn" id="rep-new">&#9654; <span data-i18n="game.new"></span></button>
      <button class="btn" id="rep-menu" data-i18n="game.menu"></button>
      <button class="btn" id="rep-close" data-i18n="rep.close"></button>
    </div>
  </div>
</div>

<script src="../shared/i18n.js"></script>
<script src="../shared/arcade.js"></script>
<script src="lang.js"></script>
<script src="pieces.js"></script>
<script src="rules.js"></script>
<script src="engine.js"></script>
<script src="chess.js"></script>
</body>
</html>
