<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A.C.EON CLASSIC</title>
<style>

/* ═══════════ ROOT THEME (GREEN – EYE-FRIENDLY) ═══════════ */
:root {
  --bg:#050510;  --bg2:#08081a;  --bg3:#0d0d22;  --bg4:#12122c;
  --pri:#00e5ff; --pri-b:#80f0ff; --pri-m:#00ccee; --pri-d:#007799;
  --txt:#b0e0ff; --txt-d:#00e5ff; --bdr:#003355;  --bdr-d:#001a33;
  --sel:#001833; --err:#ff3344;  --dim:#020208;
}

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:Tahoma,Arial,sans-serif;font-size:12px;
     color:var(--pri);min-height:100dvh;display:flex;align-items:center;
     justify-content:center;overflow-x:hidden;}
/* launcher height handled in arcade section */
.hidden{display:none!important;}
canvas{display:block;}

/* CRT OVERLAY */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.09) 2px,rgba(0,0,0,.09) 4px);}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9001;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.65) 100%);}

/* ── ARCADE LAUNCHER — fits 100dvh, no scroll ── */
#launcher,#launcher-2{
  height:100dvh;
  width:100%;
  max-width:min(95vw,960px);
  margin:0 auto;
  text-align:center;
  padding:clamp(6px,1.5vh,14px) clamp(8px,2vw,14px);
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  gap:clamp(4px,1vh,10px);
  overflow:hidden;
}
/* header strip — fixed height, won't grow */
.l-head{flex-shrink:0;}
.arc-marquee{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(11px,2.8vw,22px);
  color:#ff2d78;
  text-shadow:0 0 12px #ff2d78,0 0 28px rgba(255,45,120,.5);
  letter-spacing:3px;
  margin-bottom:2px;
  animation:arcGlow 2.4s ease-in-out infinite;
}
.arc-sub{
  font-size:clamp(6px,1vw,9px);
  letter-spacing:4px;color:var(--pri-d);
  margin-bottom:3px;
  font-family:'Press Start 2P',monospace;
}
.arc-coin{
  font-size:clamp(6px,1vw,8px);
  letter-spacing:2px;color:#ffe600;
  margin-bottom:0;
  animation:blink .9s step-end infinite;
  font-family:'Press Start 2P',monospace;
}
.arc-coin span{color:#fff;}

/* GAME GRID — 3 col × 5 row, fills remaining height */
.game-grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:clamp(3px,.8vw,8px);
  width:100%;
  max-width:min(95vw,960px);
}

/* ICON CELLS — fill their grid cell completely */
.game-icon{
  border:2px solid var(--bdr-d);
  background:var(--bg2);
  cursor:pointer;text-align:center;
  opacity:0;transform:scale(.85);
  transition:background .12s,border-color .18s,box-shadow .18s;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:0;min-width:0;
  padding:0;
}
.game-icon.appeared{
  opacity:1;transform:none;
  transition:background .12s,border-color .18s,box-shadow .18s,
             opacity .22s,transform .3s cubic-bezier(.34,1.52,.64,1);
}
.game-icon:hover{
  background:var(--sel);border-color:#00e5ff;
  box-shadow:0 0 0 1px #00e5ff,0 0 18px rgba(0,229,255,.55),inset 0 0 14px rgba(0,229,255,.07);
}
.game-icon.appeared:hover{transform:scale(1.05);}
.game-icon.page-btn{border-color:#ff2d78;}
.game-icon.page-btn:hover{border-color:#ff2d78;box-shadow:0 0 0 1px #ff2d78,0 0 18px rgba(255,45,120,.55);}

/* EMOJI — size = ~40% of the smaller side of its cell:
   cell width  ≈ viewport_width / 3
   cell height ≈ (viewport_height - header) / 5
   so min(11vw, 14vh) lands at ~40-45% of each           */
.ico-pixel{
  display:block;
  font-size:clamp(16px,min(10vw,13vh),68px);
  line-height:1;
  margin-bottom:clamp(2px,.6vh,6px);
  filter:drop-shadow(0 0 5px currentColor);
}
.ico-label{
  display:block;
  font-size:clamp(5px,min(1.4vw,1.6vh),9px);
  color:var(--pri-m);
  letter-spacing:1px;line-height:1.3;
  font-family:'Press Start 2P',monospace;
  padding:0 2px;
}
.ico-page-arrow{
  display:block;
  font-size:clamp(14px,min(7vw,9vh),48px);
  margin-bottom:clamp(2px,.4vh,6px);
  color:#ff2d78;
  text-shadow:0 0 12px #ff2d78;
  animation:blink 1s step-end infinite;
}

/* ── ARCADE BOOT SCREEN ── */
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes arcGlow{0%,100%{text-shadow:0 0 8px #00e5ff,0 0 20px rgba(0,229,255,.4);}50%{text-shadow:0 0 16px #00e5ff,0 0 40px rgba(0,229,255,.7),0 0 60px rgba(0,229,255,.2);}}
@keyframes scanRoll{0%{transform:translateY(-100%);}100%{transform:translateY(100vh);}}

#boot-overlay{
  position:fixed;inset:0;z-index:9998;
  background:#000010;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Press Start 2P',monospace;
  padding:20px;transition:opacity .5s ease;
  overflow:hidden;
}
/* scanline roll */
#boot-overlay::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,.03) 2px,rgba(0,229,255,.03) 4px);
}
#boot-overlay::after{
  content:'';position:fixed;left:0;right:0;height:40%;pointer-events:none;z-index:2;
  background:linear-gradient(to bottom,transparent,rgba(0,229,255,.04),transparent);
  animation:scanRoll 4s linear infinite;
}

/* header marquee area */
#boot-arcade-title{
  text-align:center;margin-bottom:clamp(14px,3vh,28px);position:relative;z-index:3;
}
#boot-ac-big{
  font-size:clamp(14px,4vw,28px);
  color:#ff2d78;
  text-shadow:0 0 14px #ff2d78,0 0 32px rgba(255,45,120,.6),0 0 60px rgba(255,45,120,.2);
  letter-spacing:4px;
  animation:arcGlow 2.2s ease-in-out infinite;
  display:block;margin-bottom:6px;
}
#boot-ac-sub{
  font-size:clamp(7px,1.5vw,10px);
  color:#007799;letter-spacing:6px;display:block;
}

/* main box */
#boot-box{
  border:2px solid #00e5ff;
  max-width:min(560px,92vw);width:100%;
  padding:clamp(14px,3vw,26px) clamp(16px,4vw,32px);
  position:relative;z-index:3;
  background:#000018;
  box-shadow:0 0 0 1px #003355,0 0 40px rgba(0,229,255,.2),inset 0 0 30px rgba(0,229,255,.04);
}
/* corner decorations */
#boot-box::before,#boot-box::after{
  content:'';position:absolute;width:12px;height:12px;
  border-color:#ff2d78;border-style:solid;
}
#boot-box::before{top:-2px;left:-2px;border-width:2px 0 0 2px;}
#boot-box::after{bottom:-2px;right:-2px;border-width:0 2px 2px 0;}

#boot-hdr{
  text-align:center;
  color:#00e5ff;
  font-size:clamp(8px,1.6vw,11px);
  letter-spacing:3px;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid #003355;
}
#boot-ver{
  font-size:clamp(6px,1vw,8px);
  letter-spacing:2px;color:#003355;margin-top:5px;
  animation:blink 1.4s step-end infinite;
}
#boot-log{
  font-size:clamp(7px,1.3vw,10px);
  color:#00e5ff;line-height:2.2;
  min-height:120px;letter-spacing:.5px;
}
.b-ok{color:#00ff88;}.b-dim{color:#003355;}
.bcursor{
  display:inline-block;width:8px;height:clamp(10px,1.5vw,14px);
  background:#00e5ff;
  animation:blink .65s step-end infinite;
  vertical-align:middle;margin-left:2px;
  box-shadow:0 0 6px #00e5ff;
}
#boot-bar-outer{
  margin-top:14px;height:14px;
  border:1px solid #003355;
  background:#000010;overflow:hidden;
  position:relative;
}
/* pixelated progress bar */
#boot-bar-inner{
  height:100%;width:0%;
  background:repeating-linear-gradient(90deg,#007799 0px,#007799 6px,#00e5ff 6px,#00e5ff 10px);
  background-size:10px 100%;
  transition:width .14s linear;
  box-shadow:0 0 10px rgba(0,229,255,.6);
}
#boot-bar-pct{
  text-align:center;margin-top:6px;
  font-size:clamp(7px,1.2vw,9px);
  letter-spacing:3px;color:#007799;
}

/* high score / credits strip */
#boot-hiscore{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
  font-size:clamp(6px,1vw,8px);
  color:#ff2d78;letter-spacing:2px;
}
/* ── ASSEMBLY PROGRESS BAR (bottom strip) ── */
#assembly-bar{position:fixed;bottom:0;left:0;right:0;height:3px;
  background:#001020;z-index:9997;opacity:0;transition:opacity .3s;}
#assembly-bar.show{opacity:1;}
#assembly-bar.hide{opacity:0;transition:opacity .6s .3s;}
#assembly-bar-fill{height:100%;width:0%;
  background:linear-gradient(90deg,#007799,#00e5ff);
  box-shadow:0 0 8px rgba(0,229,255,.6);
  transition:width .15s ease;}

/* ── GAME SPLASH SCREEN ── */
#game-splash{position:fixed;inset:0;z-index:9000;background:#000;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;cursor:pointer;}
#game-splash.hidden{display:none!important;}
#game-splash::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.14) 3px,rgba(0,0,0,.14) 4px);}
#splash-content{text-align:center;position:relative;z-index:1;font-family:Tahoma,Arial,sans-serif;user-select:none;}
#splash-ac{font-size:40px;font-weight:bold;letter-spacing:8px;color:var(--pri);
  text-shadow:0 0 28px var(--pri),0 0 55px var(--pri-d);
  opacity:0;animation:splAceon .48s ease-out .1s forwards;}
#splash-dot{font-size:11px;letter-spacing:5px;color:var(--txt-d);margin-top:2px;
  opacity:0;animation:splUp .3s ease .55s forwards;}
#splash-divider{width:0px;height:1px;
  background:linear-gradient(90deg,transparent,var(--pri),transparent);
  margin:13px auto;animation:splLine .38s ease .8s forwards;}
#splash-games{font-size:10px;letter-spacing:14px;color:var(--pri-m);padding-left:14px;
  opacity:0;animation:splGames .42s ease 1.05s forwards;}
#splash-hint{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.18);
  margin-top:28px;opacity:0;animation:splUp .3s ease 1.4s forwards;}
#splash-prog{position:fixed;bottom:0;left:0;height:3px;width:0%;z-index:2;
  background:linear-gradient(90deg,var(--pri-d),var(--pri));
  animation:splProg 1.7s ease-out 0s forwards;opacity:.85;}

@keyframes splAceon{
  0%{opacity:0;transform:translateY(18px);}
  65%{transform:translateY(-3px);}
  100%{opacity:1;transform:translateY(0);}
}
@keyframes splUp{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:translateY(0);}}
@keyframes splLine{from{width:0px;}to{width:160px;}}
@keyframes splGames{from{opacity:0;letter-spacing:22px;}to{opacity:1;letter-spacing:14px;}}
@keyframes splProg{from{width:0%;}to{width:100%;}}



/* ── ARCADE GAME WINDOWS ── */
@keyframes gwinIn{from{opacity:0;transform:scale(0.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes arcScan{0%{background-position:0 0;}100%{background-position:0 100px;}}

.gwin{
  width:100vw;height:100dvh;
  max-width:none;
  border:none;
  border-top:2px solid #00e5ff;
  box-shadow:0 0 0 1px #007799 inset;
  background:#050510;
  display:flex;flex-direction:column;
  animation:gwinIn .2s ease-out;
  overflow:hidden;
  position:relative;
}
/* subtle scanline inside game window */
.gwin::after{
  content:'';pointer-events:none;position:absolute;inset:0;z-index:800;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,229,255,.025) 3px,rgba(0,229,255,.025) 4px);
}

/* TITLE BAR */
.gtb{
  background:linear-gradient(90deg,#001833,#002244,#001833);
  padding:7px 10px 7px 14px;
  display:flex;align-items:center;flex-shrink:0;
  border-bottom:2px solid #00e5ff;
  position:relative;z-index:1;
}
.gtb::before{
  content:'▶';
  color:#ff2d78;font-size:8px;
  text-shadow:0 0 8px #ff2d78;
  margin-right:9px;
  font-family:'Press Start 2P',monospace;
}
.gtb-t{
  flex:1;
  font-family:'Press Start 2P',monospace;
  font-size:clamp(7px,1.8vw,10px);
  color:#00e5ff;
  text-shadow:0 0 8px rgba(0,229,255,.7);
  letter-spacing:2px;
}
.gtb-x{
  width:26px;height:26px;
  background:#1a0010;
  border:1px solid #ff3344;
  color:#ff3344;
  font-size:10px;font-weight:bold;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  text-shadow:0 0 6px #ff3344;
  transition:background .12s,color .12s;
  font-family:'Press Start 2P',monospace;
}
.gtb-x:hover{background:#ff3344;color:#fff;text-shadow:none;}

/* GAME AREA */
.garea{
  flex:1;min-height:0;
  padding:8px 12px;
  display:flex;flex-direction:column;
  align-items:center;gap:8px;
  overflow-y:auto;overflow-x:hidden;
  position:relative;z-index:1;
  scrollbar-width:thin;scrollbar-color:#003355 transparent;
}

/* STATUS BAR */
.gbar{
  width:100%;max-width:1200px;
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 16px;
  background:#001020;
  border:1px solid #003355;
  border-left:3px solid #00e5ff;
  font-family:'Press Start 2P',monospace;
  font-size:clamp(6px,1.5vw,9px);
  color:#00e5ff;
  letter-spacing:1px;
  gap:10px;flex-wrap:wrap;
  text-shadow:0 0 6px rgba(0,229,255,.5);
}

/* BUTTONS */
.btn{
  padding:5px 12px;
  background:#001020;
  border:1px solid #003355;
  border-bottom:2px solid #007799;
  color:#80f0ff;
  cursor:pointer;
  font-family:'Press Start 2P',monospace;
  font-size:clamp(6px,1.4vw,8px);
  letter-spacing:1px;
  transition:background .1s,border-color .1s,color .1s;
  white-space:nowrap;
}
.btn:hover{
  background:#003355;
  border-color:#00e5ff;
  border-bottom-color:#00e5ff;
  color:#fff;
  box-shadow:0 0 10px rgba(0,229,255,.35);
}
.btn.sel{
  background:#003355;
  border-color:#00e5ff;
  border-bottom-color:#00ccdd;
  color:#fff;
  box-shadow:0 0 10px rgba(0,229,255,.3),inset 0 0 8px rgba(0,229,255,.06);
}



/* MOBILE CONTROLS */
.m-ctrl{display:none;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0;width:100%;}
@media(max-width:768px){.m-ctrl{display:flex;}}
.m-ctrl.show{display:flex;}
.m-pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;}
.m-btn{
  font-size:20px;
  background:#001020;
  border:2px solid #003355;
  border-bottom:3px solid #007799;
  color:#00e5ff;
  cursor:pointer;border-radius:0;
  display:flex;align-items:center;justify-content:center;
  user-select:none;touch-action:manipulation;
  width:48px;height:48px;
  -webkit-tap-highlight-color:transparent;
  text-shadow:0 0 8px rgba(0,229,255,.6);
  transition:background .08s;
  font-family:'Press Start 2P',monospace;
}
.m-btn:active{
  background:#003355;border-bottom-width:1px;
  transform:translateY(2px);
  box-shadow:0 0 8px rgba(0,229,255,.4);
}
.m-btn.wide{width:110px;font-size:8px;letter-spacing:1px;}
.m-hint{font-size:7px;color:#007799;text-align:center;letter-spacing:2px;font-family:'Press Start 2P',monospace;}

/* CANVAS AUTO-SCALE — keeps internal game resolution intact, only shrinks visually */
.gcv{max-width:100%;height:auto;display:block;margin:0 auto;max-height:calc(100dvh - 130px);width:auto;}




/* 15-PUZZLE */
#pz-grid{display:inline-grid;gap:4px;padding:6px;background:var(--bg2);border:2px solid var(--bdr);border-radius:6px;}
.pz-tile{display:flex;align-items:center;justify-content:center;
         border-radius:5px;font-weight:bold;cursor:pointer;
         background:var(--bg3);border:1px solid var(--bdr);color:var(--pri);
         transition:background .12s,transform .1s;user-select:none;}
.pz-tile:hover:not(.empty){background:var(--sel);}
.pz-tile:active:not(.empty){transform:scale(.93);}
.pz-tile.empty{background:var(--dim);border-color:var(--bdr-d);cursor:default;}
.pz-tile.correct{color:var(--pri-b);border-color:var(--pri-d);}


/* ══ ARCADE OVERRIDES FOR GAME-SPECIFIC ELEMENTS ══ */


/* Checkers board: classic colours */

/* Checkers — richer board, pieces, hints */



/* 15-Puzzle */
.pz-tile{background:#001020;border-color:#003355;font-family:'Press Start 2P',monospace;border-radius:0;}
.pz-tile:hover:not(.empty){background:#003355;}
.pz-tile.correct{color:#00ff88;border-color:#005522;}
.pz-tile.empty{background:#020208;border-color:#001a33;}

/* Message text in game bars — inherit arcade font */
#sl-msg,#pz-msg,#bub-msg,#bs-msg,#ss-msg{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(6px,1.5vw,9px);
  letter-spacing:1px;
}

/* canvas fullscreen scaling — browser keeps aspect ratio via width:auto + max constraints */

/* пульсация заголовка итогов (используется пасьянсом) */
@keyframes repPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}

/* ссылка назад на новую страницу игр */
.l-head{position:relative;}
.cl-back{position:absolute;left:0;top:0;padding:8px 12px;border:1px solid var(--bdr);background:#001020;color:var(--pri-b);font-size:9px;letter-spacing:1px;text-decoration:none;}
.cl-back:hover{border-color:var(--pri);color:#fff;}
@media(max-width:600px){.cl-back{position:static;display:inline-block;margin-bottom:10px;}}
</style>
</head>
<body>

<!-- ARCADE BOOT OVERLAY -->
<div id="boot-overlay">
  <div id="boot-arcade-title">
    <span id="boot-ac-big">A.C.EON</span>
    <span id="boot-ac-sub">ARCADE</span>
  </div>
  <div id="boot-box">
    <div id="boot-hiscore">
      <span>HI&#8209;SCORE&nbsp;<span id="boot-hi">000000</span></span>
      <span>CREDITS&nbsp;<span id="boot-cr">99</span></span>
    </div>
    <div id="boot-hdr">
      SYSTEM BOOT
      <div id="boot-ver">v1.0 // COIN-OP // CLICK TO SKIP</div>
    </div>
    <div id="boot-log"><span class="bcursor"></span></div>
    <div id="boot-bar-outer"><div id="boot-bar-inner"></div></div>
    <div id="boot-bar-pct">LOADING 0%</div>
  </div>
</div>
<!-- ASSEMBLY PROGRESS BAR -->
<div id="assembly-bar"><div id="assembly-bar-fill"></div></div>

<!-- GAME SPLASH -->
<div id="game-splash" class="hidden">
  <div id="splash-content">
    <div id="splash-ac">A.C.EON</div>
    <div id="splash-dot">STUDIO</div>
    <div id="splash-divider"></div>
    <div id="splash-games">GAMES</div>
    <div id="splash-hint">click to skip</div>
  </div>
  <div id="splash-prog"></div>
</div>

<div id="launcher">
  <div class="l-head">
    <a class="cl-back" href="../">&#9664; ARCADE</a>
    <div class="arc-marquee">A.C.EON CLASSIC</div>
    <div class="arc-sub">&#9654; OLD SCHOOL CABINETS &#9664;</div>
    <div class="arc-coin">INSERT COIN &nbsp;<span>&#x25CF;</span>&nbsp; CREDITS: <span id="play-cnt">0</span></div>
  </div>
  <div class="game-grid">
    <div class="game-icon" onclick="openGame('puzzle')"><span class="ico-pixel">&#129513;</span><span class="ico-label">15-PUZZLE</span></div>
  </div>
</div>

<!-- вторая страница больше не нужна, блок оставлен пустым для старого кода showPage -->
<div id="launcher-2" class="hidden"></div>

<!-- 15-PUZZLE -->
<div id="game-puzzle" class="gwin hidden">
  <div class="gtb"><span class="gtb-t">15-PUZZLE</span><div class="gtb-x" onclick="closeGame()">&#10005;</div></div>
  <div class="garea">
    <div class="gbar">
      <span>MOVES: <span id="pz-moves">0</span></span>
      <span><button class="btn sel" id="pzb-4" onclick="setPuzzleSize(4)">4×4</button><button class="btn" id="pzb-3" onclick="setPuzzleSize(3)">3×3</button><button class="btn" id="pzb-5" onclick="setPuzzleSize(5)">5×5</button></span>
      <button class="btn" onclick="initPuzzle()">NEW</button>
      <span>BEST: <span id="hi-puzzle">&mdash;</span></span>
    </div>
    <div id="pz-msg" style="font-size:11px;letter-spacing:1px;min-height:16px;text-align:center;"></div>
    <div id="pz-grid"></div>
  </div>
</div>


<script src="../shared/achievements.js"></script>
<script>

(function(){
'use strict';
var cur=null,mcOn=false;

/* ── HELPERS ── */
function getHi(id){return parseInt(localStorage.getItem('aceon_hi_'+id)||'0');}
function setHi(id,sc){if(sc>getHi(id))localStorage.setItem('aceon_hi_'+id,sc);achLater(id);return getHi(id);}
/* достижения (shared/achievements.js): имена игр в каталоге новой страницы отличаются от старых id */
var ACH_ID={pf:'runner',ts:'stacker',mind:'mastermind',puzzle:'puzzle15',bubble:'bubbles'};
function achId(id){return ACH_ID[id]||id;}
function achLater(id){if(window.Achieve)try{Achieve.later(achId(id));}catch(e){}}
/* победа в игре, где раньше ничего не сохранялось: счётчик aceon_cl_<игра>[_уровень] */
function clWin(id,lv){
  try{
    var k='aceon_cl_'+id;localStorage.setItem(k,(parseInt(localStorage.getItem(k),10)||0)+1);
    if(lv){k+='_'+lv;localStorage.setItem(k,(parseInt(localStorage.getItem(k),10)||0)+1);}
  }catch(e){}
  achLater(id);
}
function showHi(id){var el=document.getElementById('hi-'+id);if(el)el.textContent=getHi(id);}

function gC(){
  var s=getComputedStyle(document.body),g=function(v){return s.getPropertyValue(v).trim();};
  return{bg:g('--bg'),bg2:g('--bg2'),bg3:g('--bg3'),bg4:g('--bg4'),
         pri:g('--pri'),prib:g('--pri-b'),prim:g('--pri-m'),prid:g('--pri-d'),
         txt:g('--txt'),txtd:g('--txt-d'),bdr:g('--bdr'),bdrd:g('--bdr-d'),
         sel:g('--sel'),err:g('--err'),dim:g('--dim')};
}

/* ── RESPONSIVE CELL SIZING ──
   Computes a cell size (px) that fits the current viewport width and writes it
   to a CSS custom property. The grid/board CSS reads that variable via var(),
   so cells shrink on phones without any change to game logic or click handling. */
/* ── Dynamic cell fitter — always uses available screen space ── */
var ARC_MAX={'bs-cell':46};
function fitCells(varName,cols,opts){
  opts=opts||{};
  /* dynamic margin: small fraction of screen width, never more than 48px */
  var margin=Math.min(48, Math.round(window.innerWidth*0.05));
  var min=opts.min||16;
  /* always use the largest known max for this variable */
  var max=Math.max(opts.max||999, ARC_MAX[varName]||0)||999;
  var extra=opts.extra||0;
  /* also constrain by viewport height so cells don't overflow vertically */
  var availW=window.innerWidth-margin;
  var availH=window.innerHeight-150; /* 150px for titlebar+gbar */
  var cellW=Math.floor((availW-extra)/cols);
  var cellH=Math.floor(availH/cols); /* rough square cap */
  var cell=Math.max(min,Math.min(max,cellW,cellH));
  document.documentElement.style.setProperty('--'+varName,cell+'px');
  return cell;
}
function refitCurrent(){
  /* fitCells is now self-aware — just re-call each game's fit function */
  if(cur==='puzzle')renderPuzzle();
}
var resizeTmr;
window.addEventListener('resize',function(){clearTimeout(resizeTmr);resizeTmr=setTimeout(refitCurrent,120);});
window.addEventListener('orientationchange',function(){setTimeout(refitCurrent,200);});

/* ── THEMES ── */
/* arcade palette — no theme switching */
var curPage=1;
window.showPage=function(n){
  curPage=n;
  document.getElementById('launcher').classList.toggle('hidden',n!==1);
  document.getElementById('launcher-2').classList.toggle('hidden',n!==2);
  // sync credits counter
  var cnt=localStorage.getItem('aceon_plays')||'0';
  var el2=document.getElementById('play-cnt-2');
  if(el2)el2.textContent=cnt;
};

/* ── BACKGROUND MUSIC ── */
var bgIdx=0,bgAudio=null,bgStarted=false;
var bgTracks=['../../audio/track-8-bit-1.mp3','../../audio/track-8-bit-2.mp3','../../audio/track-8-bit-3.mp3','../../audio/track-8-bit-4.mp3','../../audio/track-8-bit-5.mp3','../../audio/track-8-bit-6.mp3','../../audio/track-8-bit-7.mp3','../../audio/track-8-bit-8.mp3'];
/* трек и позиция сохраняются в sessionStorage, страницы игр продолжают с того же места (games/shared/arcade.js) */
function bgPlay(i,t){bgIdx=((i%bgTracks.length)+bgTracks.length)%bgTracks.length;bgAudio.src=bgTracks[bgIdx];if(t)bgAudio.addEventListener('loadedmetadata',function f(){bgAudio.removeEventListener('loadedmetadata',f);try{bgAudio.currentTime=t;}catch(e){}});bgAudio.play().catch(function(){});}
function bgNext(){bgPlay(bgIdx+1,0);}
function startBg(){if(bgStarted)return;bgStarted=true;bgAudio=new Audio();bgAudio.volume=0.35;bgAudio.addEventListener('ended',bgNext);var st=null;try{st=JSON.parse(sessionStorage.getItem('aceon_music')||'null');}catch(e){}bgPlay(st?st.idx:0,st?st.t:0);}
window.addEventListener('pagehide',function(){if(!bgAudio)return;try{sessionStorage.setItem('aceon_music',JSON.stringify({idx:bgIdx,t:bgAudio.currentTime||0}));}catch(e){}});
document.addEventListener('click',startBg,{once:true});

/* ── PLAY COUNTER ── */
function trackPlay(){var n=parseInt(localStorage.getItem('aceon_plays')||'0')+1;localStorage.setItem('aceon_plays',n);var el=document.getElementById('play-cnt');if(el)el.textContent=n;var el2=document.getElementById('play-cnt-2');if(el2)el2.textContent=n;}
(function(){var cnt=localStorage.getItem('aceon_plays')||'0';var el=document.getElementById('play-cnt');if(el)el.textContent=cnt;var el2=document.getElementById('play-cnt-2');if(el2)el2.textContent=cnt;})();

/* ── MOBILE CONTROLS ── */
document.addEventListener('keydown',function(e){
  if(e.key==='m'||e.key==='M'){mcOn=!mcOn;document.querySelectorAll('.m-ctrl').forEach(function(el){el.classList.toggle('show',mcOn);});}
});

/* ── OPEN / CLOSE ── */
var PAGE2_GAMES={};
/* открыта по ссылке classic/#игра с новой страницы игр: без заставок, закрытие возвращает на новую страницу */
var FROM_LINK=false;
window.addEventListener('hashchange',function(){var h=(location.hash||'').slice(1);if(h&&document.getElementById('game-'+h)){FROM_LINK=false;if(cur)closeGame();FROM_LINK=true;openGame(h,true);}});
window.openGame=function(id,direct){
  document.getElementById('launcher').classList.add('hidden');
  document.getElementById('launcher-2').classList.add('hidden');
  document.getElementById('game-'+id).classList.remove('hidden');
  cur=id;trackPlay();
  try{localStorage.setItem('aceon_cl_play_'+achId(id),'1');}catch(e){}
  if(window.Achieve)try{Achieve.played(achId(id));}catch(e){}
  var cnt=localStorage.getItem('aceon_plays')||'0';
  var el=document.getElementById('play-cnt');if(el)el.textContent=cnt;
  var el2=document.getElementById('play-cnt-2');if(el2)el2.textContent=cnt;
  var fn={
          puzzle:initPuzzle};
  /* Show PRESS START — init game only after player clicks */
  if(direct){if(fn[id])fn[id]();setTimeout(refitCurrent,40);return;}
  showGameSplash(function(){
    if(fn[id])fn[id]();
    setTimeout(refitCurrent, 40); // refit grid/board sizes after init
  });
};
window.closeGame=function(){
  if(!cur)return;
  document.getElementById('game-'+cur).classList.add('hidden');
  var wasP2=PAGE2_GAMES[cur];
  cur=null;
  if(FROM_LINK){location.href='../';return;}
  showPage(wasP2?2:1);
};

/* ════════════════ 15-PUZZLE ════════════════ */
var pzN=4,pzTiles,pzMoves,pzOver;

window.setPuzzleSize=function(n){pzN=n;['3','4','5'].forEach(function(x){document.getElementById('pzb-'+x).className='btn'+(x==n?' sel':'');});initPuzzle();};

window.initPuzzle=function(){
  pzMoves=0;pzOver=false;
  var size=pzN*pzN;
  pzTiles=Array.from({length:size},function(_,i){return i;});
  // shuffle with guaranteed solvability
  do{for(var i=size-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=pzTiles[i];pzTiles[i]=pzTiles[j];pzTiles[j]=t;}}
  while(!pzSolvable()||pzSolved());
  document.getElementById('pz-moves').textContent='0';
  document.getElementById('pz-msg').textContent='';
  pzShowBest();
  renderPuzzle();
};

function pzSolvable(){
  var inv=0,blank=pzTiles.indexOf(0),row=Math.floor(blank/pzN);
  for(var i=0;i<pzTiles.length-1;i++)for(var j=i+1;j<pzTiles.length;j++)if(pzTiles[i]&&pzTiles[j]&&pzTiles[i]>pzTiles[j])inv++;
  if(pzN%2===1)return inv%2===0;
  var rowFromBottom=pzN-row;
  return (rowFromBottom%2===0)!==(inv%2===0);
}
function pzSolved(){return pzTiles.every(function(v,i){return v===(i<pzTiles.length-1?i+1:0);});}

window.pzClick=function(idx){
  if(pzOver)return;
  var blank=pzTiles.indexOf(0);
  var r=Math.floor(idx/pzN),c=idx%pzN;
  var br=Math.floor(blank/pzN),bc=blank%pzN;
  if((Math.abs(r-br)+Math.abs(c-bc))!==1)return;
  pzTiles[blank]=pzTiles[idx];pzTiles[idx]=0;
  pzMoves++;
  document.getElementById('pz-moves').textContent=pzMoves;
  if(pzSolved()){
    pzOver=true;
    var best=pzGetBest();
    var newRec=best===null||pzMoves<best;
    if(newRec)pzSetBest(pzMoves);
    pzShowBest();
    var m=document.getElementById('pz-msg');
    m.textContent='\u2713 SOLVED IN '+pzMoves+' MOVES!'+(newRec?' NEW RECORD!':'');
    m.style.color='var(--pri-b)';
  }
  renderPuzzle();
};

function renderPuzzle(){
  var el=document.getElementById('pz-grid');if(!el)return;
  var cell=Math.min(Math.floor((window.innerHeight-180)/pzN),Math.floor((window.innerWidth-40)/(pzN+.3)),160);
  el.style.gridTemplateColumns='repeat('+pzN+','+cell+'px)';
  el.style.gridTemplateRows='repeat('+pzN+','+cell+'px)';
  el.innerHTML='';
  pzTiles.forEach(function(val,idx){
    var tile=document.createElement('div');
    tile.className='pz-tile'+(val===0?' empty':(val===idx+1||val===0&&idx===pzN*pzN-1)?' correct':'');
    tile.style.width=cell+'px';tile.style.height=cell+'px';
    tile.style.fontSize=Math.floor(cell*.35)+'px';
    if(val!==0)tile.textContent=val;
    tile.addEventListener('click',(function(i){return function(){pzClick(i);};})(idx));
    el.appendChild(tile);
  });
}

function pzGetBest(){var k='aceon_hi_pz'+pzN;var v=localStorage.getItem(k);return v?parseInt(v):null;}
function pzSetBest(moves){var k='aceon_hi_pz'+pzN;var b=pzGetBest();if(b===null||moves<b)localStorage.setItem(k,moves);achLater('puzzle');}
function pzShowBest(){var b=pzGetBest();var el=document.getElementById('hi-puzzle');if(el)el.textContent=b===null?'\u2014':b;}

/* ── BOOT SEQUENCE + ICON ASSEMBLY ── */
(function(){
  var overlay=document.getElementById('boot-overlay');
  var log=document.getElementById('boot-log');
  var barInner=document.getElementById('boot-bar-inner');
  var barPct=document.getElementById('boot-bar-pct');
  var abar=document.getElementById('assembly-bar');
  var afill=document.getElementById('assembly-bar-fill');
  if(!overlay)return;
  /* classic/#puzzle и т.п.: сразу открыть игру */
  var hashId=(location.hash||'').slice(1);
  if(hashId&&document.getElementById('game-'+hashId)){
    overlay.style.display='none';launchIcons(true);FROM_LINK=true;
    setTimeout(function(){openGame(hashId,true);},30);
    return;
  }
  /* при возврате из игры в той же сессии заставку загрузки не показываем */
  var bootSeen=false;
  try{bootSeen=sessionStorage.getItem('aceon_boot_seen')==='1';sessionStorage.setItem('aceon_boot_seen','1');}catch(e){}
  if(bootSeen){overlay.style.display='none';launchIcons(true);return;}

  function setBar(v){
    barInner.style.width=v+'%';
    barPct.textContent='LOADING '+Math.round(v)+'%';
  }

  var cursor=log.querySelector('.bcursor');
  function addLine(html,color){
    var d=document.createElement('div');
    if(color)d.style.color=color;
    d.innerHTML=html;
    if(cursor&&cursor.parentNode===log)log.insertBefore(d,cursor);
    else log.appendChild(d);
    return d;
  }

  /* fill hi-score from localStorage */
  var hiEl=document.getElementById('boot-hi');
  if(hiEl){var plays=parseInt(localStorage.getItem('aceon_plays')||'0');hiEl.textContent=String(plays*100).padStart(6,'0');}
  var crEl=document.getElementById('boot-cr');
  if(crEl){crEl.textContent=String(Math.max(0,99-parseInt(localStorage.getItem('aceon_plays')||'0')));}

  var STEPS=[
    {t:60,   msg:'LOADING GAME ROM  [1 TITLES]',  pct:14, ok:340},
    {t:500,  msg:'CHECKING HIGH SCORES...........',  pct:32, ok:280},
    {t:880,  msg:'WARMING UP DISPLAY.............',  pct:55, ok:260},
    {t:1200, msg:'CALIBRATING JOYSTICK...........',  pct:74, ok:240},
    {t:1500, msg:'INSERTING COIN.................',  pct:91, ok:220},
    {t:1780, msg:'READY PLAYER ONE',                 pct:98, ok:null, special:true}
  ];

  STEPS.forEach(function(s){
    setTimeout(function(){
      var line=addLine('&gt; '+s.msg+(s.special?'':' <span class="b-dim">...</span>'));
      setBar(s.pct);
      if(s.ok!==null){
        setTimeout(function(){
          line.innerHTML='&gt; '+s.msg+' <span class="b-ok">OK</span>';
        },s.ok);
      }
    },s.t);
  });

  // fill to 100 and show LAUNCH
  setTimeout(function(){
    setBar(100);
    barInner.style.transition='width .5s ease';
    if(cursor&&cursor.parentNode)cursor.parentNode.removeChild(cursor);
    setTimeout(function(){
      addLine('&#9654; INSERT COIN &#9654; PRESS START','#ff2d78');
    },180);
  },2000);

  function dismiss(instant){
    overlay.style.opacity='0';
    setTimeout(function(){
      overlay.style.display='none';
      launchIcons(instant);
    },instant?0:520);
  }

  // auto-dismiss
  setTimeout(function(){dismiss(false);},3100);
  // click to skip
  overlay.addEventListener('click',function(){
    overlay.style.transition='opacity .22s';
    dismiss(true);
  },{once:true});

  function launchIcons(fast){
    var icons=document.querySelectorAll('#launcher .game-icon'); // page 1 only on boot
    var total=icons.length;
    if(abar){abar.classList.add('show');}
    icons.forEach(function(el,i){
      var delay=fast?i*18+30:i*55+60;
      setTimeout(function(){
        el.classList.add('appeared');
        if(afill)afill.style.width=(((i+1)/total)*100)+'%';
        if(i===total-1){
          // Also appear page2 icons silently
          document.querySelectorAll('#launcher-2 .game-icon').forEach(function(e){e.classList.add('appeared');});
          setTimeout(function(){
            if(abar)abar.classList.remove('show');
            if(abar)abar.classList.add('hide');
          },400);
        }
      },delay);
    });
  }
})();

/* ── showGameSplash: arcade ident + PRESS START → then runs callback ── */
function showGameSplash(onStart){
  var sp=document.getElementById('game-splash');
  var cnt=document.getElementById('splash-content');
  var prog=document.getElementById('splash-prog');
  if(!sp)return;

  // Restart animations
  sp.removeChild(cnt);sp.removeChild(prog);
  void sp.offsetWidth;
  sp.appendChild(cnt);sp.appendChild(prog);

  // Add / reset PRESS START button
  var psEl=document.getElementById('splash-ps');
  if(!psEl){
    psEl=document.createElement('div');psEl.id='splash-ps';
    psEl.style.cssText='position:absolute;bottom:18%;left:0;right:0;text-align:center;font-family:"Press Start 2P",monospace;font-size:clamp(9px,2.5vw,14px);color:#ffe600;text-shadow:0 0 10px #ffe600,0 0 22px #ff8800;animation:blink .9s step-end infinite;letter-spacing:2px;z-index:2;';
    psEl.textContent='PRESS START';
    sp.appendChild(psEl);
  }
  psEl.style.display='block';

  sp.style.cssText='opacity:1;transition:none;position:fixed;';
  sp.classList.remove('hidden');

  var done=false;
  function launch(){
    if(done)return;done=true;
    psEl.style.display='none';
    sp.style.cssText='opacity:0;transition:opacity .3s ease;';
    setTimeout(function(){
      sp.classList.add('hidden');
      if(onStart)onStart();
    },320);
  }

  // Auto-show PRESS START after 1.6s, then wait for click
  var autoT=setTimeout(function(){
    sp.addEventListener('click',launch,{once:true});
  },1600);

  // Click before 1.6s = skip ident, still wait for PRESS START replacement
  sp.addEventListener('click',function skip(){
    clearTimeout(autoT);
    sp.removeEventListener('click',skip);
    setTimeout(function(){
      sp.addEventListener('click',launch,{once:true});
    },0);
  },{once:true});
}

})(); // end IIFE

</script>

</body>
