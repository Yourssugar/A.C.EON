<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>A.C.EON BREACH</title>

<!-- Загрузчик: качает файлы из списка с прогрессом и дописывает к ним ?v=.
     data-v МЕНЯТЬ ПРИ КАЖДОЙ ВЫКЛАДКЕ (и при изменениях в games/shared).
     Картинки пролога идут с "nov":true: gl.js грузит их по адресу без ?v=, так они берутся из кэша. -->
<script src="../shared/boot.js" data-v="1" defer></script>
<script type="application/json" id="boot-manifest">
{"files":[
  {"src":"../shared/arcade.css","kb":7},
  {"src":"css/cyber.css","kb":7},
  {"src":"../shared/store.js","kb":3},
  {"src":"../shared/i18n.js","kb":3},
  {"src":"../shared/sound.js","kb":9},
  {"src":"../shared/arcade.js","kb":5},
  {"src":"js/lang.js","kb":6},
  {"src":"js/gl.js","kb":7},
  {"src":"js/prologue.js","kb":7},
  {"src":"js/cyber.js","kb":2},
  {"src":"../art/cyber/bg/server_sky.webp","kb":125,"nov":true},
  {"src":"../art/cyber/bg/server_mid.webp","kb":211,"nov":true},
  {"src":"../art/cyber/bg/server_near.webp","kb":91,"nov":true},
  {"src":"../art/cyber/bg/archive.webp","kb":105,"nov":true},
  {"src":"../art/cyber/bg/archive_dust.webp","kb":31,"nov":true},
  {"src":"../art/cyber/bg/building_sky.webp","kb":20,"nov":true},
  {"src":"../art/cyber/bg/building_far.webp","kb":82,"nov":true},
  {"src":"../art/cyber/bg/building_near.webp","kb":90,"nov":true},
  {"src":"../art/cyber/fx/glow.webp","kb":6,"nov":true},
  {"src":"../art/cyber/fx/scan.webp","kb":1,"nov":true},
  {"src":"../art/cyber/fx/noise.webp","kb":135,"nov":true},
  {"src":"../art/cyber/fx/vignette.webp","kb":152,"nov":true}
]}
</script>

<!-- Обложка загрузки: щит, по которому идёт полоса проверки (--p от загрузчика) -->
<template id="boot-skin">
  <style>
    .cy-brand{font-size:9px;letter-spacing:.5em;color:#ffb347;text-shadow:0 0 10px rgba(255,179,71,.7);padding-left:.5em;margin-bottom:-14px;}
    .cy-title{font-size:clamp(14px,4vw,22px);letter-spacing:.3em;color:#4fe3d0;text-shadow:0 0 14px rgba(79,227,208,.8);padding-left:.3em;}
    .cy-shield{position:relative;width:64px;height:76px;overflow:hidden;
      clip-path:polygon(50% 0,100% 14%,100% 52%,50% 100%,0 52%,0 14%);
      background:linear-gradient(180deg,#0f1c1d,#071012);box-shadow:inset 0 0 0 2px #2a6b65;}
    .cy-shield::before{content:'';position:absolute;inset:3px;
      clip-path:polygon(50% 0,100% 14%,100% 52%,50% 100%,0 52%,0 14%);border:2px solid #4fe3d0;opacity:.55;}
    .cy-scan{position:absolute;left:0;right:0;height:3px;background:#4fe3d0;box-shadow:0 0 12px #4fe3d0;
      top:calc(76px * var(--p) - 3px);}
  </style>
  <div class="cy-brand">A.C.EON</div>
  <div class="cy-title">БРЕШЬ / BREACH</div>
  <div class="cy-shield"><i class="cy-scan"></i></div>
</template>
</head>
<body class="cy-page">

<canvas id="cy-gl"></canvas>

<div class="cy-ui">
  <div class="cy-kicker" id="cy-kicker"></div>
  <button class="cy-skip" id="cy-skip" data-i18n="ui.skip"></button>
  <div class="cy-center hidden" id="cy-center"></div>
  <div class="cy-lower hidden" id="cy-lower"><div class="cy-inner" id="cy-lower-inner"></div></div>
</div>

<div class="cy-foot">
  <div class="cy-progress" id="cy-progress"></div>
  <div class="cy-hint" id="cy-hint" data-i18n="ui.hint"></div>
  <button class="cy-cta" id="cy-cta"><span data-i18n="ui.start"></span> &#9654;</button>
</div>

</body>
</html>
