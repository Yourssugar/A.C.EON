<!-- Обложка загрузки: поле 6x6 заливается цветом по мере загрузки (--p от загрузчика) -->
<template id="boot-skin">
  <style>
    .fl-t{display:grid;grid-template-columns:repeat(6,14px);gap:2px;}
    .fl-t i{width:14px;height:14px;background:var(--c);}
    .fl-t i.f{box-shadow:inset 0 0 0 7px rgba(0,229,255,calc(var(--p) * 12 - var(--k)));}
    .fl-n{font-size:clamp(14px,4vw,22px);letter-spacing:.3em;color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.8);padding-left:.3em;}
    .fl-b{font-size:9px;letter-spacing:.5em;color:#ff2d78;text-shadow:0 0 10px #ff2d78;padding-left:.5em;margin-bottom:-14px;}
  </style>
  <div class="fl-b">A.C.EON</div>
  <div class="fl-n">FLOOD</div>
  <div class="fl-t"><i class="f" style="--k:0;--c:#ff2d78"></i><i class="f" style="--k:1;--c:#ffd23a"></i><i class="f" style="--k:2;--c:#ff8a2a"></i><i class="f" style="--k:3;--c:#1fd47a"></i><i class="f" style="--k:4;--c:#8c6cff"></i><i class="f" style="--k:5;--c:#ff2d78"></i><i class="f" style="--k:1;--c:#ffd23a"></i><i class="f" style="--k:2;--c:#ff8a2a"></i><i class="f" style="--k:3;--c:#1fd47a"></i><i class="f" style="--k:4;--c:#8c6cff"></i><i class="f" style="--k:5;--c:#ff2d78"></i><i class="f" style="--k:6;--c:#ffd23a"></i><i class="f" style="--k:2;--c:#ff8a2a"></i><i class="f" style="--k:3;--c:#1fd47a"></i><i class="f" style="--k:4;--c:#8c6cff"></i><i class="f" style="--k:5;--c:#ff2d78"></i><i class="f" style="--k:6;--c:#ffd23a"></i><i class="f" style="--k:7;--c:#ff8a2a"></i><i class="f" style="--k:3;--c:#1fd47a"></i><i class="f" style="--k:4;--c:#8c6cff"></i><i class="f" style="--k:5;--c:#ff2d78"></i><i class="f" style="--k:6;--c:#ffd23a"></i><i class="f" style="--k:7;--c:#ff8a2a"></i><i class="f" style="--k:8;--c:#1fd47a"></i><i class="f" style="--k:4;--c:#8c6cff"></i><i class="f" style="--k:5;--c:#ff2d78"></i><i class="f" style="--k:6;--c:#ffd23a"></i><i class="f" style="--k:7;--c:#ff8a2a"></i><i class="f" style="--k:8;--c:#1fd47a"></i><i class="f" style="--k:9;--c:#8c6cff"></i><i class="f" style="--k:5;--c:#ff2d78"></i><i class="f" style="--k:6;--c:#ffd23a"></i><i class="f" style="--k:7;--c:#ff8a2a"></i><i class="f" style="--k:8;--c:#1fd47a"></i><i class="f" style="--k:9;--c:#8c6cff"></i><i class="f" style="--k:10;--c:#ff2d78"></i></div>
