<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>A.C.EON ARCADE</title>

<!-- Загрузчик: качает файлы из списка ниже с прогрессом и дописывает к ним ?v=.
     data-v МЕНЯТЬ ПРИ КАЖДОЙ ВЫКЛАДКЕ (и при изменениях в games/shared). -->
<script src="shared/boot.js" data-v="5" defer></script>
<script type="application/json" id="boot-manifest">
{"files":[
  {"src":"shared/arcade.css","kb":7},
  {"src":"hub/css/hub.css","kb":16},
  {"src":"shared/store.js","kb":3},
  {"src":"shared/i18n.js","kb":3},
  {"src":"shared/sound.js","kb":9},
  {"src":"shared/arcade.js","kb":5},
  {"src":"shared/achievements.js","kb":30},
  {"src":"shared/three-loader.js","kb":3},
  {"src":"hub/js/lang.js","kb":20},
  {"src":"hub/js/ach-lang.js","kb":24},
  {"src":"hub/js/catalog.js","kb":6},
  {"src":"hub/js/bg3d.js","kb":9},
  {"src":"hub/js/hub.js","kb":18}
]}
</script>

<!-- Обложка загрузки: карточки выезжают по мере загрузки (--p от загрузчика) -->
<template id="boot-skin">
  <style>
    .h-row{display:flex;gap:8px;perspective:400px;}
    .h-row i{width:34px;height:46px;border:2px solid #00e5ff;border-radius:4px;box-shadow:0 0 10px rgba(0,229,255,.5);
      --k:clamp(0,calc((var(--p) - var(--t)) * 6),1);opacity:var(--k);transform:translateY(calc(20px * (1 - var(--k)))) rotateY(calc(var(--r) * 1deg));}
    .h-row i:nth-child(3){border-color:#ff2d78;box-shadow:0 0 14px #ff2d78;width:42px;height:56px;}
    .h-title{font-size:clamp(14px,4vw,22px);letter-spacing:.3em;color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.8);padding-left:.3em;}
    .h-brand{font-size:9px;letter-spacing:.5em;color:#ff2d78;text-shadow:0 0 10px #ff2d78;padding-left:.5em;margin-bottom:-14px;}
  </style>
  <div class="h-brand">A.C.EON</div>
  <div class="h-title">ARCADE</div>
  <div class="h-row"><i style="--t:0;--r:30"></i><i style="--t:.2;--r:18"></i><i style="--t:.4;--r:0"></i><i style="--t:.6;--r:-18"></i><i style="--t:.8;--r:-30"></i></div>
</template>
</head>
<body class="hub">

<div class="bg" id="bg"></div>

<main class="hub-main">
  <nav class="cats" id="cats"></nav>

  <section class="stage" id="stage">
    <div class="track" id="track"></div>
    <button class="arrow prev" id="prev" type="button" aria-label="previous"><i></i></button>
    <button class="arrow next" id="next" type="button" aria-label="next"><i></i></button>
  </section>

  <section class="info" id="info">
    <img class="i-hero hidden" id="i-hero" alt="">
    <div class="i-top">
      <span class="i-cat" id="i-cat"></span>
      <span class="i-classic hidden" id="i-classic" data-i18n="hub.classic"></span>
      <span class="i-last hidden" id="i-last" data-i18n="hub.last"></span>
      <span class="i-pos" id="pos"></span>
    </div>
    <h1 class="i-name" id="i-name"></h1>
    <p class="i-desc" id="i-desc"></p>
    <div class="i-stats" id="i-stats"></div>
    <div class="i-ach" id="i-ach"></div>
    <div class="i-btns">
      <button class="btn i-play" id="btn-play" type="button">&#9654; <span data-i18n="hub.play"></span></button>
      <button class="btn i-grid" id="btn-grid" type="button"><span class="gi"><i></i><i></i><i></i><i></i></span><span data-i18n="hub.list"></span></button>
      <button class="btn i-album" id="btn-album" type="button"><img class="ib-i" alt="" src="art/icons/album.webp"><span data-i18n="hub.album"></span><b id="album-n"></b></button>
    </div>
  </section>
  <div class="hub-foot"><span id="count"></span> &middot; <span data-i18n="hub.hint"></span></div>
</main>

<!-- альбом карточек -->
<div class="grid-ov album-ov hidden" id="album-ov">
  <div class="grid-box">
    <div class="grid-head">
      <span data-i18n="al.title"></span>
      <span class="al-sum"><span id="al-count"></span><span class="al-pts"><img alt="" src="art/icons/coin.webp"><b id="al-pts"></b></span></span>
      <button class="btn" id="album-close" type="button" data-i18n="hub.close"></button>
    </div>
    <div class="al-bar"><i id="al-bar"></i></div>
    <div class="album" id="album"></div>
  </div>
</div>
<!-- одна карточка крупно -->
<div class="card-ov hidden" id="card-ov">
  <div class="cv-wrap" id="cv-wrap">
    <div class="cv-card" id="cv-card"><div class="cv-face cv-back"></div><div class="cv-face cv-front" id="cv-front"></div></div>
  </div>
  <div class="cv-info">
    <div class="cv-r" id="cv-r"></div>
    <div class="cv-n" id="cv-n"></div>
    <div class="cv-h" data-i18n="al.how"></div>
    <div class="cv-d" id="cv-d"></div>
    <div class="cv-date" id="cv-date"></div>
    <button class="btn" id="cv-close" type="button" data-i18n="hub.close"></button>
  </div>
</div>

<div class="grid-ov hidden" id="grid-ov">
  <div class="grid-box">
    <div class="grid-head"><span data-i18n="hub.list"></span><button class="btn" id="grid-close" type="button" data-i18n="hub.close"></button></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

</body>
</html>
