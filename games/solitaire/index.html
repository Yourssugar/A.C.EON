<!-- Загрузчик: качает файлы из списка ниже с прогрессом и дописывает к ним ?v=.
     data-v МЕНЯТЬ ПРИ КАЖДОЙ ВЫКЛАДКЕ (и при изменениях в games/shared). -->
<script src="../shared/boot.js" data-v="12" defer></script>
<script type="application/json" id="boot-manifest">
{"files":[
  {"src":"../shared/arcade.css","kb":7},
  {"src":"css/solitaire.css","kb":14},
  {"src":"../shared/store.js","kb":3},
  {"src":"../shared/i18n.js","kb":3},
  {"src":"../shared/sound.js","kb":7},
  {"src":"../shared/arcade.js","kb":5},
  {"src":"../shared/achievements.js","kb":30},
  {"src":"js/lang.js","kb":18},
  {"src":"js/cards.js","kb":6},
  {"src":"js/rules.js","kb":14},
  {"src":"js/solitaire.js","kb":28},
  {"src":"js/bjrules.js","kb":4},
  {"src":"js/blackjack.js","kb":16},
  {"src":"js/durules.js","kb":13},
  {"src":"js/durak.js","kb":17},
  {"src":"js/hrrules.js","kb":11},
  {"src":"js/hearts.js","kb":16},
  {"src":"js/cerules.js","kb":11},
  {"src":"js/eights.js","kb":16}
]}
</script>

<!-- Обложка загрузки: четыре карты переворачиваются вместе с прогрессом (--p от загрузчика) -->
<template id="boot-skin">
  <style>
    .bs-fan{display:flex;gap:10px;}
    .bs-fan i{width:46px;height:64px;border-radius:5px;border:2px solid #2ad6c8;background:#0a1430;
      --k:clamp(0,calc((var(--p) - var(--t)) * 6),1);opacity:calc(.25 + .75 * var(--k));transform:translateY(calc(10px - 10px * var(--k)));
      transition:opacity .25s,transform .25s;display:flex;align-items:center;justify-content:center;font-size:24px;color:#ff2d78;font-style:normal;}
    .bs-fan i:nth-child(odd){color:#e8f4ff;}
    .bs-title{font-size:clamp(14px,4vw,22px);letter-spacing:.3em;color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.8);padding-left:.3em;}
    .bs-brand{font-size:9px;letter-spacing:.5em;color:#ff2d78;text-shadow:0 0 10px #ff2d78;padding-left:.5em;margin-bottom:-14px;}
  </style>
  <div class="bs-brand">A.C.EON</div>
  <div class="bs-title">CARDS</div>
  <div class="bs-fan"><i style="--t:0">&#9824;</i><i style="--t:.25">&#9829;</i><i style="--t:.5">&#9827;</i><i style="--t:.75">&#9830;</i></div>
</template>
</head>

<main class="sl-game" id="game">

    <div class="hud-btns">

      <button class="btn" id="btn-hint">? <span data-i18n="hud.hint"></span></button>
      <button class="btn btn-finish hidden" id="btn-finish"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1L3 9h4l-1 6 6-8H8z" fill="currentColor"/></svg> <span data-i18n="hud.finish"></span></button>

    <span data-i18n="stuck.text"></span>
