<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>A.C.EON TOWER</title>

<!-- Загрузчик: качает файлы из списка ниже с прогрессом и дописывает к ним ?v=.
     data-v МЕНЯТЬ ПРИ КАЖДОЙ ВЫКЛАДКЕ (и при изменениях в games/shared). -->
<script src="../shared/boot.js" data-v="3" defer></script>
<script type="application/json" id="boot-manifest">
{"files":[
  {"src":"../shared/arcade.css","kb":7},
  {"src":"css/stacker.css","kb":14},
  {"src":"../shared/store.js","kb":3},
  {"src":"../shared/i18n.js","kb":3},
  {"src":"../shared/sound.js","kb":9},
  {"src":"../shared/arcade.js","kb":5},
  {"src":"../shared/achievements.js","kb":30},
  {"src":"js/lang.js","kb":17},
  {"src":"js/rules.js","kb":6},
  {"src":"js/stacker.js","kb":20}
]}
</script>

<!-- Обложка загрузки: башня растёт по мере загрузки (--p от загрузчика) -->
<template id="boot-skin">
  <style>
    .tw-t{position:relative;width:90px;height:110px;border-bottom:3px solid #00e5ff;}
    .tw-t i{position:absolute;left:50%;height:14px;transform:translateX(-50%);opacity:calc(var(--p) * 6 - var(--k));
      background:linear-gradient(#ffb02e,#c06a00);box-shadow:0 0 8px rgba(255,176,46,.6);}
    .tw-n{font-size:clamp(14px,4vw,22px);letter-spacing:.3em;color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.8);padding-left:.3em;}
    .tw-b{font-size:9px;letter-spacing:.5em;color:#ff2d78;text-shadow:0 0 10px #ff2d78;padding-left:.5em;margin-bottom:-14px;}
  </style>
  <div class="tw-b">A.C.EON</div>
  <div class="tw-n">TOWER</div>
  <div class="tw-t"><i style="--k:0;bottom:0;width:80px"></i><i style="--k:1;bottom:16px;width:72px"></i><i style="--k:2;bottom:32px;width:66px"></i><i style="--k:3;bottom:48px;width:62px"></i><i style="--k:4;bottom:64px;width:56px"></i><i style="--k:5;bottom:80px;width:50px"></i></div>
</template>
</head>
<body class="screen-menu">

<main class="m-menu" id="menu">
  <div class="m-head">
    <h1 class="m-title"><span class="m-brand">A.C.EON</span><span data-i18n="t.title"></span></h1>
    <div class="m-sub" data-i18n="menu.sub"></div>
  </div>
  <div class="m-cols">
    <section class="m-card">
      <h2 class="m-h" data-i18n="menu.mode"></h2>
      <div class="mode-list" id="mode-list"></div>
      <div class="adv-box hidden" id="lv-box">
        <div class="lv-head"><h2 class="m-h m-h2" data-i18n="menu.levels"></h2><span class="lv-stars" id="lv-stars"></span></div>
        <div class="levels" id="levels"></div>
        <div class="opt-note" id="lv-note"></div>
      </div>
    </section>
    <section class="m-card">
      <h2 class="m-h" data-i18n="menu.opts"></h2>
      <div class="opt-row"><span class="opt-lbl" data-i18n="opt.theme"></span>
        <div class="seg" id="seg-theme">
          <button class="seg-btn" data-v="neon" data-i18n="theme.neon"></button>
          <button class="seg-btn" data-v="flat" data-i18n="theme.flat"></button>
        </div></div>
      <h2 class="m-h m-h2" data-i18n="menu.ctrl"></h2>
      <div class="opt-note" data-i18n="note.ctrl"></div>
      <h2 class="m-h m-h2" data-i18n="menu.stats"></h2>
      <div class="over-rows" id="stats"></div>
    </section>
  </div>
  <div class="m-actions">
    <button class="btn m-play" id="btn-play">&#9654; <span data-i18n="menu.play"></span></button>
  </div>
</main>

<main class="t-game" id="game">
  <div class="hud">
    <div class="hud-mode" id="hud-mode"></div>
    <div class="hud-cells" id="hud-cells"></div>
    <div class="hud-btns">
      <button class="btn" id="btn-pause"><svg class="i-pause" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="3" height="8" fill="currentColor"/><rect x="6" y="1" width="3" height="8" fill="currentColor"/></svg><span data-i18n="hud.pause"></span></button>
      <button class="btn" id="btn-menu">&#9664; <span data-i18n="hud.menu"></span></button>
    </div>
  </div>
  <div class="arena" id="arena">
    <div class="well" id="well">
      <canvas id="cv"></canvas>
      <div class="fx" id="fx"></div>
      <div class="hint hidden" id="hint" data-i18n="hint.start"></div>
      <div class="pause-ov hidden" id="pause-ov">
        <div class="po-title" data-i18n="pause.title"></div>
        <button class="btn po-go" id="po-go">&#9654; <span data-i18n="pause.go"></span></button>
        <button class="btn" id="po-restart" data-i18n="pause.restart"></button>
        <button class="btn" id="po-menu" data-i18n="pause.menu"></button>
      </div>
    </div>
  </div>
</main>

<div class="arc-modal hidden over-modal" id="over-modal">
  <div class="arc-box over-box">
    <div class="over-title" id="over-title"></div>
    <div class="stars-big" id="over-stars"></div>
    <div class="over-rec hidden" id="over-rec" data-i18n="over.record"></div>
    <div class="over-rows" id="over-rows"></div>
    <div class="over-btns">
      <button class="btn b-next hidden" id="over-next">&#9654; <span data-i18n="over.next"></span></button>
      <button class="btn" id="over-retry" data-i18n="over.retry"></button>
      <button class="btn" id="over-menu" data-i18n="over.menu"></button>
    </div>
  </div>
</div>
</body>
</html>
