<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>A.C.EON WORDLE</title>

<!-- Загрузчик: качает файлы из списка ниже с прогрессом и дописывает к ним ?v=.
     data-v МЕНЯТЬ ПРИ КАЖДОЙ ВЫКЛАДКЕ (и при изменениях в games/shared).
     Словари words-ru.js и words-en.js здесь не указаны: игра подгружает нужный сама. -->
<script src="../shared/boot.js" data-v="5" defer></script>
<script type="application/json" id="boot-manifest">
{"files":[
  {"src":"../shared/arcade.css","kb":7},
  {"src":"css/wordle.css","kb":10},
  {"src":"../shared/store.js","kb":3},
  {"src":"../shared/i18n.js","kb":3},
  {"src":"../shared/sound.js","kb":9},
  {"src":"../shared/arcade.js","kb":5},
  {"src":"../shared/achievements.js","kb":30},
  {"src":"js/lang.js","kb":20},
  {"src":"js/rules.js","kb":3},
  {"src":"js/fx.js","kb":5},
  {"src":"js/wordle.js","kb":20}
]}
</script>

<!-- Обложка загрузки: плитки по очереди становятся зелёными (--p от загрузчика) -->
<template id="boot-skin">
  <style>
    .wl-t{display:flex;gap:6px;}
    .wl-t i{width:30px;height:30px;border:2px solid #2a2a55;font-style:normal;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
    .wl-t i{background:rgba(31,212,122,calc(var(--p) * 5 - var(--k)));border-color:rgba(31,212,122,calc(var(--p) * 5 - var(--k)));}
    .wl-n{font-size:clamp(14px,4vw,22px);letter-spacing:.3em;color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.8);padding-left:.3em;}
    .wl-b{font-size:9px;letter-spacing:.5em;color:#ff2d78;text-shadow:0 0 10px #ff2d78;padding-left:.5em;margin-bottom:-14px;}
  </style>
  <div class="wl-b">A.C.EON</div>
  <div class="wl-n">WORDLE</div>
  <div class="wl-t"><i style="--k:0">W</i><i style="--k:1">O</i><i style="--k:2">R</i><i style="--k:3">D</i><i style="--k:4">S</i></div>
</template>
</head>
<body class="screen-menu">

<main class="m-menu" id="menu">
  <div class="m-head">
    <h1 class="m-title"><span class="m-brand">A.C.EON</span><span data-i18n="t.title"></span></h1>
    <div class="m-sub" data-i18n="menu.sub"></div>
  </div>
  <div class="m-cols">
    <section class="m-card">
      <h2 class="m-h" data-i18n="menu.mode"></h2>
      <div class="mode-list" id="mode-list"></div>
      <div class="opt-note" id="mode-note"></div>
      <h2 class="m-h m-h2" data-i18n="menu.how"></h2>
      <div class="how">
        <div class="how-row"><span class="tile shown ok"><span class="tf">A</span><span class="tb">A</span></span><span data-i18n="how.ok"></span></div>
        <div class="how-row"><span class="tile shown pr"><span class="tf">B</span><span class="tb">B</span></span><span data-i18n="how.pr"></span></div>
        <div class="how-row"><span class="tile shown ab"><span class="tf">C</span><span class="tb">C</span></span><span data-i18n="how.ab"></span></div>
      </div>
    </section>
    <section class="m-card">
      <h2 class="m-h" data-i18n="menu.opts"></h2>
      <div class="opt-row"><span class="opt-lbl" data-i18n="opt.wlang"></span>
        <div class="seg" id="seg-wlang">
          <button class="seg-btn" data-v="ru" data-i18n="wl.ru"></button>
          <button class="seg-btn" data-v="en" data-i18n="wl.en"></button>
        </div></div>
      <div class="opt-note" data-i18n="note.wlang"></div>
      <div class="opt-row" id="row-len"><span class="opt-lbl" data-i18n="opt.len"></span>
        <div class="seg" id="seg-len">
          <button class="seg-btn" data-v="4">4</button>
          <button class="seg-btn" data-v="5">5</button>
          <button class="seg-btn" data-v="6">6</button>
        </div></div>
      <div class="opt-row"><span class="opt-lbl" data-i18n="opt.hard"></span>
        <div class="seg" id="seg-hard">
          <button class="seg-btn" data-v="0" data-i18n="opt.hardOff"></button>
          <button class="seg-btn" data-v="1" data-i18n="opt.hardOn"></button>
        </div></div>
      <div class="opt-note" data-i18n="note.hard"></div>
      <div class="opt-row"><span class="opt-lbl" data-i18n="opt.bg"></span>
        <div class="seg" id="seg-bg">
          <button class="seg-btn" data-v="library" data-i18n="bg.library"></button>
          <button class="seg-btn" data-v="space" data-i18n="bg.space"></button>
          <button class="seg-btn" data-v="study" data-i18n="bg.study"></button>
          <button class="seg-btn" data-v="none" data-i18n="bg.none"></button>
        </div></div>
      <div class="opt-row"><span class="opt-lbl" data-i18n="opt.colors"></span>
        <div class="seg" id="seg-colors">
          <button class="seg-btn" data-v="normal" data-i18n="colors.normal"></button>
          <button class="seg-btn" data-v="contrast" data-i18n="colors.contrast"></button>
        </div></div>
      <div class="opt-note" data-i18n="note.colors"></div>
      <h2 class="m-h m-h2" data-i18n="menu.stats"></h2>
      <div class="over-rows" id="stats"></div>
    </section>
  </div>
  <div class="m-actions">
    <button class="btn m-play" id="btn-play">&#9654; <span data-i18n="menu.play"></span></button>
  </div>
</main>

<main class="t-game" id="game">
  <div class="hud">
    <div class="hud-mode" id="hud-mode"></div>
    <div class="hud-cells" id="hud-cells"></div>
    <div class="hud-btns">
      <button class="btn hidden" id="btn-skip"><span data-i18n="hud.skip"></span></button>
      <button class="btn" id="btn-menu">&#9664; <span data-i18n="hud.menu"></span></button>
    </div>
  </div>
  <div class="arena" id="arena">
    <div class="msg" id="msg"></div>
    <div class="board" id="board"></div>
    <div class="kb" id="kb"></div>
    <div class="pause-ov hidden" id="pause-ov">
      <div class="po-title" data-i18n="pause.title"></div>
      <button class="btn po-go" id="po-go">&#9654; <span data-i18n="pause.go"></span></button>
      <button class="btn" id="po-menu" data-i18n="pause.menu"></button>
    </div>
  </div>
</main>

<div class="arc-modal hidden over-modal" id="over-modal">
  <div class="arc-box over-box">
    <img class="over-img hidden" id="over-img" alt="">
    <div class="over-title" id="over-title"></div>
    <div class="over-word" id="over-word"></div>
    <div class="over-rec hidden" id="over-rec" data-i18n="over.record"></div>
    <div class="over-rows" id="over-rows"></div>
    <div class="over-btns">
      <button class="btn b-next" id="over-share"><span data-i18n="over.share"></span></button>
      <button class="btn b-next" id="over-next">&#9654; <span data-i18n="over.next"></span></button>
      <button class="btn" id="over-close" data-i18n="over.board"></button>
      <button class="btn" id="over-menu" data-i18n="over.menu"></button>
    </div>
  </div>
</div>
</body>
</html>
