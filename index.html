<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.C.EON STUDIO — [ENCRYPTED]</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=JetBrains+Mono:wght@300;400&display=swap');
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      background:#000;
      overflow:hidden;
      cursor:none;
      user-select:none;
      font-family:'JetBrains Mono','Courier New',monospace;
    }
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }

    /* ═══ VORTEX CANVAS ═══ */
    #vortex { position:fixed; inset:0; z-index:1; display:block; }

    #vig {
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background:radial-gradient(ellipse at 50% 46%, transparent 38%, rgba(0,0,0,.78) 100%);
    }
    #scan {
      position:fixed; inset:0; z-index:3; pointer-events:none;
      background:repeating-linear-gradient(0deg, rgba(255,255,255,.013) 0 1px, transparent 1px 3px);
      mix-blend-mode:overlay;
    }

    /* iris — закрывается при переходе */
    #iris {
      position:fixed; left:50%; top:46%; width:260vmax; height:260vmax;
      transform:translate(-50%,-50%) scale(1); z-index:80; pointer-events:none;
      background:radial-gradient(circle, transparent 30%, rgba(0,0,0,.55) 46%, #000 62%);
      opacity:0;
      transition:opacity 1.5s cubic-bezier(.55,0,.8,.4), transform 1.6s cubic-bezier(.55,0,.85,.35);
    }
    #iris.close { opacity:1; transform:translate(-50%,-50%) scale(.18); }

    /* ═══ TEARS / SIGNAL BROKEN ═══ */
    #tears { position:fixed; inset:0; z-index:40; pointer-events:none; overflow:hidden; }
    .tear {
      position:absolute; left:0; right:0; pointer-events:none;
      background:linear-gradient(90deg, rgba(221,0,37,.10), rgba(200,200,200,.06) 30%, rgba(0,136,187,.10));
      mix-blend-mode:screen;
    }
    #sigbroken {
      position:fixed; z-index:45; pointer-events:none;
      font-family:'Rajdhani',sans-serif; font-weight:700;
      font-size:clamp(18px,3vw,30px); letter-spacing:12px;
      color:#dd0025; text-shadow:0 0 18px rgba(221,0,37,.5), 2px 0 #0088bb;
      opacity:0; transform:skewX(-8deg);
    }
    #sigbroken.on { animation:sbflash .38s steps(3) 1; }
    @keyframes sbflash { 0%{opacity:0} 20%{opacity:.9} 45%{opacity:.15} 70%{opacity:.85} 100%{opacity:0} }

    /* ═══ BOOT ═══ */
    #boot {
      position:fixed; inset:0; z-index:120; background:#000;
      padding:26px; color:#00993a; font-size:11px; line-height:2; letter-spacing:2px;
      transition:opacity .8s ease;
    }
    #boot.gone { opacity:0; pointer-events:none; }

    /* ═══ HUD ═══ */
    #hud { position:fixed; top:14px; right:18px; z-index:50; font-size:10px; letter-spacing:3px; text-align:right; line-height:2.1; pointer-events:none; transition:opacity .6s; }
    .hg  { color:#003a12; animation:npls 4s ease-in-out infinite; }
    .hgg { color:#001d09; }
    @keyframes npls { 0%,100%{opacity:1} 50%{opacity:.08} }
    #hud-l { position:fixed; top:14px; left:18px; z-index:50; font-size:9px; letter-spacing:3px; line-height:2.1; color:#141414; pointer-events:none; transition:opacity .6s; }
    #sb {
      position:fixed; bottom:12px; left:18px; right:18px; z-index:50;
      display:flex; justify-content:space-between;
      font-size:9px; color:#101010; letter-spacing:2px; pointer-events:none; transition:opacity .6s;
    }
    .fadeout { opacity:0 !important; }

    /* ═══ STAGE ═══ */
    #stage {
      position:fixed; inset:0; z-index:20;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      pointer-events:none;
      transform-origin:50% 46%;
      animation:camBreath 11s ease-in-out infinite;
    }
    @keyframes camBreath {
      0%,100%{ transform:scale(1) rotate(0deg); }
      50%    { transform:scale(1.014) rotate(.35deg); }
    }
    #stage.suck {
      animation:none;
      transition:transform 1.55s cubic-bezier(.62,-.08,.9,.35), opacity 1.45s cubic-bezier(.7,0,1,.5), filter 1.4s ease-in;
      transform:scale(.015) rotate(620deg);
      opacity:0;
      filter:blur(2px) brightness(1.6);
    }
    .st-in { opacity:0; transform:translateY(14px); transition:opacity .9s ease, transform .9s ease; }
    .st-in.on { opacity:1; transform:translateY(0); }

    /* ── living logo ── */
    #logo-wrap { position:relative; text-align:center; pointer-events:none; }
    .ttl {
      font-family:'Rajdhani','Arial Narrow',sans-serif;
      font-size:clamp(38px,7vw,72px); font-weight:700;
      color:#c8c8c8; letter-spacing:.14em; line-height:1;
      position:relative; display:inline-block;
      animation:breath 6s ease-in-out infinite;
    }
    @keyframes breath {
      0%,100%{ text-shadow:0 0 18px rgba(200,200,200,.07); }
      50%    { text-shadow:0 0 34px rgba(200,200,200,.16), 0 0 70px rgba(0,150,200,.07); }
    }
    .ttl::before {
      content:attr(data-text); position:absolute; top:0; left:0;
      color:#dd0025; clip-path:inset(0 0 54% 0); animation:ga 7s infinite;
    }
    .ttl::after {
      content:attr(data-text); position:absolute; top:0; left:0;
      color:#0088bb; clip-path:inset(50% 0 0 0); animation:gb 7s infinite;
    }
    @keyframes ga { 0%,89%,100%{transform:translate(0);opacity:0;} 90%{transform:translate(-8px,2px);opacity:1;} 91%{transform:translate(6px,-1px);opacity:1;} 92%{transform:translate(-3px,1px);opacity:1;} 93%{opacity:0;} }
    @keyframes gb { 0%,85%,100%{transform:translate(0);opacity:0;} 86%{transform:translate(8px,-2px);opacity:1;} 87%{transform:translate(-6px,2px);opacity:1;} 88%{opacity:0;} }
    #logo-scan {
      position:absolute; top:-8%; bottom:-8%; width:34px; left:-40px;
      background:linear-gradient(90deg, transparent, rgba(0,170,204,.14) 45%, rgba(255,255,255,.10) 50%, rgba(0,170,204,.14) 55%, transparent);
      pointer-events:none; opacity:0;
    }
    #logo-scan.run { animation:lscan 2.2s cubic-bezier(.6,0,.4,1) 1; }
    @keyframes lscan { 0%{left:-40px;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{left:calc(100% + 10px);opacity:0} }
    #sub { font-size:10px; color:#1c1c1c; letter-spacing:6px; margin-top:14px; }

    /* ── auth ── */
    #auth { margin-top:52px; pointer-events:auto; width:min(340px,84vw); }
    .pwlb { font-size:9px; color:#1a1a1a; letter-spacing:4px; margin-bottom:7px; transition:color .4s; }
    #auth.open .pwlb { color:#00733a; }
    .pwbx {
      border:1px solid #161616; display:flex; align-items:center;
      background:rgba(0,0,0,.94);
      transition:border-color .4s, box-shadow .4s;
    }
    #auth.open .pwbx { border-color:#004a1e; box-shadow:0 0 18px rgba(0,140,60,.10), inset 0 0 10px rgba(0,140,60,.04); }
    .pwpr { padding:9px 11px; font-size:11px; color:#222; transition:color .4s; }
    #auth.open .pwpr { color:#00733a; }
    .pwip {
      background:transparent; border:none; outline:none; color:#5a5a5a;
      font-family:inherit; font-size:11px; padding:9px 7px; flex:1; min-width:0;
      letter-spacing:3px; cursor:none;
    }
    .pwip::placeholder { color:#101010; }
    #auth.open .pwip { color:#00a344; }
    .pwbt {
      border:none; border-left:1px solid #161616; background:transparent;
      color:#1c1c1c; font-family:inherit; font-size:9px; padding:9px 13px;
      cursor:none; letter-spacing:3px; transition:color .2s, border-color .4s;
    }
    #auth.open .pwbt { border-left-color:#004a1e; color:#00552a; }
    .pwbt:hover { color:#00a344; }
    .pwbt:disabled { color:#0e0e0e; }
    #pwstat { font-size:9px; min-height:14px; margin-top:8px; letter-spacing:2px; color:#141414; transition:color .3s; }
    #pwstat.live { color:#00893c; }
    #pwstat.err  { color:#cc001f; }

    /* ── routes ── */
    #routes { margin-top:34px; display:flex; gap:22px; pointer-events:auto; flex-wrap:wrap; justify-content:center; }
    .rbtn {
      position:relative;
      font-family:'JetBrains Mono',monospace; font-weight:400;
      font-size:10px; letter-spacing:5px;
      padding:9px 24px; text-decoration:none; white-space:nowrap;
      cursor:none; display:inline-block;
      clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));
      transition:transform .2s, box-shadow .22s;
    }
    #btn-info {
      color:#00cc66; border:1px solid #00cc66; background:rgba(0,18,8,.92);
      animation:mystPulse 2.1s ease-in-out infinite;
    }
    #btn-info:hover { transform:translateY(-2px); box-shadow:0 0 24px rgba(0,204,102,.55), inset 0 0 10px rgba(0,204,102,.08); }
    #btn-core {
      color:#4DAFFF; border:1px solid #4DAFFF; background:rgba(0,8,20,.92);
      animation:corePulse 2.7s ease-in-out infinite;
    }
    #btn-core:hover { transform:translateY(-2px); box-shadow:0 0 24px rgba(77,175,255,.5), inset 0 0 10px rgba(77,175,255,.07); }
    @keyframes mystPulse { 0%,100%{box-shadow:0 0 6px rgba(0,204,102,.3)} 50%{box-shadow:0 0 20px rgba(0,204,102,.62)} }
    @keyframes corePulse { 0%,100%{box-shadow:0 0 5px rgba(77,175,255,.22)} 50%{box-shadow:0 0 18px rgba(77,175,255,.52)} }
    .rbtn.shake { animation:bshake .35s linear; }
    @keyframes bshake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-3px) skewX(-1deg)}
      40%{transform:translateX(3px) skewX(1deg)} 60%{transform:translateX(-2px)} 80%{transform:translateX(2px)}
    }
    .rbtn.flicker-red { color:#cc2233 !important; border-color:#cc2233 !important; }
    .rbtn.flicker-dim { color:#1a5a88 !important; border-color:#1a5a88 !important; }
    #core-hover {
      position:absolute; left:50%; top:calc(100% + 10px); transform:translateX(-50%);
      font-size:8px; letter-spacing:3px; color:#2a7fc0; white-space:nowrap;
      display:flex; align-items:center; gap:8px;
      opacity:0; transition:opacity .25s; pointer-events:none;
    }
    #btn-core:hover #core-hover { opacity:1; }
    .sigbars { display:inline-flex; gap:2px; align-items:flex-end; height:9px; }
    .sigbars i { width:2px; background:#2a7fc0; animation:sig 1s ease-in-out infinite; }
    .sigbars i:nth-child(1){height:3px;animation-delay:0s}
    .sigbars i:nth-child(2){height:5px;animation-delay:.12s}
    .sigbars i:nth-child(3){height:7px;animation-delay:.24s}
    .sigbars i:nth-child(4){height:9px;animation-delay:.36s}
    @keyframes sig { 0%,100%{opacity:.2} 50%{opacity:1} }

    /* статусная строка перехода */
    #warp-line {
      position:fixed; left:50%; top:46%; transform:translate(-50%,-50%);
      z-index:90; font-size:10px; letter-spacing:6px; color:#4DAFFF;
      text-shadow:0 0 14px rgba(77,175,255,.6);
      opacity:0; pointer-events:none; transition:opacity .4s;
    }
    #warp-line.on { opacity:1; animation:warpPulse .5s ease-in-out infinite; }
    @keyframes warpPulse { 0%,100%{opacity:.55} 50%{opacity:1} }

    /* ═══ CURSOR ═══ */
    #cur { position:fixed; z-index:1000; width:34px; height:34px; margin-left:-17px; margin-top:-17px; pointer-events:none; top:-50px; left:-50px; }
    #currot { animation:crspin 9s linear infinite; transform-origin:50% 50%; transform-box:fill-box; }
    @keyframes crspin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

    @media(max-width:560px){
      #routes { flex-direction:column; align-items:center; gap:16px; }
      #core-hover { display:none; }
    }
  </style>
</head>
<body>

  <line x1="23" y1="17" x2="33" y2="17" stroke="#3c3c3c" stroke-width="0.5"/>
  <circle cx="17" cy="17" r="1.5" fill="#3c3c3c"/>
</svg>

<audio id="bgm" preload="none"></audio>

<script>
(function(){
  'use strict';
  var gch='!<>_[]{}=+#\u2593\u2592\u2591\u2573~';
  var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ═══════════════════════════════════════════
     ГРАВИТАЦИОННЫЙ ВОДОВОРОТ
     полярная система: угол ускоряется к центру,
     радиус медленно падает, трейлы — от полупрозрачной очистки
  ═══════════════════════════════════════════ */
  var canvas=document.getElementById('vortex');
  var ctx=canvas.getContext('2d');
  var W=0,H=0,CX=0,CY=0,MAXR=0;
  var DPR=Math.min(window.devicePixelRatio||1,2);
  var mouseX=.5,mouseY=.5;

  /* глобальное состояние воронки */
  var VX={ g:1, target:1, warp:false, worldA:0 };

  var SQUASH=.80;           /* сплющивание диска (перспектива) */
  var TILT=-0.10;           /* лёгкий наклон диска, рад */
  var CORE_R=26;            /* радиус чёрного ядра */

  var phrases=[
    'A.C.EON','SIGNAL','OBSERVER 01','440HZ','FRAGMENT','LAYER_01',
    'WHO ARE YOU','NOT SIMULATION','01001000','THE VOID','RECORDED','WATCHING'
  ];
  function randChar(){ return Math.random()<.3 ? gch[Math.random()*gch.length|0]
                     : String.fromCharCode(33+(Math.random()*93|0)); }

  var parts=[];
  function makeP(atEdge){
    var r = atEdge ? MAXR*(1.0+Math.random()*.4)
                   : CORE_R+Math.pow(Math.random(),.6)*MAXR;
    var glyph=Math.random()<.4;
    var acc=null, rr=Math.random();
    if(rr<.045)acc=[0,190,90];        /* зелёный */
    else if(rr<.07)acc=[210,20,50];   /* красный */
    var word=null;
    if(glyph&&Math.random()<.14) word=phrases[Math.random()*phrases.length|0];
    return {
      r:r, a:Math.random()*Math.PI*2,
      z:.35+Math.random()*.65,                 /* глубина: скорость+размер+яркость */
      glyph:glyph, ch:randChar(), word:word,
      size:glyph?(8+Math.random()*8):(1+Math.random()*1.8),
      acc:acc,
      wob:Math.random()*Math.PI*2              /* вертикальное колебание */
    };
  }

  function resize(){
    W=window.innerWidth;H=window.innerHeight;
    CX=W/2; CY=H*.46;
    MAXR=Math.sqrt(W*W+H*H)*.62;
    canvas.width=W*DPR;canvas.height=H*DPR;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    var n=Math.min(560,Math.max(220,(W*H/2600)|0));
    parts=[];
    for(var i=0;i<n;i++)parts.push(makeP(false));
  }
  window.addEventListener('resize',resize);
  resize();

  var cosT=Math.cos(TILT), sinT=Math.sin(TILT);
  var last=performance.now(), tGlobal=0;

  function draw(now){
    var dt=Math.min((now-last)/1000,.05); last=now; tGlobal+=dt;

    /* плавный разгон при варпе */
    VX.g += (VX.target-VX.g)*(VX.warp?.045:.02);
    VX.worldA += dt*.03*VX.g;

    /* трейлы: чем быстрее воронка — тем длиннее хвосты */
    var clearA = VX.warp ? .13 : .24;
    ctx.fillStyle='rgba(0,0,0,'+clearA+')';
    ctx.fillRect(0,0,W,H);

    var px=(mouseX-.5)*26, py=(mouseY-.5)*18;

    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      /* кеплеровское вращение: ближе к центру — быстрее */
      var spin=( .10 + 90/(p.r+50) ) * p.z * VX.g;
      p.a += spin*dt;
      /* затягивание */
      var pull=( 4 + 1600/(p.r+40) ) * p.z * VX.g * (VX.warp?2.6:1);
      p.r -= pull*dt;
      p.wob += dt*(.6+p.z);

      if(p.r<=CORE_R*.55){
        if(VX.warp){ p.r=MAXR*(1+Math.random()*.5); p.a=Math.random()*Math.PI*2; }
        else parts[i]=makeP(true);
        continue;
      }

      var A=p.a+VX.worldA;
      var ex=Math.cos(A)*p.r;
      var ey=Math.sin(A)*p.r*SQUASH + Math.sin(p.wob)*3*p.z;
      /* наклон диска */
      var x=ex*cosT-ey*sinT, y=ex*sinT+ey*cosT;
      var sx=CX+x+px*p.z, sy=CY+y+py*p.z;
      if(sx<-30||sx>W+30||sy<-30||sy>H+30)continue;

      /* яркость и «нагрев» ближе к ядру */
      var heat=Math.max(0,1-p.r/(MAXR*.55));           /* 0 — далеко, 1 — у ядра */
      var alpha=p.z*(.10+heat*.65)*(VX.warp?1.25:1);
      /* цвет: серый вдали -> холодный циан у ядра; акценты — фирменные */
      var cr,cg,cb;
      if(p.acc){ cr=p.acc[0];cg=p.acc[1];cb=p.acc[2]; }
      else{
        cr=(110-heat*55)|0;
        cg=(120+heat*70)|0;
        cb=(135+heat*120)|0;
      }

      if(p.glyph){
        if(Math.random()<.004)p.ch=randChar();
        ctx.font=(p.size*(1+heat*.4)|0)+'px "JetBrains Mono",monospace';
        ctx.fillStyle='rgba('+cr+','+cg+','+cb+','+alpha+')';
        if(p.word&&heat<.55){
          ctx.save();
          ctx.translate(sx,sy);
          ctx.rotate(A+Math.PI/2);
          ctx.fillText(p.word,0,0);
          ctx.restore();
        } else ctx.fillText(p.ch,sx,sy);
      } else {
        ctx.fillStyle='rgba('+cr+','+cg+','+cb+','+alpha+')';
        var s=p.size*(1+heat*.8);
        ctx.fillRect(sx,sy,s,s);
      }
    }

    /* ── ядро: аккреционное свечение + чёрная дыра ── */
    var flare=VX.warp?1.9:1;
    var g1=ctx.createRadialGradient(CX,CY,0,CX,CY,CORE_R*6*flare);
    g1.addColorStop(0,'rgba(60,180,230,'+(0.10*flare)+')');
    g1.addColorStop(.35,'rgba(30,110,170,'+(0.05*flare)+')');
    g1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g1;
    ctx.beginPath();ctx.arc(CX,CY,CORE_R*6*flare,0,Math.PI*2);ctx.fill();

    /* горизонт событий */
    ctx.save();
    ctx.translate(CX,CY);ctx.rotate(TILT);ctx.scale(1,SQUASH);
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(0,0,CORE_R,0,Math.PI*2);ctx.fill();
    /* тонкое кольцо фотонов */
    ctx.strokeStyle='rgba(90,200,255,'+(VX.warp?.5:.22)+')';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,0,CORE_R+2,0,Math.PI*2);ctx.stroke();
    /* вращающееся пунктирное кольцо */
    ctx.rotate(tGlobal*.5*VX.g);
    ctx.setLineDash([3,9]);
    ctx.strokeStyle='rgba(120,210,255,'+(VX.warp?.4:.14)+')';
    ctx.beginPath();ctx.arc(0,0,CORE_R+11,0,Math.PI*2);ctx.stroke();
    ctx.restore();

    requestAnimationFrame(draw);
  }
  if(!reduceMotion)requestAnimationFrame(draw);
  else{ ctx.fillStyle='#000';ctx.fillRect(0,0,W,H); }

  /* ═══════════ VORTEX-ПЕРЕХОД ═══════════ */
  var warping=false;
  var warpLine=document.getElementById('warp-line');
  function goVortex(href,label){
    if(warping)return; warping=true;
    VX.warp=true; VX.target=9;

    document.getElementById('stage').classList.add('suck');
    document.getElementById('hud').classList.add('fadeout');
    document.getElementById('hud-l').classList.add('fadeout');
    document.getElementById('sb').classList.add('fadeout');
    document.getElementById('iris').classList.add('close');

    setTimeout(function(){
      warpLine.textContent=label||'ENTERING SIGNAL';
      warpLine.classList.add('on');
    },650);
    setTimeout(tearBurst,300);
    setTimeout(tearBurst,900);
    setTimeout(function(){flash(.06);},1250);
    setTimeout(function(){flash(.12);},1580);
    setTimeout(function(){ window.location.href=href; },1750);
  }

  /* ═══════════ CURSOR ═══════════ */
  var cur=document.getElementById('cur');
  document.addEventListener('mousemove',function(e){
    mouseX=e.clientX/W; mouseY=e.clientY/H;
    cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px';
    if(Math.random()<.012&&!warping){
      var mx=e.clientX,my=e.clientY;
      cur.style.left=(mx+(Math.random()*10-5|0))+'px';
      cur.style.top=(my+(Math.random()*10-5|0))+'px';
      setTimeout(function(){cur.style.left=mx+'px';cur.style.top=my+'px';},75);
    }
  });
  document.addEventListener('mouseleave',function(){
    cur.style.left='-50px';cur.style.top='-50px';
  });

  /* ═══════════ GLITCH FX ═══════════ */
  var tears=document.getElementById('tears');
  function tearBurst(){
    if(reduceMotion)return;
    var n=2+(Math.random()*3|0);
    for(var i=0;i<n;i++){
      var el=document.createElement('div');
      el.className='tear';
      el.style.top=(Math.random()*100)+'%';
      el.style.height=(1+Math.random()*7|0)+'px';
      el.style.transform='translateX('+((Math.random()*24-12)|0)+'px)';
      tears.appendChild(el);
      (function(el){ setTimeout(function(){el.remove();},120+Math.random()*160|0); })(el);
    }
  }
  function schTear(){ setTimeout(function(){tearBurst();schTear();},3200+Math.random()*5600); }
  schTear();

  var sigb=document.getElementById('sigbroken');
  function signalBroken(){
    if(reduceMotion||warping)return;
    sigb.style.left=(12+Math.random()*56)+'%';
    sigb.style.top=(14+Math.random()*62)+'%';
    sigb.classList.remove('on'); void sigb.offsetWidth;
    sigb.classList.add('on');
    tearBurst();
  }
  function schSigB(){ setTimeout(function(){signalBroken();schSigB();},12000+Math.random()*16000); }
  setTimeout(schSigB,9000);

  function flash(alpha){
    var el=document.createElement('div');
    el.style.cssText='position:fixed;inset:0;background:rgba(220,240,255,'+(alpha||0.05)+');pointer-events:none;z-index:200;';
    document.body.appendChild(el);
    setTimeout(function(){el.remove();},60);
  }
  setInterval(function(){ if(Math.random()<.28&&!warping)flash(0.012+Math.random()*.018); },7500);

  /* ═══════════ GHOST PHRASES ═══════════ */
  var lagPool=['...are you there...','wrong channel','can you hear this','still here','not alone','signal broken','please respond','...hello...','it pulls everything','do not resist','closer now'];
  var lagC=0;
  function spawnLag(){
    if(lagC>=2||warping)return; lagC++;
    var phrase=lagPool[Math.random()*lagPool.length|0];
    var el=document.createElement('div');
    var vw=window.innerWidth,vh=window.innerHeight,x,y,tries=0;
    do{x=Math.random()*(vw-260)+20;y=Math.random()*(vh-80)+20;tries++;}
    while(tries<20&&x>vw*.24&&x<vw*.76&&y>vh*.22&&y<vh*.75);
    el.textContent=phrase;
    el.style.cssText='position:fixed;font-size:13px;color:transparent;letter-spacing:4px;pointer-events:none;white-space:nowrap;left:'+x+'px;top:'+y+'px;z-index:9;font-family:inherit;';
    document.body.appendChild(el);
    var life=0,total=55+Math.random()*40|0,peak=.26+Math.random()*.12,green=Math.random()<.22;
    var iv=setInterval(function(){
      life++;
      var a=life<=10?(life/10)*peak:life>=(total-14)?((total-life)/14)*peak:peak;
      var co=(life<total*.2||life>total*.78)?.45:.07;
      el.textContent=phrase.split('').map(function(c){return Math.random()<co?gch[Math.random()*gch.length|0]:c;}).join('');
      el.style.color=green?'rgba(0,'+(130+Math.random()*60|0)+',0,'+a+')':'rgba(175,175,175,'+a+')';
      if(life>=total){clearInterval(iv);el.remove();lagC--;}
    },50);
  }
  function schLag(){setTimeout(function(){spawnLag();schLag();},7000+Math.random()*9000);}
  setTimeout(function(){spawnLag();schLag();},6000);

  /* ═══════════ LIVING LOGO ═══════════ */
  var ttl=document.getElementById('ttl');
  var subel=document.getElementById('sub');
  var TORIG='A.C.EON STUDIO', SORIG='// HUMAN \u00b7 MACHINE \u00b7 SIGNAL //';
  function glitch(el,orig,n){
    var f=0,iv=setInterval(function(){
      el.textContent=orig.split('').map(function(c){return Math.random()>.79?gch[Math.random()*gch.length|0]:c;}).join('');
      if(++f>=n){clearInterval(iv);el.textContent=orig;}
    },55);
  }
  setInterval(function(){if(!warping)glitch(ttl,TORIG,16);},9000+Math.random()*4000|0);
  setInterval(function(){if(!warping)glitch(subel,SORIG,8);},13000+Math.random()*6000|0);
  setInterval(function(){
    if(reduceMotion||warping)return;
    if(Math.random()<.5){
      var dx=(Math.random()*2-1).toFixed(1), dy=(Math.random()*1.4-.7).toFixed(1);
      ttl.style.transform='translate('+dx+'px,'+dy+'px)';
      setTimeout(function(){ttl.style.transform='';},70);
    }
  },900);
  var lscan=document.getElementById('logo-scan');
  function runScan(){
    lscan.classList.remove('run'); void lscan.offsetWidth;
    lscan.classList.add('run');
  }
  function schScan(){ setTimeout(function(){runScan();schScan();},9000+Math.random()*9000); }
  setTimeout(schScan,4200);

  /* ═══════════ AUTH CHANNEL ═══════════ */
  var auth=document.getElementById('auth');
  var pwlb=document.getElementById('pwlb');
  var pwi=document.getElementById('pwi');
  var pwb=document.getElementById('pwb');
  var pwstat=document.getElementById('pwstat');

  pwi.addEventListener('focus',function(){
    auth.classList.add('open');
    pwlb.textContent='[ AUTH CHANNEL > OPENED ]';
    pwstat.className='live'; pwstat.textContent='> AUTH CHANNEL OPENED \u2014 LISTENING';
    tryStartMusic();
  });
  document.getElementById('pwbx').addEventListener('pointerdown',tryStartMusic);
  pwi.addEventListener('blur',function(){
    if(pwi.value)return;
    auth.classList.remove('open');
    pwlb.textContent='[ AUTH CHANNEL > STANDBY ]';
    if(pwstat.className==='live'){ pwstat.textContent=''; pwstat.className=''; }
  });
  pwi.addEventListener('input',function(){
    if(pwstat.className!=='err'){
      pwstat.className='live'; pwstat.textContent='> RECEIVING INPUT'+'.'.repeat(1+(pwi.value.length%3));
    }
  });

  var denies=[
    '> ACCESS DENIED \u2014 NO ACTIVE CODES THIS CYCLE',
    '> ALL CHANNELS SEALED \u2014 AWAIT BROADCAST',
    '> KEY NOT IN CURRENT TRANSMISSION',
    '> SIGNAL MISMATCH \u2014 NODE LOGGED ATTEMPT '
  ];
  function tryPass(){
    if(warping)return;
    var v=pwi.value.trim();
    pwb.disabled=true; pwb.textContent='.';
    pwstat.className='live';
    var dots=0,vi=setInterval(function(){
      pwstat.textContent='> VERIFYING'+' \u2593\u2592\u2591\u2592'.slice(0,1+(dots++%4));
    },110);
    /* воронка на миг ускоряется — система «пробует» ключ */
    VX.target=2.6;
    setTimeout(function(){ if(!warping)VX.target=1; },900);
    setTimeout(function(){
      clearInterval(vi);
      pwstat.className='err';
      if(!v){ pwstat.textContent='> NULL SIGNAL'; }
      else{
        var m=denies[Math.random()*denies.length|0];
        if(m.slice(-1)===' ')m+=Math.floor(Math.random()*9);
        pwstat.textContent=m;
        glitch(ttl,TORIG,14);
        tearBurst();
        if(Math.random()<.4)signalBroken();
      }
      pwb.textContent='OK'; pwb.disabled=false;
    },600+Math.random()*400|0);
  }
  pwb.onclick=tryPass;
  pwi.addEventListener('keydown',function(e){ if(e.key==='Enter')tryPass(); });

  /* ═══════════ ROUTE BUTTONS ═══════════ */
  var infoWords=['INFO','\u25b8 ARG','ACCESS','?????','\u25c8 SIGNAL','ENTER','\u25b8 INFO'];
  var coreWords=['\u25c6 CORE','NETWORK','A.C.EON','[CORE]','\u25b8 NODE','\u25c6 CORE'];
  var btnInfo=document.getElementById('btn-info');
  var btnCore=document.getElementById('btn-core');
  var coreLabelNode=btnCore.childNodes[0];

  function morphTo(setText,getText,target,steps,invert){
    var cu=getText();
    var maxLen=Math.max(cu.length,target.length,4);
    var f=0,iv=setInterval(function(){
      var s='';
      for(var i=0;i<maxLen;i++) s+=Math.random()>(invert?0.55:0.45)?gch[Math.random()*gch.length|0]:(target[i]||'');
      setText(s);
      if(++f>=steps){clearInterval(iv);setText(target);}
    },60);
  }
  var iwIdx=0;
  setInterval(function(){
    if(warping)return;
    iwIdx=(iwIdx+1)%infoWords.length;
    morphTo(function(s){btnInfo.textContent=s;},function(){return btnInfo.textContent;},infoWords[iwIdx],8+Math.random()*6|0,false);
    if(Math.random()<.45){btnInfo.classList.add('shake');setTimeout(function(){btnInfo.classList.remove('shake');},380);}
    if(Math.random()<.18){btnInfo.classList.add('flicker-red');setTimeout(function(){btnInfo.classList.remove('flicker-red');},220);}
  },3400+Math.random()*1800|0);

  var cwIdx=0;
  setInterval(function(){
    if(warping)return;
    cwIdx=(cwIdx+1)%coreWords.length;
    morphTo(function(s){coreLabelNode.textContent=s+' ';},function(){return coreLabelNode.textContent.trim();},coreWords[cwIdx],6+Math.random()*5|0,true);
    if(Math.random()<.3){btnCore.classList.add('shake');setTimeout(function(){btnCore.classList.remove('shake');},380);}
    if(Math.random()<.12){btnCore.classList.add('flicker-dim');setTimeout(function(){btnCore.classList.remove('flicker-dim');},180);}
  },4800+Math.random()*2400|0);

  /* переходы — через воронку */
  btnInfo.addEventListener('click',function(e){
    e.preventDefault();
    goVortex(btnInfo.getAttribute('href'),'PULLED INTO SIGNAL');
  });
  btnCore.addEventListener('click',function(e){
    e.preventDefault();
    goVortex(btnCore.getAttribute('href'),'CONNECTING A.C.EON NETWORK');
  });

  /* ═══════════ HUD / CLOCK ═══════════ */
  var nst=['OBSERVING','WATCHING','SCANNING','ANALYZING','WAITING'],ni=0;
  setInterval(function(){document.getElementById('ns1').textContent=nst[ni++%nst.length];},6200);
  setInterval(function(){
    if(Math.random()<.15){
      document.getElementById('nc1').textContent='SIG: '+String(Math.floor(Math.random()*7)+2).padStart(2,'0');
      setTimeout(function(){document.getElementById('nc1').textContent='SIG: 01';},1800);
    }
  },12000);
  var feeds=['FEED: LIVE','FEED: DRIFTING','FEED: LIVE','FEED: RESYNC'],fi=0;
  setInterval(function(){document.getElementById('feed').textContent=feeds[fi++%feeds.length];},8000);

  var t0=Date.now();
  function pad(n){return n.toString().padStart(2,'0');}
  setInterval(function(){
    var e=Math.floor((Date.now()-t0)/1000);
    var s=pad(e/3600|0)+':'+pad((e%3600)/60|0)+':'+pad(e%60);
    document.getElementById('tc1').textContent=s;
    document.getElementById('ut1').textContent='UP:'+s;
  },1000);
  var h16='0123456789ABCDEF';
  setInterval(function(){
    var r='';for(var i=0;i<4;i++)r+=h16[Math.random()*16|0];
    document.getElementById('ec1').textContent='ERR 0x'+r;
  },3800);

  /* ═══════════ BOOT ═══════════ */
  var boot=document.getElementById('boot');
  var bootLines=[
    '> A.C.EON NODE \u2014 COLD BOOT',
    '> GRAVITY WELL: STABLE',
    '> LAYER_01 \u2014 SINGULARITY MOUNTED',
    '> AUTH CHANNEL: STANDBY',
    '> RENDERING...'
  ];
  function typeBoot(i){
    if(i>=bootLines.length){
      setTimeout(function(){
        boot.classList.add('gone');
        var ins=document.querySelectorAll('.st-in');
        ins.forEach(function(el,k){ setTimeout(function(){el.classList.add('on');},300+k*450); });
        setTimeout(runScan,1400);
      },350);
      return;
    }
    var d=document.createElement('div');
    boot.appendChild(d);
    var line=bootLines[i],j=0;
    (function ch(){
      if(j<line.length){ d.textContent+=line[j++]; setTimeout(ch,8+Math.random()*18); }
      else setTimeout(function(){typeBoot(i+1);},90+Math.random()*160);
    })();
  }
  if(reduceMotion){
    boot.classList.add('gone');
    document.querySelectorAll('.st-in').forEach(function(el){el.classList.add('on');});
    /* переходы без анимации */
    [btnInfo,btnCore].forEach(function(b){
      b.addEventListener('click',function(e){
        e.stopImmediatePropagation();
      },true);
    });
  } else typeBoot(0);

  /* ═══════════ MUSIC ═══════════ */
  var bgmFired=false;
  var bgmTracks=['audio/track1.mp3','audio/track2.mp3'];
  function tryStartMusic(){
    if(bgmFired)return; bgmFired=true;
    var bgm=document.getElementById('bgm');
    if(!bgm)return;
    bgm.src=bgmTracks[Math.floor(Math.random()*bgmTracks.length)];
    bgm.volume=0;
    bgm.play().catch(function(){});
    setTimeout(function(){
      var vol=0,fiv=setInterval(function(){
        vol=Math.min(vol+0.04,0.65);bgm.volume=vol;
        if(vol>=0.65)clearInterval(fiv);
      },180);
    },1000);
  }

})();
</script>
</body>
</html>
