<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A.C.EON · INFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --txt:#eef2ff; --dim:#a9b3d6; --dim2:#7480a8;
  --glass:rgba(10,14,32,.58); --edge:rgba(160,180,255,.14);
  --acc:#40dcff; --acc2:#ffb35c;
  --games:#FF8040; --music:#A06EFF; --studio:#FFC83C; --tools:#32DCFF; --learn:#6EFA8C; --people:#FF50AF;
  --r:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{background:#05070f;color:var(--txt);font-family:'Manrope',system-ui,sans-serif;overflow-x:hidden}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:rgba(64,220,255,.35)}

/* фон: то же небо, что на главной, по времени суток; медленно дышит */
#sky{position:fixed;inset:-4%;z-index:0;background:#05070f center/cover no-repeat;opacity:0;transition:opacity 1.6s ease;
  animation:skyDrift 70s ease-in-out infinite alternate}
#sky.on{opacity:1}
@keyframes skyDrift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,1%)}}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 30%,rgba(5,7,15,.35),rgba(5,7,15,.82) 75%),linear-gradient(180deg,rgba(5,7,15,.15),rgba(5,7,15,.55))}

.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:22px 22px 80px}

/* верх: назад и навигация пилюлями */
.top{position:sticky;top:12px;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px;border-radius:999px;background:rgba(8,11,26,.62);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;text-decoration:none;
  font:600 12px/1 'Manrope',sans-serif;letter-spacing:.06em;color:var(--dim);border:1px solid transparent;
  transition:color .2s,background .2s,border-color .2s;white-space:nowrap;cursor:pointer;background:none}
.pill:hover{color:#fff;background:rgba(255,255,255,.06)}
.pill.back{color:#fff;background:rgba(64,220,255,.12);border-color:rgba(64,220,255,.35)}
.pill.back:hover{background:rgba(64,220,255,.22)}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}

/* герой */
.hero{text-align:center;padding:70px 10px 40px}
.kicker{font:600 11px/1 'JetBrains Mono',monospace;letter-spacing:.4em;color:var(--acc);text-transform:uppercase}
.h1{font:700 clamp(44px,8.5vw,96px)/1 'Rajdhani',sans-serif;letter-spacing:.12em;margin-top:18px;color:#fff;
  text-shadow:-1px 0 rgba(255,60,130,.55),1px 0 rgba(60,220,255,.55),0 0 34px rgba(110,190,255,.35)}
.h1x{font:600 clamp(16px,2.6vw,26px)/1.2 'Rajdhani',sans-serif;letter-spacing:.32em;margin-top:14px;color:#cfe6ff}
.h1x b{font-weight:700;color:#fff;text-shadow:0 0 16px rgba(60,220,255,.45)}
.lead{max-width:640px;margin:26px auto 0;font-size:clamp(15px,1.7vw,18px);line-height:1.75;color:#d7def5}

/* блоки */
section{margin-top:64px;scroll-margin-top:90px}
.sh{font:700 clamp(24px,3.4vw,34px)/1.1 'Rajdhani',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:14px}
.sh::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--c,var(--acc));box-shadow:0 0 14px var(--c,var(--acc))}
.ss{margin-top:10px;color:var(--dim);font-size:15px;line-height:1.7;max-width:720px}

.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 50px -24px rgba(0,0,0,.7)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.card{padding:28px 30px;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;
  background:radial-gradient(circle,var(--c,rgba(64,220,255,.5)),transparent 70%);opacity:.22;pointer-events:none}
.card h3{font:700 24px/1.1 'Rajdhani',sans-serif;letter-spacing:.1em;color:#fff;display:flex;align-items:center;gap:12px}
.card h3 svg{width:28px;height:28px;flex:none;stroke:var(--c);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--c))}
.tag{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font:600 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.card p{margin-top:14px;font-size:15px;line-height:1.75;color:#dce3f7}
.card p.dim{color:var(--dim)}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:12px 22px;border-radius:999px;text-decoration:none;
  font:700 13px/1 'Manrope',sans-serif;letter-spacing:.06em;color:#fff;background:color-mix(in srgb,var(--c,#40dcff) 22%,transparent);
  border:1px solid color-mix(in srgb,var(--c,#40dcff) 55%,transparent);transition:transform .2s,background .2s,box-shadow .2s;cursor:pointer}
.btn:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--c,#40dcff) 34%,transparent);box-shadow:0 0 24px -6px var(--c,#40dcff)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{padding:7px 14px;border-radius:999px;font:600 12px/1 'Manrope',sans-serif;color:#fff;
  background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}

/* карта сайта: сектор = скруглённая карточка, страницы = пилюли-строки */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;margin-top:24px}
.sec{padding:22px 22px 18px;--c:#40dcff}
.sec-h{display:flex;align-items:center;gap:14px}
.orb{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff 10%),color-mix(in srgb,var(--c) 30%,#05070f) 70%);
  box-shadow:0 0 22px -2px var(--c),inset 0 0 12px rgba(0,0,0,.4)}
.orb svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sec-n{font:700 20px/1 'Rajdhani',sans-serif;letter-spacing:.14em;color:#fff}
.sec-d{font-size:13px;color:var(--dim);margin-top:5px}
.sec-c{margin-left:auto;font:600 11px/1 'JetBrains Mono',monospace;color:var(--c);white-space:nowrap}
.pages{list-style:none;margin-top:16px;display:grid;gap:8px}
.pg{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;text-decoration:none;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);transition:background .2s,border-color .2s,transform .2s}
a.pg:hover{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 45%,transparent);transform:translateX(3px)}
.pg.off{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 8px var(--c)}
.pg.seen .dot{background:transparent;border:2px solid var(--c);box-shadow:none}
.pg-t{flex:1;min-width:0}
.pg-n{font:700 15px/1.2 'Manrope',sans-serif;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pg-s{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.st{font:600 10px/1 'JetBrains Mono',monospace;letter-spacing:.08em;padding:4px 8px;border-radius:999px;white-space:nowrap}
.st.beta{color:#ffd77a;background:rgba(255,200,60,.12)} .st.dev{color:#ffb070;background:rgba(255,128,64,.12)} .st.soon{color:#9aa3c8;background:rgba(255,255,255,.06)}
.new{font:700 10px/1 'JetBrains Mono',monospace;color:#05070f;background:var(--c);padding:3px 7px;border-radius:999px}
.ext{width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2;flex:none}

/* найдено: слова-коды круглыми жетонами */
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:24px}
.code{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;
  position:relative;transition:transform .25s}
.code.lock{background:radial-gradient(circle,rgba(255,255,255,.04),rgba(255,255,255,.015) 70%);border:1px dashed rgba(160,180,255,.22)}
.code.lock .cw{font:700 26px/1 'Rajdhani',sans-serif;color:#566089;letter-spacing:.2em}
.code.lock .cd{color:#5c6890}
.code.got{background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 34%,transparent),rgba(8,10,24,.75) 72%);
  border:1px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 30px -8px var(--c),inset 0 0 22px -8px var(--c)}
.code.got:hover{transform:scale(1.04)}
.code.got::before{content:'';position:absolute;inset:-7px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  animation:spinRing 18s linear infinite;border-top-color:var(--c)}
@keyframes spinRing{to{transform:rotate(360deg)}}
.cw{font:700 24px/1 'Rajdhani',sans-serif;letter-spacing:.16em;color:#fff;text-shadow:0 0 14px var(--c)}
.cd{font-size:11.5px;line-height:1.4;color:#dce3f7;margin-top:8px;max-width:120px}
.cgo{margin-top:10px;font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--c);text-decoration:none;padding:5px 9px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.cgo:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.prog{display:flex;align-items:center;gap:14px;margin-top:18px}
.bar{flex:1;max-width:340px;height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#40dcff,#a06eff,#ff50af);width:0;transition:width 1.2s ease}
.prog b{font:600 12px/1 'JetBrains Mono',monospace;color:var(--dim)}
.empty{margin-top:18px;padding:22px 26px;display:flex;gap:18px;align-items:center}
.empty svg{width:40px;height:40px;flex:none;stroke:#8f9bd0;fill:none;stroke-width:1.4;opacity:.8}
.empty p{color:var(--dim);font-size:14.5px;line-height:1.7}

/* кофе */
.coffee{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;padding:34px 36px;--c:#ffb35c;margin-top:22px}
.cup{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 35%,rgba(255,179,92,.35),rgba(255,120,60,.06) 70%);box-shadow:0 0 50px -10px rgba(255,170,80,.6)}
.cup svg{width:78px;height:78px;stroke:#ffd9a8;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.steam{animation:steam 3s ease-in-out infinite;transform-origin:center}
.steam:nth-child(2){animation-delay:.6s}.steam:nth-child(3){animation-delay:1.2s}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-3px)}}
.coffee h3{font:700 clamp(22px,3vw,30px)/1.1 'Rajdhani',sans-serif;letter-spacing:.1em;color:#fff}
.coffee p{margin-top:12px;color:#dce3f7;font-size:15px;line-height:1.75}
.amts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.amt{padding:11px 18px;border-radius:999px;font:700 15px/1 'Manrope',sans-serif;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);transition:all .2s}
.amt small{font-weight:500;color:var(--dim);margin-left:6px;font-size:11px}
.amt:hover{border-color:rgba(255,179,92,.6)}
.amt.on{background:rgba(255,179,92,.22);border-color:#ffb35c;box-shadow:0 0 18px -6px #ffb35c}
.own{display:none;align-items:center;gap:6px;padding:6px 8px 6px 16px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,179,92,.6)}
.own.on{display:inline-flex}
.own input{width:70px;background:none;border:0;outline:0;color:#fff;font:700 15px 'Manrope',sans-serif}
.pay{display:inline-flex;align-items:center;gap:12px;margin-top:22px;padding:15px 28px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;
  font:800 15px/1 'Manrope',sans-serif;letter-spacing:.03em;color:#0b1a3a;background:linear-gradient(180deg,#ffd46a,#ffb547);
  box-shadow:0 10px 30px -10px rgba(255,180,70,.8);transition:transform .2s,box-shadow .2s}
.pay:hover{transform:translateY(-2px);box-shadow:0 16px 36px -10px rgba(255,180,70,.95)}
.pay.disabled{filter:grayscale(.7);opacity:.6;cursor:default;transform:none}
.pay b{color:#003087} .pay i{font-style:italic;font-weight:800;color:#009cde}
.note{margin-top:12px;font-size:12.5px;color:var(--dim2)}

.small{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.small .card{padding:22px 26px}
.small h3{font-size:19px}
.small p{font-size:14px}
footer{margin-top:70px;text-align:center;font:600 11px/1.8 'JetBrains Mono',monospace;letter-spacing:.24em;color:var(--dim2)}

.rv{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#sky{animation:none}.rv{opacity:1;transform:none;transition:none}.code.got::before,.steam{animation:none}}
@media(max-width:760px){
  .grid2,.small{grid-template-columns:1fr}
  .coffee{grid-template-columns:1fr;text-align:center;padding:28px 22px}
  .cup{margin:0 auto;width:120px;height:120px}
  .amts{justify-content:center}
  .nav{display:none}
  .hero{padding-top:46px}
  .card{padding:24px 22px}
  .codes{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

 'aceon.tag':'музыка / видео',
 'aceon.p1':'Студия появилась на стыке 2025 и 2026 года. Тогда она называлась Ai Chaos Engine Studio, отсюда и буквы в названии. С тех пор расшифровка не раз менялась.',

 'tws.p2':'Название пришло из одного нашего проекта и сказано с усмешкой. Раньше люди писали длинно и красиво, а сейчас часто хватает двадцати слов, остальное копируют у других. Это небольшая шпилька в адрес тех, кто выдаёт чужое за своё.',
 'tws.p3':'Сейчас на сайте браузерные игры и лаунчер для Windows. Параллельно собираются несколько игр для ПК на Unreal Engine, но до первого релиза ещё далеко.',

en:{

 kicker:'info / site map',
 lead:'Hello. We make music and video, and our second studio makes games and software. Here you will find a short story about us, a map of the whole site and what you have already found.',
 'about.h':'Who we are',
 'aceon.tag':'music / video',
 'aceon.p1':'The studio appeared at the turn of 2025 and 2026. Back then it was called Ai Chaos Engine Studio, which is where the letters in the name come from. What they stand for has changed more than once since.',
 'aceon.p2':'It started when we tried making a song with a neural network and could not stop. Then came mixing and mastering, video editing, programming, game engines and dozens of neural networks that we connect to each other.',
 'aceon.p3':'Our music has no genre. It has a mood: whatever the mood is that day, so is the song. Releases come out on streaming platforms, animated and story clips come out only on YouTube.',
 'aceon.p4':'Tools change every month now, so we do not stick to one: we try whatever new thing an ordinary person can get and test it in real work.',
 'tws.tag':'games / software',
 'tws.p1':'Our second studio, it makes games and software. A separate name keeps things clear: music and video live under A.C.EON, games and software live here.',
 'tws.p2':'The name came from one of our projects and is said with a grin. People used to write long and beautifully, now twenty words is often enough and the rest is copied from others. It is a small jab at those who pass off someone else\'s work as their own.',
 'tws.p3':'Right now the site has browser games and a launcher for Windows. Several PC games on Unreal Engine are slowly coming together, but the first release is still far away.',
 'tws.btn':'Launcher for Windows',
 'site.h':'This site',
 'site.p1':'We build the site together, as two studios. You will find:',

 'books.btn':'Open the library',
 'coin.h':'Our own coin',

 'coin.btn':'Coin page',

 lead:'Bonjour. Nous faisons de la musique et des vidéos, notre deuxième studio fait des jeux et des logiciels. Vous trouverez ici quelques mots sur nous, le plan de tout le site et ce que vous avez déjà trouvé.',

 'aceon.tag':'musique / vidéo',
 'aceon.p1':'Le studio est né entre fin 2025 et début 2026. Il s\'appelait alors Ai Chaos Engine Studio, d\'où les lettres du nom. Leur signification a changé plusieurs fois depuis.',

 'aceon.p3':'Notre musique n\'a pas de genre. Elle a une humeur : l\'humeur du jour fait la chanson. Les sorties paraissent sur les plateformes de streaming, les clips animés et les histoires uniquement sur YouTube.',
 'aceon.p4':'Les outils changent chaque mois, alors nous ne nous accrochons à aucun : nous essayons ce qui est nouveau et accessible à tout le monde, et nous le testons pour de vrai.',
 'tws.tag':'jeux / logiciels',

 'tws.p3':'Le site propose pour l\'instant des jeux dans le navigateur et un lanceur pour Windows. Plusieurs jeux PC sous Unreal Engine prennent forme petit à petit, mais la première sortie est encore loin.',

 'coin.btn':'Page de la pièce',

es:{
 back:'Inicio','nav.about':'Nosotros','nav.map':'Mapa','nav.found':'Encontrado','nav.contact':'Contacto','nav.coffee':'Café',
 kicker:'info / mapa del sitio',
 lead:'Hola. Hacemos música y vídeos, y nuestro segundo estudio hace juegos y programas. Aquí encontrará un poco sobre nosotros, el mapa de todo el sitio y lo que ya ha encontrado.',
 'about.h':'Quiénes somos',
 'aceon.tag':'música / vídeo',
 'aceon.p1':'El estudio nació entre finales de 2025 y principios de 2026. Entonces se llamaba Ai Chaos Engine Studio, de ahí las letras del nombre. Su significado ha cambiado varias veces desde entonces.',
 'aceon.p2':'Empezó cuando probamos a hacer una canción con una red neuronal y ya no pudimos parar. Luego llegaron la mezcla y la masterización, el montaje, la programación, los motores de juego y decenas de redes neuronales que conectamos entre sí.',
 'aceon.p3':'Nuestra música no tiene género. Tiene un estado de ánimo: como sea ese día, así es la canción. Los lanzamientos salen en plataformas de streaming, los clips animados con historias solo en YouTube.',
 'aceon.p4':'Las herramientas cambian cada mes, así que no nos aferramos a ninguna: probamos lo nuevo que está al alcance de cualquiera y lo ponemos a prueba en serio.',
 'tws.tag':'juegos / programas',
 'tws.p1':'Nuestro segundo estudio, se dedica a juegos y programas. Un nombre aparte evita confusiones: la música y el vídeo viven bajo A.C.EON, los juegos y programas aquí.',
 'tws.p2':'El nombre salió de uno de nuestros proyectos y va con media sonrisa. Antes la gente escribía largo y bonito, ahora a menudo bastan veinte palabras y el resto se copia. Es una pequeña pulla a quienes hacen pasar el trabajo ajeno por suyo.',
 'tws.p3':'Ahora en el sitio hay juegos de navegador y un lanzador para Windows. Varios juegos para PC en Unreal Engine se van armando poco a poco, pero el primer lanzamiento aún está lejos.',
 'tws.btn':'Lanzador para Windows',
 'site.h':'Este sitio',
 'site.p1':'Hacemos el sitio juntos, como dos estudios. Aquí hay:',
 'site.p2':'No para de crecer: aparecen secciones nuevas y las antiguas se rehacen. El plan más cercano es sencillo: mejorar todo lo que ya existe, de la música a los juegos. Esta página sirve para no perderse.',
 chips:['música','vídeo','juegos','libros','herramientas','aprender'],
 'books.h':'Libros',
 'books.p':'Los libros los escriben sus autores, las redes neuronales les ayudan a editar y pulir el texto. Detrás hay todo un universo: cada libro está ligado a los demás y abre su parte de una historia grande. Se irá revelando poco a poco.',
 'books.btn':'Abrir la biblioteca',
 'coin.h':'Nuestra moneda',
 'coin.p':'Tenemos en planes una moneda propia y más adelante una criptomoneda. Por ahora no hay casi nada que contar: la burocracia lo complica y no sabemos las fechas. Cuando haya algo concreto, estará aquí.',
 'coin.btn':'Página de la moneda',
 'map.h':'Mapa del sitio',
 'map.sub':'Todas las secciones por sector, como en el núcleo de la red. Pulse una fila para ir. Un punto lleno significa que aún no ha estado allí, uno vacío: ya lo visitó.',
 'map.opened':'{n} de {t}',
 'found.h':'Encontrado',
 'found.sub':'En la página principal hay un terminal. Algunas palabras escritas en él cambian el universo. Las que ya encontró aparecen aquí y se pueden repetir con un clic.',
 'found.count':'encontrado {n} de {t}',
 'found.lock':'aún no encontrado',
 'found.go':'repetir',
 codes:{VOID:'El pozo exhala: el flujo va al revés',NULL:'Colapso: todo cae en el agujero',SIGNAL:'Corrimiento al rojo y alarma',STASIS:'El tiempo se congela',PULSE:'Una onda de choque desde el núcleo',DARK:'Se apaga la luz, queda una linterna','440':'La frecuencia portadora'},
 'secrets.h':'Lugares ocultos',
 'secrets.empty':'En el sitio habrá secciones secretas escondidas. Cuando encuentre una, aparecerá aquí y podrá volver a ella con un clic.',
 'secrets.go':'ir',
 'contact.h':'Contactar',
 'contact.p':'Todavía no hay correo ni chat propio. Lo más fácil es escribirnos en YouTube: en la comunidad del canal o en los comentarios de un vídeo. Los leemos.',
 'contact.yt':'Canal de YouTube',
 'contact.gb':'Libro de visitas',
 'coffee.sh':'Apoyar',
 'coffee.h':'Invite un café al desarrollador',
 'coffee.p1':'Todo esto cuesta dinero: servicios, redes neuronales, alojamiento. El estudio aún no gana nada. Si le gusta nuestro trabajo, puede apoyar el proyecto aquí.',
 'coffee.p2':'Los desarrolladores beben café barato, así que 2 dólares ya son una taza.',
 'coffee.cheap':'una taza',
 'coffee.own':'otra',
 'coffee.btn':'Enviar con',
 'coffee.note':'El pago se hace en la web de PayPal. En nuestro sitio no introduce nada y no vemos sus datos de pago.',
 'coffee.soon':'El enlace de PayPal llegará pronto.',
 'rights.h':'Autoría',
 'rights.p':'Todo en el sitio es obra de nuestros estudios. Puede usar nuestra música en sus vídeos y directos si indica la autoría. Nos alegrará un enlace al sitio o a nuestro YouTube, pero no es obligatorio.',
 'privacy.h':'Privacidad',
 'privacy.p':'Sin registro ni inicio de sesión obligatorio. Lo que el sitio recuerda de usted (visitas, palabras encontradas) queda solo en su navegador. Los datos de las secciones interactivas (libro de visitas, chat) están en nuestros servidores y no se comparten.',
 footer:'el sitio crece con nosotros'
},
it:{
 back:'Home','nav.about':'Chi siamo','nav.map':'Mappa','nav.found':'Trovato','nav.contact':'Contatti','nav.coffee':'Caffè',
 kicker:'info / mappa del sito',
 lead:'Salve. Facciamo musica e video, il nostro secondo studio fa giochi e software. Qui trova qualcosa su di noi, la mappa di tutto il sito e ciò che ha già trovato.',
 'about.h':'Chi siamo',
 'aceon.tag':'musica / video',
 'aceon.p1':'Lo studio è nato tra la fine del 2025 e l\'inizio del 2026. Allora si chiamava Ai Chaos Engine Studio, da qui le lettere del nome. Il loro significato è cambiato più volte da allora.',
 'aceon.p2':'Tutto è iniziato quando abbiamo provato a fare una canzone con una rete neurale e non siamo più riusciti a fermarci. Poi sono arrivati mixaggio e mastering, montaggio, programmazione, motori di gioco e decine di reti neurali che colleghiamo tra loro.',
 'aceon.p3':'La nostra musica non ha un genere. Ha un umore: com\'è quel giorno, così è la canzone. Le uscite sono sulle piattaforme di streaming, i clip animati con storie solo su YouTube.',
 'aceon.p4':'Gli strumenti cambiano ogni mese, quindi non ci attacchiamo a nessuno: proviamo il nuovo alla portata di chiunque e lo mettiamo alla prova sul serio.',
 'tws.tag':'giochi / software',
 'tws.p1':'Il nostro secondo studio, si occupa di giochi e software. Un nome a parte evita confusione: musica e video stanno sotto A.C.EON, giochi e software qui.',
 'tws.p2':'Il nome viene da un nostro progetto ed è detto con un mezzo sorriso. Una volta si scriveva a lungo e con cura, oggi spesso bastano venti parole e il resto si copia. È una piccola frecciata a chi spaccia il lavoro altrui per proprio.',
 'tws.p3':'Ora sul sito ci sono giochi nel browser e un launcher per Windows. Alcuni giochi per PC in Unreal Engine stanno prendendo forma piano piano, ma la prima uscita è ancora lontana.',
 'tws.btn':'Launcher per Windows',
 'site.h':'Questo sito',
 'site.p1':'Il sito lo facciamo insieme, come due studi. Qui trova:',
 'site.p2':'Cresce di continuo: arrivano nuove sezioni, le vecchie vengono rifatte. Il piano più vicino è semplice: migliorare tutto ciò che c\'è già, dalla musica ai giochi. Questa pagina serve a non perdersi.',
 chips:['musica','video','giochi','libri','strumenti','imparare'],
 'books.h':'Libri',
 'books.p':'I libri li scrivono gli autori stessi, le reti neurali li aiutano a correggere e rifinire il testo. Dietro c\'è un intero universo: ogni libro è legato agli altri e apre un pezzo di una storia più grande. Si svelerà poco a poco.',
 'books.btn':'Apri la biblioteca',
 'coin.h':'La nostra moneta',
 'coin.p':'Nei piani c\'è una nostra moneta e più avanti una criptovaluta. Per ora c\'è poco da dire: la burocrazia complica le cose e non conosciamo i tempi. Quando ci sarà qualcosa di concreto, sarà qui.',
 'coin.btn':'Pagina della moneta',
 'map.h':'Mappa del sito',
 'map.sub':'Tutte le sezioni per settore, come nel nucleo della rete. Clicchi su una riga per andarci. Un punto pieno significa che non c\'è ancora stato, vuoto: già visitata.',
 'map.opened':'{n} di {t}',
 'found.h':'Trovato',
 'found.sub':'Nella home c\'è un terminale. Alcune parole scritte lì cambiano l\'universo. Quelle che ha già trovato compaiono qui e si possono ripetere con un clic.',
 'found.count':'trovate {n} di {t}',
 'found.lock':'non ancora trovata',
 'found.go':'ripeti',
 codes:{VOID:'Il pozzo espira: il flusso torna indietro',NULL:'Collasso: tutto cade nel buco',SIGNAL:'Spostamento verso il rosso e allarme',STASIS:'Il tempo si congela',PULSE:'Un\'onda d\'urto dal nucleo',DARK:'La luce si spegne, resta una torcia','440':'La frequenza portante'},
 'secrets.h':'Luoghi nascosti',
 'secrets.empty':'Nel sito verranno nascoste sezioni segrete. Quando ne trova una, compare qui e può tornarci con un clic.',
 'secrets.go':'vai',
 'contact.h':'Contattarci',
 'contact.p':'Non c\'è ancora un\'email o una chat. Il modo più semplice è YouTube: la community del canale o i commenti sotto un video. Li leggiamo.',
 'contact.yt':'Canale YouTube',
 'contact.gb':'Guestbook',
 'coffee.sh':'Supporto',
 'coffee.h':'Offra un caffè allo sviluppatore',
 'coffee.p1':'Tutto questo costa: servizi, reti neurali, hosting. Lo studio per ora non guadagna nulla. Se il nostro lavoro le piace, può sostenere il progetto qui.',
 'coffee.p2':'Gli sviluppatori bevono caffè economico, quindi anche 2 dollari sono già una tazza.',
 'coffee.cheap':'una tazza',
 'coffee.own':'altro',
 'coffee.btn':'Invia con',
 'coffee.note':'Il pagamento avviene sul sito di PayPal. Sul nostro sito non inserisce nulla e non vediamo i suoi dati di pagamento.',
 'coffee.soon':'Il link PayPal arriverà presto.',
 'rights.h':'Paternità',
 'rights.p':'Tutto sul sito è opera dei nostri studi. Può usare la nostra musica nei suoi video e stream indicando gli autori. Un link al sito o al nostro YouTube ci farebbe piacere, ma non è obbligatorio.',
 'privacy.h':'Privacy',
 'privacy.p':'Nessuna registrazione né accesso obbligatorio. Ciò che il sito ricorda di lei (visite, parole trovate) resta solo nel suo browser. I dati delle sezioni interattive (guestbook, chat) stanno sui nostri server e non vengono condivisi.',

pl:{
 back:'Strona główna','nav.about':'O nas','nav.map':'Mapa','nav.found':'Znalezione','nav.contact':'Kontakt','nav.coffee':'Kawa',
 kicker:'info / mapa strony',
 lead:'Dzień dobry. Tworzymy muzykę i wideo, a nasze drugie studio robi gry i programy. Tu znajdą Państwo krótko o nas, mapę całej strony i to, co już udało się znaleźć.',
 'about.h':'Kim jesteśmy',
 'aceon.tag':'muzyka / wideo',
 'aceon.p1':'Studio powstało na przełomie 2025 i 2026 roku. Nazywało się wtedy Ai Chaos Engine Studio, stąd litery w nazwie. Ich znaczenie od tamtej pory zmieniało się kilka razy.',
 'aceon.p2':'Zaczęło się od tego, że spróbowaliśmy zrobić piosenkę z pomocą sieci neuronowej i nie mogliśmy już przestać. Potem przyszły miks i mastering, montaż, programowanie, silniki gier i dziesiątki sieci neuronowych, które łączymy ze sobą.',
 'aceon.p3':'Nasza muzyka nie ma gatunku. Ma nastrój: jaki jest tego dnia, taka piosenka. Wydania trafiają na platformy streamingowe, klipy z animacją i historiami wychodzą tylko na YouTube.',
 'aceon.p4':'Narzędzia zmieniają się teraz co miesiąc, więc nie trzymamy się jednego: próbujemy nowego, co jest dostępne dla zwykłego człowieka, i sprawdzamy to w praktyce.',
 'tws.tag':'gry / programy',
 'tws.p1':'Nasze drugie studio, zajmuje się grami i programami. Osobna nazwa pozwala się nie mylić: muzyka i wideo są pod A.C.EON, gry i programy tutaj.',
 'tws.p2':'Nazwa wzięła się z jednego naszego projektu i jest powiedziana z przekąsem. Kiedyś ludzie pisali długo i pięknie, a dziś często wystarcza dwadzieścia słów, resztę się kopiuje. To mała szpila w stronę tych, którzy cudzą pracę podają za swoją.',
 'tws.p3':'Na stronie są teraz gry w przeglądarce i launcher dla Windows. Kilka gier na PC na Unreal Engine powstaje powoli, ale do pierwszego wydania jeszcze daleko.',
 'tws.btn':'Launcher dla Windows',
 'site.h':'Ta strona',
 'site.p1':'Stronę robimy razem, jako dwa studia. Jest tu:',
 'site.p2':'Ciągle rośnie: pojawiają się nowe działy, stare są przerabiane. Najbliższy plan jest prosty: ulepszać wszystko, co już jest, od muzyki po gry. Ta strona jest po to, żeby się nie zgubić.',
 chips:['muzyka','wideo','gry','książki','narzędzia','nauka'],
 'books.h':'Książki',
 'books.p':'Książki piszą sami autorzy, sieci neuronowe pomagają im redagować i dopracowywać tekst. Za nimi stoi cały wszechświat: każda książka łączy się z pozostałymi i otwiera swój kawałek większej historii. Będzie się odkrywać stopniowo.',
 'books.btn':'Otwórz bibliotekę',
 'coin.h':'Własna moneta',
 'coin.p':'W planach jest własna moneta, a potem kryptowaluta. Na razie niewiele można o niej powiedzieć: biurokracja utrudnia wydanie kryptowaluty i nie znamy terminów. Gdy pojawi się coś konkretnego, będzie tutaj.',
 'coin.btn':'Strona monety',
 'map.h':'Mapa strony',
 'map.sub':'Wszystkie działy według sektorów, jak w rdzeniu sieci. Proszę kliknąć wiersz, żeby przejść. Pełna kropka oznacza, że jeszcze Państwo tam nie byli, pusta: już odwiedzone.',
 'map.opened':'{n} z {t}',
 'found.h':'Znalezione',
 'found.sub':'Na stronie głównej jest terminal. Niektóre słowa wpisane w nim zmieniają wszechświat. Te już znalezione pojawiają się tutaj i można je powtórzyć jednym kliknięciem.',
 'found.count':'znaleziono {n} z {t}',
 'found.lock':'jeszcze nie znalezione',
 'found.go':'powtórz',
 codes:{VOID:'Studnia wydycha: strumień płynie wstecz',NULL:'Kolaps: wszystko wpada do dziury',SIGNAL:'Przesunięcie ku czerwieni i alarm',STASIS:'Czas zamarza',PULSE:'Fala uderzeniowa z rdzenia',DARK:'Gaśnie światło, zostaje latarka','440':'Częstotliwość nośna'},
 'secrets.h':'Ukryte miejsca',
 'secrets.empty':'Na stronie zostaną ukryte tajne działy. Gdy Państwo znajdą taki, pojawi się tutaj i będzie można do niego wrócić jednym kliknięciem.',
 'secrets.go':'przejdź',
 'contact.h':'Kontakt z nami',
 'contact.p':'Osobnej poczty ani czatu jeszcze nie ma. Najprościej napisać do nas na YouTube: w społeczności kanału albo w komentarzach pod filmem. Czytamy je.',
 'contact.yt':'Kanał na YouTube',
 'contact.gb':'Księga gości',
 'coffee.sh':'Wsparcie',
 'coffee.h':'Postaw kawę programiście',
 'coffee.p1':'To wszystko kosztuje: usługi, sieci neuronowe, hosting. Studio na razie nic nie zarabia. Jeśli podoba się Państwu nasza twórczość, projekt można wesprzeć tutaj.',
 'coffee.p2':'Programiści piją tanią kawę, więc nawet 2 dolary to już filiżanka.',
 'coffee.cheap':'filiżanka',
 'coffee.own':'inna kwota',
 'coffee.btn':'Wyślij przez',
 'coffee.note':'Płatność odbywa się na stronie PayPal. U nas niczego Państwo nie wpisują i nie widzimy danych płatniczych.',
 'coffee.soon':'Link do PayPal pojawi się wkrótce.',
 'rights.h':'Autorstwo',
 'rights.p':'Wszystko na stronie stworzyły nasze studia. Naszej muzyki można używać we własnych filmach i streamach, jeśli poda się autorów. Ucieszy nas link do strony albo do naszego YouTube, ale nie jest wymagany.',
 'privacy.h':'Prywatność',
 'privacy.p':'Nie ma rejestracji ani obowiązkowego logowania. To, co strona o Państwu pamięta (wizyty, znalezione słowa), zostaje tylko w przeglądarce. Dane działów interaktywnych (księga gości, czat) są na naszych serwerach i nie są nikomu udostępniane.',

}

function absUrl(u){ try{ return new URL(u,location.origin+location.pathname.replace(/info\/?[^/]*$/,'A.C.EON_Core/')).href; }catch(e){ return u; } }
function visit(p){
  if(!TR)return null;
  if(p.external){ var n=(TR.data().ev['ext.'+p.id]||0); return {n:n}; }
  try{ var id=TR.idFromUrl(absUrl(p.url)); return id?(TR.data().sec[id]||{n:0}):null; }catch(e){ return null; }
}
function isNew(p){ if(!p.added||p.status==='soon')return false; var t=Date.parse(p.added); var v=visit(p); return t&&Date.now()-t<21*864e5&&!(v&&v.n>0); }
(function(){
  var grid=document.getElementById('mapgrid');
  var S=window.CORE_SECTORS||[], P=window.CORE_NODES||[];
  S.forEach(function(s){
    var pages=P.filter(function(p){ return p.sector===s.id; });
    var live=pages.filter(function(p){ return p.status!=='soon'; });
    var opened=live.filter(function(p){ var v=visit(p); return v&&v.n>0; }).length;
    var box=document.createElement('div'); box.className='glass sec rv'; box.style.setProperty('--c',s.color);
    box.innerHTML='<div class="sec-h"><div class="orb"><svg viewBox="0 0 24 24">'+(ICONS[s.icon]||'')+'</svg></div><div><div class="sec-n"></div><div class="sec-d"></div></div><div class="sec-c"></div></div><ul class="pages"></ul>';
    box.querySelector('.sec-n').textContent=CL('s.'+s.id);
    box.querySelector('.sec-d').textContent=CL('sd.'+s.id);
    box.querySelector('.sec-c').textContent=TR?T('map.opened',{n:opened,t:live.length}):String(live.length);
    var ul=box.querySelector('.pages');
    pages.forEach(function(p){
      var off=p.status==='soon'||!p.url, v=visit(p), seen=v&&v.n>0;
      var el=document.createElement(off?'div':'a'); el.className='pg'+(off?' off':'')+(seen?' seen':'');
      if(!off){ el.href=p.external?p.url:absUrl(p.url); el.target=p.external?'_blank':'_top'; if(p.external)el.rel='noopener';
        if(p.external&&TR)el.addEventListener('click',function(){ try{ TR.event('ext.'+p.id); }catch(e){} }); }
      var nm=L(p.name)||CL('soon')||'...';
      el.innerHTML='<span class="dot"></span><span class="pg-t"><span class="pg-n"></span><span class="pg-s"></span></span>';
      var n=el.querySelector('.pg-n'); n.textContent=nm;
      if(isNew(p)){ var b=document.createElement('span'); b.className='new'; b.textContent='NEW'; n.appendChild(b); }
      if(p.status!=='live'){ var stt=document.createElement('span'); stt.className='st '+p.status; stt.textContent=CL('st.'+p.status).toLowerCase(); n.appendChild(stt); }
      el.querySelector('.pg-s').textContent=L(p.desc)||L(p.tag)||'';
      if(p.external)el.insertAdjacentHTML('beforeend','<svg class="ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>');
      var li=document.createElement('li'); li.appendChild(el); ul.appendChild(li);
    });
    grid.appendChild(box);
  });
})();

/* найдено: слова-коды из памяти сайта (Trace.code на главной). Повтор: главная с #code=СЛОВО */
var CODES=[['VOID','#6fd8ff'],['NULL','#ffffff'],['SIGNAL','#ff4d6a'],['STASIS','#bff4ff'],['PULSE','#ffc24a'],['DARK','#9aa3c8'],['440','#8fd0ff']];
(function(){
  var got=TR?TR.data().codes||{}:{}, n=0, box=document.getElementById('codes'), desc=T('codes')||{};
  CODES.forEach(function(c){
    var have=!!got[c[0]]; if(have)n++;
    var el=document.createElement('div'); el.className='code rv '+(have?'got':'lock'); el.style.setProperty('--c',c[1]);
    if(have){
      el.innerHTML='<div class="cw"></div><div class="cd"></div><a class="cgo" target="_top"></a>';
      el.querySelector('.cw').textContent=c[0]; el.querySelector('.cd').textContent=desc[c[0]]||'';
      var a=el.querySelector('.cgo'); a.textContent='▸ '+T('found.go'); a.href='../#code='+encodeURIComponent(c[0]);
    } else {
      el.innerHTML='<div class="cw">? ? ?</div><div class="cd"></div>'; el.querySelector('.cd').textContent=T('found.lock');
    }
    box.appendChild(el);
  });
  document.getElementById('fcount').textContent=T('found.count',{n:n,t:CODES.length});
  setTimeout(function(){ document.getElementById('fbar').style.width=(n/CODES.length*100)+'%'; },500);
})();

/* тайные места: когда на сайте появятся секретные разделы, добавить сюда запись
   {id, name:{ru,en,...}, url, color, found:function(D){ return ...по памяти Trace... }} */
var SECRETS=[];
(function(){
  var D=TR?TR.data():null, box=document.getElementById('secrets');
  var found=SECRETS.filter(function(s){ try{ return D&&s.found(D); }catch(e){ return false; } });
  if(!found.length){
    box.innerHTML='<div class="glass empty rv"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v3l2 2"/></svg><p></p></div>';
    box.querySelector('p').textContent=T('secrets.empty'); return;
  }
  var ul=document.createElement('div'); ul.className='map';
  found.forEach(function(s){
    var a=document.createElement('a'); a.className='glass sec pg rv'; a.style.setProperty('--c',s.color||'#a06eff'); a.href=s.url; a.target='_top';
    a.innerHTML='<span class="dot"></span><span class="pg-t"><span class="pg-n"></span></span><span class="cgo"></span>';
    a.querySelector('.pg-n').textContent=L(s.name); a.querySelector('.cgo').textContent='▸ '+T('secrets.go'); ul.appendChild(a);
  });
  box.appendChild(ul);
})();

/* кофе: сумма по умолчанию 2 доллара */
(function(){
  var amt=2, pay=document.getElementById('pay'), own=document.getElementById('own'), ownv=document.getElementById('ownv'), note=document.getElementById('paynote');
  function upd(){
    var v=amt==='own'?Math.max(1,Math.round(+ownv.value||0)):amt;
    if(PAYPAL_ME){ pay.href='https://www.paypal.com/paypalme/'+encodeURIComponent(PAYPAL_ME)+'/'+v+'USD'; pay.classList.remove('disabled'); }
    else { pay.removeAttribute('href'); pay.classList.add('disabled'); note.textContent=T('coffee.soon'); }
  }
  document.querySelectorAll('.amt').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.amt').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); amt=b.dataset.v==='own'?'own':+b.dataset.v;
      own.classList.toggle('on',amt==='own'); if(amt==='own')ownv.focus(); upd();
    });
  });
  ownv.addEventListener('input',upd);
  upd();
})();

/* появление блоков при прокрутке */
(function(){
  var els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){ els.forEach(function(e){ e.classList.add('in'); }); return; }
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{rootMargin:'0px 0px -6% 0px'});
  els.forEach(function(e,i){ e.style.transitionDelay=(Math.min(i%6,5)*.06)+'s'; io.observe(e); });
})();

/* портал: «на главную» закрывает портал без перезагрузки */
(function(){
  var back=document.getElementById('back');
  if(PORTAL){
    back.addEventListener('click',function(e){ e.preventDefault(); try{ window.parent.postMessage({aceon:'close'},location.origin); }catch(x){} });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ try{ window.parent.postMessage({aceon:'close'},location.origin); }catch(x){} } });
  }
})();
})();
</script>
