<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КАИ</title>
<style>
  :root{--bg:#060a07;--bg-panel:#0d140e;--bg-input:#0a100b;--green:#3dff8a;
    --green-dim:#1f6b3f;--green-soft:#2a5e3f;--text-muted:#5a9b76;
    --border:#163320;--glow:rgba(61,255,138,.35);--warn:#ff5d5d;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--green);
    font-family:'Consolas','JetBrains Mono','Courier New',monospace;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px);z-index:9999;}
  .page{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;justify-content:space-between;align-items:center;
    padding:14px 20px;border-bottom:1px solid var(--border);
    background:var(--bg);flex-shrink:0;z-index:10;}
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand h1{font-size:22px;font-weight:700;letter-spacing:4px;
    text-shadow:0 0 8px var(--glow),0 0 18px var(--glow);}
  .brand .sub{font-size:12px;color:var(--text-muted);letter-spacing:1px;}
  .hstatus{display:flex;align-items:center;gap:6px;font-size:11px;
    color:var(--text-muted);letter-spacing:1px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);
    box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
  .hstatus.offline .dot{background:var(--text-muted);box-shadow:none;animation:none;}
  .hstatus.busy .dot{background:var(--warn);box-shadow:0 0 6px var(--warn);
    animation:pulse .8s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .body-split{display:flex;flex:1;overflow:hidden;}
  .anim-panel{width:420px;flex-shrink:0;position:relative;
    border-right:1px solid var(--border);overflow:hidden;background:var(--bg);}
  #nc{display:block;width:100%;height:calc(100% - 44px);}
  .nn-footer{position:absolute;bottom:0;left:0;right:0;height:44px;
    display:flex;align-items:center;justify-content:center;
    gap:10px;border-top:1px solid var(--border);}
  .nn-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);
    transition:background .6s,box-shadow .6s;}
  .nn-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);
    animation:pulse .8s infinite;}
  .nn-lbl{font-size:10px;letter-spacing:2px;color:var(--text-muted);
    transition:color .6s,text-shadow .6s;}
  .nn-lbl.on{color:var(--green);text-shadow:0 0 6px var(--glow);}
  .chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .controls{display:flex;align-items:center;gap:16px;padding:8px 16px;
    border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted);flex-shrink:0;}
  .controls button{background:transparent;border:1px solid var(--green-soft);
    color:var(--text-muted);font-family:inherit;font-size:12px;padding:5px 10px;
    cursor:pointer;letter-spacing:1px;transition:all .15s;}
  .controls button:hover{color:var(--green);border-color:var(--green);box-shadow:0 0 8px var(--glow);}
  .chat{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:88%;line-height:1.55;font-size:14px;white-space:pre-wrap;
    word-wrap:break-word;animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg .label{display:block;font-size:11px;letter-spacing:2px;margin-bottom:4px;color:var(--text-muted);}
  .msg.user{align-self:flex-end;background:var(--bg-panel);border:1px solid var(--border);
    border-right:2px solid var(--green-soft);padding:8px 12px;color:#cdeedd;}
  .msg.user .label{text-align:right;}
  .msg.kai{align-self:flex-start;color:var(--green);text-shadow:0 0 6px var(--glow);padding:0 4px;}
  .msg.system{align-self:center;color:var(--text-muted);font-size:12px;letter-spacing:1px;text-align:center;}
  .msg.system.warn{color:var(--warn);}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--green);
    box-shadow:0 0 6px var(--green);animation:blink 1s steps(1) infinite;
    vertical-align:text-bottom;margin-left:2px;}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .input-row{border-top:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:flex-end;gap:10px;flex-shrink:0;}
  .arrow{font-size:16px;color:var(--green);text-shadow:0 0 6px var(--glow);padding-bottom:8px;}
  textarea#input{flex:1;background:var(--bg-input);border:1px solid var(--border);
    color:var(--green);font-family:inherit;font-size:14px;padding:8px 10px;
    resize:none;max-height:120px;outline:none;transition:border-color .15s,box-shadow .15s;}
  textarea#input:focus{border-color:var(--green-soft);box-shadow:0 0 8px var(--glow);}
  textarea#input::placeholder{color:var(--green-soft);}
  textarea#input:disabled{opacity:.4;}
  button#send{background:transparent;border:1px solid var(--green);color:var(--green);
    font-family:inherit;font-size:13px;letter-spacing:2px;padding:9px 16px;
    cursor:pointer;transition:all .15s;text-shadow:0 0 6px var(--glow);}
  button#send:hover:not(:disabled){background:var(--green-dim);box-shadow:0 0 12px var(--glow);}
  button#send:disabled{opacity:.35;cursor:default;}
  .chat::-webkit-scrollbar{width:5px;}
  .chat::-webkit-scrollbar-thumb{background:var(--green-soft);border-radius:3px;}
  @media(max-width:820px){.anim-panel{display:none;}}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand"><h1 id="title">КАЙ</h1><span class="sub">статус: автономный модуль</span></div>
    <div class="hstatus offline" id="status"><span class="dot"></span><span id="statusText">НЕ ПОДКЛЮЧЕНО</span></div>
  </header>
  <div class="body-split">
    <div class="anim-panel">
      <canvas id="nc"></canvas>
      <div class="nn-footer">
        <span class="nn-dot" id="nnDot"></span>
        <span class="nn-lbl" id="nnLbl">РЕЖИМ ОЖИДАНИЯ</span>
      </div>
    </div>
    <div class="chat-panel">
      <div class="controls"><button id="clearBtn">очистить диалог</button></div>
      <div class="chat" id="chat"><div class="msg system">— инициализация —</div></div>
      <div class="input-row">
        <span class="arrow">&gt;</span>
        <textarea id="input" rows="1" placeholder="Напиши что-нибудь Каю... " disabled></textarea>
        <button id="send" disabled>ОТПРАВИТЬ</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   NEURAL SPIRAL ANIMATION  v4
   Idle  → rotating spiral  (ordered beauty)
   Active→ chaotic attractor (organic, colourful)
═══════════════════════════════════════════════════ */
(function(){
  const cv  = document.getElementById('nc');
  const ctx = cv.getContext('2d');
  const nnD = document.getElementById('nnDot');
  const nnL = document.getElementById('nnLbl');

  /* ── 10 memory-segment colours ── */
  const COLS = [
    '#3dff8a',  // core neural
    '#00f5d4',  // pattern recognition
    '#00bbf9',  // language
    '#9b5de5',  // deep analysis
    '#f15bb5',  // creativity
    '#fee440',  // memory recall
    '#fb8500',  // logic
    '#ff006e',  // emotion / intuition
    '#8ac926',  // computation
    '#4cc9f0',  // visual processing
  ];

  const N = 140, NH = 10;               // nodes, hubs (1 hub per colour group)
  const DAMP = 0.87, JIT = 0.022;       // spring damping, jitter

  let W, H, CX, CY;
  let nodes = [], impulses = [];
  let activity = 0, targetActivity = 0;
  let T = 0;
  let sRot = Math.random() * Math.PI * 2;  // spiral rotation (random start)
  let cRot = Math.random() * Math.PI * 2;  // cluster rotation

  /* ── hex → rgba ── */
  function rgba(hex, a){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  /* ── resize & init ── */
  function resize(){
    const p = cv.parentElement;
    W = cv.width = p.clientWidth;
    H = cv.height = p.clientHeight - 44;
    CX = W*.5; CY = H*.5;
    build();
  }

  function build(){
    nodes = []; impulses = [];
    const dTheta = 0.28;                            // angle step between nodes
    const maxR   = Math.min(W,H) * 0.44;           // outermost spiral radius
    const spiralA = maxR / (N * dTheta);            // spiral constant: r = a*theta

    for(let i=0; i<N; i++){
      const hub   = i < NH;
      const group = Math.floor(i * COLS.length / N);
      const col   = COLS[group];

      const sTheta = i * dTheta;                   // fixed angle in spiral
      const sR     = spiralA * sTheta;             // fixed radius in spiral

      /* cluster target: each node has its own random "home" when active */
      const cAng = Math.random() * Math.PI * 2;
      const cR   = hub
        ? 18 + Math.random() * 55
        : 25 + Math.random() * 145;

      /* noise offset gives each node independent organic drift */
      const nOff = Math.random() * 200;

      /* start at spiral position */
      const sx = CX + Math.cos(sTheta + sRot) * sR;
      const sy = CY + Math.sin(sTheta + sRot) * sR * .88;

      nodes.push({
        x:sx, y:sy, vx:0, vy:0, px:sx, py:sy,   // position, velocity, prev-pos
        sTheta, sR,                                // spiral
        cAng, cR,                                  // cluster
        nOff, hub, group, col,
        r:    hub ? 2.4+Math.random()*1.6 : .65+Math.random()*1.2,
        ph:   Math.random()*Math.PI*2,
        phS:  .007+Math.random()*.013,
        dim:  .28+Math.random()*.28,
        en:   0,                                   // energized 0-1
        burst:0,                                   // burst countdown
      });
    }
  }

  /* ── public API ── */
  window.neuralSetActive = function(on){
    targetActivity = on?1:0;
    if(on){ nnD.classList.add('on'); nnL.classList.add('on'); nnL.textContent='ОБРАБОТКА ДАННЫХ...'; }
    else  { nnD.classList.remove('on'); nnL.classList.remove('on'); nnL.textContent='РЕЖИМ ОЖИДАНИЯ'; }
  };

  /* ── per-node organic noise ── */
  function oNoise(n, scale, tOff){
    return  Math.sin(n.nOff*1.3 + T*scale       ) * .4
          + Math.sin(n.nOff*.7  + T*scale*1.4+tOff) * .3
          + Math.cos(n.nOff*2.1 + T*scale*.8    ) * .2;
  }

  /* ── compute target ── */
  function getTarget(n){
    /* SPIRAL TARGET */
    const theta  = n.sTheta + sRot;
    const sx     = CX + Math.cos(theta) * n.sR;
    const sy     = CY + Math.sin(theta) * n.sR * .88;

    /* CLUSTER TARGET — organic, not strict */
    const breath = 1 + .13*Math.sin(T*.021);
    const angDr  = oNoise(n,.007,0)   * .75;   // angle drift
    const radDr  = oNoise(n,.006,100) * .38;   // radius drift
    const ang    = n.cAng + cRot + angDr;
    const r      = n.cR * breath * (1 + radDr);
    const cx     = CX + Math.cos(ang) * r;
    const cy     = CY + Math.sin(ang) * r * .88;

    /* interpolate */
    const a = activity;
    return { tx: sx+(cx-sx)*a, ty: sy+(cy-sy)*a };
  }

  /* ── rebind cluster positions randomly for chaos ── */
  function rebind(frac){
    for(const n of nodes){
      if(!n.hub && Math.random()<frac){
        n.cAng = Math.random()*Math.PI*2;
        n.cR   = 25 + Math.random()*145;
      }
    }
  }

  /* ── update ── */
  function update(){
    T++;
    /* smooth activity */
    activity += (targetActivity-activity)*(targetActivity>activity?.024:.011);
    const act = activity;

    /* rotation — spiral is calm, cluster spins */
    sRot += .0006 + act*.0005;
    cRot += .0012 + act*.003;

    /* random rebind every ~3s when active → each activation looks different */
    if(act>.35 && T%180===0) rebind(.18);

    /* spring physics */
    for(const n of nodes){
      n.px = n.x; n.py = n.y;

      const { tx, ty } = getTarget(n);

      /* burst: push radially outward, weak spring */
      let bx=0, by=0;
      if(n.burst>0){
        n.burst--;
        const dx=n.x-CX, dy=n.y-CY, len=Math.sqrt(dx*dx+dy*dy)||1;
        const push=(n.burst/55)*1.4;
        bx = (dx/len)*push;
        by = (dy/len)*push;
      }

      const k = n.burst>0 ? .003 : .017+act*.019;
      n.vx = (n.vx + (tx-n.x)*k + bx)*DAMP + (Math.random()-.5)*JIT;
      n.vy = (n.vy + (ty-n.y)*k + by)*DAMP + (Math.random()-.5)*JIT;
      n.x += n.vx; n.y += n.vy;

      n.ph  += n.phS;
      n.en   = Math.max(0, n.en-.014);
    }

    /* chunk bursts — random group flies outward then returns */
    if(act>.4 && T%95===0){
      const pivot = nodes[Math.floor(Math.random()*nodes.length)];
      let c=0;
      for(const n of nodes){
        const dx=n.x-pivot.x, dy=n.y-pivot.y;
        if(dx*dx+dy*dy<58*58 && c<20){ n.burst=50+Math.floor(Math.random()*35); c++; }
      }
    }

    /* hub flashes (neuron firing) */
    if(act>.25 && T%42===0){
      const hubs=nodes.filter(n=>n.hub);
      hubs[Math.floor(Math.random()*hubs.length)].en=.85;
    }

    /* hub→hub impulses */
    const hubs = nodes.filter(n=>n.hub);
    if(act>.2 && T%68===0 && hubs.length>=2){
      let i=Math.floor(Math.random()*hubs.length);
      let j; do{j=Math.floor(Math.random()*hubs.length);}while(j===i);
      hubs[i].en=.9; hubs[j].en=.4;
      impulses.push({ a:hubs[i],b:hubs[j],p:0,spd:.016+Math.random()*.014,col:hubs[i].col });
    }
    for(let i=impulses.length-1;i>=0;i--){
      impulses[i].p+=impulses[i].spd;
      if(impulses[i].p>=1){ impulses[i].b.en=1; impulses.splice(i,1); }
    }
  }

  /* ── draw ── */
  function draw(){
    ctx.clearRect(0,0,W,H);
    const act = activity;

    /* central ambient glow */
    if(act>.08){
      const aR = 95+25*Math.sin(T*.022);
      const ag = ctx.createRadialGradient(CX,CY,0,CX,CY,aR);
      ag.addColorStop(0,   `rgba(61,255,138,${.055*act})`);
      ag.addColorStop(.45, `rgba(61,255,138,${.02*act})`);
      ag.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(CX,CY,aR,0,Math.PI*2); ctx.fillStyle=ag; ctx.fill();
    }

    /* motion trails for fast nodes */
    for(const n of nodes){
      const spd = Math.abs(n.vx)+Math.abs(n.vy);
      if(spd>.75){
        const op = Math.min(spd*.035,.22);
        ctx.strokeStyle = rgba(n.col,op);
        ctx.lineWidth = n.r*.7;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(n.px,n.py); ctx.lineTo(n.x,n.y); ctx.stroke();
      }
    }

    /* same-group connections (coloured, close range) */
    const maxD=72, maxD2=72*72;
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        if(a.group!==b.group) continue;
        const dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
        if(d2>maxD2) continue;
        const norm=1-Math.sqrt(d2)/maxD;
        const op=norm*(.032+act*.1);
        ctx.strokeStyle=rgba(a.col,op);
        ctx.lineWidth=.35;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }

    /* hub↔hub faint background web */
    if(act>.15){
      const hubs=nodes.filter(n=>n.hub);
      for(let i=0;i<hubs.length;i++){
        for(let j=i+1;j<hubs.length;j++){
          const a=hubs[i],b=hubs[j];
          const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
          if(d>240) continue;
          const op=(.012+act*.022)*(1-d/240);
          ctx.strokeStyle=`rgba(255,255,255,${op})`;
          ctx.lineWidth=.3;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }

    /* impulse pulses */
    for(const imp of impulses){
      const px=imp.a.x+(imp.b.x-imp.a.x)*imp.p;
      const py=imp.a.y+(imp.b.y-imp.a.y)*imp.p;
      const fade=Math.sin(imp.p*Math.PI);

      /* line lights up along the path */
      const lg=ctx.createLinearGradient(imp.a.x,imp.a.y,imp.b.x,imp.b.y);
      lg.addColorStop(Math.max(0,imp.p-.18),'rgba(0,0,0,0)');
      lg.addColorStop(imp.p,rgba(imp.col,.32*fade));
      lg.addColorStop(Math.min(1,imp.p+.18),'rgba(0,0,0,0)');
      ctx.strokeStyle=lg; ctx.lineWidth=.9;
      ctx.beginPath(); ctx.moveTo(imp.a.x,imp.a.y); ctx.lineTo(imp.b.x,imp.b.y); ctx.stroke();

      /* glow dot */
      const pg=ctx.createRadialGradient(px,py,0,px,py,13);
      pg.addColorStop(0,rgba(imp.col,.8*fade));
      pg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(px,py,13,0,Math.PI*2); ctx.fillStyle=pg; ctx.fill();
      ctx.beginPath(); ctx.arc(px,py,2.2,0,Math.PI*2);
      ctx.fillStyle=rgba(imp.col,.95*fade); ctx.fill();
    }

    /* nodes */
    for(const n of nodes){
      const breath=Math.sin(n.ph)*.14;
      const bright=n.dim+breath+act*.15+n.en*.52;
      const r=n.r+(n.hub?act*1.8:0)+n.en*.65;

      /* glow — hubs always, others when energized */
      if(n.hub||n.en>.1){
        const gR=r*(n.hub?8.5:5);
        const gO=(.04+n.en*.1+act*.028)*(n.hub?1.5:1);
        const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,gR);
        g.addColorStop(0,rgba(n.col,gO));
        g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(n.x,n.y,gR,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      }

      /* dot */
      ctx.beginPath(); ctx.arc(n.x,n.y,Math.max(.4,r),0,Math.PI*2);
      ctx.fillStyle=rgba(n.col,Math.min(bright,1)); ctx.fill();
    }
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  resize();
  loop();
  window.addEventListener('resize',()=>{resize();});
})();

/* ═══════════════════════════════════════════════════
   CHAT
═══════════════════════════════════════════════════ */
const chat=document.getElementById('chat'),input=document.getElementById('input'),
  sendBtn=document.getElementById('send'),clearBtn=document.getElementById('clearBtn'),
  statusEl=document.getElementById('status'),statusText=document.getElementById('statusText');

let API_BASE='',busy=false,pollTimer=null;
const SP=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
const GH='https://api.github.com/repos/Yourssugar/A.C.EON/contents/kai-chat/config.json';

function getSid(){let i=localStorage.getItem('kai_sid');
  if(!i){i=crypto.randomUUID?crypto.randomUUID():'s'+Math.random().toString(36).slice(2);
    localStorage.setItem('kai_sid',i);}return i;}
const SID=getSid();

function addMsg(role,text){const d=document.createElement('div');d.className='msg '+role;
  if(role==='user')d.innerHTML='<span class="label">ТЫ</span>'+esc(text);
  else if(role==='Kai')d.innerHTML='<span class="label">КАЙ</span><span class="text"></span>';
  else d.textContent=text;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function setUi(st){
  statusEl.classList.remove('offline','busy');
  if(st==='ready'){statusText.textContent='ONLINE';input.disabled=false;sendBtn.disabled=busy;
    input.placeholder='Напиши что-нибудь Каю...(ВНИМАНИЕ КАЙ НЕ РАССЧИТАН НА СЛОЖНЫЙ АНАЛИЗ ДАННЫХ)';if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
  else if(st==='busy'){statusEl.classList.add('busy');statusText.textContent='ЗАНЯТ';
    input.disabled=true;sendBtn.disabled=true;input.placeholder='Каи сейчас с кем-то другим...';
    if(!pollTimer)pollTimer=setInterval(chkAvail,8000);}
  else{statusEl.classList.add('offline');statusText.textContent='НЕ ПОДКЛЮЧЕНО';
    input.disabled=true;sendBtn.disabled=true;input.placeholder='Подключение...';
    if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}}

async function chkAvail(){try{const r=await fetch(API_BASE+'/api/state?session_id='+encodeURIComponent(SID));
  if(!r.ok)throw 0;const d=await r.json();
  if(!d.busy){addMsg('system','— Кай свободен —');setUi('ready');input.focus();}}catch(_){}}

async function loadConfig(){try{
  const r=await fetch(GH+'?t='+Date.now(),{headers:{'Accept':'application/vnd.github.v3+json'}});
  if(!r.ok)throw 0;const d=await r.json();
  const cfg=JSON.parse(atob(d.content.replace(/\n/g,'')));
  if(!cfg.api_url)throw 0;API_BASE=cfg.api_url;await connect();}
  catch(_){addMsg('system warn','— Кай офлайн —');setUi('disconnected');}}

async function connect(){try{
  const r=await fetch(API_BASE+'/api/state?session_id='+encodeURIComponent(SID));
  if(!r.ok)throw 0;const d=await r.json();
  if(d.busy){addMsg('system warn','— Кай занят —');setUi('busy');}
  else{addMsg('system','— соединение установлено —');setUi('ready');input.focus();}}
  catch(_){addMsg('system warn','— сервер недоступен —');setUi('disconnected');}}

input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
sendBtn.addEventListener('click',doSend);

async function doSend(){
  const text=input.value.trim();if(!text||busy||!API_BASE)return;
  addMsg('user',text);input.value='';input.style.height='auto';
  busy=true;sendBtn.disabled=true;
  window.neuralSetActive&&window.neuralSetActive(true);
  const div=addMsg('kai','');const span=div.querySelector('.text');
  let si=0;span.textContent=SP[0]+' печатает...';
  const st=setInterval(()=>{si=(si+1)%SP.length;span.textContent=SP[si]+' печатает...';},90);
  let first=true;const cur=document.createElement('span');cur.className='cursor';
  try{
    const r=await fetch(API_BASE+'/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,session_id:SID})});
    if(r.status===409){clearInterval(st);div.remove();addMsg('system warn','— Кай занят —');
      setUi('busy');busy=false;window.neuralSetActive&&window.neuralSetActive(false);return;}
    const reader=r.body.getReader();const dec=new TextDecoder('utf-8');
    while(true){const{value,done}=await reader.read();if(done)break;
      const chunk=dec.decode(value,{stream:true});
      if(chunk){if(first){clearInterval(st);span.textContent='';div.appendChild(cur);first=false;}
        span.textContent+=chunk;chat.scrollTop=chat.scrollHeight;}}
    if(first){clearInterval(st);span.textContent='...';}
  }catch(_){clearInterval(st);span.textContent='[Ошибка соединения]';setUi('disconnected');}
  finally{cur.remove();busy=false;sendBtn.disabled=false;
    window.neuralSetActive&&window.neuralSetActive(false);
    if(!statusEl.classList.contains('busy')&&!statusEl.classList.contains('offline'))input.focus();}}

clearBtn.addEventListener('click',async()=>{if(!API_BASE)return;
  const r=await fetch(API_BASE+'/api/reset',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:SID})});
  if(r.status===409){addMsg('system warn','— Кай занят —');return;}
  chat.innerHTML='<div class="msg system">— диалог очищен —</div>';});

/* glitch */
(function(){const t=document.getElementById('title');
  const s=document.createElement('style');
  s.textContent=`@keyframes gl{0%{text-shadow:0 0 8px var(--glow),0 0 18px var(--glow);transform:translate(0)}
    20%{text-shadow:-2px 0 #ff5d5d,2px 0 #4dd9ff;transform:translate(-1px,0)}
    40%{text-shadow:2px 0 #ff5d5d,-2px 0 #4dd9ff;transform:translate(1px,0)}
    100%{text-shadow:0 0 8px var(--glow),0 0 18px var(--glow);transform:translate(0)}}.gl{animation:gl .28s linear}`;
  document.head.appendChild(s);
  function f(){t.classList.add('gl');setTimeout(()=>t.classList.remove('gl'),280);
    setTimeout(f,7000+Math.random()*11000);}setTimeout(f,5000);})();

loadConfig();
</script>
