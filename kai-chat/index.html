<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAI · Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8FC;
    --bg-input:#FFF0F8;
    --pink:#FF6BAE;
    --pink-dim:#F5A0CC;
    --pink-soft:#FFD6EC;
    --pink-deep:#C8356E;
    --text-dark:#3B0A22;
    --text-mid:#8C4D6E;
    --text-muted:#BF86A8;
    --border:#F0B0D0;
    --glow:rgba(255,107,174,.38);
    --warn:#FF5D7A;
    --r:18px; --rsm:12px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text-dark);font-family:'Nunito',sans-serif;}
  .page{display:flex;flex-direction:column;height:100vh;}

  /* ── HEADER ─────────────────────────────── */
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 24px;
    background:linear-gradient(to right, #FFF0F8, #FFF8FC, #FFF0F8);
    border-bottom:2.5px solid var(--border);
    box-shadow:0 3px 14px rgba(255,107,174,.10);
    flex-shrink:0;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand h1{
    font-size:28px;font-weight:900;color:var(--pink);letter-spacing:3px;
    text-shadow:3px 3px 0 var(--pink-deep);
  }
  .brand .sub{
    font-size:12px;font-weight:700;color:var(--text-mid);
    background:var(--pink-soft);padding:4px 14px;border-radius:20px;
    border:2px solid var(--border);box-shadow:2px 2px 0 var(--border);
  }
  .hstatus{
    display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;
    letter-spacing:1px;color:var(--text-muted);background:var(--bg);
    padding:7px 16px;border-radius:20px;border:2px solid var(--border);
    box-shadow:2px 2px 0 var(--border);transition:all .2s;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--border);transition:background .3s,box-shadow .3s;}
  .hstatus.online{border-color:#7DE8B0;box-shadow:2px 2px 0 #7DE8B0;color:#2DA866;}
  .hstatus.online .dot{background:#3DCA7A;box-shadow:0 0 0 3px rgba(61,202,122,.25);animation:pulse 2s infinite;}
  .hstatus.busy{border-color:var(--pink);box-shadow:2px 2px 0 var(--pink);color:var(--pink-deep);}
  .hstatus.busy .dot{background:var(--pink);box-shadow:0 0 0 3px var(--glow);animation:pulse .8s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ── BODY ────────────────────────────────── */
  .body-split{display:flex;flex:1;overflow:hidden;}

  /* ── ANIM PANEL — dark so nodes glow ─────── */
  .anim-panel{
    width:420px;flex-shrink:0;position:relative;
    border-right:2.5px solid var(--border);overflow:hidden;
    background:#12061A;
  }
  #nc{display:block;width:100%;height:calc(100% - 50px);}
  .nn-footer{
    position:absolute;bottom:0;left:0;right:0;height:50px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    border-top:1px solid rgba(240,176,208,.12);
    background:rgba(18,6,26,.88);
  }
  .nn-dot{width:8px;height:8px;border-radius:50%;background:rgba(240,176,208,.25);transition:background .5s,box-shadow .5s;}
  .nn-dot.on{background:var(--pink);box-shadow:0 0 0 4px var(--glow);animation:pulse .8s infinite;}
  .nn-lbl{font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(240,176,208,.45);transition:color .5s;}
  .nn-lbl.on{color:var(--pink);text-shadow:0 0 8px var(--glow);}

  /* ── CHAT PANEL ──────────────────────────── */
  .chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .controls{
    display:flex;align-items:center;padding:9px 18px;
    border-bottom:2px solid var(--border);background:var(--bg);flex-shrink:0;
  }
  .controls button{
    background:var(--bg);border:2px solid var(--border);color:var(--text-muted);
    font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;
    padding:5px 16px;border-radius:20px;cursor:pointer;
    box-shadow:2px 2px 0 var(--border);transition:all .12s;
  }
  .controls button:hover{color:var(--pink-deep);border-color:var(--pink);box-shadow:3px 3px 0 var(--pink);transform:translate(-1px,-1px);}
  .controls button:active{transform:translate(1px,1px);box-shadow:none;}

  /* ── CHAT AREA — dot texture ─────────────── */
  .chat{
    flex:1;overflow-y:auto;padding:20px 18px;
    display:flex;flex-direction:column;gap:14px;
    background-color:var(--bg);
    background-image:radial-gradient(circle, rgba(240,176,208,.38) 1.2px, transparent 1.2px);
    background-size:22px 22px;
  }
  .chat::-webkit-scrollbar{width:5px;}
  .chat::-webkit-scrollbar-track{background:transparent;}
  .chat::-webkit-scrollbar-thumb{background:var(--pink-soft);border-radius:10px;}

  /* ── GREETING CARD ───────────────────────── */
  .greet-card{
    align-self:center;margin:auto;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
    background:#fff;border:2.5px solid var(--border);border-radius:28px;
    padding:36px 32px;box-shadow:4px 4px 0 var(--pink-soft);
  }
  .greet-icon{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg,var(--pink-soft),var(--pink-dim));
    border:3px solid var(--border);box-shadow:3px 3px 0 var(--border);
    display:flex;align-items:center;justify-content:center;font-size:30px;
  }
  .greet-title{font-size:20px;font-weight:900;color:var(--pink-deep);}
  .greet-sub{font-size:13px;font-weight:600;color:var(--text-muted);max-width:230px;line-height:1.55;}

  /* ── MESSAGES ────────────────────────────── */
  .msg{display:flex;gap:10px;max-width:87%;animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .av{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;margin-top:3px;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    border:2px solid var(--border);box-shadow:2px 2px 0 var(--border);
  }
  .lbl{display:block;font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;opacity:.55;}

  .msg.kai{align-self:flex-start;}
  .msg.kai .av{background:linear-gradient(135deg,var(--pink-soft),#fff);}
  .msg.kai .bubble{
    background:#fff;border:2.5px solid var(--border);
    border-radius:0 var(--r) var(--r) var(--r);
    padding:10px 14px;color:var(--text-dark);
    font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
    box-shadow:3px 3px 0 var(--pink-soft);
  }

  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg.user .av{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    border-color:var(--pink-deep);box-shadow:2px 2px 0 var(--pink-deep);
    color:#fff;font-size:13px;
  }
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    border:2.5px solid var(--pink-deep);
    border-radius:var(--r) 0 var(--r) var(--r);
    padding:10px 14px;color:#fff;
    font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
    box-shadow:3px 3px 0 var(--pink-deep);
  }

  .msg.system{
    display:block;align-self:center;max-width:none;
    background:rgba(255,214,236,.55);border:1.5px solid var(--border);
    border-radius:20px;padding:4px 18px;
    font-size:12px;font-weight:700;color:var(--text-muted);
    text-align:center;box-shadow:1px 1px 0 var(--border);
    backdrop-filter:blur(6px);
  }
  .msg.system.warn{background:rgba(255,93,122,.08);border-color:var(--warn);color:var(--warn);box-shadow:1px 1px 0 var(--warn);}

  /* blinking cursor */
  .cursor{display:inline-block;width:7px;height:13px;background:var(--pink);border-radius:2px;animation:blink 1s steps(1) infinite;vertical-align:text-bottom;margin-left:2px;}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  /* ── INPUT ───────────────────────────────── */
  .input-row{
    border-top:2.5px solid var(--border);padding:13px 18px 16px;
    display:flex;align-items:flex-end;gap:12px;flex-shrink:0;
    background:linear-gradient(to right,#FFF0F8,var(--bg),#FFF0F8);
  }
  .input-wrap{
    flex:1;display:flex;align-items:flex-end;
    background:var(--bg-input);border:2.5px solid var(--border);
    border-radius:var(--r);padding:8px 14px;
    box-shadow:2px 2px 0 var(--border);transition:border-color .18s,box-shadow .18s;
  }
  .input-wrap:focus-within{border-color:var(--pink);box-shadow:3px 3px 0 var(--pink);}
  textarea#input{
    flex:1;background:none;border:none;outline:none;
    font-family:'Nunito',sans-serif;font-size:14.5px;font-weight:600;
    color:var(--text-dark);resize:none;max-height:120px;min-height:24px;line-height:1.5;
  }
  textarea#input::placeholder{color:var(--text-muted);}
  textarea#input:disabled{opacity:.5;}
  button#send{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    border:2.5px solid var(--pink-deep);color:#fff;
    font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;letter-spacing:1px;
    padding:10px 22px;border-radius:var(--rsm);cursor:pointer;
    box-shadow:3px 3px 0 var(--pink-deep);transition:all .12s;
  }
  button#send:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pink-deep);}
  button#send:active{transform:translate(2px,2px);box-shadow:none;}
  button#send:disabled{opacity:.38;cursor:default;}

  @media(max-width:820px){.anim-panel{display:none;}}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="brand">
      <h1 id="title">КАЙ</h1>
      <span class="sub">добрый помощник ✨</span>
    </div>
    <div class="hstatus" id="status">
      <span class="dot"></span>
      <span id="statusText">НЕ ПОДКЛЮЧЕНО</span>
    </div>
  </header>

  <div class="body-split">

    <!-- LEFT: animation — dark bg so candy nodes pop -->
    <div class="anim-panel">
      <canvas id="nc"></canvas>
      <div class="nn-footer">
        <span class="nn-dot" id="nnDot"></span>
        <span class="nn-lbl" id="nnLbl">РЕЖИМ ОЖИДАНИЯ</span>
      </div>
    </div>

    <!-- RIGHT: chat -->
    <div class="chat-panel">
      <div class="controls">
        <button id="clearBtn">🗑 очистить диалог</button>
      </div>
      <div class="chat" id="chat">
        <div class="greet-card" id="greetCard">
          <div class="greet-icon">✦</div>
          <div class="greet-title">Привет, я КАЙ</div>
          <div class="greet-sub">Напиши мне что-нибудь — я здесь и рад помочь 🌸</div>
        </div>
      </div>
      <div class="input-row">
        <div class="input-wrap">
          <textarea id="input" rows="1" placeholder="Напиши Каю что-нибудь... ✨" disabled></textarea>
        </div>
        <button id="send" disabled>ОТПРАВИТЬ</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   NEURAL SPIRAL — candy palette, dark background
═══════════════════════════════════════════════ */
(function(){
  const cv=document.getElementById('nc'),ctx=cv.getContext('2d');
  const nnD=document.getElementById('nnDot'),nnL=document.getElementById('nnLbl');

  const COLS=['#FF6BAE','#FF9DE2','#C77DFF','#9D4EDD','#FFD93D','#FF6B6B','#4CC9F0','#06D6A0','#FF9F1C','#F72585'];
  const N=140,NH=10,DAMP=0.87,JIT=0.022;
  let W,H,CX,CY,nodes=[],impulses=[],activity=0,targetActivity=0,T=0;
  let sRot=Math.random()*Math.PI*2,cRot=Math.random()*Math.PI*2;

  function rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

  function resize(){const p=cv.parentElement;W=cv.width=p.clientWidth;H=cv.height=p.clientHeight-50;CX=W*.5;CY=H*.5;build();}

  function build(){
    nodes=[];impulses=[];
    const dTheta=0.28,maxR=Math.min(W,H)*0.44,spiralA=maxR/(N*dTheta);
    for(let i=0;i<N;i++){
      const hub=i<NH,group=Math.floor(i*COLS.length/N),col=COLS[group];
      const sTheta=i*dTheta,sR=spiralA*sTheta;
      const sx=CX+Math.cos(sTheta+sRot)*sR,sy=CY+Math.sin(sTheta+sRot)*sR*.88;
      nodes.push({x:sx,y:sy,vx:0,vy:0,px:sx,py:sy,sTheta,sR,cAng:Math.random()*Math.PI*2,cR:hub?18+Math.random()*55:25+Math.random()*145,nOff:Math.random()*200,hub,group,col,r:hub?2.4+Math.random()*1.6:.65+Math.random()*1.2,ph:Math.random()*Math.PI*2,phS:.007+Math.random()*.013,dim:.28+Math.random()*.28,en:0,burst:0});
    }
  }

  window.neuralSetActive=function(on){targetActivity=on?1:0;if(on){nnD.classList.add('on');nnL.classList.add('on');nnL.textContent='ОБРАБОТКА...';}else{nnD.classList.remove('on');nnL.classList.remove('on');nnL.textContent='РЕЖИМ ОЖИДАНИЯ';}};

  function oNoise(n,sc,to){return Math.sin(n.nOff*1.3+T*sc)*.4+Math.sin(n.nOff*.7+T*sc*1.4+to)*.3+Math.cos(n.nOff*2.1+T*sc*.8)*.2;}

  function getTarget(n){
    const theta=n.sTheta+sRot,sx=CX+Math.cos(theta)*n.sR,sy=CY+Math.sin(theta)*n.sR*.88;
    const breath=1+.13*Math.sin(T*.021),angDr=oNoise(n,.007,0)*.75,radDr=oNoise(n,.006,100)*.38;
    const ang=n.cAng+cRot+angDr,r=n.cR*breath*(1+radDr),cx=CX+Math.cos(ang)*r,cy=CY+Math.sin(ang)*r*.88;
    const a=activity;return{tx:sx+(cx-sx)*a,ty:sy+(cy-sy)*a};
  }

  function rebind(frac){for(const n of nodes)if(!n.hub&&Math.random()<frac){n.cAng=Math.random()*Math.PI*2;n.cR=25+Math.random()*145;}}

  function update(){
    T++;activity+=(targetActivity-activity)*(targetActivity>activity?.024:.011);
    const act=activity;sRot+=.0006+act*.0005;cRot+=.0012+act*.003;
    if(act>.35&&T%180===0)rebind(.18);
    for(const n of nodes){
      n.px=n.x;n.py=n.y;const{tx,ty}=getTarget(n);let bx=0,by=0;
      if(n.burst>0){n.burst--;const dx=n.x-CX,dy=n.y-CY,len=Math.sqrt(dx*dx+dy*dy)||1,push=(n.burst/55)*1.4;bx=(dx/len)*push;by=(dy/len)*push;}
      const k=n.burst>0?.003:.017+act*.019;
      n.vx=(n.vx+(tx-n.x)*k+bx)*DAMP+(Math.random()-.5)*JIT;n.vy=(n.vy+(ty-n.y)*k+by)*DAMP+(Math.random()-.5)*JIT;
      n.x+=n.vx;n.y+=n.vy;n.ph+=n.phS;n.en=Math.max(0,n.en-.014);
    }
    if(act>.4&&T%95===0){const pivot=nodes[Math.floor(Math.random()*nodes.length)];let c=0;for(const n of nodes){const dx=n.x-pivot.x,dy=n.y-pivot.y;if(dx*dx+dy*dy<58*58&&c<20){n.burst=50+Math.floor(Math.random()*35);c++;}}}
    if(act>.25&&T%42===0){const h=nodes.filter(n=>n.hub);h[Math.floor(Math.random()*h.length)].en=.85;}
    const hubs=nodes.filter(n=>n.hub);
    if(act>.2&&T%68===0&&hubs.length>=2){let i=Math.floor(Math.random()*hubs.length),j;do{j=Math.floor(Math.random()*hubs.length);}while(j===i);hubs[i].en=.9;hubs[j].en=.4;impulses.push({a:hubs[i],b:hubs[j],p:0,spd:.016+Math.random()*.014,col:hubs[i].col});}
    for(let i=impulses.length-1;i>=0;i--){impulses[i].p+=impulses[i].spd;if(impulses[i].p>=1){impulses[i].b.en=1;impulses.splice(i,1);}}
  }

  function draw(){
    ctx.clearRect(0,0,W,H);const act=activity;
    /* central glow */
    if(act>.08){const aR=95+25*Math.sin(T*.022),ag=ctx.createRadialGradient(CX,CY,0,CX,CY,aR);ag.addColorStop(0,`rgba(255,107,174,${.055*act})`);ag.addColorStop(.45,`rgba(199,125,255,${.02*act})`);ag.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();ctx.arc(CX,CY,aR,0,Math.PI*2);ctx.fillStyle=ag;ctx.fill();}
    /* trails */
    for(const n of nodes){const spd=Math.abs(n.vx)+Math.abs(n.vy);if(spd>.75){ctx.strokeStyle=rgba(n.col,Math.min(spd*.035,.22));ctx.lineWidth=n.r*.7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(n.px,n.py);ctx.lineTo(n.x,n.y);ctx.stroke();}}
    /* same-group links */
    const maxD=72,maxD2=72*72;
    for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j];if(a.group!==b.group)continue;const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2>maxD2)continue;const norm=1-Math.sqrt(d2)/maxD;ctx.strokeStyle=rgba(a.col,norm*(.032+act*.1));ctx.lineWidth=.35;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
    /* hub web (white works on dark) */
    if(act>.15){const hubs=nodes.filter(n=>n.hub);for(let i=0;i<hubs.length;i++)for(let j=i+1;j<hubs.length;j++){const a=hubs[i],b=hubs[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d>240)continue;const op=(.012+act*.022)*(1-d/240);ctx.strokeStyle=`rgba(255,255,255,${op})`;ctx.lineWidth=.3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
    /* impulses */
    for(const imp of impulses){const px=imp.a.x+(imp.b.x-imp.a.x)*imp.p,py=imp.a.y+(imp.b.y-imp.a.y)*imp.p,fade=Math.sin(imp.p*Math.PI);const lg=ctx.createLinearGradient(imp.a.x,imp.a.y,imp.b.x,imp.b.y);lg.addColorStop(Math.max(0,imp.p-.18),'rgba(0,0,0,0)');lg.addColorStop(imp.p,rgba(imp.col,.32*fade));lg.addColorStop(Math.min(1,imp.p+.18),'rgba(0,0,0,0)');ctx.strokeStyle=lg;ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(imp.a.x,imp.a.y);ctx.lineTo(imp.b.x,imp.b.y);ctx.stroke();const pg=ctx.createRadialGradient(px,py,0,px,py,13);pg.addColorStop(0,rgba(imp.col,.8*fade));pg.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();ctx.arc(px,py,13,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();ctx.beginPath();ctx.arc(px,py,2.2,0,Math.PI*2);ctx.fillStyle=rgba(imp.col,.95*fade);ctx.fill();}
    /* nodes */
    for(const n of nodes){const breath=Math.sin(n.ph)*.14,bright=n.dim+breath+act*.15+n.en*.52,r=n.r+(n.hub?act*1.8:0)+n.en*.65;if(n.hub||n.en>.1){const gR=r*(n.hub?8.5:5),gO=(.04+n.en*.1+act*.028)*(n.hub?1.5:1),g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,gR);g.addColorStop(0,rgba(n.col,gO));g.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();ctx.arc(n.x,n.y,gR,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}ctx.beginPath();ctx.arc(n.x,n.y,Math.max(.4,r),0,Math.PI*2);ctx.fillStyle=rgba(n.col,Math.min(bright,1));ctx.fill();}
  }

  function loop(){update();draw();requestAnimationFrame(loop);}
  resize();loop();
  window.addEventListener('resize',()=>resize());
})();

/* ═══════════════════════════════════════════════
   CHAT
═══════════════════════════════════════════════ */
const chat=document.getElementById('chat'),input=document.getElementById('input'),
  sendBtn=document.getElementById('send'),clearBtn=document.getElementById('clearBtn'),
  statusEl=document.getElementById('status'),statusTx=document.getElementById('statusText');

let API_BASE='',busy=false,pollTimer=null;
const SP=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
const GH='https://api.github.com/repos/Yourssugar/A.C.EON/contents/kai-chat/config.json';

function getSid(){let i=localStorage.getItem('kai_sid');if(!i){i=crypto.randomUUID?crypto.randomUUID():'s'+Math.random().toString(36).slice(2);localStorage.setItem('kai_sid',i);}return i;}
const SID=getSid();

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function removeGreeting(){const g=document.getElementById('greetCard');if(g)g.remove();}

function addMsg(role,text){
  if(role==='user')removeGreeting();
  const d=document.createElement('div');d.className='msg '+role;
  if(role==='user') d.innerHTML=`<div class="av">◆</div><div class="bubble"><span class="lbl">ТЫ</span>${esc(text)}</div>`;
  else if(role==='kai') d.innerHTML='<div class="av">✦</div><div class="bubble"><span class="lbl">КАЙ</span><span class="text"></span></div>';
  else d.textContent=text;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}

function setUi(st){
  statusEl.className='hstatus';
  if(st==='ready'){statusEl.classList.add('online');statusTx.textContent='ОНЛАЙН';input.disabled=false;sendBtn.disabled=busy;input.placeholder='Напиши Каю что-нибудь... ✨';if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
  else if(st==='busy'){statusEl.classList.add('busy');statusTx.textContent='ЗАНЯТ';input.disabled=true;sendBtn.disabled=true;input.placeholder='Кай сейчас с кем-то другим...';if(!pollTimer)pollTimer=setInterval(chkAvail,8000);}
  else{statusTx.textContent='НЕ ПОДКЛЮЧЕНО';input.disabled=true;sendBtn.disabled=true;input.placeholder='Подключение...';if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
}

async function chkAvail(){try{const r=await fetch(API_BASE+'/api/state?session_id='+encodeURIComponent(SID));if(!r.ok)throw 0;const d=await r.json();if(!d.busy){addMsg('system','— Кай свободен 💕 —');setUi('ready');input.focus();}}catch(_){}}

async function loadConfig(){try{const r=await fetch(GH+'?t='+Date.now(),{headers:{'Accept':'application/vnd.github.v3+json'}});if(!r.ok)throw 0;const d=await r.json();const cfg=JSON.parse(atob(d.content.replace(/\n/g,'')));if(!cfg.api_url)throw 0;API_BASE=cfg.api_url;await connect();}catch(_){addMsg('system warn','— Кай офлайн 😴 —');setUi('disconnected');}}

async function connect(){try{const r=await fetch(API_BASE+'/api/state?session_id='+encodeURIComponent(SID));if(!r.ok)throw 0;const d=await r.json();if(d.busy){addMsg('system warn','— Кай занят 💭 —');setUi('busy');}else{addMsg('system','— привет! Кай здесь 🌸 —');setUi('ready');input.focus();}}catch(_){addMsg('system warn','— сервер недоступен 😴 —');setUi('disconnected');}}

input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
sendBtn.addEventListener('click',doSend);

async function doSend(){
  const text=input.value.trim();if(!text||busy||!API_BASE)return;
  addMsg('user',text);input.value='';input.style.height='auto';
  busy=true;sendBtn.disabled=true;
  window.neuralSetActive&&window.neuralSetActive(true);
  const div=addMsg('kai','');
  const span=div.querySelector('.text'),bubble=div.querySelector('.bubble');
  let si=0;span.textContent=SP[0]+' думает...';
  const st=setInterval(()=>{si=(si+1)%SP.length;span.textContent=SP[si]+' думает...';},90);
  let first=true;const cur=document.createElement('span');cur.className='cursor';
  try{
    const r=await fetch(API_BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:SID})});
    if(r.status===409){clearInterval(st);div.remove();addMsg('system warn','— Кай занят 💭 —');setUi('busy');busy=false;window.neuralSetActive&&window.neuralSetActive(false);return;}
    const reader=r.body.getReader();const dec=new TextDecoder('utf-8');
    while(true){const{value,done}=await reader.read();if(done)break;const chunk=dec.decode(value,{stream:true});if(chunk){if(first){clearInterval(st);span.textContent='';bubble.appendChild(cur);first=false;}span.textContent+=chunk;chat.scrollTop=chat.scrollHeight;}}
    if(first){clearInterval(st);span.textContent='...';}
  }catch(_){clearInterval(st);span.textContent='[Ошибка соединения 😢]';setUi('disconnected');}
  finally{cur.remove();busy=false;sendBtn.disabled=false;window.neuralSetActive&&window.neuralSetActive(false);if(!statusEl.classList.contains('busy')&&!statusEl.classList.contains('offline'))input.focus();}
}

clearBtn.addEventListener('click',async()=>{
  if(!API_BASE)return;
  const r=await fetch(API_BASE+'/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:SID})});
  if(r.status===409){addMsg('system warn','— Кай занят 💭 —');return;}
  chat.innerHTML='<div class="msg system">— диалог очищен ✨ —</div>';
});

/* bounce вместо глитча */
(function(){
  const t=document.getElementById('title');
  const s=document.createElement('style');
  s.textContent=`@keyframes hbounce{0%,100%{transform:translateY(0)}25%{transform:translateY(-5px) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}75%{transform:translateY(-1px)}}.hb{animation:hbounce .45s ease}`;
  document.head.appendChild(s);
  function f(){t.classList.add('hb');setTimeout(()=>t.classList.remove('hb'),450);setTimeout(f,8000+Math.random()*12000);}
  setTimeout(f,3000);
})();

loadConfig();
</script>
