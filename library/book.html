<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Книга / Библиотека A.C.EON</title>
<meta name="description" content="Книга A.C.EON на столе: листайте страницы, слушайте песни глав.">
<meta name="theme-color" content="#050302">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/pt-serif-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-cyrillic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/book.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="scene" aria-label="Стол с раскрытой книгой"></canvas>

<header class="top">
  <a id="back" class="brand" href="index.html">
    <span class="brand-arrow" aria-hidden="true">&lt;</span>
    <span class="brand-text"><span>Библиотека</span><strong id="book-title">Книга</strong></span>
  </a>
  <div class="top-right">
    <div class="toc-wrap">
      <button id="open-toc" class="chip" type="button">Оглавление</button>
      <div id="toc" class="toc"><ol id="toc-list"></ol></div>
    </div>
    <button id="open-text" class="chip" type="button">Текстом</button>
    <button id="sound" class="chip" type="button">Звук</button>
    <button id="quality" class="chip" type="button">Графика</button>
  </div>
</header>

<div id="loader" class="loader" role="status">Зажигаем лампу</div>

<nav class="pager" aria-label="Страницы">
  <button id="prev" class="pager-btn" type="button" aria-label="Предыдущий разворот">&lt;</button>
  <div class="pager-label" aria-live="polite">
    <span id="pager-chapter" class="pager-chapter"></span>
    <span id="pager-page" class="pager-page"></span>
  </div>
  <button id="next" class="pager-btn" type="button" aria-label="Следующий разворот">&gt;</button>
</nav>
<p class="turn-hint">Тяните угол страницы или жмите стрелки. Колесо мыши приближает разворот.</p>

<section id="radio" class="radio" aria-label="Приёмник"></section>

<div id="reader" class="reader" aria-hidden="true"></div>

<div id="lightbox" class="lightbox"><img id="lightbox-img" alt=""></div>

<div class="fail">
  <p id="fail-text"></p>
  <a class="btn" href="index.html">Вернуться к полке</a>
</div>

<script src="../shared/trace.js"></script>
<script type="module" src="js/book/main.js"></script>
</body>
</html>
