<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.C.EON · NODE AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0e17; --ink:#1a1c2c; --pan:#161a2b; --pan2:#21283f; --line:#333c57;
  --txt:#f4f4f4; --dim:#94b0c2; --mute:#566c86; --acc:#41a6f6; --cyan:#73eff7;
  --lime:#a7f070; --red:#b13e53; --org:#ef7d57; --ylw:#ffcd75; --navy:#29366f;
  --px:'Pixelify Sans','JetBrains Mono',monospace; --mono:'JetBrains Mono',monospace;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;font-family:var(--px);-webkit-tap-highlight-color:transparent}
button,a,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
.px{background:var(--pan);border:2px solid var(--ink);box-shadow:inset 2px 2px 0 var(--pan2),inset -2px -2px 0 #0b0d16,0 0 0 2px var(--line)}
.pbtn{font-family:var(--px);font-size:14px;letter-spacing:.06em;padding:8px 14px;background:var(--pan2);border:2px solid var(--ink);
  box-shadow:inset 0 -3px 0 #121626,inset 0 2px 0 #2d3656;color:var(--txt);white-space:nowrap}
.pbtn:hover:not(:disabled){background:#2b3554}
.pbtn:active:not(:disabled){box-shadow:inset 0 3px 0 #121626;transform:translateY(1px)}
.pbtn.go{background:#24496f;box-shadow:inset 0 -3px 0 #152a40,inset 0 2px 0 #41a6f6}
.pbtn.go:hover:not(:disabled){background:#2c5a88}
.pbtn:disabled{opacity:.42}

/* шапка, как в офисе */
#top{position:fixed;left:0;right:0;top:0;height:46px;z-index:20;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:#10131f;border-bottom:2px solid var(--ink);box-shadow:0 2px 0 var(--line)}
#back{font-size:14px;color:var(--dim);padding:6px 8px;white-space:nowrap;text-decoration:none}
#back:hover{color:var(--txt)}
#ttl{font-size:17px;letter-spacing:.08em;white-space:nowrap}
#ttl b{color:var(--acc);font-weight:600}
#top .sp{flex:1}
#st{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;display:inline-block;background:var(--mute);box-shadow:0 0 0 2px var(--ink)}
.dot.on{background:var(--lime)} .dot.busy{background:var(--org)} .dot.off{background:var(--red)} .dot.conn{background:var(--ylw);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#obs{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.08em}
.hbtn{min-width:34px;height:30px;padding:0 8px;font-size:13px;background:var(--pan2);border:2px solid var(--ink);box-shadow:inset 0 -2px 0 #121626;color:var(--dim)}
.hbtn:hover{color:var(--txt)}
.hbtn.muted{color:var(--mute)}
#langwrap{position:relative}
#langmenu{position:absolute;right:0;top:36px;display:none;flex-direction:column;min-width:150px;padding:4px;z-index:40}
#langmenu.on{display:flex}
#langmenu button{text-align:left;padding:6px 10px;font-size:14px;color:var(--dim);display:flex;gap:10px}
#langmenu button b{font-weight:400;color:var(--acc);width:22px}
#langmenu button:hover,#langmenu button.sel{color:var(--txt);background:var(--pan2)}

/* сцена и чат: на ПК рядом, на телефоне друг под другом */
#main{position:fixed;left:0;right:0;top:48px;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,36%)}
#scene{position:relative;overflow:hidden;background:#0b0d16;
  background-image:linear-gradient(rgba(65,166,246,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(65,166,246,.05) 1px,transparent 1px);background-size:16px 16px}
#sv{position:absolute;left:50%;top:50%}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#sov{position:absolute;inset:0;pointer-events:none}
#chatp{display:flex;flex-direction:column;min-height:0;background:#10131f;border-left:2px solid var(--ink);box-shadow:-2px 0 0 var(--line)}
#log{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.msg{max-width:94%;animation:mIn .18s steps(3) both}
@keyframes mIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg .lb{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;margin-bottom:5px;color:var(--dim)}
.msg .lb canvas{width:32px;height:20px;image-rendering:pixelated;border:2px solid var(--ink);flex:none}
.msg .tx{font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;padding:10px 12px;border:2px solid var(--ink)}
.msg.node .lb{color:var(--acc)}
.msg.node .tx{background:#eef4ff;color:#14151f;box-shadow:3px 3px 0 #29366f}
.msg.me{align-self:flex-end}
.msg.me .lb{justify-content:flex-end;color:var(--mute)}
.msg.me .tx{font-family:'Rubik',sans-serif;background:var(--pan2);color:var(--txt);box-shadow:3px 3px 0 #0b0d16}
.msg.sys .lb{color:var(--ylw)}
.msg.sys .tx{font-size:12px;background:#221e14;color:#e8c98a;border-color:#3b3220}
.msg.err .lb{color:var(--org)}
.msg.err .tx{font-size:12px;background:#2a1418;color:#f0a5a5;border-color:#4a2028}
.tx.cur::after{content:'_';animation:blink .6s steps(2) infinite;margin-left:1px}
#bar{flex-shrink:0;padding:10px 12px 12px;border-top:2px solid var(--ink);box-shadow:0 -2px 0 var(--line);background:#121624}
#bar .row{display:flex;gap:8px;align-items:stretch}
#in{flex:1;min-width:0;resize:none;height:44px;max-height:120px;padding:10px 12px;font-family:'Rubik',sans-serif;font-size:15px;line-height:1.4;
  background:#0b0d16;color:var(--txt);border:2px solid var(--ink);box-shadow:inset 2px 2px 0 #06070c,0 0 0 2px var(--line);outline:none}
#in:focus{box-shadow:inset 2px 2px 0 #06070c,0 0 0 2px var(--acc)}
#in:disabled{opacity:.5}
#in::placeholder{color:var(--mute)}
#bar .meta{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.06em}

/* реплики гостей над сценой */
.bub{position:absolute;transform:translate(-50%,-100%);max-width:220px;width:max-content;padding:6px 10px 7px;background:#f8f6ee;color:#14151f;
  font-size:var(--bf,14px);line-height:1.25;text-align:center;font-family:'Rubik',sans-serif;font-weight:500;border:2px solid var(--ink);
  box-shadow:2px 2px 0 rgba(13,14,23,.45);animation:bubIn .16s steps(3) both}
.bub::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-4px;border:4px solid transparent;border-top:4px solid var(--ink)}
.bub.f-anton{font-family:'JetBrains Mono',monospace;border-color:#5a2e1d}
.bub.f-kai{font-family:'Nunito',sans-serif;font-weight:700;border-color:#7a2340;background:#fff4f6}
.bub.out{animation:bubOut .2s steps(3) both}
@keyframes bubIn{from{opacity:0;margin-top:4px}to{opacity:1;margin-top:0}}
@keyframes bubOut{to{opacity:0;margin-top:-4px}}

/* загрузка */
#boot{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .4s;cursor:pointer}
#boot.gone{opacity:0;pointer-events:none}
#bootl{font-family:var(--mono);font-size:13px;line-height:1.9;color:var(--dim);min-width:280px;white-space:pre}
#bootl b{color:var(--acc);font-weight:500} #bootl i{font-style:normal;color:var(--red)} #bootl u{text-decoration:none;color:var(--lime)}

@media (max-width:860px){
  #main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #scene{height:min(46vh,calc(100vw * .75))}
  #chatp{border-left:0;box-shadow:none;border-top:2px solid var(--ink)}
  #obs{display:none}
}
@media (max-width:520px){
  #ttl{font-size:14px} #st .lbl{display:none} #back{padding:6px 2px}
  .msg .tx{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot"><pre id="bootl"></pre></div>

<header id="top">
  <a id="back" href="../chat/">&lt; OFFICE</a>
  <div id="ttl">A.C.EON <b>NODE AI</b></div>
  <div class="sp"></div>
  <span id="st"><span class="dot conn" id="dot"></span><span class="lbl" id="stl">CONNECTING</span></span>
  <span id="obs"></span>
  <button class="hbtn" id="snd" type="button">♪</button>
  <div id="langwrap">
    <button class="hbtn" id="langbtn" type="button">EN</button>
    <div id="langmenu" class="px"></div>
  </div>
</header>

<main id="main">
  <section id="scene"><div id="sv"><canvas id="cv" width="240" height="180"></canvas><div id="sov"></div></div></section>
  <section id="chatp">
    <div id="log"></div>
    <div id="bar">
      <div class="row">
        <textarea id="in" rows="1" maxlength="1000" disabled></textarea>
        <button class="pbtn go" id="send" type="button" disabled>SEND</button>
      </div>
      <div class="meta"><span id="hint"></span><span id="cnt">0 / 1000</span></div>
    </div>
  </section>
</main>

<script src="../games/shared/store.js?v=1"></script>
<script src="../games/shared/i18n.js?v=1"></script>

let css=1;
function fit(){
  const dpr=devicePixelRatio||1, w=scene.clientWidth, h=scene.clientHeight;
  /* на экранах с плотными пикселями (телефоны) сцена встаёт ровно по ширине, разница в 1 физический пиксель там не видна;
     на обычных мониторах масштаб целый, чтобы пиксели были одинаковые */
  const fitK=Math.min(w*dpr/240,h*dpr/180);
  const k=dpr>=2?Math.max(1,fitK):Math.max(1,Math.floor(fitK));
  css=k/dpr;
  Object.assign(sv.style,{width:240*css+'px',height:180*css+'px',marginLeft:-120*css+'px',marginTop:-90*css+'px'});
  sov.style.setProperty('--bf',Math.max(12,Math.min(16,Math.round(css*3.6)))+'px');
}
addEventListener('resize',fit);
function night(){ const h=new Date().getHours(); return h>=21||h<6; }
function bodyFrame(now){
  if(link==='off')return 'sleep';
  if(mode==='error')return 'glitch';
  if(mode==='wave')return 'wave';
  if(mode==='think')return ['think1','think2','think3'][(now/160|0)%3];
  if(mode==='talk')return (now/420|0)%2?'talk2':'talk1';
  if(link==='busy')return 'busy';
  if(now-lastType<1500)return 'listen';
  return (now/900|0)%2?'idle2':'idle1';
}
function faceNow(now){
  if(link==='off')return null;
  if(mode==='error')return now%1000<600?'static':'error';
  if(mode==='wave')return 'happy';
  if(mode==='think')return ['think1','think2','think3'][(now/300|0)%3];
  if(mode==='talk')return talkMouth?'talk1':'talk2';
  if(faceOver&&now<faceOverUntil)return faceOver;
  if(link==='busy')return 'busy';
  if(now-lastType<1500)return 'listen';
  if(now>blinkAt){ if(now>blinkAt+140)blinkAt=now+2500+Math.random()*4000; return 'blink'; }
  return 'idle';
}
function drawScreens(now){
  SCR.forEach(([x,y,w,h],i)=>{
    if(link==='off'){ if(i===1&&(now/700|0)%2){ ctx.fillStyle='#b13e53'; ctx.fillRect(x+w-4,y+2,2,2); } return; }
    const t=now/1000;
    if(mode==='error'){ for(let k=0;k<26;k++){ ctx.fillStyle=Math.random()<.5?'#b13e53':'#5d275d'; ctx.fillRect(x+(Math.random()*w|0),y+(Math.random()*h|0),2,1); } return; }
    if(mode==='think'){ ctx.fillStyle='#a7f070';
      for(let r=0;r<5;r++){ const len=4+((Math.sin(r*7.3+Math.floor(t*12)+i*3)+1)*9|0); ctx.fillRect(x+2,y+2+r*2+((t*24|0)%2),Math.min(w-4,len),1); } return; }
    if(mode==='talk'){ ctx.fillStyle='#73eff7';
      for(let c=0;c<w-4;c+=2){ const a=talkMouth?(2+Math.random()*5|0):1; ctx.fillRect(x+2+c,y+h/2-a/2|0,1,a); } return; }
    if(link==='busy'){ ctx.fillStyle='#ef7d57'; const p=((t*20+i*9)%(w-4))|0; ctx.fillRect(x+2,y+h-4,p,2); ctx.fillStyle='#ffcd75'; ctx.fillRect(x+2,y+3,4+(t*3%8|0),1); return; }
    ctx.fillStyle='#41a6f6';
    if(i===0){ for(let c=0;c<w-4;c++){ const v=Math.sin(c/3+t*2)*3; ctx.fillRect(x+2+c,y+h/2+v|0,1,1); } }
    else if(i===1){ for(let c=0;c<4;c++){ const hh=2+((Math.sin(t*1.5+c*1.7)+1)*3|0); ctx.fillRect(x+4+c*5,y+h-2-hh,3,hh); } }
    else { ctx.fillRect(x+3,y+3,(t*4%(w-6))|0,1); ctx.fillRect(x+3,y+6,6,1); ctx.fillRect(x+3,y+9,10,1); if((t*2|0)%2)ctx.fillRect(x+15,y+9,2,1); }
  });
}
function drawPanel(now){
  CELLS.forEach(([x,y],i)=>{
    if(LOST.includes(i)){ if((now/(600+i*40)|0)%2){ ctx.fillStyle='#b13e53'; ctx.fillRect(x+3,y+4,2,2); } return; }
    if(link==='off')return;
    let col='#257179';
    if(mode==='think')col=((now/90|0)%12)===i?'#a7f070':'#38b764';
    else if(mode==='talk')col=Math.random()<.15?'#a7f070':'#38b764';
    else col=((now/1700+i*.37)%1)<.08?'#a7f070':'#38b764';
    ctx.fillStyle=col; ctx.fillRect(x+1,y+1,6,8);
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(x+1,y+1,6,1);
  });
}
function draw(now){
  const n=night(), f=(now/700|0)%2;
  const bg=IM[(n?'night_':'day_')+(f+1)]||IM[(n?'night_':'day_')+'1'];
  if(bg)ctx.drawImage(bg,0,0); else { ctx.fillStyle='#29366f'; ctx.fillRect(0,0,240,180); }
  drawPanel(now);
  drawScreens(now);
  drawGuest(now);
  if(IM.body){
    const fr=FR[bodyFrame(now)];
    ctx.drawImage(IM.body,(fr%4)*72,(fr>>2)*88,72,88,NX,NY,72,88);
    const fc=faceNow(now);
    if(fc&&IM.faces&&bodyFrame(now)!=='sleep'){ const i=FACE[fc]; ctx.drawImage(IM.faces,(i%4)*32,(i>>2)*20,32,20,NX+20,NY+14,32,20); }
  }
}

/* ---------- гости из офиса: заглядывают в дверь ---------- */
const GROW={anton:0,kai:1,intern:2,intern2:3};
/* ?guest=1 для проверки: гости приходят каждые несколько секунд */
const FASTG=new URLSearchParams(location.search).has('guest');
let guest=null, nextGuest=performance.now()+(FASTG?3000:25000+Math.random()*15000);
function startGuest(){
  const kinds=['anton','kai','intern','cat','vacuum']; const k=pick(kinds);
  if(k==='cat')guest={k,x:250,y:149,dir:-1,st:'walk',t:0,sp:22,say:true};
  else if(k==='vacuum')guest={k,x:192,y:149,dir:1,st:'walk',t:0,sp:18};
  else guest={k,row:k==='intern'?pick([2,3]):GROW[k],x:252,y:150,dir:-1,st:'in',t:0,stopX:222};
}
function guestLine(g){
  const off=link==='off', key=g.k==='cat'?'g_cat':'g_'+g.k+(off?'_off':'');
  return pick(T(key));
}
let gBub=null;
function say(x,y,text,cls){
  if(gBub)gBub.remove();
  const b=document.createElement('div'); b.className='bub '+(cls||''); b.textContent=text;
  b.style.left=Math.max(70,Math.min(240*css-70,x*css))+'px'; b.style.top=(y*css)+'px';
  sov.appendChild(b); gBub=b;
  const ms=2200+text.length*55;
  setTimeout(()=>{ if(gBub===b){ b.classList.add('out'); setTimeout(()=>b.remove(),220); gBub=null; } },ms);
  return ms;
}
let lastG=performance.now();
function stepGuest(now){
  const dt=Math.min(.05,(now-lastG)/1000); lastG=now;
  if(!guest){ if(now>nextGuest&&mode!=='think'&&mode!=='talk')startGuest(); return; }
  const g=guest; g.t+=dt;
  if(g.k==='cat'||g.k==='vacuum'){
    g.x+=g.dir*g.sp*dt;
    if(g.k==='cat'&&g.say&&g.x<224){ g.say=false; say(g.x,g.y-30,guestLine(g)); faceOver='heart'; faceOverUntil=now+1500; }
    if(g.k==='vacuum'&&g.t>.6&&!g.seen){ g.seen=true; faceOver='question'; faceOverUntil=now+1600; }
    if(g.x<180||g.x>252){ guest=null; nextGuest=now+(FASTG?2500:50000+Math.random()*50000); }
    return;
  }
  if(g.st==='in'){ g.x-=26*dt; if(g.x<=g.stopX){ g.x=g.stopX; g.st='stay'; g.t=0; g.ms=say(g.x,g.y-50,guestLine(g),g.k==='anton'?'f-anton':g.k==='kai'?'f-kai':''); faceOver='wow'; faceOverUntil=now+1200; } }
  else if(g.st==='stay'){ if(g.t*1000>g.ms+400){ g.st='out'; } }
  else { g.x+=26*dt; if(g.x>254){ guest=null; nextGuest=now+(FASTG?2500:50000+Math.random()*50000); } }
}
function drawGuest(now){
  const g=guest; if(!g)return;
  ctx.save(); ctx.beginPath(); ctx.rect(DOOR[0],DOOR[1],DOOR[2],DOOR[3]); ctx.clip();
  if(g.k==='cat'&&IM.cat){ const im=IM.cat; ctx.drawImage(im,Math.round(g.x-im.width),Math.round(g.y-im.height*2+((now/180|0)%2)),im.width*2,im.height*2); }
  else if(g.k==='vacuum'&&IM.vac1){ const im=(now/150|0)%2?IM.vac2:IM.vac1; ctx.drawImage(im,Math.round(g.x-im.width),Math.round(g.y-im.height*2),im.width*2,im.height*2); }
  else if(IM.guests){
    const walking=g.st!=='stay';
    const col=walking?(g.st==='in'?2+((now/140|0)%4):6+((now/140|0)%4)):(g.t<1.5?1:0);
    ctx.drawImage(IM.guests,col*16,g.row*24,16,24,Math.round(g.x-16),Math.round(g.y-48),32,48);
  }
  ctx.restore();
}

let AC=null, sndOn=true;
try{ sndOn=localStorage.getItem('nodechat:snd')!=='0'; }catch(e){}
function sfxVol(){ const s=hasI18n?Store.get('site'):readSite(); return typeof s.sfx==='number'?s.sfx:.8; }
function blip(){
  if(!sndOn)return; const v=sfxVol(); if(v<=0)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type='square'; o.frequency.value=480+Math.random()*160;
    g.gain.setValueAtTime(.035*v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.035);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.04);
  }catch(e){}
}

  if(kind==='node')l.appendChild(faceIcon());
  l.appendChild(document.createTextNode(label));

}
/* ответ печатается по буквам, NODE шевелит ртом и пищит */
function typeOut(el,text,done){
  el.textContent=''; el.classList.add('cur'); setMode('talk');
  const total=Math.min(7000,Math.max(600,text.length*24)), per=Math.max(1,Math.round(text.length/(total/16)));
  let i=0, n=0;
  const id=setInterval(()=>{
    const part=text.slice(i,i+per); i+=per;
    el.textContent=text.slice(0,i);
    const ch=part.trim();
    talkMouth=ch?((n++)%2):0;
    if(ch&&n%2===0)blip();
    log.scrollTop=log.scrollHeight;
    if(i>=text.length){ clearInterval(id); el.classList.remove('cur'); talkMouth=0; setMode('idle'); faceOver='happy'; faceOverUntil=performance.now()+1200; if(done)done(); }
  },16);
}

const CFG='config.json';
let API='', waiting=false, connectedOnce=false;
const inp=document.getElementById('in'), sendBtn=document.getElementById('send'), dot=document.getElementById('dot'), stl=document.getElementById('stl');

function paintInput(){
  const ready=(link==='on'||link==='busy')&&!waiting;

  inp.placeholder=waiting?T('ph_wait'):(link==='on'||link==='busy')?T('ph_on'):T('ph_off');
  document.getElementById('hint').textContent=(link==='on'||link==='busy')?T('hint_on'):T('hint_off');
}
function fetchTO(url,ms,opt){ const c=new AbortController(), t=setTimeout(()=>c.abort(),ms); opt=opt||{}; opt.signal=c.signal; return fetch(url,opt).finally(()=>clearTimeout(t)); }
function connect(first){
  fetchTO(CFG+'?t='+Date.now(),6000,{cache:'no-store'})
    .then(r=>{ if(!r.ok)throw 0; return r.json(); })
    .then(c=>{ if(!c.api_url||c.enabled===false)throw 0; API=c.api_url.replace(/\/$/,''); return fetchTO(API+'/api/state',5000); })
    .then(r=>{ if(!r.ok)throw 0; return r.json(); })
    .then(st=>{
      const was=link==='on'||link==='busy';
      setLink(st.busy?'busy':'on');
      if(!connectedOnce){ connectedOnce=true; setMode('wave',1800); const b=add('node','NODE',''); setTimeout(()=>typeOut(b,T('hello',{obs})),600); }
      else if(!was)add('sys',T('sys'),T('back_on'));
    })
    .catch(()=>{
      const was=link==='on'||link==='busy';
      setLink('off');
      if(first)add('err',T('nosig_t'),T('nosig'));
      else if(was)add('err',T('sys'),T('lost'));
    });
}
function send(){
  const q=inp.value.trim();
  if(!q||waiting||!(link==='on'||link==='busy'))return;
  add('me',obs,q);
  inp.value=''; autosize(); document.getElementById('cnt').textContent='0 / 1000';
  waiting=true; paintInput(); setMode('think');
  const b=add('node','NODE',''); b.classList.add('cur');
  fetchTO(API+'/api/chat',70000,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:q})})
    .then(r=>r.json().then(d=>({ok:r.ok,d})))
    .then(res=>{
      b.classList.remove('cur');
      if(!res.ok||!res.d||typeof res.d.text!=='string'){ fail(b,'refuse',(res.d&&res.d.message)||T('refuse')); return; }
      typeOut(b,res.d.text,()=>{ waiting=false; paintInput(); inp.focus(); });
    })
    .catch(e=>{ b.classList.remove('cur'); fail(b,'fail',T('fail')); console.warn('[NODE] запрос не прошёл:',e); connect(false); });
}
function fail(b,kind,text){
  const m=b.parentNode; m.className='msg err';
  m.querySelector('.lb').textContent=T(kind+'_t');
  b.textContent=text;
  setMode('error',2200); setTimeout(()=>{ if(mode==='idle'){ faceOver='sad'; faceOverUntil=performance.now()+1500; } },2300);
  waiting=false; paintInput();
}
function autosize(){ inp.style.height='44px'; inp.style.height=Math.min(120,inp.scrollHeight+4)+'px'; }
inp.addEventListener('input',()=>{ lastType=performance.now(); document.getElementById('cnt').textContent=inp.value.length+' / 1000'; autosize(); sendBtn.disabled=inp.disabled||!inp.value.trim(); });
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
sendBtn.addEventListener('click',send);

/* ---------- язык ---------- */
const langBtn=document.getElementById('langbtn'), langMenu=document.getElementById('langmenu');
LANGS.forEach(c=>{ const b=document.createElement('button'); b.type='button'; b.dataset.c=c; b.innerHTML='<b>'+c.toUpperCase()+'</b>'+LNAME[c];
  b.addEventListener('click',()=>{ setLang(c); langMenu.classList.remove('on'); }); langMenu.appendChild(b); });
langBtn.addEventListener('click',e=>{ e.stopPropagation(); langMenu.classList.toggle('on'); });
document.addEventListener('click',()=>langMenu.classList.remove('on'));
function setLang(c){
  if(hasI18n)I18n.set(c);
  else { fbLang=c; const o=readSite(); o.lang=c; try{ localStorage.setItem('aceon:site',JSON.stringify(o)); }catch(e){} }
  applyTexts();
}
function applyTexts(){
  document.documentElement.lang=lang();
  langBtn.textContent=lang().toUpperCase();
  langMenu.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.c===lang()));
  document.getElementById('back').textContent=T('back');
  sendBtn.textContent=T('send');
  stl.textContent=T(link); sndUI(); paintInput();
}
if(hasI18n&&I18n.onChange)I18n.onChange(applyTexts);
document.getElementById('obs').textContent='OBS: '+obs;

/* ---------- запуск ---------- */
const bootEl=document.getElementById('boot'), bootL=document.getElementById('bootl');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let booted=false;
T('boot').forEach((l,i)=>setTimeout(()=>{ if(!booted)bootL.innerHTML+=(i?'\n':'')+l; },reduce?0:i*230));
function hideBoot(){
  if(booted)return; booted=true;
  bootEl.classList.add('gone'); setTimeout(()=>bootEl.remove(),450);
  add('sys',T('mem_t'),T('mem'));
  connect(true);
  setInterval(()=>connect(false),15000);
}
bootEl.addEventListener('click',hideBoot);
applyTexts(); fit();
Promise.all([load('day_1','img/room_day_1.png'),load('day_2','img/room_day_2.png'),load('night_1','img/room_night_1.png'),load('night_2','img/room_night_2.png'),
  load('body','img/node_body.png'),load('faces','img/node_faces.png'),load('guests','img/guests.png'),load('cat','img/cat.png'),load('vac1','img/vacuum_1.png'),load('vac2','img/vacuum_2.png')])
  .then(()=>{ setTimeout(hideBoot,reduce?300:1700); });
(function loop(now){
  requestAnimationFrame(loop);
  if(mode!=='idle'&&modeUntil&&now>modeUntil)setMode('idle');
  stepGuest(now); draw(now);
})(performance.now());
})();
</script>
</body>
