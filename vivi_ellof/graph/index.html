<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>A.C.EON STUDIO | [OFFICIAL]</title>
<script>
/* заглушка следующей сцены (граф памяти). Попасть сюда можно только через зрачок,
   без открытой изнанки или при перезагрузке выбрасывает на главную */
(function(){
  var ok=false;
  try{
    var f=sessionStorage.getItem('aceon:rift');
    var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];
    if(f&&!(n&&n.type==='reload'))ok=true;
    else sessionStorage.removeItem('aceon:rift');
  }catch(e){}
  if(!ok)location.replace('../../');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#03181b;overflow:hidden;cursor:default}
body{display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",Consolas,monospace;color:#bfeee9;
  animation:in 2.4s ease forwards;background:#000}
@keyframes in{from{background:#03181b}to{background:#000}}
#c{position:fixed;inset:0;opacity:.5}
.t{position:relative;text-align:center;letter-spacing:.4em;opacity:0;animation:t 1.6s ease .8s forwards}
.t b{display:block;font-weight:400;font-size:clamp(18px,2.6vw,34px);margin-bottom:18px}
.t span{display:block;font-size:12px;letter-spacing:.3em;color:#6fd3d6;margin-top:8px}
.back{position:fixed;left:28px;bottom:24px;font-size:11px;letter-spacing:3px;color:#5f7f86;opacity:0;animation:t 1s ease 4s forwards;cursor:pointer}
@keyframes t{to{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="t"><b id="h"></b><span id="s1"></span><span id="s2"></span></div>
<div class="back" id="bk"></div>
<script>
(function(){
  var lang='en'; try{lang=sessionStorage.getItem('aceon:vivi-lang')||'en';}catch(e){}
  var T={ru:['ГРАФ ПАМЯТИ','узлы не найдены','сцена в разработке','[ esc ] назад в лабораторию'],
         en:['MEMORY GRAPH','no nodes found','scene in progress','[ esc ] back to the lab']}[lang==='ru'?'ru':'en'];
  document.getElementById('h').textContent=T[0];
  document.getElementById('s1').textContent=T[1];
  document.getElementById('s2').textContent=T[2];
  var bk=document.getElementById('bk'); bk.textContent=T[3];
  function back(){location.replace('../');}
  bk.onclick=back; addEventListener('keydown',function(e){if(e.key==='Escape')back();});
  /* фон: редкие точки-узлы, медленно дрейфуют, иногда соединяются */
  var c=document.getElementById('c'),x=c.getContext('2d'),P=[];
  function rs(){c.width=innerWidth;c.height=innerHeight;} rs(); addEventListener('resize',rs);
  for(var i=0;i<46;i++)P.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00012,vy:(Math.random()-.5)*.00012});
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<P.length;i++){var p=P[i];p.x=(p.x+p.vx+1)%1;p.y=(p.y+p.vy+1)%1;
      x.fillStyle='rgba(111,211,214,.7)';x.fillRect(p.x*c.width,p.y*c.height,2,2);
      for(var j=i+1;j<P.length;j++){var q=P[j],dx=(p.x-q.x)*c.width,dy=(p.y-q.y)*c.height,d=Math.hypot(dx,dy);
        if(d<120){x.strokeStyle='rgba(111,211,214,'+(0.18*(1-d/120))+')';x.beginPath();x.moveTo(p.x*c.width,p.y*c.height);x.lineTo(q.x*c.width,q.y*c.height);x.stroke();}}}
    requestAnimationFrame(f);
  })();
})();
</script>
</body>
</html>
