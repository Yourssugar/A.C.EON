<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>A.C.EON STUDIO | [OFFICIAL]</title>
<script>
/* граф памяти Архитектора. Попасть сюда можно только через зрачок,
   без открытой изнанки или при перезагрузке выбрасывает на главную */
(function(){
  var ok=false;
  try{
    var f=sessionStorage.getItem('aceon:rift');
    var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];
    if(f&&!(n&&n.type==='reload'))ok=true;
    else sessionStorage.removeItem('aceon:rift');
  }catch(e){}
  if(!ok)location.replace('../../');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#020306;overflow:hidden;font-family:"JetBrains Mono",Consolas,monospace;color:#d9e0ec}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;opacity:0;animation:in 2.6s ease .3s forwards}
@keyframes in{to{opacity:1}}
#ui{position:fixed;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;font-size:13px;letter-spacing:.2em;text-shadow:0 0 8px #000,0 0 2px #000;opacity:0;transition:opacity .25s ease;white-space:nowrap}
.card{position:absolute;right:6vw;top:50%;width:min(360px,80vw);transform:translate(20px,-50%);opacity:0;transition:opacity .5s ease,transform .5s ease;
  padding:24px 26px;background:rgba(3,5,10,.78);border:1px solid rgba(160,190,240,.25);pointer-events:none}
.card.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.card .k{font-size:11px;letter-spacing:4px;color:#e0a060;margin-bottom:10px}
.card .h{font-size:20px;letter-spacing:.12em;margin-bottom:12px;color:#f2f4f8}
.card .t{font-size:13px;line-height:1.7;color:#b9c2d2}
.card .x{font-size:12px;letter-spacing:2px;color:#c23a44}
.card button{margin-top:18px;background:none;border:1px solid rgba(224,160,96,.7);color:#f0c890;font:inherit;font-size:12px;letter-spacing:.3em;padding:9px 18px;cursor:pointer}
.card button:hover{background:rgba(224,160,96,.12)}
.hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:11px;letter-spacing:.25em;color:#6f7f96;transition:opacity 1.5s ease}
#fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;letter-spacing:.3em;color:#6fd3d6;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="fail"></div>
<script type="module">
let lang = 'en';
try { lang = sessionStorage.getItem('aceon:vivi-lang') || 'en'; } catch (e) {}
import('./graph.js?v=20261128e').then((m) => m.mount({ lang })).catch((e) => {
  console.warn('[graph]', e);
  const f = document.getElementById('fail');
  f.textContent = lang === 'ru' ? 'ГРАФ ПАМЯТИ НЕДОСТУПЕН' : 'MEMORY GRAPH UNAVAILABLE';
  f.style.display = 'flex';
});
</script>
</body>
</html>
