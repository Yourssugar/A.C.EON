<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>A.C.EON STUDIO | [OFFICIAL]</title>
<script>
/* без открытой изнанки здесь ничего нет. Перезагрузка тоже закрывает изнанку */
(function(){
  var ok=false;
  try{
    var f=sessionStorage.getItem('aceon:rift');
    var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];
    if(f&&!(n&&n.type==='reload'))ok=true;
    else sessionStorage.removeItem('aceon:rift');
  }catch(e){}
  window.__riftOk=ok;
  if(!ok)location.replace('../');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
</head>
<body>
<script type="module">
if(window.__riftOk){
  import('./rift.js').then(function(m){ m.mount({}); });
}
</script>
</body>
</html>
